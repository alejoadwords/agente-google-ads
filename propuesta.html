<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Propuesta comercial · Acuarius</title>
<style>
  :root{
    --azul:#1E2BCC; --azul-hondo:#151B94; --azul-claro:#4A56D8; --azul-tenue:#EDEEFC;
    --ambar:#F5A524; --ambar-tinta:#3A2600;
    --tinta:#0B0D18; --papel:#FFFFFF; --hueso:#F6F7FB;
    --gris:#5A5E78; --gris-2:#8C90A8; --linea:#E2E3EE;
    --ok:#0F7A55;
    --display:"Avenir Next","Futura","Century Gothic","Trebuchet MS",system-ui,sans-serif;
    --texto:"Avenir Next",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--hueso);font-family:var(--texto);color:var(--tinta);-webkit-font-smoothing:antialiased}

  /* ── La lámina ───────────────────────────────────────────────
     container-type permite dimensionar TODO en cqw, así el texto
     escala igual en pantalla que al imprimir sin tocar una regla. */
  .mazo{max-width:1180px;margin:0 auto;padding:26px 20px 70px;display:flex;flex-direction:column;gap:22px}
  .lamina{position:relative;width:100%;aspect-ratio:16/9;container-type:inline-size;background:var(--papel);
    border-radius:10px;overflow:hidden;box-shadow:0 6px 26px rgba(11,13,24,.10);break-inside:avoid}
  .lamina.azul{background:linear-gradient(150deg,var(--azul-hondo) 0%,var(--azul) 52%,var(--azul-claro) 100%);color:#fff}
  .lamina.azul .gris{color:rgba(255,255,255,.82)}

  /* Marca de agua: la A de Acuarius, girada, muy sutil */
  .agua{position:absolute;right:-8cqw;bottom:-16cqw;width:52cqw;height:52cqw;opacity:.07;pointer-events:none}
  .lamina.azul .agua{opacity:.13}

  .campo{position:absolute;inset:0;padding:6.2cqw 6.6cqw 8cqw;display:flex;flex-direction:column;overflow:hidden}
  .pie{position:absolute;left:6.6cqw;right:6.6cqw;bottom:3.1cqw;display:flex;align-items:center;justify-content:space-between;
    font-size:1.32cqw;letter-spacing:.06em;color:var(--gris-2)}
  .lamina.azul .pie{color:rgba(255,255,255,.6)}
  .pie .marca{font-family:var(--display);font-weight:800;letter-spacing:-.02em;font-size:1.72cqw;color:var(--tinta)}
  .lamina.azul .pie .marca{color:#fff}
  .num{position:absolute;top:3.4cqw;right:6.6cqw;font-size:1.35cqw;font-weight:700;color:var(--gris-2)}
  .lamina.azul .num{color:rgba(255,255,255,.55)}

  h2.titulo{font-family:var(--display);font-size:3.5cqw;font-weight:800;letter-spacing:-.028em;line-height:1.13;margin:0 0 2.4cqw;max-width:74cqw;text-wrap:balance}
  .marcador{background:var(--ambar);color:var(--ambar-tinta);padding:0 .5cqw;box-decoration-break:clone;-webkit-box-decoration-break:clone}
  .rotulo{display:inline-block;font-size:1.4cqw;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
    color:var(--azul);margin-bottom:1.6cqw}
  .lamina.azul .rotulo{color:var(--ambar)}
  .entrada{font-size:1.95cqw;line-height:1.55;color:var(--gris);max-width:62cqw;margin:0}
  .lamina.azul .entrada{color:rgba(255,255,255,.88)}

  /* Lista con flecha, el patrón que mejor funciona en una lámina */
  .puntos{display:grid;grid-template-columns:1fr 1fr;gap:2.6cqw 4cqw;margin-top:1cqw}
  .puntos.una{grid-template-columns:1fr;max-width:66cqw}
  .punto{display:flex;gap:1.6cqw;align-items:flex-start}
  .flecha{flex:0 0 auto;width:3.1cqw;height:3.1cqw;border:.19cqw solid var(--ambar);border-radius:.5cqw;
    display:flex;align-items:center;justify-content:center;margin-top:.2cqw}
  .flecha svg{width:1.7cqw;height:1.7cqw;stroke:var(--ambar);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  .punto h3{font-family:var(--display);font-size:1.95cqw;font-weight:800;letter-spacing:-.015em;margin:0 0 .5cqw;color:var(--azul)}
  .lamina.azul .punto h3{color:#fff}
  .punto h3 span{display:block;height:.22cqw;width:5.6cqw;background:var(--ambar);margin-top:.55cqw;border-radius:.2cqw}
  .punto p{font-size:1.55cqw;line-height:1.5;margin:0;color:var(--gris)}
  .lamina.azul .punto p{color:rgba(255,255,255,.84)}

  .dos{display:grid;grid-template-columns:1.05fr .95fr;gap:4cqw;align-items:center;flex:1;min-height:0}
  .dos.texto-der{grid-template-columns:.95fr 1.05fr}
  .figura{width:100%;flex:1;min-height:0;border-radius:1.1cqw;overflow:hidden;background:var(--hueso);border:.14cqw solid var(--linea);display:flex}
  .lamina.azul .figura{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.16)}
  .figura svg{display:block;width:100%;height:100%}

  /* Portada partida */
  .portada{display:grid;grid-template-columns:38% 62%;position:absolute;inset:0}
  .portada .izq{background:var(--papel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4cqw;padding:4cqw}
  .portada .izq .logo{font-family:var(--display);font-size:5cqw;font-weight:800;letter-spacing:-.045em;color:var(--tinta);display:flex;align-items:center;gap:.7cqw}
  .portada .izq .logo i{width:1.1cqw;height:1.1cqw;border-radius:50%;background:var(--azul);display:block}
  .portada .izq .bajo{font-size:1.45cqw;letter-spacing:.16em;text-transform:uppercase;color:var(--gris-2);text-align:center}
  .portada .der{background:linear-gradient(150deg,var(--azul-hondo),var(--azul) 55%,var(--azul-claro));color:#fff;
    display:flex;flex-direction:column;justify-content:center;padding:4.6cqw 5.4cqw;position:relative;overflow:hidden}
  .portada .der h1{font-family:var(--display);font-size:3.6cqw;font-weight:800;letter-spacing:-.03em;line-height:1.14;margin:0 0 2.2cqw;text-wrap:balance}
  .portada .para{font-size:1.35cqw;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.6);margin-bottom:.7cqw}
  .portada .cliente{font-family:var(--display);font-size:2.4cqw;font-weight:800;letter-spacing:-.02em;color:var(--ambar);line-height:1.18;overflow-wrap:anywhere}
  .portada .fecha{font-size:1.4cqw;color:rgba(255,255,255,.72);margin-top:2.2cqw}

  /* Cita grande */
  .cita{flex:1;display:flex;flex-direction:column;justify-content:center}
  .cita p{font-family:var(--display);font-size:3.1cqw;font-weight:700;letter-spacing:-.02em;line-height:1.32;margin:0;max-width:76cqw;text-wrap:balance}
  .cita .firma{margin-top:2.6cqw;font-size:1.6cqw;color:rgba(255,255,255,.75)}

  /* Cifras */
  .cifras{display:grid;grid-template-columns:repeat(3,1fr);gap:3cqw;margin-top:1.4cqw}
  .cifra-b .n{font-family:var(--display);font-size:5.2cqw;font-weight:800;letter-spacing:-.04em;line-height:1;color:var(--ambar)}
  .cifra-b .t{font-size:1.5cqw;line-height:1.45;margin-top:.9cqw;color:rgba(255,255,255,.85)}

  /* Tabla comparativa */
  table{width:100%;border-collapse:collapse;font-size:1.5cqw;margin-top:1cqw}
  th{text-align:left;font-size:1.22cqw;letter-spacing:.1em;text-transform:uppercase;color:var(--gris-2);font-weight:800;padding:1cqw 1.2cqw;border-bottom:.14cqw solid var(--linea)}
  th.destaca{color:var(--azul)}
  td{padding:.95cqw 1.2cqw;border-bottom:.1cqw solid var(--linea);vertical-align:top;line-height:1.4}
  td.k{font-weight:700;width:22%}
  td.ellos{color:var(--gris-2);width:36%}
  td.nos{color:var(--ok);font-weight:700;width:42%}
  tr:last-child td{border-bottom:none}

  /* Lámina de precio: checklist + tarjeta */
  .precio-fila{display:grid;grid-template-columns:1.05fr .95fr;gap:4cqw;flex:1;align-items:center;min-height:0;overflow:hidden}
  .chk{display:flex;flex-direction:column;gap:1.15cqw;min-height:0}
  .chk li{display:flex;gap:1.2cqw;align-items:flex-start;font-size:1.5cqw;line-height:1.38;list-style:none;color:rgba(255,255,255,.92)}
  .chk li svg{flex:0 0 auto;width:1.9cqw;height:1.9cqw;stroke:var(--ambar);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;margin-top:.25cqw}
  .chk li.top{background:var(--ambar);color:var(--ambar-tinta);font-weight:800;padding:.7cqw 1.1cqw;border-radius:.5cqw;margin-bottom:.4cqw}
  .chk li.top svg{stroke:var(--ambar-tinta)}
  .tarjeta{background:var(--papel);border-radius:1.2cqw;padding:1.8cqw 2cqw;text-align:center;box-shadow:0 1.4cqw 3.4cqw rgba(0,0,0,.22)}
  .tarjeta .cabe{font-size:1.24cqw;letter-spacing:.14em;text-transform:uppercase;color:var(--gris-2);margin-bottom:.6cqw}
  .tarjeta .plan{font-family:var(--display);font-size:1.95cqw;font-weight:800;letter-spacing:-.02em;color:var(--azul);margin-bottom:.3cqw}
  .tarjeta .val{font-family:var(--display);font-size:4.3cqw;font-weight:800;letter-spacing:-.045em;color:var(--azul);line-height:1;display:flex;align-items:flex-start;justify-content:center;gap:.3cqw}
  .tarjeta .val sup{font-size:2.4cqw;margin-top:.7cqw}
  .tarjeta .val small{font-size:1.6cqw;font-weight:700;align-self:flex-end;margin-bottom:1cqw;color:var(--gris)}
  .tarjeta .modo{font-size:1.35cqw;font-weight:700;color:var(--tinta);margin-top:.45cqw}
  .tarjeta .barra{height:.4cqw;background:var(--ambar);border-radius:.25cqw;margin:.85cqw 0}
  .tarjeta .anual{font-size:1.45cqw;color:var(--gris);line-height:1.4}
  .tarjeta .ahorro{display:inline-block;margin-top:.7cqw;font-size:1.35cqw;font-weight:800;color:var(--ok);background:#E6F4EE;border-radius:2cqw;padding:.5cqw 1.2cqw}

  /* Desglose de la propuesta */
  .tarjeta .desglose{display:flex;flex-direction:column;margin-top:.4cqw;font-size:1.28cqw;text-align:left}
  .tarjeta .desglose .f{display:flex;justify-content:space-between;gap:1.2cqw;padding:.33cqw 0;border-bottom:.08cqw solid var(--linea);color:var(--gris)}
  .tarjeta .desglose .f b{color:var(--tinta);font-variant-numeric:tabular-nums;white-space:nowrap}
  .tarjeta .desglose .f.total{border-bottom:none;border-top:.16cqw solid var(--ambar);margin-top:.35cqw;padding-top:.6cqw;font-size:1.38cqw;color:var(--tinta)}

  .nota-cli{margin-top:1.4cqw;padding:1.5cqw 1.8cqw;background:rgba(255,255,255,.1);border-left:.35cqw solid var(--ambar);border-radius:.5cqw;
    font-size:1.55cqw;line-height:1.5;color:rgba(255,255,255,.9);white-space:pre-wrap}

  .pasos{display:grid;grid-template-columns:repeat(4,1fr);gap:2.6cqw;margin-top:2cqw}
  .paso-b .n{font-family:var(--display);font-size:3.4cqw;font-weight:800;color:var(--ambar);line-height:1}
  .paso-b h3{font-family:var(--display);font-size:1.8cqw;font-weight:800;margin:.9cqw 0 .5cqw;letter-spacing:-.015em}
  .paso-b p{font-size:1.45cqw;line-height:1.45;margin:0;color:var(--gris)}
  .lamina.azul .paso-b p{color:rgba(255,255,255,.84)}

  .cierre-f{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:1.6cqw}
  .cierre-f .logo{font-family:var(--display);font-size:6cqw;font-weight:800;letter-spacing:-.045em;display:flex;align-items:center;gap:.9cqw}
  .cierre-f .logo i{width:1.3cqw;height:1.3cqw;border-radius:50%;background:var(--ambar)}
  .cierre-f .web{font-size:1.8cqw;color:rgba(255,255,255,.8);letter-spacing:.08em}

  /* ── Panel de edición: solo pantalla ─────────────────────────── */
  .editor{max-width:1180px;margin:0 auto 60px;padding:0 20px}
  .caja{background:#FBEFE7;border:1px solid #EBC7AE;border-radius:14px;padding:26px}
  .caja h3{font-family:var(--display);font-size:17px;margin:0 0 4px;color:#B4531F}
  .caja .sub{font-size:12.5px;color:#B4531F;opacity:.85;margin-bottom:18px}
  .campos{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px}
  label{display:block;font-size:10.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:#B4531F;margin-bottom:6px}
  input[type=text],input[type=date],select,textarea{width:100%;font-family:var(--texto);font-size:14.5px;color:var(--tinta);
    background:#fff;border:1px solid #EBC7AE;border-radius:9px;padding:10px 12px}
  textarea{min-height:80px;resize:vertical;line-height:1.55}
  input:focus,select:focus,textarea:focus{outline:2px solid #B4531F;outline-offset:1px}
  .par{display:flex;gap:8px;align-items:center}
  .par input{text-align:center;font-weight:700}
  .pz{width:34px;height:34px;flex-shrink:0;border:1px solid #EBC7AE;background:#fff;color:#B4531F;border-radius:9px;font-size:18px;font-weight:700;cursor:pointer}
  .pz:hover:not(:disabled){background:#B4531F;color:#fff}
  .pz:disabled{opacity:.35;cursor:not-allowed}
  .seg{display:flex;gap:4px;background:#fff;border:1px solid #EBC7AE;border-radius:10px;padding:4px}
  .seg button{flex:1;border:none;background:transparent;font-family:var(--texto);font-size:12.5px;font-weight:700;color:var(--gris);padding:8px 4px;border-radius:7px;cursor:pointer}
  .seg button[aria-pressed="true"]{background:#B4531F;color:#fff}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
  .chip{font-size:12.5px;border:1px solid #EBC7AE;background:#fff;color:var(--gris);border-radius:20px;padding:7px 13px;cursor:pointer}
  .chip[aria-pressed="true"]{background:#B4531F;border-color:#B4531F;color:#fff;font-weight:700}
  .alerta{display:none;margin-top:16px;background:#fff;border:1px solid #B4531F;border-radius:10px;padding:12px 15px;font-size:13.5px;color:#B4531F;line-height:1.5}
  .barra-acc{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;align-items:center}
  .btn{font-size:14px;font-weight:700;border-radius:10px;padding:12px 20px;cursor:pointer;border:1px solid transparent;font-family:var(--texto)}
  .btn-p{background:var(--azul);color:#fff}
  .btn-p:hover{background:var(--azul-hondo)}
  .btn-s{background:#fff;color:var(--gris);border-color:#EBC7AE}
  .btn-s:hover{border-color:var(--azul);color:var(--azul)}
  .estado{font-size:13px;font-weight:700;color:var(--ok);min-height:19px;margin-top:10px}
  .letra{font-size:12px;color:var(--gris-2);margin-top:12px;line-height:1.5;max-width:70ch}

  :focus-visible{outline:2px solid var(--azul);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  @media (max-width:760px){ .mazo{padding:14px 12px 40px;gap:14px} .editor{padding:0 12px} .caja{padding:18px} }

  /* ── Impresión: una lámina por página, 16:9 ──────────────────── */
  @media print{
    @page{ size:297mm 167mm; margin:0 }
    body{background:#fff}
    .editor,.no-print{display:none!important}
    .mazo{max-width:none;margin:0;padding:0;gap:0;display:block}
    .lamina{width:297mm;height:167mm;aspect-ratio:auto;border-radius:0;box-shadow:none;break-after:page;page-break-after:always}
    .lamina:last-child{break-after:auto;page-break-after:auto}
    .lamina,.lamina *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style>
</head>
<body>
<div class="mazo" id="mazo"></div>
<div class="editor no-print" id="editor"></div>
<script>
/* Propuesta comercial de Acuarius — deck 16:9.
   Las láminas se generan desde el estado, así que editar los datos del cliente
   repinta la presentación entera. Al imprimir, cada .lamina es una página. */
(function () {
  'use strict';

  var PLANES = {
    pro:    { nombre: 'Pro',    base: 39, usuarios: 3,  contactos: 1000 },
    agency: { nombre: 'Agency', base: 99, usuarios: 10, contactos: 5000 }
  };
  var PRECIO_USUARIO = 9, PASO = 1000, PRECIO_PACK = 4, MESES_ANUAL = 10;
  var MAX_U = 60, MAX_C = 100000;
  var CLAVE = 'acuarius_deck_v1';

  var DESTACADOS = [
    'Pipeline a medida', 'Automatizaciones de seguimiento', 'Inbox de WhatsApp',
    'Campañas de email ilimitadas', 'Chatbots con IA', 'Formularios y webhooks',
    'Propuestas con link de pago', 'Reportes de ventas', 'Agenda con Google Calendar',
    'Multi-cliente', 'Siete agentes de IA'
  ];

  var e = {
    cliente: '', contacto: '', sector: '', fecha: '', validez: '15 días',
    autor: '', plan: 'auto', usuarios: 3, contactos: 1000, anual: false,
    notas: '', destacados: ['Pipeline a medida', 'Automatizaciones de seguimiento', 'Inbox de WhatsApp', 'Campañas de email ilimitadas']
  };

  var $ = function (s, r) { return (r || document).querySelector(s); };
  var fmt = function (n) { return n.toLocaleString('es-CO'); };
  var esc = function (t) {
    return String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  };

  // ── Precio ────────────────────────────────────────────────────────────────
  function costeDe(clave, u, c) {
    var p = PLANES[clave];
    var eu = Math.max(0, u - p.usuarios);
    var packs = Math.max(0, Math.ceil((c - p.contactos) / PASO));
    var cu = eu * PRECIO_USUARIO, cc = packs * PRECIO_PACK;
    return {
      clave: clave, plan: p, usuarios: u, extraU: eu, costeU: cu, packs: packs, costeC: cc,
      planAnual: p.base * MESES_ANUAL,
      totalMes: p.base + cu + cc,
      efectivoAnual: Math.round(p.base * MESES_ANUAL / 12) + cu + cc
    };
  }

  // Mismo criterio que la calculadora de acuarius.app: gana el más barato. Si
  // se fuerza otro, el precio de la propuesta quedaría POR ENCIMA del que el
  // cliente ve en la web, así que hay que avisarlo.
  function calcular() {
    var u = Math.max(1, Math.min(MAX_U, parseInt(e.usuarios, 10) || 1));
    var opciones = Object.keys(PLANES).map(function (k) { return costeDe(k, u, e.contactos); });
    opciones.sort(function (a, b) { return a.totalMes - b.totalMes; });
    var barato = opciones[0];
    var r = (e.plan === 'auto') ? barato : costeDe(e.plan, u, e.contactos);
    r.masBarato = barato;
    r.esElMasBarato = r.totalMes <= barato.totalMes;
    return r;
  }

  function pasoContactos(v, dir) {
    var p = v >= 20000 ? 10000 : v >= 5000 ? 5000 : PASO;
    if (dir < 0) p = v > 20000 ? 10000 : v > 5000 ? 5000 : PASO;
    return Math.max(PASO, Math.min(MAX_C, v + dir * p));
  }

  // ── Piezas ────────────────────────────────────────────────────────────────
  var AGUA = '<svg class="agua" viewBox="0 0 100 100" aria-hidden="true"><text x="50" y="84" text-anchor="middle" font-size="104" font-weight="800" font-family="Avenir Next,Futura,sans-serif" fill="currentColor">A</text></svg>';
  var FLECHA = '<span class="flecha"><svg viewBox="0 0 24 24"><path d="M4 12h14M13 6l6 6-6 6"/></svg></span>';
  var TICK = '<svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>';

  function fila(k, v, cls) {
    return '<div class="f' + (cls ? ' ' + cls : '') + '"><span>' + k + '</span><b>' + v + '</b></div>';
  }

  function pie(n, total) {
    var cli = e.cliente.trim();
    return '<div class="pie"><span class="marca">Acuarius</span>' +
      '<span>' + (cli ? esc(cli) : 'Propuesta comercial') + '</span></div>' +
      '<div class="num">' + n + ' / ' + total + '</div>';
  }

  function punto(t, d) {
    return '<div class="punto">' + FLECHA + '<div><h3>' + t + '<span></span></h3>' +
      (d ? '<p>' + d + '</p>' : '') + '</div></div>';
  }

  // ── Ilustraciones ─────────────────────────────────────────────────────────
  function svgPipeline() {
    var col = function (x, tit, n, color, tarjetas) {
      var s = '<rect x="' + x + '" y="14" width="196" height="250" rx="11" fill="#fff" stroke="#E2E3EE"/>' +
        '<rect x="' + x + '" y="14" width="196" height="4" rx="2" fill="' + color + '"/>' +
        '<text x="' + (x + 16) + '" y="44" font-size="11.5" font-weight="700" fill="#0B0D18" letter-spacing="1.1">' + tit + '</text>' +

  function laminas() {

    if (e.fecha) {
      try { fechaTxt = new Date(e.fecha + 'T12:00:00').toLocaleDateString('es-CO', { day: 'numeric', month: 'long', year: 'numeric' }); } catch (x) {}
    }
    var L = [];

        '<div class="izq"><div class="logo">Acuarius<i></i></div>' +
          '<div class="bajo">CRM y automatización<br>para equipos comerciales</div></div>' +
        '<div class="der">' + AGUA +
          '<h1>Un CRM que no espera a que alguien se acuerde del cliente</h1>' +
          '<div class="para">Propuesta preparada para</div>' +
          '<div class="cliente">' + esc(cli || 'tu empresa') + '</div>' +
          '<div class="fecha">' + esc([fechaTxt, e.contacto.trim(), e.autor.trim() ? 'Por ' + e.autor.trim() : ''].filter(Boolean).join(' · ')) + '</div>' +
        '</div>' +
      '</div>' });

      '<span class="rotulo">El diagnóstico</span>' +
      '<div class="cita"><p>El problema casi nunca es conseguir leads. Es que <span class="marcador">nadie los contactó a tiempo</span>.</p>' +
      '<div class="firma">El contacto entra, alguien lo anota, y ahí se queda. Cuando el equipo vuelve a mirarlo, ya compró en otro lado.</div></div>' +
      '</div>' });

    // 3 — Dónde se pierde
    L.push({ cls: 'azul', html: AGUA + '<div class="campo">' +
      '<h2 class="titulo">Dónde se pierde el dinero</h2>' +
      '<div class="cifras">' +
        '<div class="cifra-b"><div class="n">1</div><div class="t"><b>Sin segundo contacto.</b> La mayoría de leads recibe un mensaje y ninguno más. La venta suele estar en el tercero o el cuarto.</div></div>' +
        '<div class="cifra-b"><div class="n">2</div><div class="t"><b>Conversaciones sueltas.</b> WhatsApp en el teléfono de un vendedor. Si esa persona no está, la conversación se pierde.</div></div>' +
        '<div class="cifra-b"><div class="n">3</div><div class="t"><b>Sin visibilidad.</b> Nadie sabe cuántas oportunidades hay abiertas, por cuánto, ni cuáles llevan días sin moverse.</div></div>' +
      '</div></div>' });

    // 4 — Pipeline

      '<span class="rotulo">El corazón del sistema</span>' +
      '<h2 class="titulo">Un pipeline que se adapta a <span class="marcador">cómo vendes tú</span></h2>' +
      '<div class="figura">' + svgPipeline() + '</div>' +
      '<div class="puntos" style="margin-top:2.2cqw">' +
        punto('Etapas propias', 'Las creas y reordenas sin ayuda técnica.') +
        punto('Lo estancado se ve', 'Aviso automático cuando un lead lleva días sin movimiento.') +
      '</div></div>' });

    // 5 — Automatizaciones
    L.push({ cls: 'azul', html: AGUA + '<div class="campo">' +
      '<span class="rotulo">Lo que trabaja solo</span>' +
      '<h2 class="titulo">El seguimiento ocurre <span class="marcador">aunque nadie se acuerde</span></h2>' +
      '<div class="figura">' + svgFlujo() + '</div>' +
      '<p class="entrada" style="margin-top:2.2cqw;font-size:1.6cqw">Los flujos corren en el servidor todo el día, con la plataforma cerrada. Se arman arrastrando pasos: espera, correo, WhatsApp y condiciones según lo que responda la persona.</p>' +
      '</div>' });

    // 6 — Inbox
    L.push({ cls: '', html: '<div class="campo">' +
      '<span class="rotulo">Donde de verdad hablan tus clientes</span>' +
      '<h2 class="titulo">WhatsApp, Instagram y Messenger <span class="marcador">en una sola bandeja</span></h2>' +
      '<div class="figura">' + svgInbox() + '</div>' +
      '<div class="puntos" style="margin-top:2.2cqw">' +
        punto('Bandeja compartida', 'Cualquiera del equipo retoma la conversación.') +
        punto('Ligado al contacto', 'Cada mensaje crea o actualiza el lead en el pipeline.') +
      '</div></div>' });

    // 7 — Todo lo que incluye
    L.push({ cls: 'azul', html: AGUA + '<div class="campo">' +
      '<h2 class="titulo">Todo esto viene incluido, <span class="marcador">sin módulos aparte</span></h2>' +
      '<div class="puntos">' +
        punto('Campañas masivas', 'Email y WhatsApp por etiqueta, con baja automática. Envíos ilimitados.') +
        punto('Propuestas comerciales', 'Con página propia, seguimiento de apertura y link de pago.') +
        punto('Formularios y webhooks', 'Los leads entran directo al pipeline desde tu web.') +
        punto('Reportes', 'Ventas, productividad y marketing, sin armarlos a mano.') +
        punto('Agenda', 'Sincronizada con Google Calendar.') +
        punto('Multi-cliente', 'Perfiles independientes por marca, con datos separados.') +
      '</div></div>' });

    // 8 — Comparativa
    L.push({ cls: '', html: '<div class="campo">' +
      '<span class="rotulo">La diferencia</span>' +
      '<h2 class="titulo">Por qué este CRM y <span class="marcador">no otro</span></h2>' +
      '<table><thead><tr><th></th><th>Clientify · plan de entrada</th><th class="destaca">Acuarius Pro</th></tr></thead><tbody>' +
      '<tr><td class="k">Precio de entrada</td><td class="ellos">65 €/mes · 39 € pagando el año</td><td class="nos">$39/mes · $32,50 pagando el año</td></tr>' +
      '<tr><td class="k">Usuarios incluidos</td><td class="ellos">1</td><td class="nos">3 · $9 el adicional</td></tr>' +
      '<tr><td class="k">Envío de correos</td><td class="ellos">Sujeto al cupo del plan</td><td class="nos">Ilimitado</td></tr>' +
      '<tr><td class="k">Agentes de IA</td><td class="ellos">No es su terreno</td><td class="nos">Siete, incluidos</td></tr>' +
      '<tr><td class="k">Permanencia</td><td class="ellos">El precio bueno exige pagar el año</td><td class="nos">Mensual, sin permanencia</td></tr>' +
      '</tbody></table>' +
      '<p style="font-size:1.25cqw;color:#8C90A8;margin-top:1.4cqw;line-height:1.5">Clientify es una buena herramienta; la comparación es de modelo de precio, no de calidad. Precios públicos de julio de 2026, sujetos a cambios.</p>' +
      '</div>' });

    // 9 — LA LÁMINA DEL DINERO
    // Una lámina de venta no aguanta once viñetas: se muestran seis y el resto
    // se resume, para que nunca se desborde por encima del pie.
    var TOPE = (c.extraU || c.packs) ? 5 : 6;
    var todos = e.destacados.length ? e.destacados : ['Acceso completo a la plataforma'];
    var items = todos.slice(0, TOPE);
    var resto = todos.length - items.length;
    var chk = '<li class="top">' + TICK + '<span>' + esc(c.plan.nombre) + ' · ' + c.plan.usuarios + ' usuarios y ' + fmt(c.plan.contactos) + ' contactos incluidos</span></li>';
    items.forEach(function (i) { chk += '<li>' + TICK + '<span>' + esc(i) + '</span></li>'; });
    if (resto > 0) chk += '<li>' + TICK + '<span>y ' + resto + ' funciones más incluidas</span></li>';
    // Los complementos NO se repiten aquí: ya están desglosados en la tarjeta.

    var desglose = '';
    if (e.anual) desglose += fila('Plan ' + c.plan.nombre + ' anual', '$' + fmt(c.planAnual) + '/año');
    else desglose += fila('Plan ' + c.plan.nombre, '$' + fmt(c.plan.base) + '/mes');
    if (c.extraU) desglose += fila(c.extraU + ' × usuario', '$' + fmt(c.costeU) + '/mes');
    if (c.packs) desglose += fila(fmt(c.packs * PASO) + ' contactos', '$' + fmt(c.costeC) + '/mes');

    L.push({ cls: 'azul', html: AGUA + '<div class="campo">' +
      '<span class="rotulo">Tu propuesta</span>' +
      '<h2 class="titulo" style="font-size:2.9cqw;margin-bottom:1.6cqw">Lo que incluye para ' + esc(cli || 'tu empresa') + '</h2>' +
      '<div class="precio-fila">' +
        '<ul class="chk" style="margin:0;padding:0">' + chk + '</ul>' +
        '<div class="tarjeta">' +
          '<div class="cabe">Plan recomendado</div>' +
          '<div class="plan">' + esc(c.plan.nombre) + '</div>' +
          '<div class="val"><sup>$</sup>' + fmt(e.anual ? c.efectivoAnual : c.totalMes) + '<small>/mes</small></div>' +
          '<div class="modo">' + (e.anual ? 'facturado anualmente' : 'facturación mensual') + '</div>' +
          '<div class="barra"></div>' +
          '<div class="desglose">' + desglose +
            (e.anual
              ? fila('<b>Pago inicial</b>', '<b>$' + fmt(c.planAnual) + '</b>', 'total')
              : fila('<b>Total mensual</b>', '<b>$' + fmt(c.totalMes) + ' USD</b>', 'total')) +
          '</div>' +
          // Con los dos complementos el desglose ya ocupa cuatro filas: la
          // linea del pago anual se omite para que la tarjeta no se recorte.
          // El ahorro anual sigue estando en la lámina de Planes.
          ((c.extraU && c.packs)
            ? ''
            : e.anual
              ? '<div class="ahorro">2 meses gratis · ahorras $' + fmt(c.plan.base * 2) + '</div>'
              : '<div class="anual">Pagando el año: <b>$' + fmt(c.planAnual) + '</b> · 2 meses gratis</div>') +
        '</div>' +
      '</div>' +
      '</div>' });

    // 9b — La nota, solo si existe, con su propia lámina
    if (e.notas.trim()) {
      L.push({ cls: '', html: '<div class="campo">' +
        '<span class="rotulo">Sobre tu caso</span>' +
        '<div class="cita" style="color:var(--tinta)"><p style="font-size:2.6cqw;color:var(--tinta)">' +
          esc(e.notas.trim()) + '</p>' +
        '<div class="firma" style="color:var(--gris)">' +
          esc([e.contacto.trim(), e.cliente.trim()].filter(Boolean).join(' · ')) + '</div></div>' +
        '</div>' });
    }

    // 10 — Cómo empezamos
    L.push({ cls: '', html: '<div class="campo">' +
      '<span class="rotulo">Cómo empezamos</span>' +
      '<h2 class="titulo"><span class="marcador">14 días de prueba</span>, sin tarjeta</h2>' +
      '<div class="pasos">' +
        '<div class="paso-b"><div class="n">1</div><h3>Creamos la cuenta</h3><p>Con el correo del responsable. Toma minutos.</p></div>' +
        '<div class="paso-b"><div class="n">2</div><h3>Importamos</h3><p>Tus contactos y el pipeline con tus etapas reales.</p></div>' +
        '<div class="paso-b"><div class="n">3</div><h3>Conectamos</h3><p>WhatsApp y los formularios de tu sitio.</p></div>' +
        '<div class="paso-b"><div class="n">4</div><h3>Activamos</h3><p>La primera automatización de seguimiento.</p></div>' +
      '</div>' +
      '<p class="entrada" style="margin-top:2.6cqw;font-size:1.6cqw">Si al final de la prueba no ves el valor, no pagas nada. Sin permanencia ni costo de implementación.</p>' +
      '</div>' });

    // 11 — Cierre
    L.push({ cls: 'azul', sinPie: true, html: AGUA + '<div class="campo"><div class="cierre-f">' +
      '<div class="logo">Acuarius<i></i></div>' +
      '<div class="web">acuarius.app</div>' +
      (e.validez.trim() ? '<div style="font-size:1.4cqw;color:rgba(255,255,255,.65);margin-top:1.4cqw">Esta propuesta tiene una validez de ' + esc(e.validez.trim()) + '</div>' : '') +
      '</div></div>' });

    return L;
  }

            '<input type="text" id="i-contactos" value="' + fmt(e.contactos) + '" readonly>' +
            '<button type="button" class="pz" id="c-mas">+</button></div></div>' +
        '</div>' +
        '<div id="alerta" class="alerta"></div>' +
        '<div style="margin-top:20px"><label>Qué destacar</label><div class="chips" id="chips">' +
          DESTACADOS.map(function (d) {
            return '<button type="button" class="chip" data-d="' + esc(d) + '" aria-pressed="' + (e.destacados.indexOf(d) >= 0) + '">' + esc(d) + '</button>';
          }).join('') + '</div></div>' +
        '<div style="margin-top:20px"><label for="i-notas">Nota personalizada <span style="text-transform:none;letter-spacing:0;font-weight:400">(sale en la lámina de precio)</span></label>' +
          '<textarea id="i-notas" placeholder="Conversamos sobre los leads de WhatsApp que se quedan sin seguimiento…">' + esc(e.notas) + '</textarea></div>' +
        '<div class="barra-acc">' +
          '<button class="btn btn-p" id="b-pdf">Guardar como PDF</button>' +
          '<button class="btn btn-s" id="b-file">Descargar archivo</button>' +
          '<button class="btn btn-s" id="b-new">Empezar una nueva</button>' +
        '</div>' +
        '<div class="estado" id="estado"></div>' +
        '<p class="letra"><b>Guardar como PDF</b> abre el diálogo de impresión: elige «Guardar como PDF» y verifica que esté en horizontal. Cada lámina sale como una página 16:9. Precios en dólares, sin impuestos según el país del cliente.</p>' +
      '</div>';

    $('#i-plan').value = e.plan;
    var al = $('#alerta');
    if (!c.esElMasBarato) {
      al.style.display = 'block';
      al.innerHTML = 'Con esta configuración, <b>' + c.masBarato.plan.nombre + '</b> sale <b>$' +
        fmt(c.totalMes - c.masBarato.totalMes) + ' más barato</b> al mes ($' + fmt(c.masBarato.totalMes) +
        ' frente a $' + fmt(c.totalMes) + '). La calculadora de acuarius.app le mostrará ese precio al cliente.';
    } else { al.style.display = 'none'; }

    conectar();
  }

  function campo(k, et, tipo, ph) {
    return '<div><label for="i-' + k + '">' + et + '</label>' +
      '<input type="' + tipo + '" id="i-' + k + '" value="' + esc(e[k]) + '" placeholder="' + esc(ph) + '"></div>';
  }

  function repintar() { pintarMazo(); pintarEditor(); guardar(); }

  // Un selector malo tumbaba conectar() a media funcion y dejaba los chips y
  // los botones muertos, sin error visible. Cada enlace va aislado.
  function liga(sel, ev, fn) {
    try {
      var el = $(sel);
      if (el) el.addEventListener(ev, fn);
      else console.warn('[propuesta] no existe', sel);
    } catch (x) { console.error('[propuesta] selector invalido', sel, x); }
  }

  function conectar() {
    ['cliente', 'contacto', 'sector', 'fecha', 'validez', 'autor'].forEach(function (k) {
      var el = $('#i-' + k);
      el.addEventListener('input', function () { e[k] = el.value; pintarMazo(); guardar(); });
    });
    liga('#i-notas', 'input', function () { e.notas = this.value; pintarMazo(); guardar(); });
    liga('#i-plan', 'change', function () { e.plan = this.value; repintar(); });
    liga('#i-mes', 'click', function () { e.anual = false; repintar(); });
    liga('#i-anu', 'click', function () { e.anual = true; repintar(); });
    liga('#i-usuarios', 'input', function () {
      var v = parseInt(this.value.replace(/\D/g, ''), 10);
      e.usuarios = isNaN(v) || v < 1 ? 1 : Math.min(MAX_U, v);
      pintarMazo(); guardar();
    });
    liga('#u-menos', 'click', function () { e.usuarios = Math.max(1, e.usuarios - 1); repintar(); });
    liga('#u-mas', 'click', function () { e.usuarios = Math.min(MAX_U, e.usuarios + 1); repintar(); });
    liga('#c-menos', 'click', function () { e.contactos = pasoContactos(e.contactos, -1); repintar(); });
    liga('#c-mas', 'click', function () { e.contactos = pasoContactos(e.contactos, 1); repintar(); });
    Array.prototype.forEach.call(document.querySelectorAll('#chips .chip'), function (b) {
      b.addEventListener('click', function () {
        var d = b.getAttribute('data-d'), i = e.destacados.indexOf(d);
        if (i >= 0) e.destacados.splice(i, 1); else e.destacados.push(d);
        repintar();
      });
    });
    liga('#b-pdf', 'click', function () {
      decir('Elige «Guardar como PDF» y orientación horizontal.');
      window.print();
    });
    liga('#b-file', 'click', descargar);
    liga('#b-new', 'click', function () {
      if (!confirm('Se borran los datos de esta propuesta. ¿Seguir?')) return;
      try { localStorage.removeItem(CLAVE); } catch (x) {}
      e.cliente = e.contacto = e.sector = e.notas = '';
      e.plan = 'auto'; e.usuarios = 3; e.contactos = 1000; e.anual = false;
      repintar(); decir('');
    });
  }

  function decir(t, alerta) {
    var el = $('#estado');
    el.style.color = alerta ? '#B4531F' : '#0F7A55';
    el.textContent = t;
  }

  function descargar() {
    try {
      var clon = document.documentElement.cloneNode(true);
      Array.prototype.forEach.call(clon.querySelectorAll('script,.editor,.no-print'), function (n) { n.remove(); });
      var est = document.createElement('style');
      est.textContent = 'body{background:#fff}.mazo{max-width:none;padding:0;gap:0}' +
        '.lamina{border-radius:0;box-shadow:none}';
      (clon.querySelector('head') || clon).appendChild(est);
      var t = clon.querySelector('title');
      if (t) t.textContent = 'Propuesta Acuarius · ' + (e.cliente.trim() || 'cliente');
      var html = '<!doctype html><html lang="es">' + clon.innerHTML + '</html>';
      var nom = 'Propuesta Acuarius - ' + (e.cliente.trim() || 'cliente').replace(/[^\w\sáéíóúñÁÉÍÓÚÑ-]/g, '').trim() + '.html';
      var url = URL.createObjectURL(new Blob([html], { type: 'text/html;charset=utf-8' }));
      var a = document.createElement('a');
      a.href = url; a.download = nom;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
      decir('Descargado: «' + nom + '».');
    } catch (x) {
      decir('No se pudo generar el archivo. Usa «Guardar como PDF».', true);
    }
  }

  function guardar() { try { localStorage.setItem(CLAVE, JSON.stringify(e)); } catch (x) {} }
  function restaurar() {
    try {
      var d = JSON.parse(localStorage.getItem(CLAVE) || 'null');
      if (d) Object.keys(e).forEach(function (k) { if (d[k] != null) e[k] = d[k]; });
    } catch (x) {}
  }

  restaurar();
  if (!e.fecha) {
    var h = new Date();
    e.fecha = h.getFullYear() + '-' + String(h.getMonth() + 1).padStart(2, '0') + '-' + String(h.getDate()).padStart(2, '0');
  }
  pintarMazo();
  pintarEditor();
})();

</script>
</body>
</html>
