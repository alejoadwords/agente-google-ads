# Worker del agente de voz de Acuarius.
#   fly launch --no-deploy --copy-config   (la primera vez)
#   fly secrets set LIVEKIT_URL=... LIVEKIT_API_KEY=... LIVEKIT_API_SECRET=... \
#     DEEPGRAM_API_KEY=... CARTESIA_API_KEY=... ANTHROPIC_API_KEY=... \
#     AGENTE_VOZ_SECRETO=... VOZ_CARTESIA_DEFECTO=<id de voz>
#   fly deploy
app = "acuarius-voz"
# Miami: lo más cerca de Colombia que tiene Fly, y al lado de LiveKit us-east.
primary_region = "mia"

[build]

[[vm]]
  memory = "2gb"
  cpus = 2

# El worker no recibe tráfico HTTP: se conecta él a LiveKit. Por eso no hay
# [http_service] y la máquina no se apaga por inactividad.
