<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Diseño Anuncios — Acuarius</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400&family=Playfair+Display:ital,wght@1,400;1,700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Montserrat',sans-serif; background:#f0f2f5; min-height:100vh; }

/* ── Layout ── */
.app { display:flex; height:100vh; overflow:hidden; }
.sidebar { width:320px; flex-shrink:0; background:#fff; border-right:1px solid #e5e7eb; display:flex; flex-direction:column; overflow-y:auto; }
.main { flex:1; overflow-y:auto; padding:24px; background:#f0f2f5; }

/* ── Sidebar header ── */
.sb-header { padding:20px; border-bottom:1px solid #f0f0f0; display:flex; align-items:center; gap:10px; }
.sb-header svg { width:28px; height:28px; }
.sb-header h1 { font-size:14px; font-weight:700; color:#111; }
.sb-header span { font-size:11px; color:#888; display:block; }

/* ── Form ── */
.form-body { padding:16px; flex:1; }
.section-title { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:#999; margin:16px 0 8px; }
.field { margin-bottom:10px; }
.field label { display:block; font-size:11px; font-weight:600; color:#555; margin-bottom:4px; }
.field input, .field textarea, .field select {
  width:100%; padding:8px 10px; border:1px solid #e5e7eb; border-radius:8px;
  font-size:12px; font-family:'Montserrat',sans-serif; color:#111;
  transition:border-color .15s;
}
.field input:focus, .field textarea:focus, .field select:focus {
  outline:none; border-color:#1a3d1a;
}
.field textarea { resize:vertical; min-height:54px; }
.color-row { display:flex; gap:6px; }
.color-row .field { flex:1; }
.color-row input[type=color] { padding:2px 4px; height:36px; cursor:pointer; }

.features-input { position:relative; }
.features-input input { padding-right:32px; }
.features-list { display:flex; flex-wrap:wrap; gap:4px; margin-top:6px; }
.feat-tag { background:#e8f5e8; color:#1a3d1a; font-size:10px; font-weight:600; padding:3px 8px; border-radius:20px; display:flex; align-items:center; gap:4px; }
.feat-tag button { background:none; border:none; cursor:pointer; color:#666; font-size:12px; line-height:1; }

/* ── Buttons ── */
.btn { width:100%; padding:11px; border:none; border-radius:10px; font-size:13px; font-weight:700; cursor:pointer; font-family:'Montserrat',sans-serif; transition:all .15s; }
.btn-primary { background:#1a3d1a; color:#fff; }
.btn-primary:hover { background:#2a5a2a; }
.btn-dl { background:#4ade80; color:#1a3d1a; margin-top:6px; }
.btn-dl:hover { background:#22c55e; }
.btn-dl:disabled { background:#ccc; color:#999; cursor:not-allowed; }
.btn-actions { padding:16px; border-top:1px solid #f0f0f0; display:flex; flex-direction:column; gap:6px; }

/* ── Format selector ── */
.format-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; margin-bottom:4px; }
.fmt-btn { padding:8px 4px; border:1.5px solid #e5e7eb; border-radius:8px; background:#fff; cursor:pointer; font-size:10px; font-weight:600; color:#888; text-align:center; transition:all .15s; font-family:'Montserrat',sans-serif; }
.fmt-btn.active { border-color:#1a3d1a; background:#e8f5e8; color:#1a3d1a; }
.fmt-icon { font-size:16px; display:block; margin-bottom:2px; }

/* ── Preview area ── */
.preview-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
.preview-header h2 { font-size:15px; font-weight:700; color:#111; }
.preview-meta { font-size:11px; color:#888; }

.previews-grid { display:flex; gap:20px; flex-wrap:wrap; align-items:flex-start; }
.preview-card { background:#fff; border-radius:14px; padding:16px; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.preview-card h3 { font-size:10px; font-weight:700; color:#888; text-transform:uppercase; letter-spacing:.05em; margin-bottom:10px; }
.preview-wrap { border-radius:10px; overflow:hidden; position:relative; }

/* Scale wrappers */
.scale-story  { width:270px; height:480px; }  /* 1080×1920 @ 0.25x */
.scale-square { width:300px; height:300px; }  /* 1080×1080 @ ~0.278x */
.scale-feed   { width:270px; height:338px; }  /* 1080×1350 @ 0.25x */

/* ═══════════════════════════════════════════════════════════════════
   AD TEMPLATES — rendered at 1080px, then CSS-scaled for preview
   ═══════════════════════════════════════════════════════════════════ */

/* ── STORY 9:16 ── */
.ad-story {
  width:1080px; height:1920px;
  background:var(--bg, #f5f0e8);
  position:relative; overflow:hidden;
  font-family:'Montserrat',sans-serif;
  transform-origin:top left;
}
.ad-story .photo-panel {
  position:absolute; right:0; top:0; width:52%; height:100%;
  background-image:var(--photo);
  background-size:cover; background-position:center;
  clip-path:ellipse(100% 100% at 100% 50%);
}
.ad-story .photo-overlay {
  position:absolute; inset:0;
  background:linear-gradient(to right, rgba(0,0,0,0) 60%, rgba(0,0,0,.15) 100%);
}
.ad-story .text-area {
  position:absolute; left:0; top:0; width:54%; height:100%;
  padding:100px 80px 80px;
  display:flex; flex-direction:column;
}
.ad-story .category-badge {
  display:inline-flex; align-items:center; gap:14px;
  background:var(--primary, #1a3d1a); color:#fff;
  padding:16px 32px; border-radius:60px;
  font-size:26px; font-weight:800; letter-spacing:.08em;
  text-transform:uppercase; width:fit-content; margin-bottom:60px;
}
.ad-story .category-badge svg { width:36px; height:36px; }
.ad-story .headline {
  font-size:148px; font-weight:900; line-height:.95;
  color:var(--primary, #1a3d1a); letter-spacing:-.03em;
  text-transform:uppercase; margin-bottom:20px;
}
.ad-story .subheadline {
  font-family:'Playfair Display', serif; font-style:italic;
  font-size:96px; font-weight:700; line-height:1.1;
  color:var(--primary, #1a3d1a); margin-bottom:40px;
}
.ad-story .divider {
  display:flex; align-items:center; gap:20px; margin-bottom:44px;
}
.ad-story .divider-line { flex:1; height:3px; background:var(--primary,.#1a3d1a); opacity:.25; }
.ad-story .divider-label {
  font-size:28px; font-weight:800; color:var(--primary, #1a3d1a);
  letter-spacing:.12em; text-transform:uppercase;
}
.ad-story .description {
  font-size:30px; line-height:1.55; color:#333; margin-bottom:60px; max-width:480px;
}
.ad-story .features { display:flex; flex-direction:column; gap:22px; flex:1; }
.ad-story .feat-item { display:flex; align-items:center; gap:28px; }
.ad-story .feat-icon {
  width:88px; height:88px; border-radius:50%;
  background:var(--icon-bg, #c8dbc8);
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.ad-story .feat-icon svg { width:44px; height:44px; }
.ad-story .feat-label {
  font-size:26px; font-weight:800; color:var(--primary, #1a3d1a);
  text-transform:uppercase; letter-spacing:.06em; line-height:1.2;
}
.ad-story .cta-bar {
  position:absolute; bottom:0; left:0; right:0;
  background:var(--primary, #1a3d1a); padding:44px 80px;
  display:flex; align-items:center; gap:40px;
}
.ad-story .cta-icon {
  width:88px; height:88px; border-radius:50%;
  border:3px solid rgba(255,255,255,.3);
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.ad-story .cta-icon svg { width:44px; height:44px; color:#fff; }
.ad-story .cta-text { flex:1; }
.ad-story .cta-title {
  font-size:36px; font-weight:800; color:#fff; text-transform:uppercase; letter-spacing:.04em;
}
.ad-story .cta-sub { font-size:26px; color:rgba(255,255,255,.7); font-weight:600; }
.ad-story .cta-arrow {
  width:96px; height:96px; background:var(--accent, #4ade80);
  border-radius:20px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.ad-story .cta-arrow svg { width:52px; height:52px; color:var(--primary, #1a3d1a); }

/* ── SQUARE 1:1 ── */
.ad-square {
  width:1080px; height:1080px;
  background:var(--bg, #f5f0e8);
  position:relative; overflow:hidden;
  font-family:'Montserrat',sans-serif;
}
.ad-square .photo-panel {
  position:absolute; right:0; top:0; width:50%; height:100%;
  background-image:var(--photo);
  background-size:cover; background-position:center;
  border-radius:60px 0 0 60px;
}
.ad-square .text-area {
  position:absolute; left:0; top:0; width:56%; height:100%;
  padding:70px 70px 200px;
  display:flex; flex-direction:column;
}
.ad-square .category-badge {
  display:inline-flex; align-items:center; gap:12px;
  background:var(--primary, #1a3d1a); color:#fff;
  padding:14px 28px; border-radius:50px;
  font-size:22px; font-weight:800; letter-spacing:.08em;
  text-transform:uppercase; width:fit-content; margin-bottom:40px;
}
.ad-square .category-badge svg { width:30px; height:30px; }
.ad-square .headline {
  font-size:112px; font-weight:900; line-height:.92;
  color:var(--primary, #1a3d1a); letter-spacing:-.03em;
  text-transform:uppercase; margin-bottom:16px;
}
.ad-square .subheadline {
  font-family:'Playfair Display', serif; font-style:italic;
  font-size:72px; font-weight:700; line-height:1.1;
  color:var(--primary, #1a3d1a); margin-bottom:28px;
}
.ad-square .divider {
  display:flex; align-items:center; gap:16px; margin-bottom:30px;
}
.ad-square .divider-line { flex:1; height:2px; background:var(--primary, #1a3d1a); opacity:.25; }
.ad-square .divider-label {
  font-size:22px; font-weight:800; color:var(--primary, #1a3d1a);
  letter-spacing:.12em; text-transform:uppercase;
}
.ad-square .description {
  font-size:22px; line-height:1.55; color:#333; margin-bottom:32px;
}
.ad-square .features-grid {
  display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:auto;
}
.ad-square .feat-item { display:flex; align-items:center; gap:14px; }
.ad-square .feat-icon {
  width:60px; height:60px; border-radius:50%;
  background:var(--icon-bg, #c8dbc8);
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.ad-square .feat-icon svg { width:30px; height:30px; }
.ad-square .feat-label {
  font-size:18px; font-weight:800; color:var(--primary, #1a3d1a);
  text-transform:uppercase; letter-spacing:.04em; line-height:1.2;
}
.ad-square .cta-bar {
  position:absolute; bottom:0; left:0; right:0;
  background:var(--primary, #1a3d1a); padding:36px 70px;
  display:flex; align-items:center; gap:28px;
}
.ad-square .cta-icon {
  width:70px; height:70px; border-radius:50%;
  border:2px solid rgba(255,255,255,.3);
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.ad-square .cta-icon svg { width:34px; height:34px; color:#fff; }
.ad-square .cta-text { flex:1; }
.ad-square .cta-title {
  font-size:28px; font-weight:800; color:#fff; text-transform:uppercase; letter-spacing:.04em;
}
.ad-square .cta-sub { font-size:20px; color:rgba(255,255,255,.7); font-weight:600; }
.ad-square .cta-arrow {
  width:72px; height:72px; background:var(--accent, #4ade80);
  border-radius:14px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.ad-square .cta-arrow svg { width:38px; height:38px; color:var(--primary, #1a3d1a); }
.ad-square .logo {
  position:absolute; top:50px; right:55%;
  display:none; /* shown when needed */
}

/* ── FEED VERTICAL 4:5 ── */
.ad-feed {
  width:1080px; height:1350px;
  background:var(--photo); background-size:cover; background-position:center;
  position:relative; overflow:hidden;
  font-family:'Montserrat',sans-serif;
}
.ad-feed .overlay {
  position:absolute; inset:0;
  background:linear-gradient(to top, rgba(0,0,0,.82) 45%, rgba(0,0,0,.1) 100%);
}
.ad-feed .top-badge {
  position:absolute; top:70px; left:70px;
  display:inline-flex; align-items:center; gap:16px;
  background:rgba(255,255,255,.15); backdrop-filter:blur(10px);
  border:1.5px solid rgba(255,255,255,.25);
  color:#fff; padding:18px 36px; border-radius:60px;
  font-size:26px; font-weight:800; letter-spacing:.08em; text-transform:uppercase;
}
.ad-feed .top-badge svg { width:30px; height:30px; }
.ad-feed .content {
  position:absolute; bottom:0; left:0; right:0;
  padding:0 70px 160px;
}
.ad-feed .destination {
  font-size:26px; font-weight:700; color:rgba(255,255,255,.7);
  letter-spacing:.15em; text-transform:uppercase; margin-bottom:16px;
}
.ad-feed .headline {
  font-size:130px; font-weight:900; line-height:.9;
  color:#fff; letter-spacing:-.02em; text-transform:uppercase; margin-bottom:16px;
}
.ad-feed .subheadline {
  font-family:'Playfair Display', serif; font-style:italic;
  font-size:80px; font-weight:700; color:#fff; margin-bottom:40px; opacity:.9;
}
.ad-feed .description {
  font-size:28px; color:rgba(255,255,255,.8); line-height:1.5; margin-bottom:50px;
}
.ad-feed .features {
  display:flex; flex-direction:column; gap:16px; margin-bottom:20px;
}
.ad-feed .feat-item {
  display:flex; align-items:center; gap:22px;
  background:rgba(255,255,255,.1); backdrop-filter:blur(8px);
  padding:16px 24px; border-radius:60px;
  border:1px solid rgba(255,255,255,.2); width:fit-content;
}
.ad-feed .feat-icon svg { width:28px; height:28px; color:#fff; }
.ad-feed .feat-label {
  font-size:24px; font-weight:700; color:#fff; letter-spacing:.04em;
}
.ad-feed .cta-bar {
  position:absolute; bottom:0; left:0; right:0;
  background:var(--primary, #1a3d1a); padding:38px 70px;
  display:flex; align-items:center; gap:28px;
}
.ad-feed .cta-icon {
  width:72px; height:72px; border-radius:50%;
  border:2px solid rgba(255,255,255,.3);
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.ad-feed .cta-icon svg { width:36px; height:36px; color:#fff; }
.ad-feed .cta-text { flex:1; }
.ad-feed .cta-title {
  font-size:30px; font-weight:800; color:#fff; text-transform:uppercase; letter-spacing:.04em;
}
.ad-feed .cta-sub { font-size:22px; color:rgba(255,255,255,.7); font-weight:600; }
.ad-feed .cta-arrow {
  width:76px; height:76px; background:var(--accent, #4ade80);
  border-radius:16px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.ad-feed .cta-arrow svg { width:40px; height:40px; color:var(--primary, #1a3d1a); }

/* ── Loading state ── */
.loading-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,.5);
  display:none; align-items:center; justify-content:center; z-index:999;
}
.loading-overlay.show { display:flex; }
.loading-box {
  background:#fff; border-radius:16px; padding:40px 56px; text-align:center;
}
.spinner {
  width:40px; height:40px; border:3px solid #e5e7eb;
  border-top-color:#1a3d1a; border-radius:50%; animation:spin .8s linear infinite; margin:0 auto 16px;
}
@keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>

<div class="app">
  <!-- ── Sidebar / Form ── -->
  <div class="sidebar">
    <div class="sb-header">
      <svg viewBox="0 0 75 75" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="75" height="75" fill="#1a3d1a" rx="10"/>
        <path fill="#fff" d="M57.82 24.91l-5.86 10.16-6.1 10.56-9.44 16.35c-2.82 4.9-8.1 7.95-13.75 7.95-5.74 0-10.89-2.97-13.77-7.95-2.87-4.97-2.87-10.92 0-15.89L25.41 17.5c1.72-2.97 4.79-4.75 8.21-4.75s6.49 1.78 8.21 4.75l.6 1.04 1.71 2.96-6.1 10.57-4.42-7.65L18.06 51.36c-1.39 2.4-.47 4.53 0 5.33.47.8 1.84 2.67 4.62 2.67 1.89 0 3.67-1.02 4.6-2.67l12.48-21.62 6.11-10.57 2.8-4.86c1.46-2.53 4.69-3.4 7.22-1.93 2.52 1.45 3.39 4.67 1.93 7.2z"/>
      </svg>
      <div>
        <h1>Test Diseño</h1>
        <span>Generador de anuncios HTML</span>
      </div>
    </div>

    <div class="form-body">
      <!-- Format -->
      <div class="section-title">Formato</div>
      <div class="format-grid">
        <button class="fmt-btn active" onclick="setFormat('story',this)">
          <span class="fmt-icon">📱</span>Story 9:16
        </button>
        <button class="fmt-btn" onclick="setFormat('square',this)">
          <span class="fmt-icon">⬛</span>Feed 1:1
        </button>
        <button class="fmt-btn" onclick="setFormat('feed',this)">
          <span class="fmt-icon">🖼️</span>Feed 4:5
        </button>
      </div>

      <!-- Content -->
      <div class="section-title">Contenido</div>
      <div class="field">
        <label>Titular principal</label>
        <input type="text" id="f-headline" value="DESCONECTA" oninput="updatePreview()">
      </div>
      <div class="field">
        <label>Frase emocional (italic)</label>
        <input type="text" id="f-sub" value="para conectar" oninput="updatePreview()">
      </div>
      <div class="field">
        <label>Etiqueta central (ej: VIVE CABO VERDE)</label>
        <input type="text" id="f-divider" value="VIVE CABO VERDE" oninput="updatePreview()">
      </div>
      <div class="field">
        <label>Descripción</label>
        <textarea id="f-desc" oninput="updatePreview()">Descubre un destino donde la naturaleza y la autenticidad se unen para darte experiencias que te transforman.</textarea>
      </div>
      <div class="field">
        <label>Categoría (badge superior)</label>
        <input type="text" id="f-category" value="NATURALEZA & CONEXIÓN" oninput="updatePreview()">
      </div>

      <!-- Features -->
      <div class="section-title">Características</div>
      <div class="field features-input">
        <label>Agregar (Enter para añadir)</label>
        <input type="text" id="f-feat-input" placeholder="ej: Playas vírgenes" onkeydown="addFeature(event)">
        <div class="features-list" id="feat-list"></div>
      </div>

      <!-- CTA -->
      <div class="section-title">CTA</div>
      <div class="field">
        <label>Título CTA</label>
        <input type="text" id="f-cta-title" value="RECIBE TU ITINERARIO COMPLETO" oninput="updatePreview()">
      </div>
      <div class="field">
        <label>Subtítulo CTA</label>
        <input type="text" id="f-cta-sub" value="+ PRECIOS EXCLUSIVOS" oninput="updatePreview()">
      </div>

      <!-- Colors -->
      <div class="section-title">Colores</div>
      <div class="color-row">
        <div class="field">
          <label>Principal</label>
          <input type="color" id="f-color-primary" value="#1a3d1a" oninput="updatePreview()">
        </div>
        <div class="field">
          <label>Fondo</label>
          <input type="color" id="f-color-bg" value="#f5f0e8" oninput="updatePreview()">
        </div>
        <div class="field">
          <label>Acento</label>
          <input type="color" id="f-color-accent" value="#4ade80" oninput="updatePreview()">
        </div>
      </div>

      <!-- Photo -->
      <div class="section-title">Foto de fondo</div>
      <div class="field">
        <label>URL de imagen (CORS friendly)</label>
        <input type="text" id="f-photo" value="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1080&q=80" oninput="updatePreview()" placeholder="https://...">
      </div>
      <div class="field">
        <label>O pega base64 / data URL</label>
        <input type="file" id="f-photo-file" accept="image/*" onchange="loadPhotoFile(event)">
      </div>
    </div>

    <div class="btn-actions">
      <button class="btn btn-primary" onclick="updatePreview()">↺ Actualizar vista</button>
      <button class="btn btn-dl" id="dl-btn" onclick="captureAd()" disabled>⬇ Descargar PNG</button>
    </div>
  </div>

  <!-- ── Main / Preview ── -->
  <div class="main">
    <div class="preview-header">
      <h2>Vista previa</h2>
      <div class="preview-meta" id="preview-meta">Story · 1080 × 1920 px</div>
    </div>

    <div class="previews-grid" id="previews-grid">
      <!-- Rendered dynamically -->
    </div>
  </div>
</div>

<!-- Loading -->
<div class="loading-overlay" id="loading">
  <div class="loading-box">
    <div class="spinner"></div>
    <div style="font-size:14px;font-weight:600;color:#333">Generando imagen...</div>
    <div style="font-size:12px;color:#888;margin-top:4px">Puede tomar unos segundos</div>
  </div>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
let currentFormat = 'story';
let features = ['Montañas impresionantes','Playas vírgenes','Cultura y tradiciones','Grupos reducidos'];
let photoDataUrl = null;

// ── SVG Icons ──────────────────────────────────────────────────────────────
const ICONS = {
  leaf:    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>`,
  mountain:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m8 3 4 8 5-5 5 15H2L8 3z"/></svg>`,
  beach:   `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 17H7l-5-5c0 0 4-3 10-3s10 3 10 3l-5 5z"/><path d="M12 9V4"/><path d="M4.22 10.22 6 12"/><path d="M19.78 10.22 18 12"/></svg>`,
  culture: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>`,
  group:   `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>`,
  star:    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`,
  water:   `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>`,
  gift:    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><line x1="12" y1="22" x2="12" y2="7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg>`,
  arrow:   `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>`,
};

function icon(key, color='currentColor') {
  return ICONS[key] || ICONS.star;
}

function getIconForFeature(feat, index) {
  const f = feat.toLowerCase();
  if (f.includes('montaña') || f.includes('volcan') || f.includes('senderismo')) return ICONS.mountain;
  if (f.includes('playa') || f.includes('playa') || f.includes('mar')) return ICONS.beach;
  if (f.includes('cultura') || f.includes('tradición') || f.includes('historico')) return ICONS.culture;
  if (f.includes('grupo') || f.includes('familia') || f.includes('person')) return ICONS.group;
  if (f.includes('natural') || f.includes('salvaje') || f.includes('flora')) return ICONS.leaf;
  if (f.includes('agua') || f.includes('cristal') || f.includes('laguna')) return ICONS.water;
  const fallbacks = [ICONS.mountain, ICONS.beach, ICONS.culture, ICONS.group, ICONS.leaf, ICONS.star];
  return fallbacks[index % fallbacks.length];
}

// ── Features management ──────────────────────────────────────────────────
function renderFeatTags() {
  const list = document.getElementById('feat-list');
  list.innerHTML = features.map((f, i) =>
    `<span class="feat-tag">${f}<button onclick="removeFeat(${i})">×</button></span>`
  ).join('');
}

function addFeature(e) {
  if (e.key !== 'Enter') return;
  const input = document.getElementById('f-feat-input');
  const val = input.value.trim();
  if (val && !features.includes(val)) {
    features.push(val);
    input.value = '';
    renderFeatTags();
    updatePreview();
  }
}

function removeFeat(i) {
  features.splice(i, 1);
  renderFeatTags();
  updatePreview();
}

function loadPhotoFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => { photoDataUrl = ev.target.result; updatePreview(); };
  reader.readAsDataURL(file);
}

// ── Format selector ────────────────────────────────────────────────────────
function setFormat(fmt, btn) {
  currentFormat = fmt;
  document.querySelectorAll('.fmt-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const metas = { story:'Story · 1080 × 1920 px', square:'Feed · 1080 × 1080 px', feed:'Feed · 1080 × 1350 px' };
  document.getElementById('preview-meta').textContent = metas[fmt];
  updatePreview();
}

// ── Read form values ───────────────────────────────────────────────────────
function vals() {
  return {
    headline:   document.getElementById('f-headline').value || 'TITULAR',
    sub:        document.getElementById('f-sub').value || 'frase emocional',
    divider:    document.getElementById('f-divider').value || 'DESTINO',
    desc:       document.getElementById('f-desc').value || '',
    category:   document.getElementById('f-category').value || 'CATEGORÍA',
    ctaTitle:   document.getElementById('f-cta-title').value || 'RECIBE TU ITINERARIO',
    ctaSub:     document.getElementById('f-cta-sub').value || '+ PRECIOS EXCLUSIVOS',
    colorPrimary: document.getElementById('f-color-primary').value || '#1a3d1a',
    colorBg:    document.getElementById('f-color-bg').value || '#f5f0e8',
    colorAccent:document.getElementById('f-color-accent').value || '#4ade80',
    photo:      photoDataUrl || document.getElementById('f-photo').value,
  };
}

// ── Build feature HTML ─────────────────────────────────────────────────────
function buildFeaturesStory(v) {
  return features.slice(0, 5).map((f, i) => `
    <div class="feat-item">
      <div class="feat-icon" style="background:${lighten(v.colorPrimary, 0.7)}">
        ${getIconForFeature(f, i).replace('stroke="currentColor"', `stroke="${v.colorPrimary}"`)}
      </div>
      <div class="feat-label" style="color:${v.colorPrimary}">${f.toUpperCase()}</div>
    </div>
  `).join('');
}

function buildFeaturesSquare(v) {
  return features.slice(0, 4).map((f, i) => `
    <div class="feat-item">
      <div class="feat-icon" style="background:${lighten(v.colorPrimary, 0.7)}">
        ${getIconForFeature(f, i).replace('stroke="currentColor"', `stroke="${v.colorPrimary}"`)}
      </div>
      <div class="feat-label" style="color:${v.colorPrimary}">${f.toUpperCase()}</div>
    </div>
  `).join('');
}

function buildFeaturesFeed(v) {
  return features.slice(0, 5).map((f, i) => `
    <div class="feat-item">
      <div class="feat-icon">${getIconForFeature(f, i)}</div>
      <div class="feat-label">${f}</div>
    </div>
  `).join('');
}

// ── Color utilities ────────────────────────────────────────────────────────
function lighten(hex, amount) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  const nr = Math.round(r + (255 - r) * amount);
  const ng = Math.round(g + (255 - g) * amount);
  const nb = Math.round(b + (255 - b) * amount);
  return `rgb(${nr},${ng},${nb})`;
}

// ── Build ad HTML ──────────────────────────────────────────────────────────
function buildStory(v) {
  const photoStyle = v.photo ? `background-image:url('${v.photo}')` : 'background:#888';
  return `
  <div class="ad-story" id="ad-render" style="--primary:${v.colorPrimary};--bg:${v.colorBg};--accent:${v.colorAccent}">
    <div class="photo-panel" style="${photoStyle}">
      <div class="photo-overlay"></div>
    </div>
    <div class="text-area">
      <div class="category-badge" style="background:${v.colorPrimary}">
        ${ICONS.leaf.replace('stroke="currentColor"', 'stroke="#fff"')}
        ${v.category}
      </div>
      <div class="headline" style="color:${v.colorPrimary}">${v.headline}</div>
      <div class="subheadline" style="color:${v.colorPrimary}">${v.sub}</div>
      <div class="divider">
        <div class="divider-line" style="background:${v.colorPrimary}"></div>
        <div class="divider-label" style="color:${v.colorPrimary}">${v.divider}</div>
        <div class="divider-line" style="background:${v.colorPrimary}"></div>
      </div>
      <div class="description">${v.desc}</div>
      <div class="features">${buildFeaturesStory(v)}</div>
    </div>
    <div class="cta-bar" style="background:${v.colorPrimary}">
      <div class="cta-icon">${ICONS.gift.replace('stroke="currentColor"', 'stroke="#fff"')}</div>
      <div class="cta-text">
        <div class="cta-title">${v.ctaTitle}</div>
        <div class="cta-sub">${v.ctaSub}</div>
      </div>
      <div class="cta-arrow" style="background:${v.colorAccent}">
        ${ICONS.arrow.replace('stroke="currentColor"', `stroke="${v.colorPrimary}"`)}
      </div>
    </div>
  </div>`;
}

function buildSquare(v) {
  const photoStyle = v.photo ? `background-image:url('${v.photo}')` : 'background:#888';
  return `
  <div class="ad-square" id="ad-render" style="--primary:${v.colorPrimary};--bg:${v.colorBg};--accent:${v.colorAccent}">
    <div class="photo-panel" style="${photoStyle}"></div>
    <div class="text-area">
      <div class="category-badge" style="background:${v.colorPrimary}">
        ${ICONS.leaf.replace('stroke="currentColor"', 'stroke="#fff"')}
        ${v.category}
      </div>
      <div class="headline" style="color:${v.colorPrimary}">${v.headline}</div>
      <div class="subheadline" style="color:${v.colorPrimary}">${v.sub}</div>
      <div class="divider">
        <div class="divider-line" style="background:${v.colorPrimary}"></div>
        <div class="divider-label" style="color:${v.colorPrimary}">${v.divider}</div>
        <div class="divider-line" style="background:${v.colorPrimary}"></div>
      </div>
      <div class="description">${v.desc}</div>
      <div class="features-grid">${buildFeaturesSquare(v)}</div>
    </div>
    <div class="cta-bar" style="background:${v.colorPrimary}">
      <div class="cta-icon">${ICONS.gift.replace('stroke="currentColor"', 'stroke="#fff"')}</div>
      <div class="cta-text">
        <div class="cta-title">${v.ctaTitle}</div>
        <div class="cta-sub">${v.ctaSub}</div>
      </div>
      <div class="cta-arrow" style="background:${v.colorAccent}">
        ${ICONS.arrow.replace('stroke="currentColor"', `stroke="${v.colorPrimary}"`)}
      </div>
    </div>
  </div>`;
}

function buildFeed(v) {
  const photoStyle = v.photo ? `background-image:url('${v.photo}')` : 'background:linear-gradient(135deg,#1a3d1a,#2d6b2d)';
  return `
  <div class="ad-feed" id="ad-render" style="--primary:${v.colorPrimary};--accent:${v.colorAccent};${photoStyle}">
    <div class="overlay"></div>
    <div class="top-badge">
      ${ICONS.leaf.replace('stroke="currentColor"', 'stroke="#fff"')}
      ${v.category}
    </div>
    <div class="content">
      <div class="destination" style="color:rgba(255,255,255,.7)">${v.divider}</div>
      <div class="headline">${v.headline}</div>
      <div class="subheadline">${v.sub}</div>
      <div class="description">${v.desc}</div>
      <div class="features">${buildFeaturesFeed(v)}</div>
    </div>
    <div class="cta-bar" style="background:${v.colorPrimary}">
      <div class="cta-icon">${ICONS.gift.replace('stroke="currentColor"', 'stroke="#fff"')}</div>
      <div class="cta-text">
        <div class="cta-title">${v.ctaTitle}</div>
        <div class="cta-sub">${v.ctaSub}</div>
      </div>
      <div class="cta-arrow" style="background:${v.colorAccent}">
        ${ICONS.arrow.replace('stroke="currentColor"', `stroke="${v.colorPrimary}"`)}
      </div>
    </div>
  </div>`;
}

// ── Render preview ─────────────────────────────────────────────────────────
function updatePreview() {
  const v = vals();
  const grid = document.getElementById('previews-grid');

  let adHtml, scaleClass, dims;
  if (currentFormat === 'story') {
    adHtml = buildStory(v);
    scaleClass = 'scale-story';
    dims = { w:1080, h:1920, scale:270/1080 };
  } else if (currentFormat === 'square') {
    adHtml = buildSquare(v);
    scaleClass = 'scale-square';
    dims = { w:1080, h:1080, scale:300/1080 };
  } else {
    adHtml = buildFeed(v);
    scaleClass = 'scale-feed';
    dims = { w:1080, h:1350, scale:270/1080 };
  }

  grid.innerHTML = `
    <div class="preview-card">
      <h3>${currentFormat === 'story' ? 'Stories / Reels · 1080×1920' : currentFormat === 'square' ? 'Feed cuadrado · 1080×1080' : 'Feed vertical · 1080×1350'}</h3>
      <div class="preview-wrap ${scaleClass}">
        <div style="transform:scale(${dims.scale});transform-origin:top left;width:${dims.w}px;height:${dims.h}px">
          ${adHtml}
        </div>
      </div>
    </div>
  `;

  document.getElementById('dl-btn').disabled = false;
}

// ── Capture as PNG ─────────────────────────────────────────────────────────
async function captureAd() {
  const el = document.getElementById('ad-render');
  if (!el) return;

  document.getElementById('loading').classList.add('show');

  try {
    const canvas = await html2canvas(el, {
      scale: 2,
      useCORS: true,
      allowTaint: true,
      backgroundColor: null,
      logging: false,
      width: el.offsetWidth,
      height: el.offsetHeight,
    });

    const link = document.createElement('a');
    link.download = `acuarius-ad-${currentFormat}-${Date.now()}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  } catch(err) {
    alert('Error capturando: ' + err.message + '\n\nAsegúrate de que la imagen de fondo tenga CORS habilitado, o usa una imagen local.');
  } finally {
    document.getElementById('loading').classList.remove('show');
  }
}

// ── Init ───────────────────────────────────────────────────────────────────
renderFeatTags();
updatePreview();
</script>
</body>
