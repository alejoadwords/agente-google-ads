<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crea tu cuenta — Acuarius</title>
<meta name="description" content="Prueba Acuarius 14 días con todo incluido, sin tarjeta de crédito.">
<meta name="theme-color" content="#0B1030">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script
  async
  crossorigin="anonymous"
  data-clerk-publishable-key="pk_live_Y2xlcmsuYWN1YXJpdXMuYXBwJA"
  src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@5.125.10/dist/clerk.browser.js"
  type="text/javascript"
></script>
<!--
  Alta guiada de Acuarius — /registro y /registro/<enlace>

  Crear la cuenta es el primer paso, no el último: lo que decide si alguien se
  queda es lo que pasa en los diez minutos siguientes. Por eso aquí se sigue
  de largo — empresa, moneda, calendario, contactos, equipo, teléfono y qué
  quiere lograr — y al entrar a la app le espera un mensaje del equipo que
  responde a eso último (api/onboarding.js).

  Cada paso se guarda al avanzar: quien cierra la pestaña a la mitad vuelve al
  mismo punto la próxima vez que entra (la app lo trae aquí mientras no acabe).
-->
<style>
:root{
  --blue:#1E2BCC;--blue-h:#1825B8;--blue-lt:#EEF0FD;--blue-md:#C7CBFB;
  --navy:#0B1030;--navy-2:#141B45;--navy-line:rgba(255,255,255,.12);
  --text:#0A0A0A;--text-2:#374151;--muted:#6B7280;--muted2:#9CA3AF;
  --border:#E5E7EB;--border2:#D1D5DB;
  --bg:#FFFFFF;--bg2:#F8F9FA;
  --ok:#047857;--ok-bg:#ECFDF5;--err:#B91C1C;--err-bg:#FEF2F2;--warn:#B45309;
  --font:'Outfit',sans-serif;--r:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100svh;display:grid;grid-template-columns:380px 1fr}

/* ── Panel izquierdo: los pasos ── */
.lado{background:var(--navy);color:#fff;padding:36px 32px;display:flex;flex-direction:column;gap:28px;position:sticky;top:0;height:100svh;overflow-y:auto}
.lado-logo img{height:26px;display:block}
.lado-invita{font-size:13px;color:rgba(255,255,255,.75);line-height:1.45;display:none}
.lado-invita strong{color:#fff}
.lado-hero h2{font-size:28px;font-weight:800;line-height:1.15;letter-spacing:-.02em}
.lado-hero p{margin-top:12px;font-size:15px;line-height:1.5;color:rgba(255,255,255,.8)}
.pasos{list-style:none;display:none;flex-direction:column;gap:14px}
.pasos li{display:flex;align-items:center;gap:12px;font-size:15px;color:rgba(255,255,255,.55)}
.pasos li .pt{width:20px;height:20px;border-radius:50%;border:2px solid rgba(255,255,255,.35);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.pasos li.hecho{color:rgba(255,255,255,.45)}
.pasos li.hecho .pt{background:var(--blue);border-color:var(--blue)}
.pasos li.act{color:#fff;font-weight:700}
.pasos li.act .pt{border-color:#fff;border-style:dashed}
.tip{margin-top:auto;border:1px solid var(--navy-line);background:var(--navy-2);border-radius:12px;padding:16px;font-size:13.5px;line-height:1.5;color:rgba(255,255,255,.82)}
.tip b{display:flex;align-items:center;gap:8px;color:#9DB2FF;font-size:14px;margin-bottom:6px}
.pie{border-top:1px solid var(--navy-line);padding-top:16px;font-size:12.5px;color:rgba(255,255,255,.6);display:flex;gap:8px;align-items:flex-start;line-height:1.45}

/* ── Contenido ── */
main{display:flex;justify-content:center;align-items:flex-start;padding:56px 24px 48px;min-height:100svh}
.caja{width:100%;max-width:560px}
.etq{font-size:13px;font-weight:700;color:var(--blue)}
.barra{height:4px;border-radius:4px;background:var(--blue-md);margin:10px 0 34px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--blue);border-radius:4px;transition:width .35s ease;width:8%}
.ico-grande{width:60px;height:60px;border-radius:16px;background:var(--blue-lt);color:var(--blue);display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
h1{font-size:34px;font-weight:800;line-height:1.12;letter-spacing:-.025em;text-align:center}
.sub{text-align:center;color:var(--muted);font-size:15.5px;line-height:1.5;margin:10px auto 28px;max-width:470px}
.fila{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.campo{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.campo label{font-size:13.5px;font-weight:600;color:var(--text-2)}
.campo input,.campo textarea{border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;font-family:var(--font);font-size:15px;color:var(--text);background:var(--bg);outline:none;transition:border-color .15s}
.campo input:focus,.campo textarea:focus{border-color:var(--blue)}
.campo textarea{min-height:120px;resize:vertical;line-height:1.5}
.nota-ia{font-size:12px;color:var(--muted2)}
.pref{display:flex;align-items:center;border:1.5px solid var(--border);border-radius:10px;overflow:hidden}
.pref:focus-within{border-color:var(--blue)}
.pref span{padding:12px 10px 12px 14px;color:var(--muted);border-right:1px solid var(--border);font-size:15px}
.pref input{border:0;flex:1;min-width:0;padding:12px 14px;font-family:var(--font);font-size:15px;outline:none;background:transparent}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--text-2);margin:6px 0 18px;line-height:1.45;cursor:pointer}
.chk input{width:18px;height:18px;margin-top:1px;accent-color:var(--blue);flex-shrink:0}
.chk a{color:var(--blue);text-decoration:none}
.btn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid transparent;border-radius:11px;padding:15px 18px;font-family:var(--font);font-size:16px;font-weight:700;cursor:pointer;transition:all .15s;text-decoration:none}
.btn-pri{background:var(--blue);color:#fff}
.btn-pri:hover{background:var(--blue-h)}
.btn-pri:disabled{background:var(--border);color:var(--muted2);cursor:default}
.btn-sec{background:var(--bg);color:var(--text);border-color:var(--border2);margin-top:10px}
.btn-sec:hover{background:var(--bg2)}
.btn-google{background:var(--bg);color:var(--text);border-color:var(--border2);margin-bottom:18px}
.dos-btn{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dos-btn .btn-sec{margin-top:0}
.sep{display:flex;align-items:center;gap:12px;color:var(--muted2);font-size:13px;margin:0 0 18px}
.sep::before,.sep::after{content:"";flex:1;height:1px;background:var(--border)}
.bajo{text-align:center;color:var(--muted);font-size:14.5px;margin-top:20px}
.bajo a{color:var(--blue);font-weight:600;text-decoration:none;cursor:pointer}
.chica{text-align:center;color:var(--muted2);font-size:13px;margin-top:12px}
.err{display:none;background:var(--err-bg);color:var(--err);border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:14px;line-height:1.4}
.ok{display:none;background:var(--ok-bg);color:var(--ok);border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:14px}
.info{display:flex;gap:10px;align-items:flex-start;background:var(--blue-lt);border:1px solid var(--blue-md);color:#1A237E;border-radius:12px;padding:14px 16px;font-size:14.5px;line-height:1.5;margin:6px 0 20px}
.lista-ok{background:var(--blue-lt);border:1px solid var(--blue-md);border-radius:12px;padding:16px 20px;margin-bottom:22px;display:flex;flex-direction:column;gap:12px}
.lista-ok div{display:flex;gap:10px;align-items:center;font-size:15px;color:var(--text-2)}
.lista-ok svg{color:var(--blue);flex-shrink:0}
.codigo{display:flex;gap:10px;justify-content:center;margin:6px 0 10px}
.codigo input{width:54px;height:64px;text-align:center;font-size:26px;font-weight:700;font-family:var(--font);border:1.5px solid var(--border2);border-radius:10px;outline:none}
.codigo input:focus{border-color:var(--blue)}
.pildoras{display:flex;flex-wrap:wrap;gap:8px}
.pildoras button{border:1.5px solid var(--border);background:var(--bg);border-radius:20px;padding:8px 14px;font-family:var(--font);font-size:14px;color:var(--text-2);cursor:pointer}
.pildoras button.sel{border-color:var(--blue);background:var(--blue-lt);color:var(--blue);font-weight:700}
.web-hallada{display:flex;align-items:center;gap:12px;border:1px solid var(--blue-md);background:var(--blue-lt);border-radius:12px;padding:12px 16px;margin-bottom:18px}
.web-hallada b{display:block;font-size:15px}
.web-hallada span{font-size:13px;color:var(--muted)}
.web-hallada a{margin-left:auto;color:var(--blue);font-weight:700;cursor:pointer;font-size:14px}
.monedas{border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:18px;max-height:340px;overflow-y:auto}
.moneda{display:flex;align-items:center;gap:14px;padding:13px 16px;border-bottom:1px solid var(--border);cursor:pointer;font-size:15px}
.moneda:last-child{border-bottom:0}
.moneda:hover{background:var(--bg2)}
.moneda.sel{background:var(--blue-lt)}
.moneda .cod{width:38px;height:30px;border:1px solid var(--border2);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--text-2);background:var(--bg)}
.moneda .der{margin-left:auto;color:var(--muted);font-size:14px}
.grupo-t{font-size:13px;font-weight:700;color:var(--text-2);margin:4px 0 8px}
.invitado{border:1px solid var(--border);border-radius:12px;padding:14px 16px 2px;margin-bottom:12px}
.invitado-t{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:10px}
.invitado-t a{color:var(--muted2);cursor:pointer;font-weight:500}
.perfiles{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:12px 16px;font-size:13.5px;line-height:1.5;color:var(--text-2);margin-bottom:18px}
.perfiles b{color:var(--text)}
.tel{display:flex;gap:10px}
.pais{position:relative}
.pais > button{height:100%;border:1.5px solid var(--border);border-radius:10px;background:var(--bg);padding:0 14px;font-family:var(--font);font-size:15px;cursor:pointer;white-space:nowrap}
.pais-lista{position:absolute;top:calc(100% + 6px);left:0;z-index:5;background:var(--bg);border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 32px rgba(10,12,40,.14);max-height:280px;overflow-y:auto;min-width:220px;display:none}
.pais-lista.abierta{display:block}
.pais-lista div{padding:10px 14px;cursor:pointer;font-size:14.5px;display:flex;justify-content:space-between;gap:14px}
.pais-lista div:hover{background:var(--bg2)}
.tel input{flex:1}
.contador{font-size:13px;color:var(--muted2);margin-top:-6px;margin-bottom:16px}
.sp{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:gira .7s linear infinite;display:inline-block}
.btn-sec .sp{border-color:var(--border2);border-top-color:var(--blue)}
@keyframes gira{to{transform:rotate(360deg)}}
.oculto{display:none!important}

@media (max-width:900px){
  body{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .lado{position:static;height:auto;padding:20px 20px 18px;gap:12px}
  .lado-hero,.pasos,.tip,.pie{display:none!important}
  main{padding:28px 16px 40px;min-height:auto}
  h1{font-size:27px}
  .fila,.dos-btn{grid-template-columns:1fr}
  .codigo input{width:44px;height:56px;font-size:22px}
  .codigo{gap:7px}
}
</style>
</head>
<body>

// El enlace por el que llegó: /registro/<slug>. Se guarda en el navegador
// porque el alta con Google sale del sitio y vuelve sin la ruta.
const SLUG = (() => {
  const m = location.pathname.match(/^\/registro\/([a-z0-9-]{3,40})\/?$/i);
  const s = m ? m[1].toLowerCase() : null;
  try {
    if (s) localStorage.setItem('acuarius_enlace', s);
    return s || localStorage.getItem('acuarius_enlace');
  } catch { return s; }
})();

function paisDetectado() {
  try {
    const zona = (Intl.DateTimeFormat().resolvedOptions().timeZone || '').split('/').pop();
    const cod = ZONA_PAIS[zona];
    return PAISES.find(p => p[0] === cod) || null;
  } catch { return null; }
}

function mostrarError(msg) { const e = $('err'); e.textContent = msg; e.style.display = msg ? 'block' : 'none'; }

async function token() {
  try { return await clerk.session.getToken(); } catch { return null; }
}
async function api(ruta, opts = {}) {
  const t = await token();
  const r = await fetch(ruta, { ...opts, headers: { 'Content-Type': 'application/json', ...(t ? { Authorization: 'Bearer ' + t } : {}), ...(opts.headers || {}) } });
  const txt = await r.text();
  let d; try { d = JSON.parse(txt); } catch { d = { error: txt.slice(0, 200) }; }
  if (!r.ok) throw new Error(d.error || ('Error ' + r.status));
  return d;
}
async function guardarPaso(datos) {
  const d = await api('/api/onboarding', { method: 'POST', body: JSON.stringify(datos) });
  estado = d.onboarding || estado;
  return d;
}

  const tip = TIPS[paso];

  mostrarError('');

// ── Acciones ────────────────────────────────────────────────────────────────
async function conGoogle() {
  if (!clerk) return mostrarError('Cargando, intenta en unos segundos…');
  try {
    await clerk.client.signUp.authenticateWithRedirect({
      strategy: 'oauth_google',
      redirectUrl: '/sso-callback',
      redirectUrlComplete: '/registro?continuar=1',
    });
  } catch (e) { mostrarError(e.errors?.[0]?.long_message || e.errors?.[0]?.message || 'No se pudo continuar con Google.'); }
}

async function crearCuenta(btn) {
  if (!clerk) return mostrarError('Cargando, intenta en unos segundos…');
  const nombre = $('r-nombre').value.trim(), apellido = $('r-apellido').value.trim();
  const email = $('r-email').value.trim(), clave = $('r-clave').value;
  if (!nombre || !email || !clave) return mostrarError('Completa tu nombre, tu correo y una contraseña.');
  if (clave.length < 8) return mostrarError('La contraseña debe tener al menos 8 caracteres.');
  if (!$('r-terminos').checked) return mostrarError('Para crear la cuenta tienes que aceptar los términos y la política de privacidad.');
  mostrarError('');
  cargando(btn, 'Creando tu cuenta…');
  try {
    const r = await clerk.client.signUp.create({ firstName: nombre, lastName: apellido, emailAddress: email, password: clave });
    if (r.status === 'complete') { await clerk.setActive({ session: r.createdSessionId }); return trasEntrar(); }
    await clerk.client.signUp.prepareEmailAddressVerification({ strategy: 'email_code' });
    ir('verificar');
  } catch (e) {
    listo(btn);
    const c = e.errors?.[0]?.code;
    mostrarError(c === 'form_identifier_exists'
      ? 'Ese correo ya tiene una cuenta. Inicia sesión con él.'
      : (e.errors?.[0]?.long_message || e.errors?.[0]?.message || 'No se pudo crear la cuenta.'));
  }
}

function arrancarReenvio() {
  reenviarEn = 60;
  clearInterval(_relojReenvio);
  const pintar = () => {
    const el = $('reenviar');
    if (!el) return clearInterval(_relojReenvio);
    el.innerHTML = reenviarEn > 0 ? '¿No lo ves? Reenviar en ' + reenviarEn + ' s' : '¿No lo ves? <a onclick="reenviar()">Reenviar el código</a>';
    if (reenviarEn-- <= 0) clearInterval(_relojReenvio);
  };
  pintar();
  _relojReenvio = setInterval(pintar, 1000);
}
async function reenviar() {
  try { await clerk.client.signUp.prepareEmailAddressVerification({ strategy: 'email_code' }); arrancarReenvio(); }
  catch (e) { mostrarError(e.errors?.[0]?.message || 'No se pudo reenviar el código.'); }
}

let _verificando = false;
async function verificar(btn) {
  const cod = [...document.querySelectorAll('#codigo input')].map(x => x.value).join('');
  // Pegar el código dispara la verificación por dos caminos a la vez (input y
  // paste): sin este cerrojo, el segundo intento llega con el código ya gastado.
  if (cod.length !== 6 || _verificando) return;
  _verificando = true;
  cargando(btn, 'Verificando…');
  try {
    const r = await clerk.client.signUp.attemptEmailAddressVerification({ code: cod });
    if (r.status !== 'complete') throw new Error('Falta algún dato para terminar el registro (' + r.status + ').');
    await clerk.setActive({ session: r.createdSessionId });
    await trasEntrar();
  } catch (e) {
    _verificando = false;
    listo(btn);
    document.querySelectorAll('#codigo input').forEach(x => { x.value = ''; });
    document.querySelector('#codigo input')?.focus();
    btn.disabled = true;
    mostrarError(e.errors?.[0]?.code === 'form_code_incorrect' ? 'Ese código no es correcto. Revísalo e inténtalo de nuevo.' : (e.errors?.[0]?.long_message || e.message || 'No se pudo verificar.'));
  }
}

// Recién creada la sesión: arranca la prueba (sin ella no se puede invitar al
// equipo) y se anota por qué enlace llegó. Ninguna de las dos detiene el alta.
async function trasEntrar() {
  await Promise.all([
    api('/api/trial', { method: 'POST' }).catch(() => null),
    SLUG ? api('/api/cuentas', { method: 'POST', body: JSON.stringify({ accion: 'atribuir', slug: SLUG }) }).catch(() => null) : null,
  ]);
  try {
    if (!localStorage.getItem('acuarius_signup_tracked')) {
      localStorage.setItem('acuarius_signup_tracked', '1');
      (window.dataLayer = window.dataLayer || []).push({ event: 'sign_up', method: 'registro' });
    }
  } catch {}
  await reanudar();
}

async function reanudar() {
  let d;
  try { d = await api('/api/onboarding'); }
  catch (e) {
    // Si no se puede leer el alta, se entra a la app: quedarse aquí bloqueado
    // por un fallo nuestro sería peor que saltarse la bienvenida.
    mostrarError('No pudimos cargar tu configuración (' + e.message + '). Te llevamos a tu cuenta…');
    setTimeout(() => { location.href = '/'; }, 2500);
    return;
  }
  if (!d.debe) { location.href = '/'; return; }
  estado = d.onboarding || {};
  if (estado.empresa) { empresa = { ...empresa, ...estado.empresa }; webAnalizada = !!(empresa.nombre || empresa.web); }
  if (estado.moneda) moneda = estado.moneda;
  const orden = PASOS.map(p => p.id);
  const guardado = orden.includes(estado.paso) ? estado.paso : 'empresa';
  ir(orden.indexOf(guardado) < 2 ? 'empresa' : guardado);
}

async function analizarWeb(btn) {
  let web = $('e-web').value.trim().replace(/^https?:\/\//, '').replace(/\/$/, '');
  if (!/^[^\s/]+\.[a-z]{2,}/i.test(web)) return mostrarError('Escribe tu web completa, por ejemplo tuempresa.com');
  mostrarError('');
  cargando(btn, 'Analizando tu web…');
  empresa.web = 'https://' + web;
  try {
    const d = await api('/api/extract-brand', { method: 'POST', body: JSON.stringify({ url: empresa.web }) });
    if (d.error) throw new Error(d.error);
    empresa.nombre = d.name || empresa.nombre;
    empresa.descripcion = d.descripcion || empresa.descripcion;
    const s = String(d.industria || '');
    empresa.sector = SECTORES.find(x => x.toLowerCase() === s.toLowerCase()) || (s ? 'Otro sector' : empresa.sector);
  } catch (e) {
    // La web no se pudo leer, pero el paso no se pierde: se rellena a mano.
    empresa.nombre = empresa.nombre || '';
    setTimeout(() => mostrarError('No pudimos leer tu web (' + e.message + '). Complétalo tú, es un momento.'), 30);
  }
  webAnalizada = true;
  VISTAS.empresa();
}
function sinWeb() { empresa.web = ''; webAnalizada = true; VISTAS.empresa(); }
function elegir(campo, btn) {
  btn.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('sel'));
  btn.classList.add('sel');
  empresa[campo] = btn.textContent;
}
async function guardarEmpresa(btn) {
  empresa.nombre = $('e-nombre').value.trim();
  empresa.descripcion = $('e-desc').value.trim();
  if (!empresa.nombre) return mostrarError('Escribe el nombre de tu empresa.');
  cargando(btn, 'Guardando…');
  try { await guardarPaso({ paso: 'moneda', empresa }); siguiente(); }
  catch (e) { listo(btn); mostrarError(e.message); }
}
async function guardarMoneda(btn) {
  cargando(btn, 'Guardando…');
  try {
    await guardarPaso({ paso: 'calendario', moneda });
    try { localStorage.setItem('crm_last_currency', moneda); } catch {}
    siguiente();
  } catch (e) { listo(btn); mostrarError(e.message); }
}
async function siguientePaso(proximo) {
  try { await guardarPaso({ paso: proximo }); } catch {}
  ir(proximo);
}

// El OAuth de Google vuelve a la app (/?gcal_connected=…), no aquí. Se abre en
// una ventana aparte y se vigila: cuando esa ventana llega de vuelta a nuestro
// dominio, se lee el resultado y se cierra. El alta sigue donde estaba.
async function conectarCalendario(btn) {
  cargando(btn, 'Abriendo Google…');
  let url;
  try { url = (await api('/api/gcal-enlace', { method: 'POST' })).url; }
  catch (e) { listo(btn); return mostrarError('No se pudo empezar la conexión: ' + e.message); }
  const w = window.open(url, 'acuarius_gcal', 'width=520,height=680');
  if (!w) { listo(btn); return mostrarError('Tu navegador bloqueó la ventana de Google. Permite las ventanas emergentes para este sitio e inténtalo de nuevo.'); }
  const vigia = setInterval(() => {
    let q = null;
    try { q = w.location.origin === location.origin ? w.location.search : null; } catch { /* aún en Google */ }
    if (w.closed && q === null) { clearInterval(vigia); listo(btn); return; }
    if (q === null) return;
    const p = new URLSearchParams(q);
    if (!p.get('gcal_connected') && !p.get('gcal_error')) return;
    clearInterval(vigia);
    w.close();
    if (p.get('gcal_connected')) {
      const ok = $('cal-ok');
      ok.textContent = 'Google Calendar conectado' + (p.get('gcal_email') ? ' (' + p.get('gcal_email') + ')' : '') + '.';
      ok.style.display = 'block';
      btn.disabled = false; btn.innerHTML = 'Continuar'; btn.onclick = () => siguientePaso('contactos');
    } else {
      listo(btn);
      mostrarError('Google no terminó la conexión. Puedes intentarlo otra vez u omitir este paso.');
    }
  }, 400);
}

function importarAlEntrar() {
  try { localStorage.setItem('acuarius_tras_alta', 'importar'); } catch {}
  siguientePaso('equipo');
}

function pintarInvitados() {
  $('invitados').innerHTML = invitados.map((v, k) =>
    '<div class="invitado"><div class="invitado-t"><span>Persona ' + (k + 1) + '</span>' + (invitados.length > 1 ? '<a onclick="invitados.splice(' + k + ',1);leerInvitados(true)">Quitar</a>' : '') + '</div>' +
      '<div class="fila"><div class="campo"><label>Nombre</label><input data-k="' + k + '" data-c="nombre" value="' + esc(v.nombre) + '" placeholder="Nombre"></div>' +
      '<div class="campo"><label>Correo</label><input data-k="' + k + '" data-c="email" type="email" value="' + esc(v.email) + '" placeholder="correo@empresa.com"></div></div>' +
      '<div class="campo"><label>Perfil</label><div class="pildoras">' + [['admin', 'Administrador'], ['ventas', 'Ventas'], ['mercadeo', 'Mercadeo']].map(([id, t]) =>
        '<button type="button" class="' + (v.perfil === id ? 'sel' : '') + '" onclick="leerInvitados();invitados[' + k + '].perfil=\'' + id + '\';pintarInvitados()">' + t + '</button>').join('') + '</div></div>' +
    '</div>').join('');
}
function leerInvitados(repintar) {
  document.querySelectorAll('#invitados input').forEach(i => { invitados[+i.dataset.k][i.dataset.c] = i.value.trim(); });
  if (repintar) VISTAS.equipo();
}
async function invitar(btn) {
  leerInvitados();
  const validos = invitados.filter(v => v.email);
  if (!validos.length) return mostrarError('Escribe al menos un correo, u omite este paso.');
  if (validos.some(v => !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email))) return mostrarError('Revisa los correos: alguno no es válido.');
  cargando(btn, 'Enviando…');
  const fallos = [];
  for (const v of validos) {
    try { await api('/api/team', { method: 'POST', body: JSON.stringify({ email: v.email, name: v.nombre, perfil: v.perfil, owner_name: empresa.nombre || '' }) }); }
    catch (e) { fallos.push(v.email + ': ' + e.message); }
  }
  listo(btn);
  if (fallos.length) return mostrarError('No se pudo invitar a ' + fallos.join(' · '));
  siguientePaso('telefono');
}

function elegirPais(k) {
  pais = PAISES[k];
  $('t-pais').textContent = pais[0] + ' ' + pais[1] + ' ▾';
  $('t-lista').classList.remove('abierta');
  $('t-num').focus();
}
async function guardarTelefono(btn) {
  const num = $('t-num').value.replace(/\D/g, '');
  if (num.length < 7) return mostrarError('Escribe tu número completo.');
  cargando(btn, 'Guardando…');
  try { await guardarPaso({ paso: 'objetivo', telefono: pais[1] + num }); siguiente(); }
  catch (e) { listo(btn); mostrarError(e.message); }
}

async function completar(btn) {
  const objetivo = $('o-txt').value.trim();
  cargando(btn, 'Preparando tu cuenta…');
  try {
    await api('/api/onboarding', { method: 'POST', body: JSON.stringify({ accion: 'completar', objetivo }) });
    try { localStorage.removeItem('acuarius_enlace'); } catch {}
    location.href = '/?bienvenida=1';
  } catch (e) { listo(btn); mostrarError(e.message); }
}

document.addEventListener('click', e => {
  const l = $('t-lista');
  if (l && l.classList.contains('abierta') && !e.target.closest('.pais')) l.classList.remove('abierta');
});

// ── Arranque ────────────────────────────────────────────────────────────────
(async function arrancar() {
  // El enlace personalizado: quién invita. Si falla, la página sigue igual.
  if (SLUG) {
    fetch('/api/cuentas?registro=' + encodeURIComponent(SLUG)).then(r => r.json()).then(d => {
      if (!d.ok || !d.titulo) return;
      const el = $('invita');
      el.innerHTML = esc(d.titulo);
      el.style.display = 'block';
    }).catch(() => {});
  }
  marco();
  try {
    await new Promise((ok, mal) => {
      const t0 = Date.now();
      const iv = setInterval(() => {
        if (window.Clerk) { clearInterval(iv); ok(); }
        else if (Date.now() - t0 > 12000) { clearInterval(iv); mal(new Error('timeout')); }
      }, 60);
    });
    await window.Clerk.load();
    clerk = window.Clerk;
  } catch (e) {
    $('vista').innerHTML = '<p class="sub">No se pudo cargar el registro. Revisa tu conexión y recarga la página.</p><button class="btn btn-pri" onclick="location.reload()">Recargar</button>';
    return;
  }
  // Una sesión de soporte (un admin dentro de la cuenta de un cliente) no
  // completa el alta por él: se va a la app.
  if (clerk.session?.actor) { location.href = '/'; return; }
  if (clerk.user) { await trasEntrar(); return; }
  // Un alta a medias en esta pestaña (cerró en el código): se retoma.
  if (clerk.client?.signUp?.status === 'missing_requirements' && clerk.client.signUp.emailAddress
      && (clerk.client.signUp.unverifiedFields || []).includes('email_address')) { ir('verificar'); return; }
  ir('cuenta');
})();
</script>
