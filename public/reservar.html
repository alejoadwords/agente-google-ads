<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Reservar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --text:#0D0F1C;--text-2:#5A607A;--text-3:#9DA3BE;
  --border:#E4E6F0;--border2:#F0F1F8;
  --bg:#FFFFFF;--bg-subtle:#F7F8FC;--bg-muted:#F0F1F8;
  --success:#059669;--success-bg:#E7F7F0;--danger:#DC2626;--danger-bg:#FDECEC;
  --blue:#1E2BCC;--aqua:#00B8CE;--agua-grad:linear-gradient(135deg,var(--blue),var(--aqua));
  --font:'Outfit',sans-serif;--r:10px;--rlg:14px;
  --ease:cubic-bezier(0.16,1,0.3,1);
  --shadow-sm:0 1px 3px rgba(13,15,28,.06),0 1px 2px rgba(13,15,28,.04);
  --shadow-md:0 4px 12px rgba(13,15,28,.08),0 1px 3px rgba(13,15,28,.05);
  /* El acento lo pone cada negocio; el resto de la página no cambia. */
  --acento:#1E2BCC;--acento-lt:#EEF0FD;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg-subtle);color:var(--text);
  -webkit-font-smoothing:antialiased;padding:0 0 40px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}

.prog{position:sticky;top:0;z-index:20;background:rgba(247,248,252,.92);
  backdrop-filter:blur(12px);padding:12px 0 10px;border-bottom:1px solid var(--border2)}
.prog-in{max-width:560px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:8px}
.prog-back{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--text-2)}
.prog-back:hover{background:var(--bg-muted)}
.prog-back[hidden]{display:none}
.prog-bars{flex:1;display:flex;gap:5px}
.prog-bars i{flex:1;height:4px;border-radius:99px;background:var(--border);transition:background .3s var(--ease)}
.prog-bars i.on{background:var(--acento)}
.prog-paso{font-size:11px;font-weight:700;color:var(--text-3);letter-spacing:.03em;white-space:nowrap}

.neg{padding:22px 0 18px;display:flex;align-items:center;gap:14px}
.neg-logo{width:52px;height:52px;border-radius:15px;background:var(--agua-grad);
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:20px;
  flex:0 0 auto;box-shadow:var(--shadow-md)}
.neg h1{font-size:19px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.neg .sub{font-size:13px;color:var(--text-2);margin-top:3px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}

h2.tit{font-size:15px;font-weight:700;letter-spacing:-.01em;margin:0 0 3px}
p.ayuda{font-size:13px;color:var(--text-2);margin:0 0 14px}

.serv{display:flex;flex-direction:column;gap:9px}
.serv button{width:100%;text-align:left;background:var(--bg);border:1.5px solid var(--border);
  border-radius:var(--rlg);padding:14px 15px;display:flex;align-items:center;gap:13px;
  transition:border-color .18s var(--ease),transform .18s var(--ease),box-shadow .18s var(--ease)}
.serv button:hover{border-color:var(--acento);transform:translateY(-1px);box-shadow:var(--shadow-md)}
.serv .ico{width:40px;height:40px;border-radius:12px;background:var(--acento-lt);
  display:grid;place-items:center;color:var(--acento);flex:0 0 auto}
.serv .nom{font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.serv .det{font-size:12.5px;color:var(--text-2);margin-top:2px}
.serv .precio{margin-left:auto;text-align:right;flex:0 0 auto}
.serv .precio b{font-size:14px;font-weight:700;display:block}
.serv .precio span{font-size:11px;color:var(--text-3)}

.pros{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.pros button{background:var(--bg);border:1.5px solid var(--border);border-radius:var(--rlg);
  padding:16px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;
  transition:border-color .18s var(--ease),transform .18s var(--ease)}
.pros button:hover{border-color:var(--acento);transform:translateY(-1px)}
.pros .av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;
  font-weight:700;font-size:15px;color:#fff;background:var(--agua-grad)}
.pros .av.cualq{background:var(--bg-muted);color:var(--text-2)}
.pros .nm{font-size:13px;font-weight:600}
.pros .rol{font-size:11.5px;color:var(--text-3)}

.dias{display:flex;gap:7px;overflow-x:auto;padding:2px 16px 12px;margin:0 -16px;scrollbar-width:none}
.dias::-webkit-scrollbar{display:none}
.dias button{flex:0 0 auto;width:54px;background:var(--bg);border:1.5px solid var(--border);
  border-radius:var(--r);padding:9px 0 8px;text-align:center;transition:all .18s var(--ease)}
.dias button .dow{font-size:10.5px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em}
.dias button .num{font-size:17px;font-weight:700;margin-top:2px;letter-spacing:-.02em}
.dias button .pt{width:4px;height:4px;border-radius:50%;background:var(--acento);margin:4px auto 0}
.dias button.sel{background:var(--acento);border-color:var(--acento);color:#fff}
.dias button.sel .dow{color:rgba(255,255,255,.75)}
.dias button.sel .pt{background:rgba(255,255,255,.9)}
/* Cerrado y lleno se ven distinto a propósito: si un martes a tope se pintara
   como el domingo, el cliente creería que ese día no atienden. */
.dias button.cerrado{opacity:.38;cursor:default}
.dias button.cerrado .pt{background:transparent}
.dias button.lleno .pt{background:var(--border)}

.franja-tit{font-size:11px;font-weight:700;color:var(--text-3);text-transform:uppercase;
  letter-spacing:.06em;margin:16px 0 8px;display:flex;align-items:center;gap:7px}
.franja-tit::after{content:'';flex:1;height:1px;background:var(--border2)}
.horas{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px}
.horas button{background:var(--bg);border:1.5px solid var(--border);border-radius:var(--r);
  padding:11px 0;font-size:14px;font-weight:600;transition:all .15s var(--ease)}
.horas button:hover{border-color:var(--acento);color:var(--acento)}
.horas button.sel{background:var(--acento);border-color:var(--acento);color:#fff}

.vacio{text-align:center;padding:34px 20px;background:var(--bg);border:1px dashed var(--border);
  border-radius:var(--rlg);margin-top:14px}
.vacio .em{width:44px;height:44px;border-radius:50%;background:var(--bg-muted);
  display:grid;place-items:center;margin:0 auto 11px;color:var(--text-3)}
.vacio p{font-size:13.5px;color:var(--text-2);line-height:1.5}

.resumen{background:var(--bg);border:1.5px solid var(--acento);border-radius:var(--rlg);
  padding:14px 15px;margin-bottom:18px}
.resumen .fila{display:flex;align-items:center;gap:10px;font-size:13.5px;padding:5px 0}
.resumen .fila svg{color:var(--acento);flex:0 0 auto}
.resumen .fila b{font-weight:600}
.resumen .cambiar{margin-left:auto;font-size:12px;font-weight:700;color:var(--acento)}

label{display:block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  color:var(--text-2);margin:13px 0 5px}
label .req{color:var(--danger)}
input,textarea{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:var(--r);
  font-size:15px;background:var(--bg);color:inherit;outline:none;transition:border-color .15s}
input:focus,textarea:focus{border-color:var(--acento)}
textarea{min-height:76px;resize:vertical;font-size:14px}
.btn-pri{width:100%;margin-top:20px;padding:14px;border-radius:12px;background:var(--acento);
  color:#fff;font-size:15px;font-weight:700;transition:filter .15s}
.btn-pri:hover{filter:brightness(1.08)}
.btn-pri:disabled{opacity:.6;cursor:default}
.legal{font-size:11.5px;color:var(--text-3);text-align:center;margin-top:11px;line-height:1.5}
.hp{position:absolute;left:-9999px;opacity:0;height:0;overflow:hidden}

.err{margin-top:12px;font-size:13px;color:var(--danger);background:var(--danger-bg);
  border-radius:9px;padding:10px 13px;line-height:1.5}

.ok{text-align:center;padding:30px 4px 10px}
.ok .tick{width:64px;height:64px;border-radius:50%;background:var(--success-bg);color:var(--success);
  display:grid;place-items:center;margin:0 auto 16px;animation:pop .5s var(--ease)}
.ok .tick.gris{background:var(--bg-muted);color:var(--text-3)}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
.ok h2{font-size:21px;font-weight:700;letter-spacing:-.02em}
.ok .cuando{font-size:15px;color:var(--text-2);margin-top:6px;line-height:1.5}
.tarjeta{background:var(--bg);border:1px solid var(--border);border-radius:var(--rlg);
  padding:16px;margin-top:20px;text-align:left;box-shadow:var(--shadow-sm)}
.tarjeta .fila{display:flex;gap:11px;padding:7px 0;font-size:13.5px;align-items:flex-start}
.tarjeta .fila svg{color:var(--text-3);flex:0 0 auto;margin-top:1px}
.avisos{display:flex;gap:8px;margin-top:14px;font-size:12.5px;color:var(--text-2);
  background:var(--bg-subtle);border-radius:var(--r);padding:11px 13px;line-height:1.5}
.acciones{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap}
.acciones button,.acciones a{flex:1;min-width:120px;padding:12px;border-radius:var(--r);font-size:13.5px;
  font-weight:700;border:1.5px solid var(--border);background:var(--bg);transition:border-color .15s;
  text-align:center;text-decoration:none;color:inherit;display:block}
.acciones button:hover,.acciones a:hover{border-color:var(--acento);color:var(--acento)}
.acciones .cal{background:var(--acento);border-color:var(--acento);color:#fff}
.acciones .cal:hover{color:#fff;filter:brightness(1.08)}
.acciones .peligro:hover{border-color:var(--danger);color:var(--danger)}

.firma{text-align:center;margin-top:26px;font-size:11.5px;color:var(--text-3)}
.firma a{color:var(--text-3);font-weight:700;text-decoration:none}
.cargando{text-align:center;color:var(--text-3);padding:60px 0;font-size:14px}
.paso{display:none}.paso.on{display:block;animation:entra .3s var(--ease)}
@keyframes entra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>

<div class="prog" id="prog" hidden>
  <div class="prog-in">
    <button class="prog-back" id="atras" hidden aria-label="Atrás">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="prog-bars" id="barras"><i class="on"></i><i></i><i></i><i></i></div>
    <div class="prog-paso" id="rotulo">Paso 1 de 4</div>
  </div>
</div>

<div class="wrap" id="todo"><div class="cargando">Cargando…</div></div>

<script>
(function () {
'use strict';

var RUTA = location.pathname.match(/\/(reservar|cita)\/([a-f0-9]{24,64})/i) || [];
var MODO = RUTA[1] || '';
var TOKEN = RUTA[2] || '';

var N = null;           // el negocio
var SERVICIOS = [], RECURSOS = [];
var sel = { serv: null, pro: null, dia: null, hora: null, recursos: [] };
var DIAS = [];          // la tira, con su cupo
var HORAS = [];
var DOW = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];

var $ = function (id) { return document.getElementById(id); };
function esc(t) {
  return String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function ico(p, s) {
  return '<svg width="' + (s || 15) + '" height="' + (s || 15) + '" viewBox="0 0 24 24" fill="none" ' +
    'stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + p + '</svg>';
}
var I = {
  tijeras: '<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4L8.12 15.88M14.47 14.48L20 20M8.12 8.12L12 12"/>',
  cal: '<rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  pin: '<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/>',
  user: '<path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  reloj: '<circle cx="12" cy="12" r="10"/><path d="M12 7v5l3 2"/>',
  info: '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',
  tick: '<path d="M20 6L9 17l-5-5"/>',
};

function pantallaSola(titulo, texto, gris) {
  $('prog').hidden = true;
  $('todo').innerHTML =
    '<div class="ok"><div class="tick' + (gris ? ' gris' : '') + '">' + ico(I.info, 28) + '</div>' +
    '<h2>' + esc(titulo) + '</h2><div class="cuando">' + esc(texto) + '</div></div>' +
    '<div class="firma">Con la tecnología de <a href="https://acuarius.app" target="_blank" rel="noopener">Acuarius</a></div>';
}

function api(qs, opts) {
  return fetch('/api/booking-public?' + qs, opts).then(function (r) {
    return r.json().then(function (d) { return { ok: r.ok, status: r.status, d: d }; });
  });
}

// ── Arranque ───────────────────────────────────────────────────────────────
if (!TOKEN) {
  pantallaSola('Enlace incompleto', 'Pídele al negocio su enlace de reservas otra vez.', true);
} else if (MODO === 'cita') {
  verCita();
} else {
  api('token=' + TOKEN).then(function (r) {
    if (!r.ok) {
      pantallaSola(r.d && r.d.apagada ? 'Reservas cerradas' : 'No encontramos esta página',
        (r.d && r.d.error) || 'Revisa el enlace con el negocio.', true);
      return;
    }
    N = r.d.negocio; SERVICIOS = r.d.servicios || []; RECURSOS = r.d.recursos || [];
    aplicarAcento(N.acento);
    document.title = N.nombre;
    if (!SERVICIOS.length) {
      pantallaSola(N.nombre, 'Todavía no hay nada que reservar por aquí. Escríbele al negocio.', true);
      return;
    }
    montar();
  }).catch(function () {
    pantallaSola('No se pudo cargar', 'Revisa tu conexión y vuelve a intentarlo.', true);
  });
}

function aplicarAcento(c) {
  if (!/^#[0-9a-f]{6}$/i.test(String(c || ''))) return;
  document.documentElement.style.setProperty('--acento', c);
  // Una versión muy clara del mismo color para los fondos, sin pedirle nada
  // más al negocio que su color.
  var r = parseInt(c.slice(1, 3), 16), g = parseInt(c.slice(3, 5), 16), b = parseInt(c.slice(5, 7), 16);
  var mez = function (x) { return Math.round(x + (255 - x) * 0.92); };
  document.documentElement.style.setProperty('--acento-lt',
    'rgb(' + mez(r) + ',' + mez(g) + ',' + mez(b) + ')');
}

function iniciales(t) {
  return String(t || '?').trim().split(/\s+/).slice(0, 2).map(function (p) { return p.charAt(0); }).join('').toUpperCase();
}

function montar() {
  $('prog').hidden = false;
  $('todo').innerHTML =
    '<div class="neg" id="cab">' +
      '<div class="neg-logo">' + esc(iniciales(N.nombre)) + '</div>' +
      '<div><h1>' + esc(N.nombre) + '</h1>' +
        (N.direccion ? '<div class="sub">' + ico(I.pin, 13) + esc(N.direccion) + '</div>' : '') +
      '</div></div>' +

    '<section class="paso on" id="p1"><h2 class="tit">¿Qué necesitas?</h2>' +
      '<p class="ayuda">Elige el servicio para ver las horas libres.</p>' +
      '<div class="serv" id="servicios"></div></section>' +

    '<section class="paso" id="p2"><h2 class="tit">¿Con quién?</h2>' +
      '<p class="ayuda">Si te da igual, te asignamos al primero disponible.</p>' +
      '<div class="pros" id="profesionales"></div></section>' +

    '<section class="paso" id="p3"><h2 class="tit">¿Cuándo te viene bien?</h2>' +
      '<p class="ayuda" id="ayuda-hora"></p>' +
      '<div class="dias" id="dias"></div><div id="horarios"></div></section>' +

    '<section class="paso" id="p4"><h2 class="tit">Últimos datos</h2>' +
      '<p class="ayuda">' + (N.recordatorio
        ? 'Te mandamos la confirmación y un recordatorio antes de tu cita.'
        : 'Te mandamos la confirmación con los datos de tu cita.') + '</p>' +
      '<div class="resumen" id="resumen"></div>' +
      '<label>Nombre <span class="req">*</span></label><input id="f-nom" autocomplete="name" placeholder="Tu nombre y apellido">' +
      '<label>WhatsApp</label><input id="f-tel" inputmode="tel" autocomplete="tel" placeholder="+57 300 000 0000">' +
      '<label>Correo</label><input id="f-mail" inputmode="email" autocomplete="email" placeholder="tucorreo@ejemplo.com">' +
      '<label>¿Algo que debamos saber?</label><textarea id="f-nota" placeholder="Opcional"></textarea>' +
      '<div class="hp"><input type="text" id="f-hp" tabindex="-1" autocomplete="off"></div>' +
      '<button class="btn-pri" id="btn-conf">Confirmar reserva</button>' +
      '<div class="err" id="err" style="display:none"></div>' +
      '<div class="legal">Al reservar aceptas que te escribamos para confirmarte la cita' +
        (N.recordatorio ? ' y recordártela' : '') + '.</div></section>' +

    '<section class="paso" id="p5"></section>';

  $('atras').onclick = function () { ir(Math.max(1, pasoActual - 1)); };
  $('btn-conf').onclick = confirmar;
  $('ayuda-hora').textContent = 'Horas de ' + N.zona.split('/').pop().replace(/_/g, ' ') + '.';

  $('servicios').innerHTML = SERVICIOS.map(function (s, i) {
    return '<button data-i="' + i + '">' +
      '<div class="ico">' + ico(I.tijeras, 19) + '</div>' +
      '<div><div class="nom">' + esc(s.nombre) + '</div>' +
      (s.descripcion ? '<div class="det">' + esc(s.descripcion) + '</div>' : '') + '</div>' +
      '<div class="precio">' + (s.precio != null && s.precio !== '' ? '<b>$' + miles(s.precio) + '</b>' : '') +
      '<span>' + duracion(s.minutos) + '</span></div></button>';
  }).join('');
  $('servicios').onclick = function (e) {
    var b = e.target.closest('button[data-i]');
    if (b) elegirServ(+b.dataset.i);
  };
}

function miles(n) {
  var x = Number(n);
  if (!isFinite(x)) return '';
  try { return x.toLocaleString('es-CO', { maximumFractionDigits: 0 }); } catch (e) { return String(x); }
}
function duracion(m) {
  m = Number(m) || 0;
  if (m < 60) return m + ' min';
  var h = Math.floor(m / 60), r = m % 60;
  return h + ' h' + (r ? ' ' + r + ' min' : '');
}

// ── Paso 2 ─────────────────────────────────────────────────────────────────
function elegirServ(i) {
  sel.serv = SERVICIOS[i]; sel.pro = null; sel.dia = null; sel.hora = null;
  var puede = RECURSOS.filter(function (r) { return sel.serv.recursos.indexOf(r.id) >= 0; });
  // Con una sola persona no hay nada que elegir: preguntarlo es un paso de más.
  if (puede.length <= 1) { sel.pro = puede[0] || null; cargarDias(); ir(3); return; }
  $('profesionales').innerHTML =
    '<button data-id=""><div class="av cualq">★</div><div class="nm">Quien esté libre</div>' +
      '<div class="rol">Más horas para elegir</div></button>' +
    puede.map(function (p) {
      return '<button data-id="' + esc(p.id) + '"><div class="av">' + esc(iniciales(p.nombre)) + '</div>' +
        '<div class="nm">' + esc(p.nombre) + '</div></button>';
    }).join('');
  $('profesionales').onclick = function (e) {
    var b = e.target.closest('button[data-id]');
    if (!b) return;
    sel.pro = b.dataset.id ? puede.filter(function (p) { return p.id === b.dataset.id; })[0] : null;
    cargarDias(); ir(3);
  };
  ir(2);
}

// ── Paso 3 ─────────────────────────────────────────────────────────────────
function qs() {
  return 'token=' + TOKEN + '&service_id=' + encodeURIComponent(sel.serv.id) +
    (sel.pro ? '&resource_id=' + encodeURIComponent(sel.pro.id) : '');
}

function cargarDias() {
  $('dias').innerHTML = '<div class="cargando" style="padding:18px 0">Buscando horas…</div>';
  $('horarios').innerHTML = '';
  api(qs() + '&dias=1').then(function (r) {
    if (!r.ok) { $('dias').innerHTML = ''; avisoVacio((r.d && r.d.error) || 'No se pudieron cargar los días.'); return; }
    DIAS = r.d.dias || [];
    pintarDias();
    // Se abre en el primer día con hueco: nadie quiere llegar y tener que
    // buscar a mano cuál de los catorce tiene algo.
    var k = -1;
    for (var i = 0; i < DIAS.length; i++) if (DIAS[i].cupo) { k = i; break; }
    if (k >= 0) elegirDia(k);
    else avisoVacio('No queda ninguna hora libre en los próximos días. Escríbele al negocio.');
  }).catch(function () { $('dias').innerHTML = ''; avisoVacio('Revisa tu conexión y vuelve a intentarlo.'); });
}

function pintarDias() {
  $('dias').innerHTML = DIAS.map(function (d, k) {
    var p = d.dia.split('-');
    var f = new Date(+p[0], +p[1] - 1, +p[2]);
    var clase = d.cerrado ? 'cerrado' : (d.cupo ? '' : 'lleno');
    return '<button class="' + clase + '"' + (d.cupo ? ' data-k="' + k + '"' : '') + '>' +
      '<div class="dow">' + (k === 0 ? 'hoy' : DOW[f.getDay()]) + '</div>' +
      '<div class="num">' + f.getDate() + '</div><div class="pt"></div></button>';
  }).join('');
  $('dias').onclick = function (e) {
    var b = e.target.closest('button[data-k]');
    if (b) elegirDia(+b.dataset.k);
  };
}

function elegirDia(k) {
  sel.dia = DIAS[k].dia; sel.hora = null;
  Array.prototype.forEach.call($('dias').children, function (b, i) { b.classList.toggle('sel', i === k); });
  var act = $('dias').children[k];
  if (act && act.scrollIntoView) act.scrollIntoView({ block: 'nearest', inline: 'center' });
  $('horarios').innerHTML = '<div class="cargando" style="padding:18px 0">Buscando horas…</div>';
  api(qs() + '&dia=' + sel.dia).then(function (r) {
    if (!r.ok) { avisoVacio((r.d && r.d.error) || 'No se pudieron cargar las horas.'); return; }
    HORAS = r.d.horas || [];
    pintarHoras();
  }).catch(function () { avisoVacio('Revisa tu conexión y vuelve a intentarlo.'); });
}

function avisoVacio(texto) {
  $('horarios').innerHTML = '<div class="vacio"><div class="em">' + ico(I.reloj, 20) + '</div>' +
    '<p>' + esc(texto) + '</p></div>';
}

function horaLocal(iso) {
  try {
    return new Intl.DateTimeFormat('es-CO', { timeZone: N.zona, hour: 'numeric', minute: '2-digit', hour12: true }).format(new Date(iso));
  } catch (e) { return iso.slice(11, 16); }
}
function hora24(iso) {
  try {
    return new Intl.DateTimeFormat('en-GB', { timeZone: N.zona, hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date(iso));
  } catch (e) { return iso.slice(11, 16); }
}

function pintarHoras() {
  if (!HORAS.length) {
    avisoVacio('No queda nada ese día. Prueba con otro de la tira.');
    return;
  }
  // Mañana y tarde, y en reloj de 12 horas: «14:30» es lenguaje de sistema,
  // nadie pide una cita así.
  var man = [], tar = [];
  HORAS.forEach(function (h) { (hora24(h.inicio) < '12:00' ? man : tar).push(h); });
  var bloque = function (rot, arr) {
    if (!arr.length) return '';
    return '<div class="franja-tit">' + rot + '</div><div class="horas">' + arr.map(function (h) {
      return '<button data-i="' + HORAS.indexOf(h) + '">' + esc(horaLocal(h.inicio)) + '</button>';
    }).join('') + '</div>';
  };
  $('horarios').innerHTML = bloque('Mañana', man) + bloque('Tarde', tar);
  $('horarios').onclick = function (e) {
    var b = e.target.closest('button[data-i]');
    if (!b) return;
    sel.hora = HORAS[+b.dataset.i];
    Array.prototype.forEach.call($('horarios').querySelectorAll('.horas button'), function (x) { x.classList.remove('sel'); });
    b.classList.add('sel');
    setTimeout(function () { pintarResumen(); ir(4); }, 180);
  };
}

// ── Paso 4 ─────────────────────────────────────────────────────────────────
function cuandoTexto() {
  try {
    return new Intl.DateTimeFormat('es-CO', {
      timeZone: N.zona, weekday: 'long', day: 'numeric', month: 'long',
      hour: 'numeric', minute: '2-digit', hour12: true,
    }).format(new Date(sel.hora.inicio));
  } catch (e) { return sel.hora.inicio; }
}

function pintarResumen() {
  $('resumen').innerHTML =
    '<div class="fila">' + ico(I.tijeras) + '<b>' + esc(sel.serv.nombre) + '</b> · ' + duracion(sel.serv.minutos) +
      '<button class="cambiar" data-ir="1">Cambiar</button></div>' +
    '<div class="fila">' + ico(I.cal) + '<b>' + esc(cuandoTexto()) + '</b>' +
      '<button class="cambiar" data-ir="3">Cambiar</button></div>' +
    '<div class="fila">' + ico(I.user) + (sel.pro ? 'Con <b>' + esc(sel.pro.nombre) + '</b>' : 'Con quien esté libre') +
      (RECURSOS.length > 1 ? '<button class="cambiar" data-ir="2">Cambiar</button>' : '') + '</div>';
  $('resumen').onclick = function (e) {
    var b = e.target.closest('button[data-ir]');
    if (b) ir(+b.dataset.ir);
  };
}

function confirmar() {
  var err = $('err');
  err.style.display = 'none';
  var nombre = $('f-nom').value.trim();
  var tel = $('f-tel').value.trim();
  var mail = $('f-mail').value.trim();
  if (!nombre) { fallo('Escribe tu nombre.'); $('f-nom').focus(); return; }
  if (!tel && !mail) { fallo('Déjanos un teléfono o un correo para poder confirmarte.'); $('f-tel').focus(); return; }
  if (mail && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)) { fallo('Ese correo no parece válido.'); $('f-mail').focus(); return; }

  var btn = $('btn-conf');
  btn.disabled = true; btn.textContent = 'Reservando…';
  api('token=' + TOKEN, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      service_id: sel.serv.id,
      resource_id: sel.pro ? sel.pro.id : null,
      inicio: sel.hora.inicio,
      nombre: nombre, telefono: tel, correo: mail,
      nota: $('f-nota').value.trim(),
      _hp: $('f-hp').value,
    }),
  }).then(function (r) {
    btn.disabled = false; btn.textContent = 'Confirmar reserva';
    if (!r.ok) {
      fallo((r.d && r.d.error) || 'No se pudo reservar. Inténtalo otra vez.');
      // Si se la quitaron mientras rellenaba, se le devuelve a las horas con la
      // lista ya actualizada, en vez de dejarlo mirando un error.
      if (r.d && r.d.ocupada) setTimeout(function () { ir(3); elegirDia(indiceDe(sel.dia)); }, 1400);
      return;
    }
    listo(r.d.cita);
  }).catch(function () {
    btn.disabled = false; btn.textContent = 'Confirmar reserva';
    fallo('Revisa tu conexión y vuelve a intentarlo.');
  });

  function fallo(m) { err.textContent = m; err.style.display = 'block'; }
}

function indiceDe(dia) {
  for (var i = 0; i < DIAS.length; i++) if (DIAS[i].dia === dia) return i;
  return 0;
}

// ── Paso 5 ─────────────────────────────────────────────────────────────────
function enlaceCalendario(c) {
  var z = function (d) { return new Date(d).toISOString().replace(/[-:]|\.\d{3}/g, ''); };
  var p = new URLSearchParams({
    action: 'TEMPLATE',
    text: c.servicio + (N.nombre ? ' · ' + N.nombre : ''),
    dates: z(c.inicio) + '/' + z(c.fin),
    details: 'Reservado en ' + (N.nombre || 'línea') + '. Cancelar: ' + location.origin + '/cita/' + c.token,
    location: N.direccion || '',
  });
  return 'https://calendar.google.com/calendar/render?' + p.toString();
}

function listo(c) {
  var nombreCorto = String(c.nombre || '').trim().split(/\s+/)[0] || '';
  $('cab').style.display = 'none';
  $('p5').innerHTML =
    '<div class="ok"><div class="tick">' + ico(I.tick, 30) + '</div>' +
      '<h2>¡Listo' + (nombreCorto ? ', ' + esc(nombreCorto) : '') + '!</h2>' +
      '<div class="cuando"><b>' + esc(cuandoTexto()) + '</b><br>' +
        esc(c.servicio) + ' · ' + duracion(c.minutos) + '</div></div>' +
    '<div class="tarjeta">' +
      '<div class="fila">' + ico(I.user, 16) + '<div>Te atiende <b>' + esc(c.con) + '</b></div></div>' +
      (N.direccion ? '<div class="fila">' + ico(I.pin, 16) + '<div>' + esc(N.direccion) +
        (N.detalle_direccion ? '<br><span style="color:var(--text-3);font-size:12.5px">' + esc(N.detalle_direccion) + '</span>' : '') +
        '</div></div>' : '') +
    '</div>' +
    (N.mensaje_confirmacion
      ? '<div class="avisos">' + ico(I.info, 15) + '<div>' + esc(N.mensaje_confirmacion) + '</div></div>' : '') +
    '<div class="avisos">' + ico(I.info, 15) +
      '<div>' + (N.recordatorio ? 'Te lo recordamos antes de la cita. ' : '') +
      'Guarda este enlace: desde ahí puedes cancelar si te surge algo.</div></div>' +
    '<div class="acciones">' +
      '<a class="cal" href="' + esc(enlaceCalendario(c)) + '" target="_blank" rel="noopener">Agregar a mi calendario</a>' +
      '<a href="/cita/' + esc(c.token) + '">Ver mi cita</a>' +
    '</div>' +
    '<div class="firma">Con la tecnología de <a href="https://acuarius.app" target="_blank" rel="noopener">Acuarius</a></div>';
  ir(5);
}

var pasoActual = 1;
function ir(n) {
  pasoActual = n;
  for (var i = 1; i <= 5; i++) $('p' + i).classList.toggle('on', i === n);
  Array.prototype.forEach.call($('barras').children, function (b, i) { b.classList.toggle('on', i < Math.min(n, 4)); });
  $('rotulo').textContent = n === 5 ? 'Reserva confirmada' : 'Paso ' + n + ' de 4';
  $('atras').hidden = n === 1 || n === 5;
  if (n === 5) $('prog').hidden = true;
  window.scrollTo(0, 0);
}

// ── /cita/<token> ──────────────────────────────────────────────────────────
function verCita() {
  api('cita=' + TOKEN).then(function (r) {
    if (!r.ok) { pantallaSola('Cita no encontrada', 'Revisa el enlace que te mandamos.', true); return; }
    pintarCita(r.d.cita);
  }).catch(function () { pantallaSola('No se pudo cargar', 'Revisa tu conexión.', true); });
}

function pintarCita(c) {
  N = { zona: c.zona, nombre: c.negocio, direccion: c.direccion, detalle_direccion: c.detalle_direccion };
  aplicarAcento(c.acento);
  document.title = c.negocio || 'Tu cita';
  var cancelada = c.estado === 'cancelada';
  var cuando = '';
  try {
    cuando = new Intl.DateTimeFormat('es-CO', {
      timeZone: c.zona, weekday: 'long', day: 'numeric', month: 'long',
      hour: 'numeric', minute: '2-digit', hour12: true,
    }).format(new Date(c.inicio));
  } catch (e) { cuando = c.inicio; }

  $('prog').hidden = true;
  $('todo').innerHTML =
    '<div class="ok"><div class="tick' + (cancelada || c.pasada ? ' gris' : '') + '">' +
      ico(cancelada ? I.info : I.tick, 30) + '</div>' +
      '<h2>' + (cancelada ? 'Cita cancelada' : (c.pasada ? 'Esta cita ya pasó' : 'Tu cita está confirmada')) + '</h2>' +
      '<div class="cuando"><b>' + esc(cuando) + '</b>' +
        (c.negocio ? '<br>' + esc(c.negocio) : '') + '</div></div>' +
    (c.direccion ? '<div class="tarjeta"><div class="fila">' + ico(I.pin, 16) + '<div>' + esc(c.direccion) +
      (c.detalle_direccion ? '<br><span style="color:var(--text-3);font-size:12.5px">' + esc(c.detalle_direccion) + '</span>' : '') +
      '</div></div></div>' : '') +
    (cancelada || c.pasada ? '' :
      '<div class="acciones"><button class="peligro" id="btn-cancelar">Cancelar mi cita</button></div>') +
    '<div class="err" id="err" style="display:none"></div>' +
    '<div class="firma">Con la tecnología de <a href="https://acuarius.app" target="_blank" rel="noopener">Acuarius</a></div>';

  var b = $('btn-cancelar');
  if (b) b.onclick = function () {
    if (!confirm('¿Seguro que quieres cancelar tu cita?\n\nEl turno quedará libre para otra persona.')) return;
    b.disabled = true; b.textContent = 'Cancelando…';
    api('cita=' + TOKEN, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ accion: 'cancelar' }),
    }).then(function (r) {
      if (!r.ok) {
        b.disabled = false; b.textContent = 'Cancelar mi cita';
        $('err').textContent = (r.d && r.d.error) || 'No se pudo cancelar.';
        $('err').style.display = 'block';
        return;
      }
      pintarCita(r.d.cita);
    }).catch(function () {
      b.disabled = false; b.textContent = 'Cancelar mi cita';
      $('err').textContent = 'Revisa tu conexión.';
      $('err').style.display = 'block';
    });
  };
}

})();
</script>
</body>
</html>
