<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<title>Reporte de resultados</title>
<!-- Reporte público de una agencia para su cliente (/r/<token>). Ver api/_reportes.js.
     Marca blanca: sin el GTM de Acuarius y con el color y el logo de la agencia.
     Los números vienen congelados del día en que se armó el reporte. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/reporte-v2.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" defer onload="window.dispatchEvent(new Event('chartjs-listo'))"></script>
<script src="/reporte-v2.js"></script>
<style>
  :root{
    --marca:#1E2BCC; --marca-suave:#EEF0FD;
    --texto:#14161F; --suave:#5B6072; --tenue:#8A8FA3; --borde:#E4E6F2; --fondo:#F4F5FB; --tarjeta:#FFFFFF;
    --bien:#0E8A4F; --mal:#B4231F; --ojo-fondo:#FFF4E5; --ojo:#7A4A08;
    --r:14px; --sombra:0 10px 40px rgba(20,22,31,.06);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--fondo);color:var(--texto);line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:880px;margin:0 auto;padding:32px 16px 64px}
  .doc{background:var(--tarjeta);border-radius:18px;box-shadow:var(--sombra);padding:40px 44px;position:relative;overflow:hidden}
  .doc::before{content:'';position:absolute;top:0;left:0;right:0;height:5px;background:var(--marca)}
  .cab{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px;flex-wrap:wrap}
  .cab img{max-height:44px;max-width:180px;object-fit:contain}
  .firma{font-weight:800;font-size:15px;color:var(--marca)}
  .imprimir{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--borde);background:var(--tarjeta);color:var(--suave);border-radius:9px;padding:7px 12px;cursor:pointer}
  h1{font-size:28px;line-height:1.2;letter-spacing:-.01em;margin-bottom:6px}
  .meta{font-size:13px;color:var(--suave);margin-bottom:24px}
  .resumen{background:var(--marca-suave);border-radius:var(--r);padding:16px 20px;font-size:15.5px;margin-bottom:26px}
  h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--marca);margin:30px 0 12px}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .kpi{border:1px solid var(--borde);border-radius:var(--r);padding:14px 16px;min-width:0}
  .kpi-e{font-size:12px;color:var(--suave)}
  .kpi-v{font-size:24px;font-weight:800;margin:4px 0 2px;letter-spacing:-.01em;overflow-wrap:anywhere}
  .kpi-c{font-size:12px;color:var(--tenue)}
  .sube{color:var(--bien)} .baja{color:var(--mal)}
  .tabla{width:100%;border-collapse:collapse;font-size:14px}
  .tabla th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--suave);padding:8px 10px;border-bottom:2px solid var(--marca)}
  .tabla td{padding:9px 10px;border-bottom:1px solid var(--borde);vertical-align:top}
  .tabla .n{text-align:right;white-space:nowrap}
  .caja-tabla{overflow-x:auto}
  .red{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 7px;background:var(--fondo);color:var(--suave)}
  ul.hicimos{margin-left:20px} ul.hicimos li{margin-bottom:6px}
  .aviso{background:var(--ojo-fondo);color:var(--ojo);border-radius:var(--r);padding:12px 16px;font-size:13.5px;margin-top:18px}
  .pie{margin-top:34px;font-size:12px;color:var(--tenue);text-align:center}
  .estado{text-align:center;padding:80px 16px;color:var(--suave)}
  @media (max-width:640px){
    .doc{padding:28px 18px}
    .kpis{grid-template-columns:repeat(2,1fr)}
    h1{font-size:23px}
    .kpis{gap:8px} .kpi{padding:12px} .kpi-v{font-size:19px}
  }
  @media print{
    body{background:#fff} .wrap{padding:0;max-width:none} .doc{box-shadow:none;padding:0}
    .imprimir{display:none} .kpi,.tabla tr{break-inside:avoid}
  }
</style>
</head>
<body>
<div class="wrap"><div class="doc" id="doc"><div class="estado">Cargando el reporte…</div></div></div>
<script>
(function () {
  let doc = document.getElementById('doc');
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  // /r/<token> llega aquí por la reescritura de vercel.json; ?t= sirve para probar.
  const token = (location.pathname.match(/\/r\/([a-f0-9]{32})/) || [])[1] || new URLSearchParams(location.search).get('t') || '';
  const falla = (msg) => { doc.innerHTML = '<div class="estado">' + esc(msg) + '</div>'; };
  if (!/^[a-f0-9]{32}$/.test(token)) return falla('Este enlace no es válido.');

  const previa = new URLSearchParams(location.search).get('previa') === '1';
  fetch('/api/reporte-publico?t=' + token + (previa ? '&previa=1' : '')).then(r => r.json().then(d => ({ ok: r.ok, d }))).then(({ ok, d }) => {
    if (!ok || d.error) return falla(d.error || 'No pudimos abrir el reporte.');
    // Versión 2: el reporte de agencia completo, con pestañas (reporte-v2.js).
    // Los reportes de antes se siguen viendo como se enviaron.
    if (d.datos && d.datos.version === 2 && window.pintarReporteV2) {
      const raiz = document.createElement('div');
      document.body.innerHTML = '';
      document.body.appendChild(raiz);
      try { return window.pintarReporteV2(d, raiz); }
      // Si la versión 2 falla, se ve con el diseño anterior: nunca una página en blanco.
      catch (e) { console.error(e); document.body.classList.remove('v2'); document.body.innerHTML = '<div class="wrap"><div class="doc" id="doc"></div></div>'; doc = document.getElementById('doc'); }
    }
    pintar(d);
  }).catch(() => falla('No pudimos abrir el reporte. Revisa tu conexión y vuelve a intentarlo.'));

  function pintar(r) {
    const d = r.datos, t = d.actual.totales, a = d.anterior.totales, m = d.moneda, marca = d.marca || {};
    if (marca.color && /^#[0-9a-f]{6}$/i.test(marca.color)) {
      document.documentElement.style.setProperty('--marca', marca.color);
      document.documentElement.style.setProperty('--marca-suave', marca.color + '14');
    }
    const plata = (n) => {
      if (n == null) return '—';
      try { return new Intl.NumberFormat('es-CO', { style: 'currency', currency: m || 'COP', maximumFractionDigits: 0 }).format(n); }
      catch (e) { return '$' + Math.round(n).toLocaleString('es-CO'); }
    };
    const num = (n) => n == null ? '—' : Number(n).toLocaleString('es-CO');
    const cambio = (act, ant, menosEsMejor) => {
      if (act == null || ant == null || !ant) return 'Sin dato del período anterior';
      const p = Math.round((act - ant) / ant * 100);
      if (!p) return 'Igual que el período anterior';
      const bien = menosEsMejor ? p < 0 : p > 0;
      return '<span class="' + (bien ? 'sube' : 'baja') + '">' + (p > 0 ? '▲ ' : '▼ ') + Math.abs(p) + ' %</span> frente al período anterior';
    };
    const neutro = (act, ant) => cambio(act, ant).replace(/class="(sube|baja)"/, '');
    const kpi = (e, v, c) => '<div class="kpi"><div class="kpi-e">' + e + '</div><div class="kpi-v">' + v + '</div><div class="kpi-c">' + c + '</div></div>';
    const firma = marca.firma || '';
    // De qué red son las conversiones: el cliente las va a contrastar con su
    // Google Ads o su Meta, y tiene que saber con cuál.
    const redes = [...new Set(d.actual.campanas.map(c => c.red))];
    const segun = redes.length === 1 ? (redes[0] === 'google' ? 'Google' : redes[0] === 'meta' ? 'Meta' : 'la red') : 'Google y Meta';
    const conv = (n) => n == null ? '—' : (Math.round(n * 10) / 10).toLocaleString('es-CO');
    document.title = 'Resultados de ' + d.etiqueta + (marca.nombre ? ' · ' + marca.nombre : '');

    let h = '<div class="cab">' +
      (marca.logo_url ? '<img src="' + esc(marca.logo_url) + '" alt="' + esc(firma) + '" onerror="this.replaceWith(Object.assign(document.createElement(\'div\'),{className:\'firma\',textContent:' + esc(JSON.stringify(firma)) + '}))">'
        : '<div class="firma">' + esc(firma) + '</div>') +
      '<button class="imprimir" onclick="window.print()">Guardar en PDF</button></div>' +
      '<h1>Resultados de ' + esc(d.etiqueta) + '</h1>' +
      '<div class="meta">' + (marca.nombre ? esc(marca.nombre) + ' · ' : '') + 'Comparado con el período del ' + esc(fecha(d.anterior_desde)) + ' al ' + esc(fecha(d.anterior_hasta)) + '</div>';
    if (r.resumen) h += '<div class="resumen">' + esc(r.resumen) + '</div>';

    // Se lee ANTES de las cifras: explica por qué no hay costo por lead.
    if (d.aviso_atribucion) {
      h += '<div class="aviso" style="margin:0 0 4px">Casi ningún lead de este período llegó con el dato de la campaña que lo trajo, así que todavía no podemos decir cuánto costó cada lead de la pauta. Estamos corrigiendo esa medición; mientras tanto te mostramos la inversión, el alcance y lo que pasó en el CRM.</div>';
    }
    h += '<h2>Lo principal</h2><div class="kpis">' +
      kpi('Inversión en pauta', plata(t.inversion), neutro(t.inversion, a.inversion)) +
      kpi('Leads que llegaron', num(t.leads), cambio(t.leads, a.leads)) +
      kpi('Ventas', num(t.ganados), cambio(t.ganados, a.ganados)) +
      // Sin el dato de campaña en los leads, costo por lead y retorno de pauta
      // mienten: se enseñan los ingresos y los clics, que sí son ciertos.
      (d.aviso_atribucion
        ? kpi('Ingresos por ventas', plata(t.ingresos), cambio(t.ingresos, a.ingresos)) +
          kpi('Clics en los anuncios', num(t.clics), cambio(t.clics, a.clics)) +
          kpi('Conversiones según ' + segun, conv(t.conv_red), 'Las cuenta ' + segun + ', no son leads del CRM')
        : kpi('Costo por lead de pauta', plata(t.cpl_real), cambio(t.cpl_real, a.cpl_real, true)) +
          kpi('Ingresos de ventas de pauta', plata(t.ingresos_pauta), cambio(t.ingresos_pauta, a.ingresos_pauta)) +
          kpi('Retorno de la inversión', t.retorno == null ? '—' : (Math.round(t.retorno * 10) / 10).toLocaleString('es-CO') + ' ×',
            t.retorno == null ? 'Sin ventas de pauta en el período' : 'Por cada peso invertido')) +
      '</div>';

    if (d.actual.campanas.length) {
      const sinAtrib = !!d.aviso_atribucion;
      const red = (c) => '<span class="red">' + (c.red === 'google' ? 'Google' : c.red === 'meta' ? 'Meta' : esc(c.red)) + '</span> ' + esc(c.nombre);
      h += '<h2>Campañas</h2><div class="caja-tabla"><table class="tabla"><thead><tr><th>Campaña</th><th class="n">Inversión</th><th class="n">Clics</th>' +
        '<th class="n">Conversiones según ' + segun + '</th><th class="n">Leads en el CRM</th>' +
        (sinAtrib ? '' : '<th class="n">Costo por lead</th><th class="n">Ventas</th>') + '</tr></thead><tbody>' +
        d.actual.campanas.map(c => '<tr><td>' + red(c) + '</td><td class="n">' + plata(c.inversion) + '</td><td class="n">' + num(c.clics) + '</td>' +
          '<td class="n">' + conv(c.conv_red) + '</td><td class="n">' + num(c.leads) + '</td>' +
          (sinAtrib ? '' : '<td class="n">' + plata(c.cpl_real) + '</td><td class="n">' + num(c.ganados) + '</td>') + '</tr>').join('') +
        '</tbody></table></div>';
      // Las dos columnas no tienen por qué coincidir, y quien contrasta con su
      // cuenta de anuncios lo primero que ve es que no cuadran: se explica.
      const convTot = t.conv_red || 0;
      if (convTot >= 5 && convTot > 2 * (t.leads_pauta || 0)) {
        h += '<div class="aviso" style="margin-top:10px">' + segun + ' cuenta ' + conv(convTot) + ' conversiones y al CRM ' + (t.leads_pauta === 1 ? 'llegó 1 lead' : 'llegaron ' + num(t.leads_pauta) + ' leads') +
          ' con el dato de su campaña. No son lo mismo: una conversión es lo que ' + segun + ' mide con su propia etiqueta (un formulario enviado, un clic a WhatsApp, una llamada), ' +
          'y un lead es un contacto que de verdad entró al CRM. Cuando la diferencia es tan grande, o los leads de la pauta llegan sin el dato de la campaña, o la etiqueta de ' + segun +
          ' está contando acciones que no son contactos. Lo estamos revisando.</div>';
      }
    }
    if (d.actual.fuentes.length) {
      h += '<h2>De dónde llegaron los leads</h2><div class="caja-tabla"><table class="tabla"><tbody>' +
        d.actual.fuentes.map(f => '<tr><td>' + esc(f.fuente) + '</td><td class="n">' + num(f.n) + '</td></tr>').join('') + '</tbody></table></div>';
    }
    h += '<h2>Estado de los leads del período</h2><div class="kpis">' +
      kpi('En proceso', num(t.en_proceso), 'Todavía se están trabajando') +
      kpi('Ganados', num(t.ganados), plata(t.ingresos) + ' en ventas') +
      kpi('Perdidos', num(t.perdidos), '') + '</div>';
    if (d.hicimos && d.hicimos.length) {
      h += '<h2>Lo que hicimos</h2><ul class="hicimos">' + d.hicimos.map(x => '<li>' + esc(x.que) + '</li>').join('') + '</ul>';
    }
    if (d.cuentas_sin_leer && d.cuentas_sin_leer.length) {
      h += '<div class="aviso">No pudimos leer ' + esc(d.cuentas_sin_leer.join(', ')) + ' al armar este reporte: su inversión no está en estas cifras.</div>';
    }
    h += '<div class="pie">' + (firma ? 'Preparado por ' + esc(firma) + ' · ' : '') + 'Hecho con Acuarius · Números al ' + esc(new Date(r.creado).toLocaleDateString('es-CO', { day: 'numeric', month: 'long', year: 'numeric' })) + '</div>';
    doc.innerHTML = h;
  }
  function fecha(s) {
    const M = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
    const p = String(s || '').split('-');
    return p.length === 3 ? Number(p[2]) + ' de ' + M[Number(p[1]) - 1] : String(s || '');
  }
})();
</script>
</body>
</html>
