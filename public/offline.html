<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sin conexión — Acuarius</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:#F7F8FC;color:#0D0F1C;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
.caja{max-width:340px}
img{width:64px;height:64px;border-radius:16px;margin-bottom:22px}
h1{font-size:21px;font-weight:700;letter-spacing:-.3px;margin-bottom:8px}
p{font-size:14px;color:#5A607A;line-height:1.6;margin-bottom:22px}
button{background:#1E2BCC;color:#fff;border:0;font-family:inherit;font-size:14.5px;font-weight:600;padding:12px 26px;border-radius:11px;cursor:pointer}
button:hover{background:#1520B0}
</style>
</head>
<body>
  <div class="caja">
    <img src="/icons/icon-192.png" alt="Acuarius">
    <h1>Sin conexión</h1>
    <p>Acuarius necesita internet para traer tus leads y tus conversaciones. En cuanto vuelvas a tener señal, vuelve a intentarlo.</p>
    <button onclick="location.reload()">Reintentar</button>
  </div>
</body>
</html>
