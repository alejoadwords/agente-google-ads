<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cargando…</title>
<style>
  /* Reset mínimo. El resto del estilo lo trae la página, no nosotros: cada
     landing es de un negocio distinto y no debe oler a Acuarius. */
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0}
  img{max-width:100%;height:auto}
  #cargando{min-height:70vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif;color:#9aa}
  #fallo{max-width:420px;margin:14vh auto;text-align:center;font-family:system-ui,sans-serif;color:#444;padding:0 24px}
  #fallo h1{font-size:20px;margin:0 0 8px}
  #fallo p{font-size:14px;color:#777;line-height:1.6}
  .ac-firma{font-family:system-ui,sans-serif;font-size:12px;color:#9aa;text-align:center;padding:22px 16px}
  .ac-firma a{color:#6b7280;text-decoration:none}
  /* Estado del formulario, común a todas las plantillas */
  .ac-ok{background:#ECFDF5;color:#059669;border-radius:10px;padding:14px 16px;font-size:14.5px;text-align:center;font-family:system-ui,sans-serif}
  .ac-error{color:#B91C1C;font-size:13px;margin-top:8px;font-family:system-ui,sans-serif}
</style>
</head>
<body>
<div id="cargando">Cargando…</div>
<div id="pagina" style="display:none"></div>

<script>
(function () {
  // El slug viene de /l/<slug> (reescritura de vercel.json).
  var slug = location.pathname.replace(/^\/l\//, '').replace(/\/+$/, '');
  var cargando = document.getElementById('cargando');
  var cont = document.getElementById('pagina');

  function fallo(titulo, texto) {
    cargando.style.display = 'none';
    cont.style.display = 'block';
    cont.innerHTML = '<div id="fallo"><h1>' + titulo + '</h1><p>' + texto + '</p></div>';
    document.title = titulo;
  }

  if (!slug) return fallo('Página no encontrada', 'El enlace no parece correcto.');

  fetch('/api/landings?slug=' + encodeURIComponent(slug))
    .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
    .then(function (res) {
      if (!res.ok) return fallo('Página no encontrada', 'Puede que el enlace haya cambiado o que la página ya no esté publicada.');
      var p = res.d.pagina;
      document.title = p.title || 'Página';

      if (p.css) {
        var st = document.createElement('style');
        st.textContent = p.css;
        document.head.appendChild(st);
      }
      cont.innerHTML = p.html || '';
      cargando.style.display = 'none';
      cont.style.display = 'block';

      // Firma discreta al pie. Es publicidad honesta: la página es del cliente,
      // el pie no compite con su contenido.
      var firma = document.createElement('div');
      firma.className = 'ac-firma';
      firma.innerHTML = 'Hecho con <a href="https://acuarius.app" target="_blank" rel="noopener">Acuarius</a>';
      document.body.appendChild(firma);

      prepararFormularios(p.form_token);
    })
    .catch(function () { fallo('No se pudo cargar', 'Revisa tu conexión y vuelve a intentarlo.'); });

  // Los formularios de la página entran por /api/form-public, que es la misma
  // puerta que los formularios normales: deduplica, dispara automatizaciones y
  // filtra bots. No se abre una vía nueva solo para las landings.
  function prepararFormularios(token) {
    var forms = cont.querySelectorAll('form');
    for (var i = 0; i < forms.length; i++) {
      (function (f) {
        f.addEventListener('submit', function (e) {
          e.preventDefault();
          if (!token) return pintarError(f, 'Esta página todavía no está conectada a un formulario.');
          var btn = f.querySelector('button[type=submit], button:not([type]), input[type=submit]');
          var textoBtn = btn ? (btn.textContent || btn.value) : '';
          if (btn) { btn.disabled = true; if (btn.tagName === 'BUTTON') btn.textContent = 'Enviando…'; }

          var datos = {};
          var campos = f.querySelectorAll('input, textarea, select');
          for (var k = 0; k < campos.length; k++) {
            var c = campos[k];
            if (!c.name || c.type === 'submit') continue;
            datos[c.name] = c.type === 'checkbox' ? (c.checked ? 'sí' : 'no') : c.value;
          }

          fetch('/api/form-public?token=' + encodeURIComponent(token), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(datos),
          })
            .then(function (r) { return r.json().catch(function () { return {}; }); })
            .then(function (d) {
              if (d && d.error) throw new Error(d.error);
              var ok = document.createElement('div');
              ok.className = 'ac-ok';
              ok.textContent = f.getAttribute('data-gracias') || '¡Gracias! Te contactamos muy pronto.';
              f.parentNode.replaceChild(ok, f);
            })
            .catch(function (err) {
              if (btn) { btn.disabled = false; if (btn.tagName === 'BUTTON') btn.textContent = textoBtn; }
              pintarError(f, err.message || 'No se pudo enviar. Inténtalo de nuevo.');
            });
        });
      })(forms[i]);
    }
  }

  function pintarError(f, texto) {
    var e = f.querySelector('.ac-error');
    if (!e) { e = document.createElement('div'); e.className = 'ac-error'; f.appendChild(e); }
    e.textContent = texto;
  }
})();
</script>
</body>
</html>
