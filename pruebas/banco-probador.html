<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banco de pruebas · Probador del agente</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!--
  Banco de pruebas del probador del agente.

  No es una maqueta: saca el CSS de public/index.html, el MARCADO del paso 6 del
  propio index.html y las funciones de pintado de public/app.js, tal cual están.
  Si alguien renombra un token o una clase, se ve roto aquí antes que en
  producción.

  Los estados que importan son los que en producción no se pueden provocar a
  mano: una ruta que el enrutado no reconoce, un catálogo que no se filtró, un
  descarte. Son justo los que el probador existe para hacer visibles.

  Arrancar con:  node pruebas/servidor-boceto.mjs
-->
<style id="estilos-reales"></style>
<style>
  body{margin:0;font-family:'Outfit',sans-serif;background:var(--bg-subtle,#F7F8FC);color:var(--text,#0D0F1C);padding:20px 22px 70px}
  #zona{max-width:760px;margin:0 auto;background:var(--bg-card,#fff);border:1.5px solid var(--border,#E4E6F0);
    border-radius:14px;padding:18px 20px}
  .banco{position:fixed;bottom:0;left:0;right:0;background:var(--text,#111);color:#fff;padding:8px 14px;
    display:flex;gap:10px;align-items:center;justify-content:center;font-size:12px;z-index:9000;flex-wrap:wrap}
  .banco button{background:rgba(255,255,255,.14);color:#fff;border:none;border-radius:7px;padding:5px 10px;
    font-family:inherit;font-size:12px;cursor:pointer}
  .banco button:hover{background:rgba(255,255,255,.26)}
  .banco span{opacity:.55}
</style>
</head>
<body>
<div id="zona"></div>
<div class="banco">
  <span>BANCO ·</span>
  <button onclick="esc_('vacio')">recién abierto</button>
  <button onclick="esc_('normal')">conversando</button>
  <button onclick="esc_('sinfiltro')">catálogo sin filtrar</button>
  <button onclick="esc_('rutamala')">ruta desconocida</button>
  <button onclick="esc_('sinasesor')">ruta sin asesor</button>
  <button onclick="esc_('calificado')">calificado</button>
  <button onclick="esc_('descartado')">descartado</button>
  <button onclick="esc_('escala')">pide un asesor</button>
  <button onclick="esc_('largo')">respuesta larguísima</button>
  <span>·</span>
  <button onclick="document.documentElement.setAttribute('data-theme', document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark')">oscuro</button>
  <button onclick="document.getElementById('zona').style.maxWidth=document.getElementById('zona').style.maxWidth?'':'380px'">móvil</button>
</div>

<script>
const CONV = [
  { role: 'user', content: 'Buenas tardes, estoy buscando apartamento en arriendo' },
  { role: 'assistant', content: 'Buenas tardes. Con gusto le ayudo. ¿En qué ciudad y zona está buscando?' },
  { role: 'user', content: 'En Barranquilla, por el norte. Mi presupuesto es de 3 millones' },
];

const LINEAS = [
  'CP-1042 · Arriendo · Apartamento · Villa Santos, Barranquilla · 3 hab · 2 baños · $2.700.000',
  'CP-0988 · Arriendo · Apartamento · Alto Prado, Barranquilla · 3 hab · 3 baños · $3.100.000',
];

function base() {
  return {
    texto: 'Tengo dos opciones que encajan:\n\nCP-1042 — Villa Santos, 3 habitaciones, $2.700.000\nCP-0988 — Alto Prado, 3 habitaciones, $3.100.000\n\n¿Cuál le interesa ver?',
    capturado: { celular: '3001234567' },
    escalar: false,
    calificacion: { activa: true, estado: 'pendiente', cumplidas: 2, total: 4,
      resumen: '¿Qué presupuesto maneja? → 3 millones ✅\n¿En qué zona busca? → Norte ✅' },
    ruta: { clave: 'arriendo', etiqueta: 'Arriendo', reconocida: true, asignada: true, asignar_nombre: 'Maira Ballesteros' },
    catalogo: { pistas: { operacion: 'arriendo', ciudad: 'Barranquilla', presupuesto: 3000000 }, ofrecidas: 2, lineas: LINEAS },
  };
}

function esc_(cual) {
  agPrbHist = []; agPrbVista = []; agPrbOcupado = false;
  if (cual === 'vacio') { agPrbPintar(); agPrbRadiografia(null); return; }

  agPrbVista = CONV.slice();
  const d = base();

  if (cual === 'sinfiltro') {
    // El fallo que no se nota en la respuesta: sin pistas, el motor le pasa las
    // más baratas de todo el inventario y el agente contesta con aplomo.
    d.catalogo = { pistas: { operacion: 'arriendo' }, ofrecidas: 25, lineas: LINEAS };
    d.catalogo.pistas = {};
  }
  if (cual === 'rutamala') d.ruta = { clave: 'alquiler', etiqueta: null, reconocida: false, asignada: false, asignar_nombre: null };
  if (cual === 'sinasesor') d.ruta = { clave: 'arriendo', etiqueta: 'Arriendo', reconocida: true, asignada: false, asignar_nombre: null };
  if (cual === 'calificado') { d.calificacion = { ...d.calificacion, estado: 'calificado', cumplidas: 4, total: 4 }; }
  if (cual === 'descartado') { d.calificacion = { ...d.calificacion, estado: 'descartado', cumplidas: 1, total: 4 }; }
  if (cual === 'escala') {
    d.escalar = true;
    d.texto = 'Voy a compartir su información y lo conversado con un asesor especializado, quien continuará atendiendo su solicitud.';
  }
  if (cual === 'largo') {
    d.texto = 'Con gusto le explico todo el proceso. ' + 'El estudio de arrendamiento no tiene ningún costo y se realiza de forma digital. '.repeat(6);
    d.capturado = { nombre: 'María Fernanda Restrepo Villalobos', celular: '3001234567', email: 'mariafernanda.restrepo@correoempresarial.com.co', interes: 'Apartamento de 3 habitaciones en el norte de Barranquilla con parqueadero' };
  }

  agPrbVista.push({ role: 'assistant', content: d.texto });
  agPrbPintar();
  agPrbRadiografia(d);
}

(async function montar() {
  const html = await (await fetch('/public/index.html')).text();
  const js = await (await fetch('/public/app.js')).text();

  document.getElementById('estilos-reales').textContent =
    (html.match(/<style>([\s\S]*?)<\/style>/) || ['', ''])[1];

  // El marcado del paso 6, sacado del index.html de verdad: si alguien cambia
  // un id ahí, este banco deja de pintar en vez de seguir enseñando lo viejo.
  const a = html.indexOf('<div class="ag-paso" data-paso="6"');
  if (a < 0) throw new Error('No encontré el paso 6 en index.html');
  const b = html.indexOf('<div class="ag-prb-rx" id="ag-prb-rx"></div>', a);
  if (b < 0) throw new Error('No encontré el panel de radiografía');
  document.getElementById('zona').innerHTML =
    html.slice(a, b) + '<div class="ag-prb-rx" id="ag-prb-rx"></div></div></div>';
  // Aquí el paso se ve siempre: en la app lo muestra agIrAPaso.
  document.querySelector('[data-paso="6"]').style.display = '';

  const trozo = (desde, hasta) => {
    const i = js.indexOf(desde);
    if (i < 0) throw new Error('No encontré en app.js: ' + desde);
    const j = js.indexOf(hasta, i);
    return js.slice(i, j > i ? j : js.length);
  };

  const s = document.createElement('script');
  s.textContent = [
    (js.match(/function esc\(t\)\{.*\n/) || [''])[0],
    'function showToast(m){console.log("toast:",m)}',
    'let agEditingId = "banco";',
    trozo('let agPrbHist = []', 'async function agPrbEnviar()'),
    'function agPrbEnviar(){ showToast("el banco no llama al servidor: usa los botones de abajo") }',
  ].join('\n');
  document.body.appendChild(s);

  esc_('normal');
})().catch(e => {
  document.getElementById('zona').innerHTML =
    '<pre style="color:#B91C1C;white-space:pre-wrap">' + e.message + '</pre>';
});
</script>
</body>
</html>
