.agency-health.amarillo{background:#FFFBEB;color:#92400E}
.agency-health.rojo{background:#FEF2F2;color:#991B1B}
.agency-health.gris{background:var(--sidebar);color:var(--muted)}
.agency-health-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.agency-health.verde .agency-health-dot{background:#059669}
.agency-health.amarillo .agency-health-dot{background:#D97706}
.agency-health.rojo .agency-health-dot{background:#DC2626}
.agency-health.gris .agency-health-dot{background:var(--muted2)}
.agency-card-date{font-size:10px;color:var(--muted2)}
.agency-card-agents{display:flex;align-items:center;gap:4px}
/* Agentes apagados (ver AGENTES_ACTIVOS): las tarjetas del panel de clientes se
   vuelven a dibujar cada vez que se entra, así que esconderlas una sola vez
   desde JS no sirve — la clase en <body> sí sobrevive al re-dibujo. El botón de
   Leads se queda: ese lleva al CRM, que es justo a donde queremos llevar. */
body.sin-agentes .agency-agent-btn:not(.leads){display:none}

/* ── Filtros de la lista de tareas ──────────────────────────────────────────
   Solo para quien ve el trabajo de todo el equipo. */
.tar-filtros{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--rlg);padding:12px 14px;margin-bottom:18px;max-width:820px}
.tar-f{display:flex;flex-direction:column;gap:5px}
.tar-f>span{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted2)}
.tar-f select{font-family:var(--font);font-size:var(--fs-sm);font-weight:500;color:var(--text);background:var(--bg-card);border:1px solid var(--border);border-radius:9px;padding:7px 10px;min-height:34px;cursor:pointer;max-width:210px}
.tar-cuenta{font-size:var(--fs-sm);color:var(--muted2);margin-left:auto;white-space:nowrap;align-self:center}
.tar-resumen{flex-basis:100%;display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding-top:11px;border-top:1px solid var(--border2)}
.tar-resumen-t{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted2);margin-right:2px}
.tar-chip{font-family:var(--font);display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-sm);font-weight:500;color:var(--muted);background:var(--bg-subtle);border:1px solid var(--border);border-radius:99px;padding:4px 10px;cursor:pointer;min-height:28px;transition:all var(--dur-fast) var(--ease)}
.tar-chip:hover{border-color:var(--border-h);color:var(--text)}
.tar-chip.on{background:var(--blue-lt);border-color:var(--blue-md);color:var(--blue);font-weight:600}
/* El número va en rojo porque son tareas que ya se pasaron de fecha: es un
   aviso, no una estadística. */
.tar-chip b{font-weight:700;color:var(--danger)}
.tar-chip.on b{color:var(--blue)}
.tar-vacio{max-width:820px;font-size:var(--fs-base);color:var(--muted);padding:22px 0}

/* Una fila de tarea */
.tar-fila{display:flex;align-items:center;gap:12px;padding:11px 14px;border:1px solid var(--border);border-radius:11px;margin-bottom:7px;background:var(--panel)}
.tar-fila-check{cursor:pointer;flex-shrink:0;width:16px;height:16px}
.tar-fila-txt{flex:1;min-width:0}
.tar-fila-tit{font-size:var(--fs-base);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tar-fila-meta{display:flex;flex-wrap:wrap;font-size:11.5px;color:var(--muted2);margin-top:2px}
/* El separador se dibuja en CSS y no se escribe en el texto, para poder
   quitarlo en el teléfono: ahí los datos van en varias líneas y el punto se
   quedaba abriendo renglón, como una viñeta que no es. */
.tar-fila-meta>span+span::before{content:'·';margin:0 6px;opacity:.55}
.tar-fila-acc{display:flex;gap:6px;flex-shrink:0}

@media (max-width:640px){
  /* En el teléfono los botones bajan a su propia línea. Compitiendo por el
     ancho dejaban al título en dos palabras y a la fecha en cuatro renglones. */
  .tar-fila{flex-wrap:wrap;align-items:flex-start;gap:9px 10px}
  .tar-fila-check{margin-top:2px}
  /* `1 1 0` y no `auto`: con la base en el contenido, una fila cuyo texto
     medía más que el hueco se iba entera a la línea siguiente y dejaba la
     casilla sola arriba. Así encoge en su sitio. */
  .tar-fila-txt{flex:1 1 0;min-width:0}
  /* Dos líneas de título en vez de recortarlo: «se le contacta por chat,
     pendiente para seguimiento de llamada» sin el final no dice nada. */
  .tar-fila-tit{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  /* Sin punto de separación: cada dato en su sitio, separados por el hueco. */
  .tar-fila-meta{gap:1px 12px}
  .tar-fila-meta>span+span::before{content:none}
  .tar-fila-acc{flex-basis:100%;padding-left:26px}
  .tar-fila-acc button{flex:1;min-height:34px}
}
@media (max-width:640px){
  .tar-filtros{gap:8px}
  .tar-f{flex:1 1 140px}
  .tar-f select{max-width:none;width:100%}
  .tar-cuenta{margin-left:0;flex-basis:100%}
}

/* ── Traspaso al quitar a alguien del equipo ─────────────────────────────── */
.tt-bg{position:fixed;inset:0;z-index:10000;background:rgba(13,15,28,.45);display:flex;align-items:center;justify-content:center;padding:20px;animation:pautaFondo .18s var(--ease)}
.tt-caja{width:min(460px,100%);box-sizing:border-box;background:var(--bg-card);border-radius:var(--rxl);box-shadow:var(--shadow-lg);padding:24px 26px;max-height:88vh;overflow-y:auto}
.tt-h{margin:0 0 8px;font-size:var(--fs-lg);font-weight:700;letter-spacing:-.3px}
.tt-s{margin:0 0 16px;font-size:var(--fs-base);color:var(--muted);line-height:1.5}
.tt-lista{margin:0 0 18px;padding:14px 16px 14px 32px;background:var(--bg-subtle);border-radius:var(--r);font-size:var(--fs-base);line-height:1.7}
.tt-lista li{color:var(--muted)}
.tt-lista li b{color:var(--text)}
.tt-lista li.tt-ojo{color:var(--warning);font-weight:600;list-style:none;margin-left:-16px}
.tt-l{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted2);margin-bottom:6px}
.tt-sel{width:100%;box-sizing:border-box;font-family:var(--font);font-size:var(--fs-base);color:var(--text);background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;min-height:42px;cursor:pointer}
.tt-aviso{margin-top:10px;background:var(--danger-bg);border-radius:var(--r);padding:11px 13px;font-size:var(--fs-sm);color:#991B1B;line-height:1.5}
.tt-nota{margin-top:12px;font-size:var(--fs-sm);color:var(--muted2);line-height:1.5}
.tt-btns{display:flex;gap:9px;justify-content:flex-end;margin-top:20px}
.tt-btns button{min-height:40px}
@media (max-width:480px){ .tt-btns{flex-direction:column-reverse} .tt-btns button{width:100%} }

/* ── Plataformas de pauta ────────────────────────────────────────────────────
   La tabla va partida en dos mitades con fondo distinto: gris «En la
   plataforma», azul «En tu CRM». La mitad azul es la que no tiene nadie más, y
   se separa a la vista para que se lea como lo que es: otro origen de datos. */
.pauta-head{display:flex;align-items:flex-end;gap:18px;margin-bottom:14px;flex-wrap:wrap}
.pauta-h1{margin:0 0 3px;font-size:var(--fs-xl);font-weight:700;letter-spacing:-.5px}
.pauta-sub{margin:0;font-size:var(--fs-base);color:var(--muted)}
.pauta-tabs{display:flex;gap:4px;padding:3px;background:var(--bg-muted);border-radius:10px}
.pauta-tab{font-family:var(--font);font-size:var(--fs-sm);font-weight:500;color:var(--muted);background:transparent;border:1px solid transparent;border-radius:8px;padding:7px 14px;cursor:pointer;min-height:32px;transition:all var(--dur-fast) var(--ease)}
.pauta-tab.active{font-weight:600;color:var(--text);background:var(--bg-card);border-color:var(--border);box-shadow:var(--shadow-sm)}
.pauta-filtros{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.pauta-sel{font-family:var(--font);font-size:var(--fs-sm);font-weight:500;color:var(--text);background:var(--bg-card);border:1px solid var(--border);border-radius:9px;padding:8px 11px;min-height:36px;cursor:pointer}
.pauta-cargando{display:flex;align-items:center;gap:9px;justify-content:center;padding:52px 0;font-size:var(--fs-base);color:var(--muted)}
.pauta-cargando svg{animation:spin .9s linear infinite}
.pauta-vacio{padding:18px 0;font-size:var(--fs-sm);color:var(--muted2)}

.pauta-aviso{box-sizing:border-box;display:flex;align-items:center;gap:11px;background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:11px 14px;margin-bottom:14px;font-size:var(--fs-sm);color:var(--muted);line-height:1.45}
.pauta-aviso b{color:var(--text);font-weight:700}
.pauta-aviso svg{flex-shrink:0;color:var(--muted)}
.pauta-aviso-ojo{background:var(--warning-bg);border-color:#F3D9AE;color:#7A4A08}
.pauta-aviso-ojo b,.pauta-aviso-ojo svg{color:#7A4A08}
.pauta-aviso-mal{background:var(--danger-bg);border-color:#F3C9C9;color:#991B1B}
.pauta-aviso-mal b,.pauta-aviso-mal svg{color:#991B1B}

.pauta-kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:14px}
.pauta-kpi{box-sizing:border-box;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--rlg);padding:14px 15px}
.pauta-kpi.crm{border-color:var(--blue-md)}
.pauta-kpi-etq{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted2);margin-bottom:5px}
.pauta-kpi.crm .pauta-kpi-etq{color:var(--blue)}
.pauta-kpi-val{font-size:20px;font-weight:700;letter-spacing:-.5px;line-height:1.15}
.pauta-kpi-pie{font-size:11px;color:var(--muted);margin-top:4px}

.pauta-tabla-caja{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;overflow:hidden}
.pauta-tabla{width:100%;border-collapse:collapse;font-size:var(--fs-sm)}
.pauta-grupo{text-align:left;padding:10px 16px 6px;background:var(--bg-subtle);border-bottom:1px solid var(--border);font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted2)}
.pauta-grupo.crm{background:var(--blue-lt);border-bottom-color:var(--blue-md);border-left:1px solid var(--blue-md);color:var(--blue)}
.pauta-th{text-align:left;padding:9px 12px;font-size:11px;font-weight:600;color:var(--muted);background:var(--bg-subtle);border-bottom:1px solid var(--border);white-space:nowrap}
.pauta-th.crm{color:var(--blue);background:var(--blue-lt);border-bottom-color:var(--blue-md)}
.pauta-th.num,.pauta-td.num{text-align:right;font-variant-numeric:tabular-nums}
.pauta-th.crm:first-of-type{border-left:1px solid var(--blue-md)}
.pauta-td{padding:12px;border-bottom:1px solid var(--border2);vertical-align:middle}
.pauta-td.crm{background:#FAFBFF}
.pauta-fila td:nth-child(5){border-left:1px solid var(--blue-md)}
.pauta-tabla thead tr:nth-child(2) th:nth-child(5){border-left:1px solid var(--blue-md)}
.pauta-fila{cursor:pointer;transition:background var(--dur-fast) var(--ease)}
.pauta-fila:hover td{background:var(--blue-lt)}
.pauta-fila:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.pauta-total td{font-weight:700;background:var(--bg-subtle);border-bottom:none}
.pauta-total td.crm{background:var(--blue-lt)}
.pauta-camp{display:flex;align-items:center;gap:9px;min-width:0}
.pauta-camp-n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pauta-pie{display:flex;align-items:center;gap:8px;padding:11px 16px;border-top:1px solid var(--border2);font-size:11.5px;color:var(--muted2)}

.pauta-red{flex-shrink:0;font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:5px;padding:3px 6px}
.pauta-red-g{color:#B45309;background:rgba(217,119,6,.1)}
.pauta-red-m{color:#1877F2;background:rgba(24,119,242,.1)}
.pauta-red-n{color:var(--muted2);background:var(--bg-muted)}
.pauta-pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:20px;padding:3px 9px;white-space:nowrap}
.pauta-pill-ok{color:#047857;background:var(--success-bg)}
.pauta-pill-off{color:var(--muted);background:var(--bg-muted)}
.pauta-pill-ojo{color:#7A4A08;background:var(--warning-bg)}
.pauta-pill-mal{color:#B91C1C;background:var(--danger-bg)}

.pauta-conxs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:16px}
.pauta-conx{box-sizing:border-box;background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:13px}
.pauta-conx.viva{border-color:var(--blue-md)}
.pauta-conx.ojo{border-color:#F3D9AE}
.pauta-conx-top{display:flex;align-items:flex-start;gap:13px}
.pauta-conx-logo{width:40px;height:40px;flex-shrink:0;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;background:var(--bg-muted);color:var(--muted)}
.pauta-conx-logo.google{background:rgba(217,119,6,.09);color:#B45309}
.pauta-conx-logo.meta{background:rgba(24,119,242,.09);color:#1877F2}
.pauta-conx-t{font-size:var(--fs-md);font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pauta-conx-s{font-size:var(--fs-sm);color:var(--muted);margin-top:3px}
.pauta-conx-cifras.una{grid-template-columns:minmax(0,1fr)}
.pauta-conx-cifras{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:12px 0;border-top:1px solid var(--border2);border-bottom:1px solid var(--border2)}
.pauta-conx-cifras b{display:block;font-size:var(--fs-md);font-weight:700}
.pauta-conx-cifras span{font-size:11px;color:var(--muted)}
.pauta-conx-nota{font-size:var(--fs-sm);color:var(--muted);line-height:1.5;display:flex;align-items:flex-start;gap:8px}
.pauta-conx-nota svg{flex-shrink:0;margin-top:2px;color:var(--success)}
.pauta-conx-nota.ojo{display:block;background:var(--warning-bg);border-radius:11px;padding:12px 14px;color:#7A4A08}
.pauta-conx-nota.mal{color:#B91C1C}
.pauta-conx-btns{display:flex;gap:8px;margin-top:auto}
.pauta-conx-cambiar{display:flex;flex-direction:column;gap:8px}
.pauta-link{font-family:var(--font);font-size:var(--fs-sm);font-weight:600;color:var(--blue);background:none;border:0;padding:0;cursor:pointer;text-align:left}
.pauta-link:hover{text-decoration:underline}
.pauta-elige{display:flex;flex-direction:column;gap:7px;background:var(--bg-subtle);border:1px solid var(--border);border-radius:11px;padding:12px 13px}
.pauta-elige-l{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted2)}
.pauta-elige .pauta-sel{width:100%}

.pauta-pasos{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:20px 24px}
.pauta-pasos-t{font-size:var(--fs-base);font-weight:700;margin-bottom:16px}
.pauta-pasos-g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.pauta-paso{display:flex;gap:13px}
.pauta-paso-n{width:26px;height:26px;flex-shrink:0;border-radius:50%;background:var(--blue-lt);color:var(--blue);font-size:var(--fs-sm);font-weight:700;display:flex;align-items:center;justify-content:center}
.pauta-paso-t{font-size:var(--fs-base);font-weight:600;margin-bottom:3px}
.pauta-paso-d{font-size:var(--fs-sm);color:var(--muted);line-height:1.5}

@keyframes pautaFondo{from{opacity:0}to{opacity:1}}
.pauta-panel-bg{position:fixed;inset:0;z-index:9998;background:rgba(13,15,28,.38);display:flex;justify-content:flex-end;animation:pautaFondo .18s var(--ease)}
.pauta-panel{width:min(1012px,94vw);height:100%;box-sizing:border-box;background:var(--bg-subtle);border-left:1px solid var(--blue-md);display:flex;flex-direction:column;overflow:hidden;animation:pautaEntra .3s var(--ease-mover)}
@keyframes pautaEntra{from{transform:translateX(40px);opacity:.4}to{transform:none;opacity:1}}
.pauta-panel-top{flex-shrink:0;box-sizing:border-box;background:var(--bg-card);border-bottom:1px solid var(--border);padding:18px 26px;display:flex;align-items:flex-start;gap:14px}
.pauta-panel-h{margin:0 0 4px;font-size:var(--fs-lg);font-weight:700;letter-spacing:-.4px}
.pauta-panel-s{font-size:var(--fs-sm);color:var(--muted)}
.pauta-x{flex-shrink:0;width:34px;height:34px;display:flex;align-items:center;justify-content:center;background:var(--bg-subtle);border:1px solid var(--border);border-radius:9px;cursor:pointer;color:var(--muted)}
.pauta-panel-cuerpo{flex:1;min-height:0;box-sizing:border-box;padding:18px 26px 26px;display:flex;flex-direction:column;gap:14px;overflow-y:auto}
.pauta-dos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.pauta-dos-b{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:14px}
.pauta-caja{box-sizing:border-box;background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:16px 18px}
.pauta-caja.crm{border-color:var(--blue-md)}
.pauta-caja-t{font-size:var(--fs-base);font-weight:700;margin-bottom:12px}
.pauta-caja-t.crm{color:var(--blue)}
.pauta-cifs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.pauta-cif{font-size:18px;font-weight:700;letter-spacing:-.4px}
.pauta-cif-e{font-size:11px;color:var(--muted);margin-top:2px}
.pauta-embudo{display:flex;flex-direction:column;gap:9px}
.pauta-emb-l{display:flex;align-items:baseline;gap:8px;margin-bottom:4px;font-size:var(--fs-sm)}
.pauta-emb-l span{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pauta-emb-l b{font-weight:700}
.pauta-emb-l i{font-style:normal;color:var(--muted2);font-size:11px;width:38px;text-align:right}
.pauta-emb-b{height:9px;border-radius:6px;background:var(--bg-muted);overflow:hidden}
.pauta-emb-b div{height:9px;border-radius:6px;background:var(--agua-grad)}
.pauta-emb-b div.bien{background:var(--success)}
.pauta-emb-b div.mal{background:var(--danger)}
.pauta-emb-l.bien span,.pauta-emb-l.bien b{color:var(--success)}
.pauta-emb-l.mal span,.pauta-emb-l.mal b{color:var(--danger)}
.pauta-motivos{margin-top:16px;padding-top:14px;border-top:1px solid var(--border2)}
.pauta-motivos-t{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted2);margin-bottom:9px}
.pauta-motivo{display:flex;align-items:center;gap:8px;font-size:var(--fs-sm);padding:3px 0}
.pauta-motivo span{flex:1;color:var(--muted)}
.pauta-motivo b{font-weight:600}
.pauta-tabla.chica .pauta-th{background:transparent;padding:0 10px 8px 0}
.pauta-tabla.chica .pauta-td{padding:10px 10px 10px 0}
.pauta-tabla.chica .pauta-th.num,.pauta-tabla.chica .pauta-td.num{padding-right:0}

@media (max-width:1180px){
  .pauta-kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .pauta-dos-b{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:768px){
  /* En columna: en fila, el título se quedaba con 80 px y caía a una palabra
     por línea mientras las pestañas se llevaban todo el ancho. */
  .pauta-head{flex-direction:column;align-items:stretch;gap:12px}
  .pauta-tabs{overflow-x:auto}
  .pauta-tab{flex:1;white-space:nowrap}
  .pauta-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pauta-conxs,.pauta-dos,.pauta-pasos-g{grid-template-columns:minmax(0,1fr)}
  .pauta-tabla-caja{overflow-x:auto}
  .pauta-tabla{min-width:760px}
  .pauta-panel{width:100vw}
}


/* ══ FICHA DEL LEAD A PÁGINA COMPLETA ════════════════════════════════════════
   El panel lateral se queda para mirar rápido —380 px bastan para saber quién
   es y llamarlo— y esta página es para trabajar el lead: tres columnas que
   responden a tres preguntas distintas (quién es, qué ha pasado, qué falta por
   hacer). Antes todo eso iba apilado en 380 px y el historial quedaba debajo
   de todo, que es justo lo que se mira para saber si el lead sigue vivo. */
.lf-barra{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--bg);
  border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
.lf-volver{display:flex;align-items:center;gap:6px;font-size:var(--fs-sm);font-weight:600;
  color:var(--muted);background:none;border:none;cursor:pointer;padding:6px 8px;border-radius:8px}
.lf-volver:hover{background:var(--bg-muted);color:var(--text)}
.lf-av{width:36px;height:36px;border-radius:50%;background:var(--agua-grad);color:#fff;display:grid;
  place-items:center;font-weight:700;font-size:14px;flex-shrink:0}
.lf-nom{font-size:var(--fs-lg);font-weight:700;letter-spacing:-.02em}
.lf-sub{font-size:var(--fs-sm);color:var(--muted)}
.lf-acc{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}

/* El embudo como barra de progreso. Hoy la etapa es un desplegable: se ve DÓNDE
   está, pero no cuánto le falta ni por dónde ya pasó. */
.lf-embudo{display:flex;align-items:center;gap:0;padding:14px 20px;background:var(--bg);
  border-bottom:1px solid var(--border)}
/* La tira se reparte en varias líneas cuando no cabe, en vez de arrastrarse:
   un embudo que hay que arrastrar deja de ser una barra de progreso —no se ve
   de un vistazo por dónde va— y además esconde las últimas etapas. Con nueve
   etapas de nombre largo caben en dos líneas y se leen todas.
   Los botones de cierre quedan fuera de esta tira: son los dos más
   importantes de la ficha. */
.lf-pasos{display:flex;align-items:center;gap:6px 0;flex:1;min-width:0;flex-wrap:wrap}
/* `min-width:max-content` y no una cifra fija: con 120px un paso se encogía por
   debajo de su propio texto y los rótulos se montaban unos sobre otros. Se veía
   con etapas de nombre largo —«Presentación de propuesta», «Aprobación de
   solicitud»— en cuanto la tira bajaba de 1400px, que es lo que mide con la
   barra lateral abierta. Ahora ningún paso baja de su texto y la tira se
   arrastra cuando no caben. Medido en el banco con 11 etapas: 0 solapes de
   1700px para abajo. */
.lf-paso{display:flex;align-items:center;gap:0;flex:1 1 auto;min-width:max-content}
.lf-paso .bola{width:22px;height:22px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;
  border:2px solid var(--border);background:var(--bg);color:var(--muted2)}
.lf-paso.hecho .bola{background:var(--blue);border-color:var(--blue);color:#fff}
.lf-paso.aqui .bola{border-color:var(--blue);background:var(--bg);color:var(--blue);
  box-shadow:0 0 0 4px var(--blue-ring)}
.lf-paso .txt{font-size:11.5px;font-weight:600;color:var(--muted2);margin-left:8px;white-space:nowrap}
.lf-paso.hecho .txt,.lf-paso.aqui .txt{color:var(--text)}
.lf-paso .linea{flex:1;height:2px;background:var(--border);margin:0 8px;min-width:12px}
.lf-paso.hecho .linea{background:var(--blue)}
.lf-cierre{display:flex;gap:8px;margin-left:14px;flex-shrink:0}
.lf-cierre button{border:1.5px solid var(--border);background:var(--bg);border-radius:99px;
  padding:5px 12px;font-family:var(--font);font-size:11.5px;font-weight:700;cursor:pointer;color:var(--muted)}
.lf-cierre .gana:hover{border-color:var(--success);color:var(--success);background:var(--success-bg)}
.lf-cierre .pierde:hover{border-color:var(--danger);color:var(--danger);background:var(--danger-bg)}
/* Cuando el lead YA está ganado o perdido, su botón se queda encendido. Sin
   esto el embudo salía entero completo y no se veía por cuál de las dos
   puertas salió, que es lo único que importa de un lead cerrado. */
.lf-cierre .gana.puesto{border-color:var(--success);color:#fff;background:var(--success)}
.lf-cierre .pierde.puesto{border-color:var(--danger);color:#fff;background:var(--danger)}

.lf-caja{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--rlg);padding:14px 16px}
.lf-tit{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
  color:var(--muted2);margin-bottom:10px;display:flex;align-items:center;gap:7px}
.lf-tit .cuenta{background:var(--bg-muted);color:var(--muted);border-radius:99px;padding:1px 7px;
  font-size:10px;letter-spacing:0}
.lf-tit button{margin-left:auto;background:none;border:none;cursor:pointer;color:var(--blue);
  font-family:var(--font);font-size:11px;font-weight:700;letter-spacing:0;text-transform:none}
.lf-fila{display:flex;gap:10px;font-size:13px;padding:5px 0}
.lf-fila .k{color:var(--muted);width:92px;flex-shrink:0;font-weight:600}
.lf-fila .v{flex:1;word-break:break-word}
.lf-chip{display:inline-flex;align-items:center;gap:5px;background:var(--bg-muted);border-radius:99px;
  padding:3px 9px;font-size:11.5px;font-weight:600;color:var(--text-2);margin:0 4px 4px 0}
.lf-vacio{font-size:12.5px;color:var(--muted2);padding:4px 0}

/* Historial */
.lf-tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:12px;overflow-x:auto}
.lf-tabs button{background:none;border:none;border-bottom:2px solid transparent;padding:8px 12px;
  cursor:pointer;font-family:var(--font);font-size:12.5px;font-weight:600;color:var(--muted);
  margin-bottom:-1px;white-space:nowrap}
.lf-tabs button.on{color:var(--blue);border-bottom-color:var(--blue)}
.lf-ev{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--border2)}
.lf-ev:last-child{border-bottom:none}
.lf-ev .ico{width:28px;height:28px;border-radius:9px;flex-shrink:0;display:grid;place-items:center;
  background:var(--bg-subtle);color:var(--muted);border:1px solid var(--border2)}
.lf-ev .cuerpo{flex:1;min-width:0}
.lf-ev .cab{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.lf-ev .qui{font-size:13px;font-weight:700}
.lf-ev .cuando{font-size:11px;color:var(--muted2);margin-left:auto;white-space:nowrap}
.lf-ev .txt{font-size:13px;color:var(--text-2);line-height:1.55;margin-top:3px;white-space:pre-wrap;
  overflow-wrap:anywhere}
.lf-dia{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted2);
  padding:12px 0 4px}

/* Registrar actividad */
.lf-reg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
.lf-reg button{border:1.5px solid var(--border);background:var(--bg);border-radius:9px;padding:6px 11px;
  font-family:var(--font);font-size:12.5px;font-weight:600;cursor:pointer;color:var(--text-2);
  display:inline-flex;align-items:center;gap:6px}
.lf-reg button.on{border-color:var(--blue);background:var(--blue-lt);color:var(--blue)}
.lf-area{width:100%;min-height:74px;padding:11px 13px;border:1.5px solid var(--border);border-radius:var(--r);
  font-size:13.5px;font-family:var(--font);resize:vertical;outline:none;box-sizing:border-box;background:var(--bg);color:var(--text)}
.lf-area:focus{border-color:var(--blue-md)}

/* Tareas */
.lf-tarea{display:flex;gap:9px;align-items:flex-start;padding:9px 11px;border:1px solid var(--border);
  border-radius:var(--r);margin-bottom:7px;background:var(--bg-subtle);font-size:12.5px}
.lf-tarea.vence{border-color:var(--danger);background:var(--danger-bg)}
.lf-tarea input{width:16px;height:16px;margin-top:1px;accent-color:var(--blue);flex-shrink:0}
.lf-tarea .cuando{font-size:11px;color:var(--muted2);margin-top:2px}
/* Una URL pegada no tiene dónde partir y se sale del recuadro. Pasa de verdad:
   las tareas de una inmobiliaria traen el enlace del inmueble dentro del
   texto. `anywhere` parte donde haga falta; `break-word` habría dejado igual
   la palabra que no cabe entera. */
.lf-tarea,.lf-auto,.lf-envio,.lf-prop,.lf-log,.lf-nota,.lf-cita-nps,.lf-quemado{overflow-wrap:anywhere}
.lf-tarea > div,.lf-auto > div,.lf-envio > div,.lf-prop > div{min-width:0}

/* Citas. Sin casilla: una cita no se «marca», se atiende. El icono ocupa el
   sitio de la casilla para que las dos listas queden alineadas. */
.lf-tarea.cita{border-color:var(--aqua);background:var(--aqua-lt)}
.lf-tarea.cita.vence{border-color:var(--danger);background:var(--danger-bg)}
.lf-ico{width:16px;flex-shrink:0;color:var(--aqua);display:flex;margin-top:1px}

/* Automatizaciones: lo que va a pasar solo. Violeta, como el resto de lo que
   hace la máquina por su cuenta en la aplicación. */
.lf-auto{display:flex;gap:9px;align-items:center;padding:9px 11px;border:1px solid var(--violet);
  border-radius:var(--r);margin-bottom:7px;background:var(--violet-lt);font-size:12.5px}
.lf-auto.apagada{border-color:var(--border);background:var(--bg-subtle)}
.lf-auto .cuando{font-size:11px;color:var(--muted2);margin-top:2px}
.lf-parar{margin-left:auto;flex-shrink:0;background:none;border:1px solid var(--border);border-radius:99px;
  padding:3px 11px;font-family:inherit;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer}
.lf-parar:hover{border-color:var(--danger);color:var(--danger)}
.lf-log{font-size:12.5px;line-height:1.5;padding:6px 0;border-bottom:1px solid var(--border)}
.lf-log:last-child{border-bottom:none}
.lf-log.fallo{color:var(--danger)}
.lf-log .cuando{font-size:11px;color:var(--muted2);margin-top:2px}

/* Editar sin salir de la ficha. El dato se ve como texto y al hacer clic se
   convierte en campo: antes había que abrir el formulario entero para cambiar
   una cifra. El subrayado punteado es la única pista de que se puede tocar. */
.lf-edit{cursor:text;border-bottom:1px dashed var(--border);padding-bottom:1px}
.lf-edit:hover{border-bottom-color:var(--blue);color:var(--blue)}
.lf-edit .pon{color:var(--muted2);font-style:italic}
.lf-campo{width:100%;box-sizing:border-box;padding:4px 7px;border:1.5px solid var(--blue);
  border-radius:7px;font-family:var(--font);font-size:13px;background:var(--bg);color:var(--text);outline:none}
.lf-fecha{padding:3px 7px;border:1px solid var(--border);border-radius:7px;font-family:var(--font);
  font-size:12.5px;background:var(--bg);color:var(--text)}
.lf-fecha:hover{border-color:var(--blue)}
.lf-resp{width:100%;padding:6px 9px;border:1px solid var(--border);border-radius:var(--r);
  font-family:var(--font);font-size:13px;background:var(--bg);color:var(--text);cursor:pointer}
.lf-resp:hover{border-color:var(--blue)}
.lf-chips{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.lf-tag-nueva{flex:1;min-width:88px;padding:4px 8px;border:1px dashed var(--border);border-radius:99px;
  font-family:var(--font);font-size:11.5px;background:none;color:var(--text);outline:none}
.lf-tag-nueva:focus{border-color:var(--blue);border-style:solid}

/* Las notas del contacto: texto libre, tal como lo escribieron. */
.lf-notas{font-size:13px;line-height:1.6;color:var(--text-2);white-space:pre-wrap;overflow-wrap:anywhere}

/* Una fecha de cierre que ya pasó con el lead abierto. En el panel llevaba su
   triángulo rojo y en la ficha salía como una fecha más. */
.lf-vencida{display:inline-flex;align-items:center;gap:5px;color:var(--danger);font-weight:700}

/* Borrar no se deshace: va al final de la columna, en gris, y solo se tiñe de
   rojo cuando el puntero está encima. */
.lf-borrar{width:100%;background:none;border:1px dashed var(--border);border-radius:var(--r);
  padding:9px;font-family:var(--font);font-size:12px;font-weight:600;color:var(--muted2);cursor:pointer}
.lf-borrar:hover{border-color:var(--danger);border-style:solid;color:var(--danger);background:var(--danger-bg)}

/* Campañas: qué envíos masivos le tocaron y qué hizo con ellos */
.lf-envio{display:flex;gap:9px;align-items:center;padding:9px 11px;border:1px solid var(--border);
  border-radius:var(--r);margin-bottom:7px;background:var(--bg-subtle);font-size:12.5px}
.lf-envio.malo{border-color:var(--danger);background:var(--danger-bg)}
.lf-envio .cuando{font-size:11px;color:var(--muted2);margin-top:2px}
.lf-reaccion{background:var(--bg-muted);color:var(--muted)}
.lf-reaccion.malo{background:var(--danger);color:#fff}
.lf-quemado{display:flex;gap:8px;align-items:flex-start;margin-bottom:9px;padding:9px 11px;
  border:1px solid var(--danger);border-radius:var(--r);background:var(--danger-bg);
  font-size:12.5px;line-height:1.5;color:var(--danger)}
.lf-quemado svg{flex-shrink:0;margin-top:2px}

/* Satisfacción. El color es el mensaje: un detractor se ve antes de leerlo. */
.lf-nota{display:flex;gap:11px;align-items:center;padding:9px 11px;border:1px solid var(--border);
  border-radius:var(--r);background:var(--bg-subtle);font-size:12.5px}
.lf-nota .num{width:34px;height:34px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  border-radius:50%;font-size:15px;font-weight:800;color:#fff;background:var(--muted)}
.lf-nota .cuando{font-size:11px;color:var(--muted2);margin-top:2px}
.lf-nota.promotor{border-color:var(--success);background:var(--success-bg)}
.lf-nota.promotor .num{background:var(--success)}
.lf-nota.neutro{border-color:var(--warning);background:var(--warning-bg)}
.lf-nota.neutro .num{background:var(--warning)}
.lf-nota.detractor{border-color:var(--danger);background:var(--danger-bg)}
.lf-nota.detractor .num{background:var(--danger)}
.lf-cita-nps{margin-top:8px;padding-left:10px;border-left:2px solid var(--border);
  font-size:12.5px;line-height:1.55;color:var(--text-2);font-style:italic}

/* Propuestas */
.lf-prop{display:flex;gap:9px;align-items:center;padding:9px 11px;border:1px solid var(--border);
  border-radius:var(--r);margin-bottom:7px;background:var(--bg-subtle);font-size:12.5px;
  color:inherit;text-decoration:none}
a.lf-prop:hover{border-color:var(--blue)}
.lf-prop .cuando{font-size:11px;color:var(--muted2);margin-top:2px}
.lf-estado{margin-left:auto;font-size:10px;font-weight:800;padding:3px 9px;border-radius:99px;white-space:nowrap}


.crm-modal-aviso{margin:0 20px 10px;padding:10px 12px;border:1px solid var(--danger);
  border-radius:var(--r);background:var(--danger-bg);color:var(--danger);
  font-size:12.5px;line-height:1.5;overflow-wrap:anywhere}

/* Fondo tenue bajo las cajas: en blanco sobre blanco los recuadros se
   desdibujan y la pantalla se lee como una lista larga en vez de tres
   columnas. Va en el contenedor y no en `.lf-a` para que cubra también el
   hueco de abajo cuando el contenido es corto. */
#crm-lead-view{background:var(--bg-subtle)}
.lf-a{display:grid;grid-template-columns:320px minmax(0,1fr) 300px;gap:16px;padding:16px 20px;align-items:start}
.lf-col{display:flex;flex-direction:column;gap:14px;min-width:0}

/* En el móvil tres columnas no caben: se convierten en pestañas. Apretarlas
   hasta que entren daría tres columnas ilegibles en vez de una legible. */
.lf-pestanas{display:none;gap:2px;border-bottom:1px solid var(--border);padding:0 16px;
  background:var(--bg);position:sticky;top:0;z-index:9}
.lf-pestanas button{flex:1;background:none;border:none;border-bottom:2px solid transparent;
  padding:11px 6px;cursor:pointer;font-family:var(--font);font-size:12.5px;font-weight:600;
  color:var(--muted);margin-bottom:-1px}
.lf-pestanas button.on{color:var(--blue);border-bottom-color:var(--blue)}

@media (max-width:1180px){
  .lf-a{grid-template-columns:300px minmax(0,1fr)}
  .lf-col.tercera{grid-column:1 / -1;flex-direction:row;flex-wrap:wrap}
  /* `min-width:0` no es adorno: sin él un ítem flexible no baja de su ancho de
     contenido, y basta una fecha sin espacios o una tira de filtros para que
     la caja sobresalga y toda la página se desplace en horizontal. */
  .lf-col.tercera > *{flex:1 1 280px;min-width:0}
}
@media (max-width:820px){
  .lf-pestanas{display:flex}
  /* El embudo pasa a desplazarse en horizontal en vez de encogerse: con
     `flex:1` los pasos se comprimían por debajo de su texto y los rótulos se
     montaban unos sobre otros. Mejor arrastrarlo que no poder leerlo. */
  .lf-paso{flex:0 0 auto;min-width:0}
  .lf-paso .linea{flex:0 0 20px;min-width:20px}
  /* Y en el móvil bajan a su propia línea: con 375px de ancho, anclarlos a la
     derecha se comía 158px de la tira y el embudo dejaba de leerse. */
  .lf-embudo{flex-wrap:wrap;gap:10px;padding:12px 16px}
  .lf-pasos{flex:1 1 100%}
  .lf-cierre{margin-left:0}
  .lf-a{grid-template-columns:minmax(0,1fr);padding:14px 16px}
  .lf-col{display:none}
  .lf-col.visible{display:flex;flex-direction:row;flex-wrap:wrap}
  /* Lo mismo aquí, y aquí se notaba: en «Qué ha pasado» la caja del historial
     salía 44px por fuera de la pantalla —la empujaban la tira de filtros y la
     fecha de cada evento, que no parte— y el móvil se desplazaba en
     horizontal. La tira de filtros ya tiene su propio desplazamiento. */
  .lf-col.visible > *{flex:1 1 100%;min-width:0}
  .lf-barra{flex-wrap:wrap}
  .lf-acc{width:100%;margin-left:0}
}

/* ── RESERVAS ──────────────────────────────────────────────────────────────
   La trastienda del módulo de citas. Los mismos tokens de siempre: nada de
   hex sueltos salvo los ocho colores que el negocio elige para SU página,
   que son datos, no interfaz. */
.rsv-head{display:flex;align-items:flex-end;gap:18px;margin-bottom:14px;flex-wrap:wrap}
.rsv-h1{margin:0 0 3px;font-size:var(--fs-xl);font-weight:700;letter-spacing:-.5px}
.rsv-sub{margin:0;font-size:var(--fs-base);color:var(--muted);max-width:620px}
.rsv-activo{display:flex;align-items:center;gap:9px;font-size:var(--fs-base);font-weight:600}
.rsv-cargando{padding:40px;text-align:center;color:var(--muted2);font-size:var(--fs-base)}

.rsv-fallo{background:var(--danger-bg);border:1px solid var(--danger);border-radius:var(--rlg);padding:16px 18px;max-width:560px}
.rsv-fallo-t{display:flex;align-items:center;gap:7px;font-weight:700;font-size:var(--fs-base);color:var(--danger)}
.rsv-fallo-d{font-size:var(--fs-sm);color:var(--text-2);margin:6px 0 12px;word-break:break-word}

.rsv-aviso{display:flex;gap:9px;align-items:flex-start;background:var(--warning-bg);border:1px solid var(--warning);
  border-radius:var(--r);padding:11px 14px;font-size:var(--fs-sm);color:var(--text-2);line-height:1.5;margin-bottom:12px}
.rsv-aviso svg{color:var(--warning);flex-shrink:0;margin-top:1px}

.rsv-enlace{display:flex;align-items:center;gap:9px;background:var(--bg-subtle);border:1px solid var(--border);
  border-radius:var(--r);padding:9px 12px;margin-bottom:16px;flex-wrap:wrap}
.rsv-enlace-l{display:flex;align-items:center;gap:8px;flex:1;min-width:180px;font-size:var(--fs-sm);
  color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rsv-enlace-l svg{color:var(--muted2);flex-shrink:0}
.rsv-enlace a.btn-ghost{text-decoration:none;display:inline-flex;align-items:center}

.rsv-tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px}
.rsv-tab{background:none;border:none;border-bottom:2px solid transparent;padding:9px 14px;cursor:pointer;
  font-family:var(--font);font-size:var(--fs-base);font-weight:600;color:var(--muted);margin-bottom:-1px;transition:all var(--dur-fast) var(--ease)}
.rsv-tab:hover{color:var(--text)}
.rsv-tab.active{color:var(--blue);border-bottom-color:var(--blue)}

.rsv-cuerpo{padding-bottom:24px}
.rsv-barra{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.rsv-conteo{flex:1;font-size:var(--fs-sm);color:var(--muted)}

.rsv-rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.rsv-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--rlg);
  padding:14px 15px;display:flex;flex-direction:column;gap:8px;transition:border-color var(--dur-fast) var(--ease)}
.rsv-card:hover{border-color:var(--border-h)}
.rsv-card.apagada{opacity:.6}
.rsv-card-top{display:flex;align-items:flex-start;gap:9px}
.rsv-punto{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:5px}
/* El icono del servicio hereda su color del propio servicio: el color ya no es
   un punto suelto, es de qué color se dibuja lo que representa. */
.rsv-punto-ico{width:30px;height:30px;border-radius:9px;flex-shrink:0;display:flex;
  align-items:center;justify-content:center;background:var(--bg-subtle);border:1px solid var(--border2)}

.rsv-iconos{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
.rsv-ico-op{width:100%;aspect-ratio:1;border:1.5px solid var(--border);border-radius:var(--r);
  background:var(--bg);color:var(--text-2);cursor:pointer;display:flex;align-items:center;
  justify-content:center;transition:all .15s var(--ease)}
.rsv-ico-op:hover{border-color:var(--blue-md);color:var(--text)}
.rsv-ico-op.sel{border-color:var(--blue);color:var(--blue);background:var(--blue-lt)}

.rsv-logo-fila{display:flex;align-items:center;gap:13px;flex-wrap:wrap}
.rsv-logo{width:56px;height:56px;border-radius:15px;object-fit:cover;flex-shrink:0;
  border:1px solid var(--border);background:var(--bg-subtle)}
.rsv-logo-vacio{display:flex;align-items:center;justify-content:center;color:var(--muted2);
  border-style:dashed}

/* El prefijo de la URL va pegado al campo: se lee como una dirección entera,
   no como un rótulo y un hueco sin relación. */
.rsv-dir{display:flex;align-items:center;border:1.5px solid var(--border);border-radius:var(--r);
  background:var(--bg-subtle);padding-left:11px;overflow:hidden}
.rsv-dir span{font-size:var(--fs-sm);color:var(--muted2);white-space:nowrap}
.rsv-dir .auto-input{border:none;background:var(--bg);border-radius:0;flex:1;min-width:0}
.rsv-dir .auto-input:focus{border:none;outline:none}
.rsv-card-nom{font-size:var(--fs-base);font-weight:700;letter-spacing:-.01em}
.rsv-card-meta{font-size:var(--fs-sm);color:var(--muted);margin-top:2px}
.rsv-card-desc{font-size:var(--fs-sm);color:var(--text-2);line-height:1.5}
.rsv-card-quien{font-size:var(--fs-sm);color:var(--muted);display:flex;align-items:center;gap:6px}
.rsv-card-pie{display:flex;gap:6px;margin-top:2px;padding-top:9px;border-top:1px solid var(--border2)}
.rsv-ojo{color:var(--warning);display:inline-flex;align-items:center;gap:5px}
.rsv-chip{font-size:var(--fs-xs);font-weight:700;padding:2px 7px;border-radius:99px;flex-shrink:0}
.rsv-chip.off{background:var(--bg-muted);color:var(--muted)}
.rsv-borrar:hover{color:var(--danger);border-color:var(--danger)}

.rsv-lista{display:flex;flex-direction:column;gap:8px}
.rsv-fila{display:flex;align-items:center;gap:11px;background:var(--bg-card);border:1px solid var(--border);
  border-radius:var(--r);padding:11px 13px}
.rsv-fila.apagada{opacity:.6}
.rsv-fila-nom{font-size:var(--fs-base);font-weight:600}
.rsv-fila-meta{font-size:var(--fs-sm);color:var(--muted);margin-top:2px}
.rsv-av{width:34px;height:34px;border-radius:50%;background:var(--agua-grad);color:#fff;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:var(--fs-base)}

/* DOS columnas fijas, no `auto-fit`. Con auto-fit una pantalla ancha partía
   esto en tres o cuatro columnas de ~350 px, y una fila de horario necesita
   ~455: el nombre del día, dos selectores de hora y la equis. El resultado era
   que los tramos se salían de la tarjeta y se dibujaban encima de la de al
   lado —o quedaban tapados por ella, según la altura—. La primera columna va
   más ancha porque el horario es lo que más sitio pide. */
.rsv-cols{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
.rsv-bloque{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--rlg);padding:16px 18px;min-width:0}
.rsv-h3{margin:0 0 3px;font-size:var(--fs-md);font-weight:700;letter-spacing:-.01em}
.rsv-p{margin:0 0 14px;font-size:var(--fs-sm);color:var(--muted);line-height:1.5}

.rsv-dias{display:flex;flex-direction:column;gap:2px}
.rsv-dia{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--border2);flex-wrap:wrap}
.rsv-dia:last-child{border-bottom:none}
.rsv-dia-nom{display:flex;align-items:center;gap:9px;width:132px;flex-shrink:0;font-size:var(--fs-base);
  font-weight:600;padding-top:4px}
.rsv-dia.cerrado .rsv-dia-nom span{color:var(--muted2)}
/* `flex:1 1 300px`: cuando al lado del nombre del día quedan menos de 300 px,
   el bloque de tramos baja ENTERO a su propia línea y allí le sobra sitio. Sin
   la base, lo que se caía de renglón era la equis sola, que queda raro. */
.rsv-dia-tramos{flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
/* Que envuelva es el cinturón: si algún día la tarjeta vuelve a quedarse
   corta, la equis baja de línea en vez de salirse. */
.rsv-tramo{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
/* 128 y no 104: el selector de hora del navegador escribe «09:00 a. m.» con su
   propio icono al lado, y con menos ancho el texto sale cortado. */
.rsv-hora{width:128px;padding:6px 8px;font-size:var(--fs-sm)}
.rsv-a{font-size:var(--fs-sm);color:var(--muted2)}
.rsv-cerrado-txt{font-size:var(--fs-sm);color:var(--muted2);padding-top:5px}
.rsv-x{background:none;border:none;cursor:pointer;color:var(--muted2);font-size:12px;padding:4px;
  border-radius:6px;line-height:1}
.rsv-x:hover{color:var(--danger);background:var(--danger-bg)}
.rsv-mas{background:none;border:none;cursor:pointer;color:var(--blue);font-family:var(--font);
  font-size:var(--fs-sm);font-weight:700;padding:2px 0}
.rsv-guardar{display:flex;gap:8px;margin-top:14px}

.rsv-exc{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.rsv-exc-fila{display:flex;align-items:center;gap:10px;font-size:var(--fs-sm);background:var(--bg-subtle);
  border-radius:var(--r);padding:8px 11px}
.rsv-exc-fila b{font-weight:600;flex:1;min-width:0}
.rsv-exc-add{display:flex;gap:8px;align-items:center}
.rsv-exc-add .auto-input{flex:1;padding:7px 10px;font-size:var(--fs-sm)}
.rsv-vacio-chico{font-size:var(--fs-sm);color:var(--muted2);margin-bottom:12px}

.rsv-campo{margin-bottom:14px}
/* Hijo DIRECTO: si no, el rótulo en versalitas se le aplicaba también a las
   casillas de «quién lo presta», y los nombres de la gente salían gritados. */
.rsv-campo > label{display:block;font-size:var(--fs-xs);font-weight:700;letter-spacing:.04em;
  text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.rsv-opc{text-transform:none;letter-spacing:0;font-weight:500;color:var(--muted2)}
.rsv-nota{font-size:var(--fs-sm);color:var(--muted2);margin-top:5px;line-height:1.45}
.rsv-dos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rsv-colores{display:flex;gap:7px;flex-wrap:wrap}
.rsv-color{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;
  box-shadow:inset 0 0 0 1px rgba(13,15,28,.08)}
.rsv-color.sel{border-color:var(--text);transform:scale(1.08)}
.rsv-checks{display:flex;flex-wrap:wrap;gap:7px}
.rsv-check{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-sm);background:var(--bg-subtle);
  border:1px solid var(--border);border-radius:99px;padding:6px 11px;cursor:pointer}
.rsv-check input{margin:0;accent-color:var(--blue)}
.rsv-solo{border-radius:var(--r);width:100%;box-sizing:border-box}

/* El estado de un aviso: listo, pendiente de algo, o mal. Los tres se ven
   distinto de un vistazo — un estado que hay que leer entero para saber si va
   bien no sirve de estado. */
.rsv-estado{font-size:var(--fs-sm);line-height:1.55;background:var(--bg-subtle);
  border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;color:var(--text-2)}
.rsv-estado b{color:var(--text)}
.rsv-estado svg{vertical-align:-2px;margin-right:4px}
.rsv-estado.ok{background:var(--success-bg);border-color:var(--success);color:var(--text-2)}
.rsv-estado.ok svg{color:var(--success)}
.rsv-estado.aviso{background:var(--warning-bg);border-color:var(--warning)}
.rsv-estado.aviso svg{color:var(--warning)}
.rsv-estado.malo{background:var(--danger-bg);border-color:var(--danger)}
.rsv-estado.malo svg{color:var(--danger)}
.rsv-estado .rsv-nota{margin-top:6px}

.rsv-modal-cuerpo{padding:18px 22px;overflow-y:auto}
.rsv-modal-pie{display:flex;gap:8px;justify-content:flex-end;padding:14px 22px;border-top:1px solid var(--border)}

@media (max-width:1100px){
  .rsv-cols{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:768px){
  .rsv-head{flex-direction:column;align-items:stretch;gap:12px}
  .rsv-tabs{overflow-x:auto}
  .rsv-tab{flex:1;white-space:nowrap}
  .rsv-cols{grid-template-columns:minmax(0,1fr)}
  /* En fila, el nombre del día se comía el ancho y los dos selectores de hora
     quedaban en 60 px cada uno: ilegibles y casi imposibles de tocar. */
  .rsv-dia{flex-direction:column;gap:7px}
  .rsv-dia-nom{width:auto}
  .rsv-dos{grid-template-columns:minmax(0,1fr)}
}

.agency-agent-btn{width:28px;height:28px;border-radius:7px;border:1.5px solid;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0;background:transparent}
.agency-agent-btn:hover{transform:translateY(-1px);box-shadow:0 3px 8px rgba(0,0,0,.13)}
.agency-agent-btn.gads{border-color:#d0e4ff;background:#EFF6FF}
.agency-agent-btn.gads:hover{background:#f0f7ff;border-color:#4285F4}
.agency-agent-btn.meta{color:#1877F2;border-color:#d0e4ff;background:#EFF6FF}
.agency-agent-btn.meta:hover{background:#1877F2;color:#fff;border-color:#1877F2}
.agency-agent-btn.tiktok{color:#010101;border-color:var(--border);background:#f3f4f6}
.agency-agent-btn.tiktok:hover{background:#010101;color:#fff;border-color:#010101}
.agency-agent-btn.linkedin{color:#0A66C2;border-color:#dbeafe;background:#EFF6FF}
.agency-agent-btn.linkedin:hover{background:#0A66C2;color:#fff;border-color:#0A66C2}
.agency-agent-btn.seo{color:#10B981;border-color:#d1fae5;background:#F0FDF4}
.agency-agent-btn.seo:hover{background:#10B981;color:#fff;border-color:#10B981}
.agency-agent-btn.social{color:#F59E0B;border-color:#fed7aa;background:#FFF7ED}
.agency-agent-btn.social:hover{background:#F59E0B;color:#fff;border-color:#F59E0B}
.agency-agent-btn.leads{color:#6366F1;border-color:#c7d2fe;background:#EEF2FF}
.agency-agent-btn.leads:hover{background:#6366F1;color:#fff;border-color:#6366F1}
.agency-empty{text-align:center;padding:60px 20px;color:var(--muted)}
.agency-empty-icon{font-size:40px;margin-bottom:12px;opacity:.4}
.agency-empty-title{font-size:15px;font-weight:600;color:var(--text);margin-bottom:6px}
.agency-empty-desc{font-size:13px;line-height:1.55}
.agency-limit-bar{background:var(--sidebar);border-radius:var(--r);padding:10px 14px;margin-bottom:16px;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.agency-limit-track{flex:1;height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.agency-limit-fill{height:100%;background:var(--blue);border-radius:2px;transition:width .3s}
.agency-limit-fill.warning{background:var(--warning)}
.agency-limit-fill.danger{background:var(--danger)}

/* Modal nuevo cliente */
.agency-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.agency-modal{background:var(--bg);border-radius:var(--rlg);width:100%;max-width:600px;border:1px solid var(--border);box-shadow:0 20px 60px rgba(0,0,0,.2);display:flex;flex-direction:column;max-height:calc(100vh - 32px);overflow:hidden}
.agency-modal-header{padding:22px 24px 0;flex-shrink:0}
.agency-modal-title{font-size:17px;font-weight:700;color:var(--text);margin-bottom:2px}
.agency-modal-sub{font-size:12.5px;color:var(--muted);margin-bottom:0}
/* Steps nav */
.agency-steps-nav{display:flex;gap:0;padding:16px 24px 0;flex-shrink:0;overflow-x:auto;scrollbar-width:none}
.agency-steps-nav::-webkit-scrollbar{display:none}
.agency-step-pill{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--muted2);padding:6px 10px;border-radius:20px;cursor:pointer;transition:all .15s;white-space:nowrap;flex-shrink:0}
.agency-step-pill.active{background:var(--blue-lt);color:var(--blue)}
.agency-step-pill.done{color:var(--success)}
.agency-step-num{width:18px;height:18px;border-radius:50%;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:var(--muted);transition:all .15s;flex-shrink:0}
.agency-step-pill.active .agency-step-num{background:var(--blue);color:#fff}
.agency-step-pill.done .agency-step-num{background:var(--success);color:#fff}
/* Progress bar */
.agency-brief-progress{height:3px;background:var(--border);margin:10px 24px 0;border-radius:2px;flex-shrink:0}
.agency-brief-progress-fill{height:100%;background:var(--blue);border-radius:2px;transition:width .3s}
/* Body */
.agency-modal-body{flex:1;overflow-y:auto;padding:20px 24px;scrollbar-width:thin;scrollbar-color:var(--border2) transparent}
.agency-step-panel{display:none}
.agency-step-panel.active{display:block}
.agency-step-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:4px}
.agency-step-desc{font-size:12px;color:var(--muted);margin-bottom:16px;line-height:1.5}
/* Fields */
.agency-field{margin-bottom:14px}
.agency-field label{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px}
.agency-field input,.agency-field textarea,.agency-field select{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:var(--r);font-size:13px;color:var(--text);background:var(--bg);font-family:var(--font);transition:border-color .15s;resize:none}
.agency-field input:focus,.agency-field textarea:focus,.agency-field select:focus{outline:none;border-color:var(--blue-md)}
.agency-field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* Option chips */
.agency-chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
.agency-chip{padding:6px 12px;border:1.5px solid var(--border);border-radius:20px;font-size:12px;font-weight:500;color:var(--muted);cursor:pointer;transition:all .15s;user-select:none}
.agency-chip:hover{border-color:var(--blue-md);color:var(--blue)}
.agency-chip.sel{background:var(--blue-lt);border-color:var(--blue-md);color:var(--blue);font-weight:600}
/* Health picker */
.agency-health-picker{display:flex;gap:8px}
.agency-health-opt{flex:1;padding:8px;border-radius:var(--r);border:1.5px solid var(--border);cursor:pointer;text-align:center;font-size:12px;font-weight:600;transition:all .15s}
.agency-health-opt.selected-verde{background:#ECFDF5;border-color:#059669;color:#065F46}
.agency-health-opt.selected-amarillo{background:#FFFBEB;border-color:#D97706;color:#92400E}
.agency-health-opt.selected-rojo{background:#FEF2F2;border-color:#DC2626;color:#991B1B}
.agency-health-opt.selected-gris{background:var(--sidebar);border-color:var(--border2);color:var(--muted)}
/* Footer */
.agency-modal-footer{padding:14px 24px;padding-bottom:max(14px,env(safe-area-inset-bottom));border-top:1px solid var(--border);display:flex;gap:8px;flex-shrink:0;background:var(--bg)}
.agency-modal-cancel{padding:10px 16px;border:1.5px solid var(--border);border-radius:var(--r);background:none;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;font-family:var(--font);transition:all .15s;flex-shrink:0}
.agency-modal-cancel:hover{background:var(--sidebar)}
.agency-modal-prev{padding:10px 16px;border:1.5px solid var(--border);border-radius:var(--r);background:none;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;font-family:var(--font);transition:all .15s;flex-shrink:0}
.agency-modal-prev:hover{background:var(--sidebar)}
.agency-modal-next{flex:1;padding:10px;background:var(--blue);color:#fff;border:none;border-radius:var(--r);font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font);transition:all .15s}
.agency-modal-next:hover{background:var(--blue-h)}
.agency-modal-next:disabled{opacity:.5;cursor:not-allowed}
@media(max-width:640px){
  .agency-field-row{grid-template-columns:1fr}
  .agency-modal-overlay{align-items:flex-start;padding:12px 12px 0}
  .agency-modal{max-height:calc(100svh - 12px);border-bottom-left-radius:0;border-bottom-right-radius:0;width:100%}
  .agency-modal-next{min-height:44px;font-size:15px}
  .agency-modal-cancel,.agency-modal-prev{min-height:44px}
}

/* Contexto activo de cliente en chat */
.agency-ctx-bar{display:flex;align-items:center;gap:8px;padding:6px 14px;background:var(--blue-lt);border-bottom:1px solid var(--blue-md);font-size:12px;color:var(--blue);flex-shrink:0}
.agency-ctx-name{font-weight:600;flex:1}
.agency-ctx-exit{background:none;border:none;cursor:pointer;color:var(--blue);font-size:11px;font-family:var(--font);padding:2px 6px;border-radius:4px;transition:all .15s}
.agency-ctx-exit:hover{background:var(--blue-md)}

@media(max-width:768px){
  .agency-wrap{padding:20px 16px}
  .agency-stats{grid-template-columns:repeat(3,1fr);gap:6px}
  .agency-list-header{display:none}
  .agency-card{grid-template-columns:36px 1fr 100px;gap:10px}
  .agency-card-agents,.agency-card-footer{display:none}
}
/* ── REPORTE WHATSAPP ──────────────────────────────────────────────────────── */
.war-overlay{position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:600;display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.war-modal{background:var(--bg);border-radius:var(--rlg);width:100%;max-width:640px;border:1px solid var(--border);box-shadow:0 20px 60px rgba(0,0,0,.22);display:flex;flex-direction:column;max-height:calc(100vh - 32px);overflow:hidden}
.war-header{padding:18px 22px 0;flex-shrink:0}
.war-title{font-size:16px;font-weight:700;color:var(--text);margin-bottom:2px}
.war-sub{font-size:12px;color:var(--muted)}
/* Tabs de pasos */
.war-tabs{display:flex;border-bottom:1px solid var(--border);padding:0 22px;flex-shrink:0;margin-top:14px}
.war-tab{padding:8px 14px;font-size:12px;font-weight:600;color:var(--muted2);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap}
.war-tab.active{color:var(--blue);border-bottom-color:var(--blue)}
.war-tab.done{color:var(--success)}
/* Body */
.war-body{flex:1;overflow-y:auto;padding:18px 22px;scrollbar-width:thin}
.war-step{display:none}
.war-step.active{display:block}
.war-section-title{font-size:12px;font-weight:700;color:var(--text);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
/* Plataformas */
.war-platform-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:4px}
.war-platform-card{border:1.5px solid var(--border);border-radius:var(--r);padding:11px 14px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:10px}
.war-platform-card:hover{border-color:var(--blue-md)}
.war-platform-card.sel{border-color:var(--blue);background:var(--blue-lt)}
.war-platform-card.sel .war-plat-name{color:var(--blue)}
.war-plat-name{font-size:13px;font-weight:600;color:var(--text)}
.war-plat-sub{font-size:11px;color:var(--muted);margin-top:1px}
/* KPIs */
.war-kpi-grid{display:flex;flex-wrap:wrap;gap:7px}
.war-kpi-chip{padding:6px 12px;border:1.5px solid var(--border);border-radius:20px;font-size:12px;font-weight:500;color:var(--muted);cursor:pointer;transition:all .15s;user-select:none}
.war-kpi-chip:hover{border-color:var(--blue-md);color:var(--blue)}
.war-kpi-chip.sel{background:var(--blue-lt);border-color:var(--blue-md);color:var(--blue);font-weight:600}
/* Período */
.war-period-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.war-period-btn{padding:6px 13px;border:1.5px solid var(--border);border-radius:20px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;transition:all .15s;background:none;font-family:var(--font)}
.war-period-btn.active{background:var(--blue-lt);border-color:var(--blue-md);color:var(--blue)}
.war-date-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.war-date-row input[type=date]{width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:var(--r);font-size:12px;color:var(--text);background:var(--bg);font-family:var(--font)}
/* Datos de métricas */
.war-platform-section{margin-bottom:20px}
.war-platform-header{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border2)}
.war-platform-label{font-size:13px;font-weight:700;color:var(--text)}
.war-metrics-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.war-metric-field label{display:block;font-size:10px;font-weight:600;color:var(--muted2);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.war-metric-field input{width:100%;padding:7px 10px;border:1.5px solid var(--border);border-radius:var(--r);font-size:13px;color:var(--text);background:var(--bg);font-family:var(--font);transition:border-color .15s}
.war-metric-field input:focus{outline:none;border-color:var(--blue-md)}
/* Preview */
.war-phone-wrap{background:#ECE5DD;border-radius:12px;padding:14px}
.war-bubble{background:var(--bg);border-radius:4px 12px 12px 12px;padding:11px 14px;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.war-bubble-text{font-size:12.5px;line-height:1.6;color:var(--text);white-space:pre-wrap;word-break:break-word}
.war-bubble-time{font-size:10px;color:#999;text-align:right;margin-top:5px}
.war-generating{text-align:center;padding:28px 0;color:var(--muted)}
.war-gen-dots{display:inline-flex;gap:4px;margin-top:8px}
.war-gen-dots span{width:6px;height:6px;border-radius:50%;background:var(--blue);animation:warDot .9s ease-in-out infinite}
.war-gen-dots span:nth-child(2){animation-delay:.15s}
.war-gen-dots span:nth-child(3){animation-delay:.3s}
@keyframes warDot{0%,80%,100%{opacity:.2;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
.war-regen{font-size:12px;color:var(--blue);cursor:pointer;background:none;border:none;font-family:var(--font);padding:4px 0;margin-top:8px;display:inline-block}
/* Footer */
.war-footer{padding:12px 22px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-shrink:0;background:var(--bg)}
.war-footer-left{flex:1;font-size:11px;color:var(--muted2)}
.war-btn-cancel{padding:9px 16px;border:1.5px solid var(--border);border-radius:var(--r);background:none;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;font-family:var(--font)}
.war-btn-cancel:hover{background:var(--sidebar)}
.war-btn-prev{padding:9px 14px;border:1.5px solid var(--border);border-radius:var(--r);background:none;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;font-family:var(--font)}
.war-btn-prev:hover{background:var(--sidebar)}
.war-btn-next{padding:9px 18px;background:var(--blue);color:#fff;border:none;border-radius:var(--r);font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font)}
.war-btn-next:hover{background:var(--blue-h)}
.war-btn-next:disabled{opacity:.4;cursor:not-allowed}
.war-btn-wa{padding:9px 16px;background:#25D366;color:#fff;border:none;border-radius:var(--r);font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font);display:flex;align-items:center;gap:6px}
.war-btn-wa:hover{opacity:.9}
.war-btn-copy{padding:9px 14px;border:1.5px solid var(--border);border-radius:var(--r);background:none;font-size:13px;color:var(--text);cursor:pointer;font-family:var(--font);display:flex;align-items:center;gap:5px}
.war-btn-copy:hover{background:var(--sidebar)}
/* Botones en tarjeta y barra */
.agency-report-btn{font-size:11px;font-weight:600;color:var(--muted2);background:none;border:none;cursor:pointer;font-family:var(--font);padding:0;transition:color .15s;display:flex;align-items:center;gap:4px}
.agency-report-btn:hover{color:var(--blue)}
.agency-ctx-report{background:var(--blue);color:#fff;border:none;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;font-family:var(--font);padding:4px 10px;transition:opacity .15s;display:flex;align-items:center;gap:5px;flex-shrink:0}
.agency-ctx-report:hover{opacity:.85}
@media(max-width:640px){.war-metrics-grid{grid-template-columns:1fr 1fr}.war-platform-grid{grid-template-columns:1fr}}
/* ── FIN REPORTE WHATSAPP ──────────────────────────────────────────────────── */

/* ── FIN PANEL AGENCIA ─────────────────────────────────────────────────────── */

/* ── ACTION CONFIRM CARD ──────────────────────────────────────────────────── */
.action-confirm-card{background:var(--bg);border:2px solid var(--warning);border-radius:var(--rlg);padding:16px;margin:8px 0;max-width:500px}
.action-confirm-header{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.action-confirm-icon{font-size:16px}
.action-confirm-title{font-size:13px;font-weight:700;color:var(--text);flex:1}
.action-confirm-badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px}
.action-confirm-badge.reversible{background:#ECFDF5;color:#065F46}
.action-confirm-badge.irreversible{background:#FEF2F2;color:#991B1B}
.action-confirm-body{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.action-confirm-detail{display:flex;align-items:center;gap:8px;font-size:12px}
.action-confirm-detail .label{color:var(--muted);min-width:90px;flex-shrink:0}
.action-confirm-detail .value{color:var(--text);font-weight:500}
.action-confirm-detail .status-active{color:var(--success)}
.action-confirm-detail .status-paused{color:var(--muted)}
.action-confirm-footer{display:flex;gap:8px}
.action-confirm-footer .btn-cancel{padding:8px 14px;border:1.5px solid var(--border);border-radius:var(--r);background:none;font-size:12px;font-weight:500;color:var(--muted);cursor:pointer;font-family:var(--font);transition:all .15s}
.action-confirm-footer .btn-cancel:hover{background:var(--sidebar)}
.action-confirm-footer .btn-execute{padding:8px 14px;background:var(--warning);color:#fff;border:none;border-radius:var(--r);font-size:12px;font-weight:600;cursor:pointer;font-family:var(--font);transition:all .15s}
.action-confirm-footer .btn-execute:hover{opacity:.85}
.action-confirm-footer .btn-execute.danger{background:var(--danger)}
.action-confirm-footer .btn-execute:disabled{opacity:.5;cursor:not-allowed}
/* ── FIN ACTION CONFIRM ────────────────────────────────────────────────────── */

/* ── VIDEO BRIEF CARD + PLAYER ───────────────────────────────────────────── */
.video-brief-card{background:var(--bg);border:2px solid #7C3AED;border-radius:var(--rlg);padding:16px;margin:8px 0;max-width:520px}
.video-brief-header{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.video-brief-icon{font-size:18px}
.video-brief-title{font-size:13px;font-weight:700;color:var(--text);flex:1}
.video-brief-platform{font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px;background:#F5F3FF;color:#7C3AED}
.video-brief-specs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.video-brief-spec{font-size:11px;font-weight:500;padding:3px 8px;border-radius:6px;background:var(--sidebar2);color:var(--muted);border:1px solid var(--border)}
.video-brief-prompt{font-size:11px;color:var(--muted);line-height:1.5;background:var(--sidebar2);border-radius:8px;padding:10px;margin-bottom:12px;border:1px solid var(--border);max-height:80px;overflow-y:auto}
.video-brief-description{font-size:12px;font-weight:500;color:var(--text);margin-bottom:14px}
.video-brief-footer{display:flex;gap:8px;align-items:center}
.video-brief-footer .btn-generate{display:flex;align-items:center;gap:6px;padding:9px 16px;background:#7C3AED;color:#fff;border:none;border-radius:var(--r);font-size:12px;font-weight:600;cursor:pointer;font-family:var(--font);transition:all .15s}
.video-brief-footer .btn-generate:hover{background:#6D28D9}
.video-brief-footer .btn-generate:disabled{opacity:.5;cursor:not-allowed}
.video-brief-footer .btn-generate svg{flex-shrink:0}
.video-brief-cost{font-size:10px;color:var(--muted2);margin-left:4px}
.video-gen-progress{display:flex;align-items:center;gap:10px;padding:12px;background:var(--sidebar2);border-radius:8px;margin-top:8px;font-size:12px;color:var(--muted)}
.video-gen-spinner{width:16px;height:16px;border:2px solid var(--border);border-top-color:#7C3AED;border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0}
.video-player-wrap{margin:8px 0;max-width:320px;border-radius:var(--rlg);overflow:hidden;border:1.5px solid var(--border);position:relative}
.video-player-wrap video{display:block;width:100%;background:#000}
.video-player-actions{display:flex;gap:8px;padding:8px;background:var(--sidebar2);border-top:1px solid var(--border)}
.video-download-btn{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:#7C3AED;background:none;border:1.5px solid #7C3AED;border-radius:6px;padding:5px 10px;cursor:pointer;font-family:var(--font);transition:all .15s;text-decoration:none}
.video-download-btn:hover{background:#F5F3FF}
/* ── FIN VIDEO BRIEF ─────────────────────────────────────────────────────── */

/* ── REFERRAL SIDEBAR BUTTON ─────────────────────────────────────────────── */
.sb-mod{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);border:1px solid transparent;transition:all .15s;margin:1px 0}
.sb-mod:hover{background:var(--sidebar2);color:var(--text)}
.sb-mod.active{background:var(--blue-lt);color:var(--blue);border-color:var(--blue-md);font-weight:700}
/* Submenú flotante: aparece al lado del menú sin desplazarlo */
.sb-sub{position:fixed;z-index:9990;min-width:216px;max-width:260px;background:var(--bg);
  border:1px solid var(--border);border-radius:14px;box-shadow:0 18px 44px rgba(13,15,28,.16);
  padding:10px 8px;display:none;animation:sbSubIn .14s var(--ease,ease)}
/* Puente invisible: cubre el hueco entre el menú y el panel para que el ratón
   pueda cruzar en diagonal sin que se cierre a medio camino */
.sb-sub::before{content:'';position:absolute;left:-22px;top:-10px;width:24px;height:calc(100% + 20px)}
.sb-sub.open{display:block}
@keyframes sbSubIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.sb-sub-title{font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
  color:var(--muted2);padding:4px 10px 8px}
.sb-sub-item{padding:8px 11px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;
  border-radius:9px;transition:all .12s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-sub-item:hover{background:var(--sidebar2);color:var(--text)}
.sb-sub-item.active{color:var(--blue);font-weight:800;background:var(--blue-lt)}
.sb-sub-sep{height:1px;background:var(--border);margin:7px 10px}
/* Es una accion, no un item deshabilitado: en gris claro parecia apagada. */
.sb-sub-action{display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:600}
.sb-sub-action svg{flex-shrink:0;opacity:.8}
.sb-sub-action:hover{color:var(--blue)}
/* En móvil no hay hover: el submenú se despliega dentro del propio menú */
@media(max-width:768px){
  .sb-sub{position:static;display:none;box-shadow:none;border:none;border-left:1.5px solid var(--border);
    border-radius:0;margin:0 0 0 10px;padding:2px 0;max-width:none;min-width:0;animation:none}
  .sb-sub.open{display:block}
}
#sb-agents-group{margin-left:4px}
#sb-agents-group.sb-collapsed{display:none}
#sb-leads-btn{display:none !important}
.sb-referral {
  margin-top: auto; display: flex; align-items: center; gap: 10px;
  padding: 11px 12px; border-radius: var(--rlg);
  background: linear-gradient(135deg, var(--blue-lt) 0%, #E8EAFC 100%);
  border: 1.5px solid var(--blue-md); cursor: pointer;
  transition: all .2s var(--ease); text-decoration: none;
  box-shadow: var(--shadow-sm);
}
.sb-referral:hover { background: linear-gradient(135deg, #E0E3FB 0%, #D5DAFC 100%); border-color: var(--blue-mid); box-shadow: 0 4px 12px var(--blue-glow); transform: translateY(-1px); }
.sb-referral-icon { font-size: 18px; flex-shrink: 0; display:flex; align-items:center; justify-content:center; width:28px; height:28px; background:var(--blue); border-radius:7px; color:#fff; }
.sb-referral-text { flex: 1; min-width: 0; }
.sb-referral-title { font-size: 12px; font-weight: 700; color: var(--blue); line-height: 1.3; }
.sb-referral-sub { font-size: 10.5px; color: var(--blue-mid); font-weight: 500; }
.sb-referral-arrow { color: var(--blue-mid); flex-shrink: 0; transition: transform .2s var(--ease); }
.sb-referral:hover .sb-referral-arrow { transform: translateX(2px); }

/* ── REFERRAL MODAL ───────────────────────────────────────────────────────── */
.modal-backdrop {
  display: none; position: fixed; inset: 0; z-index: 500;
  background: rgba(13,15,28,.4); backdrop-filter: blur(4px);
  align-items: center; justify-content: center; padding: 16px;
}
.modal-backdrop.open { display: flex; }
.modal-inner {
  background: var(--bg-card); border-radius: var(--rxl);
  border: 1px solid var(--border); width: 100%; max-width: 480px;
  box-shadow: 0 24px 64px rgba(13,15,28,.2);
  animation: fadeUp .35s var(--ease) both;
  overflow: hidden; max-height: 90vh; overflow-y: auto;
}
@keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
.modal-head {
  padding: 24px 24px 0; text-align: center;
  background: linear-gradient(180deg, var(--blue-lt) 0%, var(--bg-card) 100%);
}
.modal-emoji { font-size: 40px; margin-bottom: 10px; display: block; }
.modal-title { font-size: 19px; font-weight: 800; letter-spacing: -.4px; color: var(--text); margin-bottom: 5px; }
.modal-sub { font-size: 13px; color: var(--text-2); line-height: 1.5; margin-bottom: 20px; }
.modal-body { padding: 0 24px 24px; }
.modal-link-label { font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); margin-bottom: 8px; margin-top: 16px; }
.modal-link-row {
  display: flex; align-items: center; gap: 8px;
  background: var(--bg-subtle); border: 1.5px solid var(--border);
  border-radius: var(--r); padding: 10px 14px;
}
.modal-link-url { flex: 1; font-size: 13px; color: var(--text); font-family: monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.modal-copy-btn {
  padding: 6px 14px; border-radius: 8px;
  background: var(--blue); color: #fff; font-family: var(--font);
  font-size: 12px; font-weight: 700; border: none; cursor: pointer;
  transition: all .15s var(--ease); flex-shrink: 0;
}
.modal-copy-btn:hover { background: var(--blue-h); }
.modal-copy-btn.copied { background: var(--success); }
.modal-socials { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; }
.modal-social-btn {
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  padding: 10px 8px; border-radius: var(--r);
  border: 1.5px solid var(--border); background: var(--bg);
  cursor: pointer; transition: all .15s var(--ease); text-decoration: none;
}
.modal-social-btn:hover { border-color: var(--blue-md); background: var(--blue-lt); transform: translateY(-2px); box-shadow: var(--shadow-sm); }
.modal-social-icon { font-size: 18px; }
.modal-social-label { font-size: 10px; font-weight: 600; color: var(--text-2); }
.modal-divider { height: 1px; background: var(--border); margin: 16px 0; }
.modal-stats { display: flex; gap: 0; background: var(--bg-subtle); border-radius: 12px; border: 1px solid var(--border); overflow: hidden; }
.modal-stat { flex: 1; padding: 14px 16px; text-align: center; }
.modal-stat + .modal-stat { border-left: 1px solid var(--border); }
.modal-stat-val { font-size: 22px; font-weight: 800; color: var(--text); letter-spacing: -.5px; margin-bottom: 2px; }
.modal-stat-label { font-size: 10px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: .06em; }
.modal-close-btn {
  position: absolute; top: 16px; right: 16px;
  width: 28px; height: 28px; border-radius: 8px;
  background: var(--bg-muted); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--text-2); transition: all .15s var(--ease);
}
.modal-close-btn:hover { background: var(--border); color: var(--text); }
.modal-inner { position: relative; }

/* ── SIDEBAR REDESIGN — new agent rows ── */
.sb-new{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:var(--r);cursor:pointer;font-size:12.5px;font-weight:600;color:var(--blue);transition:all .18s var(--ease);border:1px solid var(--blue-md);background:var(--blue-lt);margin-bottom:6px}
.sb-new:hover{background:#E0E3FB;border-color:var(--blue-mid)}
.sb-new svg{width:14px;height:14px;flex-shrink:0}
.sb-agent-row{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--r);cursor:pointer;transition:all .18s var(--ease);border:1px solid transparent;user-select:none;margin-top:1px}
.sb-agent-row:hover,.sb-agent-row.open{background:var(--bg-muted)}
.sb-agent-row:hover .sb-agent-name,.sb-agent-row.open .sb-agent-name{color:var(--text)}
.sb-dot{width:4px;height:4px;border-radius:50%;background:var(--border);flex-shrink:0;margin-left:2px}
.sb-item.active .sb-dot{background:var(--blue)}
.sb-divider{height:1px;background:var(--border);margin:6px 4px}

.cfg-wrap{flex:1;overflow-y:auto;scrollbar-width:none}
.cfg-wrap::-webkit-scrollbar{display:none}

.cfg-settings-title{font-size:16px;font-weight:700;color:var(--text);letter-spacing:-.2px}

.cfg-nav-item{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:var(--r);font-size:13px;font-weight:500;color:var(--text-2);cursor:pointer;transition:all .15s var(--ease);margin-bottom:2px;border:1px solid transparent;width:100%;text-align:left;background:none;font-family:var(--font);line-height:1.4}
