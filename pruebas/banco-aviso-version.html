.cfg-main{flex:1;min-width:0;padding-left:32px}
.cfg-section{background:var(--bg);border:1px solid var(--border);border-radius:var(--rlg);padding:22px 24px;margin-bottom:16px}
.cfg-section-title{font-size:15px;font-weight:700;color:var(--text);margin-bottom:2px}
.cfg-section-sub{font-size:12px;color:var(--text-3);margin-bottom:18px;line-height:1.5}
.cfg-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--border);gap:12px}
.cfg-row:last-child{border-bottom:none;padding-bottom:0}
.cfg-label{font-size:12.5px;color:var(--text-2);font-weight:500;flex-shrink:0}
.cfg-value{font-size:12.5px;color:var(--text);font-weight:600;flex:1;text-align:right}
.cfg-edit-btn{font-size:11.5px;font-weight:600;color:var(--blue);background:var(--blue-lt);border:1px solid var(--blue-md);border-radius:8px;padding:5px 11px;cursor:pointer;font-family:var(--font);white-space:nowrap;transition:all .15s var(--ease);flex-shrink:0}
.cfg-edit-btn:hover{background:#E0E3FB}
.cfg-avatar-row{display:flex;align-items:center;gap:16px;margin-bottom:18px;padding-bottom:18px;border-bottom:1px solid var(--border)}
.cfg-avatar-big{width:56px;height:56px;border-radius:16px;background:var(--blue-lt);border:2px solid var(--blue-md);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:var(--blue);flex-shrink:0}
.cfg-avatar-info{flex:1}
.cfg-avatar-name{font-size:15px;font-weight:700;color:var(--text)}
.cfg-avatar-email{font-size:12px;color:var(--text-3);margin-top:2px}
.cfg-plan-card{display:flex;align-items:center;gap:14px;padding:16px;background:var(--blue-lt);border:1.5px solid var(--blue-md);border-radius:var(--rlg);margin-bottom:14px}
.cfg-plan-icon{font-size:24px;flex-shrink:0}
.cfg-plan-info{flex:1}
.cfg-plan-name{font-size:14px;font-weight:700;color:var(--blue)}
.cfg-plan-desc{font-size:11.5px;color:var(--text-2);margin-top:2px;line-height:1.4}
.cfg-upgrade-btn{padding:8px 16px;background:var(--blue);color:#fff;border:none;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--font);transition:all .15s var(--ease);white-space:nowrap}
.cfg-upgrade-btn:hover{background:var(--blue-mid)}
.integration-row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--border)}
.integration-row:last-child{border-bottom:none}
.int-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.int-info{flex:1;min-width:0}
.int-name{font-size:13px;font-weight:600;color:var(--text)}
.int-status{font-size:11px;color:var(--text-3)}
.int-status.connected{color:var(--success);font-weight:600}
.int-badge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px}
.int-badge.on{background:rgba(5,150,105,.1);color:var(--success);border:1px solid rgba(5,150,105,.2)}
.int-badge.off{background:var(--bg-muted);color:var(--text-3);border:1px solid var(--border)}
.cfg-toggle-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border)}
.cfg-toggle-row:last-child{border-bottom:none}
.cfg-toggle-label{font-size:13px;font-weight:500;color:var(--text)}
.cfg-toggle-sub{font-size:11.5px;color:var(--text-3);margin-top:2px}
.toggle{width:38px;height:22px;border-radius:11px;background:var(--bg-muted);border:1.5px solid var(--border);cursor:pointer;position:relative;transition:all .2s var(--ease);flex-shrink:0}
.toggle.on{background:var(--blue);border-color:var(--blue)}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--bg);box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s var(--ease)}
.toggle.on::after{transform:translateX(16px)}
.cfg-danger-btn{padding:9px 18px;border-radius:9px;background:rgba(220,38,38,.07);color:var(--danger);font-family:var(--font);font-size:13px;font-weight:600;border:1.5px solid rgba(220,38,38,.2);cursor:pointer;transition:all .15s var(--ease)}
.cfg-danger-btn:hover{background:rgba(220,38,38,.12);border-color:rgba(220,38,38,.35)}
/* Settings responsive */
@media(max-width:768px){
  .cfg-layout{flex-direction:column;padding:16px;gap:0;min-height:auto}
  .cfg-nav{width:100%;border-right:none;border-bottom:1px solid var(--border);padding:0 0 12px;margin-bottom:16px;display:flex;flex-wrap:wrap;gap:4px}
  .cfg-nav-title{display:none}
  .cfg-nav-item{font-size:11.5px;padding:7px 11px}
  .cfg-section{padding:16px}
  .cfg-main{padding-left:0}
}



/* ── STUDIO WIZARD CHIPS ── */
.wiz-chip{padding:6px 14px;border-radius:20px;border:1.5px solid var(--border);background:var(--bg);color:var(--muted);font-size:12px;font-weight:500;cursor:pointer;font-family:var(--font);transition:all .15s;white-space:nowrap}
.wiz-chip:hover{border-color:var(--blue-md);color:var(--blue)}
.wiz-chip.active{background:var(--blue-lt);border-color:var(--blue);color:var(--blue);font-weight:700}
/* ── SOCIAL MEDIA STUDIO ── */
.sb-studio-link{color:#818cf8!important;font-weight:600}
.sb-studio-link svg{stroke:#818cf8}
.social-studio{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg-subtle);height:100%}
/* Si la parrilla no pudo guardarse en la cuenta, se dice en pantalla: el riesgo real es creer que el equipo ya lo ve. */
.studio-aviso{display:flex;align-items:center;gap:8px;margin:10px 14px 0;padding:9px 12px;border:1px solid var(--warning);border-radius:10px;background:color-mix(in srgb,var(--warning) 12%,transparent);color:var(--warning);font-size:12.5px;line-height:1.35}
.studio-aviso svg{flex:0 0 auto}
.studio-hdr{display:flex;align-items:center;justify-content:space-between;padding:20px 24px 16px;background:var(--bg);border-bottom:1px solid var(--border);flex-shrink:0;gap:12px;flex-wrap:wrap}
.studio-hdr-left{display:flex;align-items:center;gap:14px}
.studio-back{background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;font-family:var(--font);padding:4px 8px;border-radius:6px;transition:all .15s}
.studio-back:hover{background:var(--bg-muted);color:var(--text)}
.studio-title{font-size:18px;font-weight:700;color:var(--text);margin:0}
.studio-sub{font-size:12px;color:var(--muted);margin:2px 0 0}
.studio-hdr-right{display:flex;align-items:center;gap:8px}
.studio-filters{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;background:var(--bg);border-bottom:1px solid var(--border2);flex-shrink:0;gap:12px;flex-wrap:wrap}
.studio-week-tabs{display:flex;gap:4px}
.week-tab{background:none;border:1px solid var(--border);color:var(--muted);font-size:12px;font-weight:500;padding:5px 12px;border-radius:20px;cursor:pointer;font-family:var(--font);transition:all .15s}
.week-tab:hover{border-color:var(--blue-md);color:var(--blue)}
.week-tab.active{background:var(--blue);border-color:var(--blue);color:#fff}
.studio-view-btns{display:flex;gap:2px;background:var(--bg-muted);border-radius:8px;padding:2px}
.view-tog{background:none;border:none;color:var(--muted);padding:5px 8px;border-radius:6px;cursor:pointer;transition:all .15s;display:flex;align-items:center}
.view-tog.active{background:var(--bg);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.studio-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 24px;text-align:center;gap:12px}
.studio-empty-icon{font-size:48px;margin-bottom:8px}
.studio-empty h3{font-size:18px;font-weight:700;color:var(--text);margin:0}
.studio-empty p{font-size:14px;color:var(--muted);margin:0;max-width:320px;line-height:1.5}
.studio-cal-cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;padding:20px 24px}
.studio-net-col{background:var(--bg);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.studio-net-hdr{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--border2)}
.studio-net-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.studio-net-name{font-size:12px;font-weight:700;color:var(--text);flex:1}
.studio-net-count{font-size:11px;font-weight:600;background:var(--bg-muted);color:var(--muted);padding:1px 7px;border-radius:10px}
.studio-net-body{padding:10px;display:flex;flex-direction:column;gap:8px}
.studio-week-label{font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted2);padding:4px 2px 2px;margin-top:4px}
.studio-week-label:first-child{margin-top:0}
.studio-week-empty{font-size:11px;color:var(--muted2);padding:4px 2px;font-style:italic}
.post-card{border:1px solid var(--border);border-radius:10px;overflow:hidden;cursor:pointer;transition:all .15s;background:var(--bg-card)}
.post-card:hover{border-color:var(--blue-md);box-shadow:0 2px 8px rgba(30,43,204,.08);transform:translateY(-1px)}
.post-card-img{aspect-ratio:1/1;background:var(--bg-muted);overflow:hidden}
.post-card-img img,.post-card-img video{width:100%;height:100%;object-fit:cover;display:block}
.post-card-img-empty{display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--muted2)}
.post-card-body{padding:8px 10px}
.post-card-meta{display:flex;align-items:center;gap:4px;margin-bottom:5px;flex-wrap:wrap}
.post-badge{font-size:9px;font-weight:700;padding:2px 6px;border-radius:10px;text-transform:uppercase;letter-spacing:.04em}
.post-status{font-size:9px;font-weight:600;padding:2px 6px;border-radius:10px;margin-left:auto}
.post-card-title{font-size:11px;font-weight:600;color:var(--text);line-height:1.4;margin-bottom:2px}
.post-card-caption{font-size:10px;color:var(--muted);line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.post-card-day{font-size:10px;color:var(--muted2);margin-top:4px}
.studio-list-grid{display:flex;flex-direction:column;gap:8px;padding:20px 24px}
.post-list-item{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px 16px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:all .15s}
.post-list-item:hover{border-color:var(--blue-md);background:var(--blue-dim)}
.post-list-thumb{width:44px;height:44px;border-radius:8px;background:var(--bg-muted);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px}
.post-list-thumb img{width:100%;height:100%;object-fit:cover}
.post-list-info{flex:1;min-width:0}
.post-list-title{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.post-list-meta{font-size:11px;color:var(--muted);margin-top:2px}
.post-list-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.post-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:2000;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(6px)}
.post-modal-box{background:var(--bg);border-radius:18px;width:100%;max-width:720px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 32px 80px rgba(0,0,0,.25);overflow:hidden}
.post-modal-hdr{display:flex;align-items:flex-start;justify-content:space-between;padding:20px 24px 16px;border-bottom:1px solid var(--border);flex-shrink:0}
.post-modal-title{font-size:15px;font-weight:700;color:var(--text);line-height:1.4;margin-bottom:6px}
.post-modal-close{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:2px 7px;border-radius:7px;line-height:1;flex-shrink:0;margin-top:2px}
.post-modal-close:hover{background:var(--bg-muted);color:var(--text)}
/* Two-column body */
.post-modal-2col{display:grid;grid-template-columns:240px 1fr;flex:1;overflow:hidden;min-height:0}
.post-modal-media{background:var(--bg-subtle);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:20px;gap:10px;overflow-y:auto}
.post-modal-media-preview{border-radius:12px;overflow:hidden;background:var(--bg-muted);aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;position:relative}
.post-modal-media-preview img{width:100%;height:100%;object-fit:cover}
.post-modal-media-preview video{width:100%;height:100%;object-fit:cover}
.post-modal-media-empty{font-size:36px;color:var(--muted2)}
.post-modal-media-label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
.post-modal-content{overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:14px}
.post-field{display:flex;flex-direction:column;gap:5px}
.post-field label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.post-field textarea,.post-field input{border:1px solid var(--border);border-radius:9px;padding:10px 13px;font-size:13px;font-family:var(--font);color:var(--text);background:var(--bg);resize:vertical;transition:border .15s;box-sizing:border-box;width:100%}
.post-field textarea:focus,.post-field input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(30,43,204,.08)}
.post-modal-footer{display:flex;align-items:center;gap:8px;padding:14px 24px;border-top:1px solid var(--border);background:var(--bg-subtle);flex-shrink:0;flex-wrap:wrap}
.pm-btn{padding:9px 16px;border-radius:9px;font-size:12px;font-weight:600;cursor:pointer;font-family:var(--font);transition:all .15s;border:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pm-btn-primary{background:var(--blue);color:#fff}.pm-btn-primary:hover{background:var(--blue-h)}
.pm-btn-success{background:#ECFDF5;color:#059669;border:1px solid #A7F3D0!important}.pm-btn-success:hover{background:#D1FAE5}
.pm-btn-info{background:#EFF6FF;color:#2563EB;border:1px solid #BFDBFE!important}.pm-btn-info:hover{background:#DBEAFE}
.pm-btn-ghost{background:var(--bg);color:var(--muted);border:1px solid var(--border)!important}.pm-btn-ghost:hover{background:var(--bg-muted)}
.pm-btn-danger{background:none;color:#EF4444;border:1px solid #FCA5A5!important}.pm-btn-danger:hover{background:#FEF2F2}
.pm-btn-upload{width:100%;justify-content:center;background:var(--bg);color:var(--text);border:1.5px dashed var(--border)!important}.pm-btn-upload:hover{border-color:var(--blue)!important;color:var(--blue)}
/* ── Social Connections Modal ── */
.social-conn-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:2100;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(6px)}
.social-conn-box{background:var(--bg);border-radius:18px;width:100%;max-width:460px;box-shadow:0 32px 80px rgba(0,0,0,.22);overflow:hidden}
.social-conn-hdr{display:flex;align-items:center;justify-content:space-between;padding:20px 24px 16px;border-bottom:1px solid var(--border)}
.social-conn-body{padding:20px 24px;display:flex;flex-direction:column;gap:14px}
.social-conn-row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:12px;border:1px solid var(--border);background:var(--bg-subtle)}
.social-conn-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.social-conn-info{flex:1;min-width:0}
.social-conn-name{font-size:13px;font-weight:700;color:var(--text)}
.social-conn-status{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ── Publish Modal ── */
.pub-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:2100;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(6px)}
.pub-box{background:var(--bg);border-radius:18px;width:100%;max-width:420px;box-shadow:0 32px 80px rgba(0,0,0,.22);overflow:hidden}
.pub-hdr{display:flex;align-items:center;justify-content:space-between;padding:20px 24px 16px;border-bottom:1px solid var(--border)}
.pub-body{padding:20px 24px;display:flex;flex-direction:column;gap:14px}
.pub-net-row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:10px;border:2px solid var(--border);cursor:pointer;transition:all .15s;background:var(--bg)}
.pub-net-row:hover{border-color:var(--blue);background:var(--blue-lt)}
.pub-net-row.selected{border-color:var(--blue);background:var(--blue-lt)}
.pub-net-row.disabled{opacity:.45;cursor:not-allowed;pointer-events:none}
.pub-acct-label{font-size:10px;color:var(--muted);margin-top:2px}
.studio-stats{display:flex;gap:12px;padding:12px 24px 0;flex-wrap:wrap}
.studio-stat{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px 16px;flex:1;min-width:100px;text-align:center}
.studio-stat-num{font-size:22px;font-weight:800;color:var(--text)}
.studio-stat-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
/* ── Historial panel ── */
.studio-historial-panel{position:absolute;right:0;top:0;bottom:0;width:320px;max-width:90vw;background:var(--bg);border-left:1px solid var(--border);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s cubic-bezier(.4,0,.2,1);box-shadow:-4px 0 24px rgba(0,0,0,.12)}
.studio-historial-panel.open{transform:translateX(0)}
.studio-historial-hdr{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);flex-shrink:0}
.studio-historial-title{font-size:14px;font-weight:700;color:var(--text)}
.historial-card{padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s}
.historial-card:hover{background:var(--blue-dim)}
.historial-active{background:var(--blue-lt)}
.historial-name{font-size:13px;font-weight:600;color:var(--text);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.historial-meta{font-size:11px;color:var(--muted);margin-top:2px}

/* ── ACADEMIA ─────────────────────────────────────────────────────────────── */
.academia-scroll{flex:1;overflow-y:auto;background:var(--bg-subtle)}
.academia-hero{background:linear-gradient(135deg,#1520B0 0%,#1E2BCC 45%,#3D52E5 100%);padding:40px 36px 36px;color:#fff;position:relative;overflow:hidden;flex-shrink:0}
.academia-hero::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 80% 80% at 80% -10%,rgba(255,255,255,.07),transparent);pointer-events:none}
.academia-hero-eyebrow{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.6;margin-bottom:10px;display:flex;align-items:center;gap:7px}
.academia-hero-eyebrow::before{content:'';width:24px;height:2px;background:rgba(255,255,255,.5);border-radius:2px;display:inline-block}
.academia-hero-title{font-size:30px;font-weight:800;letter-spacing:-.6px;line-height:1.12;margin-bottom:10px}
.academia-hero-sub{font-size:14px;opacity:.75;line-height:1.55;max-width:520px;margin-bottom:24px}
.academia-hero-stats{display:flex;gap:28px;flex-wrap:wrap}
.academia-hero-stat-val{font-size:22px;font-weight:800;line-height:1}
.academia-hero-stat-lbl{font-size:11px;opacity:.58;margin-top:3px;letter-spacing:.02em}

.academia-body{padding:28px 32px;max-width:1100px;margin:0 auto;width:100%}
.academia-cats-wrap{background:var(--bg);border-bottom:1px solid var(--border);padding:0 32px;position:sticky;top:0;z-index:10}
.academia-cats{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:14px 0}
.academia-cats::-webkit-scrollbar{display:none}
.academia-cat-btn{padding:7px 13px;border-radius:20px;border:none;background:transparent;font-size:13px;font-weight:500;color:var(--text-2);cursor:pointer;font-family:var(--font);transition:all .17s;white-space:nowrap;flex-shrink:0}
.academia-cat-btn:hover{background:var(--bg-subtle);color:var(--text)}
.academia-cat-btn.active{background:var(--blue-lt);color:var(--blue);font-weight:600}

.academia-section{margin-bottom:40px}
.academia-section-hdr{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.academia-section-icon{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.academia-section-title{font-size:16px;font-weight:700;color:var(--text);letter-spacing:-.2px}
.academia-section-sub{font-size:13px;color:var(--muted);margin-bottom:18px;padding-left:42px}
.academia-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:16px}

.ac-card{background:var(--bg);border-radius:14px;border:1px solid var(--border);overflow:hidden;cursor:pointer;transition:all .22s var(--ease);display:flex;flex-direction:column}
.ac-card:hover{transform:translateY(-3px);box-shadow:0 8px 28px rgba(13,15,28,.1);border-color:var(--border-h)}
.ac-card.ac-soon{cursor:default;opacity:.72}
.ac-card.ac-soon:hover{transform:none;box-shadow:none;border-color:var(--border)}
.ac-thumb{position:relative;aspect-ratio:16/9;overflow:hidden;display:flex;align-items:center;justify-content:center}
.ac-thumb-icon{opacity:.18;position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.ac-thumb-icon svg{width:72px;height:72px;color:#fff}
.ac-play{width:46px;height:46px;background:rgba(255,255,255,.96);border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(0,0,0,.25);transition:all .2s;position:relative;z-index:2;flex-shrink:0}
.ac-card:not(.ac-soon):hover .ac-play{transform:scale(1.12);box-shadow:0 6px 28px rgba(0,0,0,.32)}
.ac-play svg{width:16px;height:16px;margin-left:3px;fill:var(--blue)}
.ac-cat-tag{position:absolute;top:10px;left:10px;z-index:3;padding:3px 8px;border-radius:20px;font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;backdrop-filter:blur(6px)}
.ac-soon-tag{position:absolute;top:10px;right:10px;z-index:3;padding:3px 10px;border-radius:20px;font-size:9px;font-weight:700;background:rgba(0,0,0,.35);color:#fff;backdrop-filter:blur(4px);letter-spacing:.04em}
.ac-dur{position:absolute;bottom:8px;right:8px;z-index:3;padding:2px 7px;border-radius:6px;font-size:10px;font-weight:600;background:rgba(0,0,0,.55);color:#fff}
.ac-info{padding:14px 16px 16px;flex:1;display:flex;flex-direction:column;gap:4px}
.ac-title{font-size:13.5px;font-weight:600;color:var(--text);line-height:1.4}
.ac-desc{font-size:12px;color:var(--muted);line-height:1.5;margin-top:2px}

/* Video player modal */
.ac-player-overlay{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:3000;display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .25s;backdrop-filter:blur(4px)}
.ac-player-overlay.open{opacity:1;pointer-events:all}
.ac-player-box{background:#111;border-radius:16px;width:100%;max-width:900px;overflow:hidden;box-shadow:0 32px 80px rgba(0,0,0,.6);transform:scale(.95) translateY(12px);transition:transform .28s var(--ease)}
.ac-player-overlay.open .ac-player-box{transform:scale(1) translateY(0)}
.ac-player-hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#1a1a1a}
.ac-player-title{font-size:13px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;margin-right:12px}
.ac-player-close{width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.08);border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;flex-shrink:0}
.ac-player-close:hover{background:rgba(255,255,255,.16)}
.ac-player-ratio{position:relative;aspect-ratio:16/9}
.ac-player-ratio iframe{position:absolute;inset:0;width:100%;height:100%;border:none;display:block}

/* Novedades — el aviso de "qué hay de nuevo" al entrar */
.nov-overlay{position:fixed;inset:0;background:rgba(15,18,32,.55);z-index:3200;display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .22s;backdrop-filter:blur(3px)}
.nov-overlay.open{opacity:1;pointer-events:all}
.nov-box{background:var(--bg);border:1px solid var(--border);border-radius:16px;width:100%;max-width:480px;max-height:86vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 64px rgba(0,0,0,.22);transform:scale(.96) translateY(10px);transition:transform .26s var(--ease)}
.nov-overlay.open .nov-box{transform:scale(1) translateY(0)}
.nov-hdr{padding:20px 22px 14px;border-bottom:1px solid var(--border)}
.nov-eyebrow{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
.nov-title{font-size:18px;font-weight:700;color:var(--text);margin-top:5px;line-height:1.25}
.nov-body{padding:6px 22px 4px;overflow-y:auto}
.nov-item{padding:16px 0;border-bottom:1px solid var(--border)}
.nov-item:last-child{border-bottom:none}
.nov-chip{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:20px;margin-bottom:8px}
.nov-chip.nuevo{background:var(--blue-lt);color:var(--blue)}
.nov-chip.mejora{background:#ECFDF5;color:#059669}
.nov-chip.arreglo{background:#FFF3EA;color:#ea580c}
.nov-item-title{font-size:14px;font-weight:650;color:var(--text);line-height:1.35}
.nov-item-text{font-size:12.5px;color:var(--text-2);line-height:1.55;margin-top:5px}
.nov-item-cta{margin-top:9px;font-size:12px;font-weight:600;color:var(--blue);background:none;border:none;padding:0;cursor:pointer;font-family:var(--font)}
.nov-item-cta:hover{text-decoration:underline}
.nov-foot{padding:14px 22px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end}
@media (prefers-color-scheme: dark){
  .nov-chip.mejora{background:rgba(5,150,105,.15)}
  .nov-chip.arreglo{background:rgba(234,88,12,.15)}
}

/* Academia admin button */
.ac-admin-btn{position:absolute;bottom:20px;right:24px;display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:20px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.12);color:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:var(--font);transition:all .17s;backdrop-filter:blur(4px)}
.ac-admin-btn:hover{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.4)}
/* Academia skeleton */
.ac-skeleton{height:180px;border-radius:14px;background:linear-gradient(90deg,var(--bg-muted) 25%,var(--border) 50%,var(--bg-muted) 75%);background-size:200% 100%;animation:acSkeletonWave 1.4s ease-in-out infinite}
@keyframes acSkeletonWave{0%{background-position:200% 0}100%{background-position:-200% 0}}
/* Academia admin panel */
.ac-admin-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:2500;display:flex;align-items:stretch;justify-content:flex-end;opacity:0;pointer-events:none;transition:opacity .22s;backdrop-filter:blur(3px)}
.ac-admin-overlay.open{opacity:1;pointer-events:all}
.ac-admin-panel{width:100%;max-width:860px;background:var(--bg-subtle);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);box-shadow:-8px 0 40px rgba(0,0,0,.18)}
.ac-admin-overlay.open .ac-admin-panel{transform:translateX(0)}
.ac-admin-hdr{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;background:var(--bg);border-bottom:1px solid var(--border);flex-shrink:0}
.ac-admin-hdr-left{display:flex;align-items:center;gap:10px}
.ac-admin-hdr-title{font-size:15px;font-weight:700;color:var(--text)}
.ac-admin-hdr-sub{font-size:12px;color:var(--muted);margin-top:1px}
.ac-admin-close{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text-2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.ac-admin-close:hover{background:var(--bg-muted);color:var(--text)}
.ac-admin-body{display:flex;flex:1;overflow:hidden}
.ac-admin-list{width:280px;flex-shrink:0;border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.ac-admin-list-top{padding:12px;border-bottom:1px solid var(--border);flex-shrink:0}
.ac-admin-add-btn{width:100%;padding:9px 14px;border-radius:10px;border:1.5px dashed var(--border-h);background:transparent;color:var(--blue);font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font);transition:all .17s;display:flex;align-items:center;justify-content:center;gap:6px}
.ac-admin-add-btn:hover{background:var(--blue-lt);border-color:var(--blue)}
.ac-admin-list-scroll{flex:1;overflow-y:auto}
.ac-admin-cat-hdr{padding:10px 12px 4px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted2);background:var(--bg-subtle)}
.ac-admin-video-item{display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .12s}
.ac-admin-video-item:hover{background:var(--bg-subtle)}
.ac-admin-video-item.selected{background:var(--blue-lt)}
.ac-admin-video-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.ac-admin-video-name{font-size:12.5px;color:var(--text);line-height:1.35;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ac-admin-video-badge{font-size:9px;font-weight:700;padding:2px 6px;border-radius:10px;flex-shrink:0}
.ac-admin-orden{display:flex;flex-direction:column;gap:2px;flex-shrink:0;opacity:0;transition:opacity .12s}
.ac-admin-video-item:hover .ac-admin-orden,.ac-admin-video-item.selected .ac-admin-orden{opacity:1}
.ac-admin-mover{width:20px;height:15px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);background:var(--bg);border-radius:4px;color:var(--text-2);cursor:pointer;padding:0}
.ac-admin-mover:hover:not(:disabled){background:var(--blue-lt);color:var(--blue);border-color:var(--blue)}
.ac-admin-mover:disabled{opacity:.28;cursor:default}
.ac-admin-form-wrap{flex:1;overflow-y:auto;padding:24px}
.ac-admin-form-title{font-size:15px;font-weight:700;color:var(--text);margin-bottom:20px;display:flex;align-items:center;gap:8px}
.ac-admin-field{margin-bottom:16px}
.ac-admin-label{font-size:11.5px;font-weight:600;color:var(--text-2);margin-bottom:5px;display:block;text-transform:uppercase;letter-spacing:.04em}
.ac-admin-input{width:100%;padding:9px 12px;border-radius:9px;border:1.5px solid var(--border);background:var(--bg);color:var(--text);font-size:13px;font-family:var(--font);transition:border-color .15s;box-sizing:border-box}
.ac-admin-input:focus{outline:none;border-color:var(--blue)}
.ac-admin-input.textarea{min-height:72px;resize:vertical}
.ac-admin-select{width:100%;padding:9px 12px;border-radius:9px;border:1.5px solid var(--border);background:var(--bg);color:var(--text);font-size:13px;font-family:var(--font);cursor:pointer}
.ac-admin-select:focus{outline:none;border-color:var(--blue)}
.ac-admin-toggle-row{display:flex;align-items:center;gap:10px;padding:12px;border-radius:10px;border:1.5px solid var(--border);background:var(--bg-subtle);cursor:pointer;transition:all .15s}
.ac-admin-toggle-row:hover{border-color:var(--border-h)}
.ac-admin-toggle-row.on{border-color:#22c55e;background:#f0fdf4}
.ac-admin-toggle{width:36px;height:20px;border-radius:10px;background:var(--border-h);position:relative;transition:background .2s;flex-shrink:0}
.ac-admin-toggle.on{background:#22c55e}
.ac-admin-toggle::after{content:'';position:absolute;width:14px;height:14px;border-radius:50%;background:var(--bg);top:3px;left:3px;transition:transform .2s;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.ac-admin-toggle.on::after{transform:translateX(16px)}
.ac-admin-toggle-text{font-size:13px;font-weight:500;color:var(--text)}
.ac-admin-yt-preview{margin-top:6px;display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;background:#fef2f2;border:1px solid #fecaca;font-size:12px;color:#dc2626}
.ac-admin-yt-preview.ok{background:#f0fdf4;border-color:#86efac;color:#16a34a}
.ac-admin-actions{display:flex;gap:10px;margin-top:24px;padding-top:20px;border-top:1px solid var(--border)}
.ac-admin-save-btn{flex:1;padding:10px;border-radius:10px;border:none;background:var(--blue);color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font);transition:all .17s}
.ac-admin-save-btn:hover{background:#1527b8}
.ac-admin-save-btn:disabled{opacity:.5;cursor:default}
.ac-admin-del-btn{padding:10px 16px;border-radius:10px;border:1.5px solid #fecaca;background:#fff5f5;color:#dc2626;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font);transition:all .17s}
.ac-admin-del-btn:hover{background:#fee2e2;border-color:#f87171}
.ac-admin-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--muted);text-align:center;gap:12px;padding:40px}
.ac-admin-empty svg{opacity:.3}
.ac-admin-empty-text{font-size:14px;font-weight:500}
.ac-admin-empty-sub{font-size:12px;color:var(--muted2)}
@media(max-width:640px){
  .ac-admin-panel{max-width:100%}
  .ac-admin-body{flex-direction:column}
  .ac-admin-list{width:100%;max-height:220px;border-right:none;border-bottom:1px solid var(--border)}
}

@media(max-width:768px){
  .academia-hero{padding:24px 20px 22px}
  .academia-hero-title{font-size:22px}
  .academia-hero-stats{gap:16px}
  .academia-hero-stat-val{font-size:18px}
  .academia-cats-wrap{padding:0 16px}
  .academia-body{padding:20px 16px}
  .academia-grid{grid-template-columns:1fr 1fr;gap:12px}
  .academia-section-sub{padding-left:0;margin-top:4px}
}
@media(max-width:480px){
  .academia-grid{grid-template-columns:1fr}
}
/* ── MÓDULO LEADS / CRM ───────────────────────────────────────────────────── */
.crm-wrap{display:flex;flex-direction:column;height:100%;overflow:hidden}
.crm-toolbar{display:flex;align-items:center;gap:10px;padding:14px 20px 10px;flex-shrink:0;border-bottom:1px solid var(--border)}
/* ── Panel de filtros del CRM ────────────────────────────────────────────── */
.crm-d-cierre-input{border:1.5px solid var(--border);border-radius:8px;padding:4px 8px;font-family:var(--font);font-size:12.5px;background:var(--bg);color:var(--text);outline:none;max-width:150px}
.crm-d-cierre-input:focus{border-color:var(--blue)}
.crm-d-cierre-input.vencida{border-color:#DC2626;color:#DC2626;font-weight:600}
.crm-card-cierre{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;color:var(--muted);margin-top:6px}
.crm-card-tarea{display:flex;align-items:center;gap:4px;font-size:10.5px;color:var(--muted);margin-top:4px}
.crm-card-tarea.vencida{color:#DC2626;font-weight:600}
.crm-card-cierre.vencida{color:#DC2626;font-weight:600}
.crm-btn-filtros.active,#crm-btn-filtros.active{border-color:var(--blue);color:var(--blue)}
.pwa-barra{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;background:var(--bg);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:12px;padding:12px 14px;z-index:1500;transform:translateY(140%);transition:transform .3s var(--ease)}
.pwa-barra.visible{transform:translateY(0)}
.pwa-barra img{width:38px;height:38px;border-radius:9px;flex-shrink:0}
.pwa-txt{flex:1;display:flex;flex-direction:column;gap:1px;min-width:0}
.pwa-txt b{font-size:13.5px;font-weight:700}
.pwa-txt span{font-size:12px;color:var(--muted);line-height:1.4}
.pwa-x{background:none;border:0;color:var(--muted2);font-size:15px;cursor:pointer;padding:2px 4px;flex-shrink:0}
.pwa-x:hover{color:var(--text)}
@media(max-width:520px){.pwa-barra{flex-wrap:wrap}.pwa-txt{flex:1 1 100%;order:2}}
/* ── Páginas de aterrizaje ───────────────────────────────────────────────── */
.lp-lista{display:flex;flex-direction:column;gap:10px}
.lp-item{display:flex;align-items:center;gap:14px;background:var(--bg);border:1px solid var(--border);border-radius:13px;padding:14px 16px}
.lp-item-main{flex:1;min-width:0}
.lp-item-tit{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:700;margin-bottom:3px}
.lp-chip{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--bg-muted);color:var(--muted)}
.lp-chip-on{background:var(--success-bg);color:var(--success)}
.lp-item-url{font-size:12px;color:var(--blue);text-decoration:none;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lp-item-url:hover{text-decoration:underline}
.lp-item-num{text-align:center;flex-shrink:0;padding:0 10px}
.lp-item-num b{display:block;font-size:17px;font-weight:800}
.lp-item-num span{font-size:10.5px;color:var(--muted2)}
.lp-item-acc{display:flex;gap:6px;flex-shrink:0}
.lp-plantillas{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.lp-plantilla{background:var(--bg);border:1.5px solid var(--border);border-radius:14px;padding:12px;cursor:pointer;font-family:var(--font);text-align:left;transition:border-color .15s,transform .15s}
.lp-plantilla:hover{border-color:var(--blue);transform:translateY(-2px)}
.lp-plantilla-vp{height:96px;border-radius:9px;overflow:hidden;margin-bottom:10px}
.lp-plantilla-tit{font-size:13.5px;font-weight:700;color:var(--text);margin-bottom:3px}
.lp-plantilla-sub{font-size:11.5px;color:var(--muted);line-height:1.45}
.lp-mini{height:100%;padding:11px;display:flex;gap:8px}
.lp-mini span{display:block;height:6px;border-radius:3px}
.lp-mini .lp-mini-col{flex:1;display:flex;flex-direction:column;gap:6px;justify-content:center}
.lp-mini .lp-mini-col span:first-child{width:45%;height:9px}
.lp-mini .lp-mini-caja{width:38%;background:#fff;border-radius:6px;box-shadow:0 3px 10px rgba(0,0,0,.18)}
.lp-mini-captura{background:linear-gradient(160deg,#101433,#1E2BCC)}
.lp-mini-guia{background:#FAFAF9}
.lp-mini-cita{background:#0F766E;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.lp-mini-cita span{width:62%}
.lp-mini-cita span:first-child{height:9px}
.lp-mini-cita i{display:block;width:44%;height:14px;background:#fff;border-radius:5px;margin:3px 0}
.lp-mini-cita .lp-mini-row{display:flex;gap:5px;width:70%}
.lp-mini-cita .lp-mini-row span{flex:1;width:auto}
.lp-ed-overlay{position:fixed;inset:0;background:var(--bg);z-index:2000;display:flex;flex-direction:column}
.lp-ed-barra{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.lp-ed-tit{display:flex;flex-direction:column;gap:2px;min-width:0}
.lp-ed-tit input{border:0;background:none;font-family:var(--font);font-size:15px;font-weight:800;color:var(--text);outline:none;padding:2px 0;min-width:200px}
.lp-ed-tit input:focus{border-bottom:1.5px solid var(--blue)}
.lp-ed-url{font-size:11.5px;color:var(--muted)}
.lp-ed-url a{color:var(--blue);text-decoration:none}
.lp-ed-acc{display:flex;align-items:center;gap:7px;flex-shrink:0}
.lp-ed-estado{font-size:11.5px;color:var(--muted);min-width:74px;text-align:right}
.lp-ed-estado.sucio{color:var(--warning);font-weight:600}
.lp-ed-estado.ok{color:var(--success);font-weight:600}
.lp-ed-lienzo{flex:1;min-height:0;overflow:hidden}

/* ── Ajustes de la página ────────────────────────────────────────────────────
   Panel lateral sobre el editor (que vive en z-index 2000). Mismo gesto que el
   panel de filtros del pipeline: entra por la derecha y no tapa el lienzo del
   todo, para que se vea sobre qué se está decidiendo. */
.lp-aj-fondo{position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:2100;display:none}
.lp-aj-fondo.open{display:block}
.lp-aj{position:fixed;top:0;right:0;bottom:0;width:400px;max-width:100vw;background:var(--bg);
  border-left:1.5px solid var(--border);z-index:2101;display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .28s var(--ease);box-shadow:var(--shadow-lg)}
.lp-aj.open{transform:translateX(0)}
.lp-aj-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;
  padding:18px 20px 14px;border-bottom:1px solid var(--border);flex-shrink:0}
.lp-aj-head h3{font-size:var(--fs-md);font-weight:800;margin:0}
.lp-aj-head p{font-size:11.5px;color:var(--muted);margin:2px 0 0}
.lp-aj-body{flex:1;overflow-y:auto;padding:4px 20px 20px}
.lp-aj-grupo{padding:16px 0;border-bottom:1px solid var(--border)}
.lp-aj-grupo:last-child{border-bottom:0}
.lp-aj-tit{font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.lp-aj-pista{font-size:11.5px;color:var(--muted);line-height:1.55;margin:0 0 10px}
.lp-aj label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px}
.lp-aj input[type=text],.lp-aj input[type=url],.lp-aj textarea,.lp-aj select{width:100%;padding:9px 11px;
  border:1.5px solid var(--border);border-radius:var(--r);font-family:var(--font);font-size:13px;
  background:var(--bg-subtle);color:var(--text);outline:none}
.lp-aj input:focus,.lp-aj textarea:focus,.lp-aj select:focus{border-color:var(--blue)}
.lp-aj select{cursor:pointer;appearance:none;background-image:none}
.lp-aj textarea{resize:vertical;min-height:66px;line-height:1.5}
.lp-aj-url{display:flex;align-items:center;border:1.5px solid var(--border);border-radius:var(--r);
  background:var(--bg-subtle);overflow:hidden}
.lp-aj-url:focus-within{border-color:var(--blue)}
.lp-aj-url span{font-size:12px;color:var(--muted);padding:0 0 0 11px;white-space:nowrap}
.lp-aj-url input{border:0;background:none;border-radius:0;padding-left:2px}
.lp-aj-contador{font-size:10.5px;color:var(--muted2);text-align:right;margin-top:3px}
.lp-aj-campo{margin-bottom:12px}
.lp-aj-campo:last-child{margin-bottom:0}
.lp-aj-op{display:flex;gap:8px;margin-bottom:10px}
.lp-aj-op button{flex:1;background:var(--bg-subtle);border:1.5px solid var(--border);color:var(--text);
  font-family:var(--font);font-size:12.5px;padding:9px 8px;border-radius:var(--r);cursor:pointer}
.lp-aj-op button.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.lp-aj-pie{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--border);flex-shrink:0}
/* Cómo se verá al compartirlo. Se enseña porque es lo que de verdad decide si
   alguien abre el enlace, y hasta ahora no se veía en ningún sitio. */
.lp-aj-previo{border:1px solid var(--border);border-radius:var(--r);overflow:hidden;background:var(--bg-subtle)}
.lp-aj-previo-img{height:112px;background:var(--bg-muted) center/cover no-repeat;display:flex;
  align-items:center;justify-content:center;color:var(--muted2);font-size:11px}

/* ── Piel de Acuarius para el constructor ───────────────────────────────────
   GrapesJS trae su propia piel: gris oscuro con acentos morados. Dentro de la
   aplicación parece software de otra empresa, y quien lo abre siente que salió
   de Acuarius. Aquí se le pone nuestra línea gráfica.

   La 0.23 está hecha con variables, así que casi todo es remapearlas. Lo que
   no basta son las reglas que dan por hecho un panel OSCURO: blancos
   translúcidos que sobre fondo claro desaparecen y bordes negros que sobre
   fondo claro son un tajo. Esas hay que rehacerlas a mano — están abajo,
   agrupadas y con su porqué.

   Vale para los dos constructores: páginas (#lp-gjs) y correos (#gjs). */
#lp-gjs, #gjs{
  --gjs-main-font:var(--font);
  --gjs-font-size:12px;
  --gjs-primary-color:var(--bg);            /* fondo de los paneles */
  --gjs-secondary-color:var(--text-2);      /* texto de los paneles */
  --gjs-tertiary-color:var(--blue);         /* acento: fondo (etiquetas de clase) */
  --gjs-quaternary-color:var(--blue);       /* acento: icono activo */
  --gjs-font-color:var(--text-2);
  --gjs-font-color-active:var(--text);
  --gjs-main-color:var(--bg-subtle);
  --gjs-main-dark-color:var(--bg-muted);    /* fondo de los campos */
  --gjs-secondary-dark-color:var(--bg-subtle);
  --gjs-main-light-color:var(--blue-lt);    /* capa seleccionada */
  --gjs-secondary-light-color:var(--text-2);
  --gjs-soft-light-color:var(--bg-subtle);  /* capa bajo el cursor */
  --gjs-light-border:var(--border);
  --gjs-arrow-color:var(--text-3);
  --gjs-dark-text-shadow:transparent;       /* sombra de texto: sobre claro embarra */
  --gjs-color-highlight:var(--blue-mid);
  --gjs-color-blue:var(--blue);
  --gjs-color-red:var(--danger);
  --gjs-color-green:var(--success);
  --gjs-color-yellow:var(--warning);
  --gjs-color-warn:var(--warning);
  --gjs-left-width:252px;
  --gjs-input-padding:7px;
  --gjs-canvas-top:44px;
  background:var(--bg);
}
#lp-gjs .gjs-editor, #gjs .gjs-editor{font-family:var(--font)}

/* Barra superior (dispositivos, deshacer, ver código) */
#lp-gjs .gjs-pn-commands, #gjs .gjs-pn-commands{
  border-bottom:1px solid var(--border);background:var(--bg-subtle);
  height:44px;display:flex;align-items:center;padding:0 10px}
#lp-gjs .gjs-pn-options, #gjs .gjs-pn-options{padding:0}
#lp-gjs .gjs-pn-btn, #gjs .gjs-pn-btn{
  border-radius:var(--r);color:var(--text-2);font-size:16px;
  min-height:30px;min-width:32px;transition:background var(--dur-fast),color var(--dur-fast)}
#lp-gjs .gjs-pn-btn:hover, #gjs .gjs-pn-btn:hover{background:var(--bg-muted);color:var(--text)}
#lp-gjs .gjs-pn-btn.gjs-pn-active, #gjs .gjs-pn-btn.gjs-pn-active{
  background:var(--blue-lt);color:var(--blue);box-shadow:none}

/* Pestañas del panel derecho */
#lp-gjs .gjs-pn-views, #gjs .gjs-pn-views{
  border-bottom:1px solid var(--border);background:var(--bg-subtle);
  display:flex;align-items:center;justify-content:space-around;padding:6px}
#lp-gjs .gjs-pn-views-container, #gjs .gjs-pn-views-container{
  box-shadow:none;border-left:1px solid var(--border);background:var(--bg)}

/* Títulos de sección (bloques, estilos, ajustes, capas).
   El original los deja en «lighter» con 1px de espaciado sobre gris: pesa poco
   y se lee peor. Aquí van como el resto de títulos de la aplicación. */
#lp-gjs .gjs-category-title, #gjs .gjs-category-title,
#lp-gjs .gjs-sm-sector-title, #gjs .gjs-sm-sector-title,
#lp-gjs .gjs-block-category .gjs-title, #gjs .gjs-block-category .gjs-title,
#lp-gjs .gjs-trait-category .gjs-title, #gjs .gjs-trait-category .gjs-title{
  font-weight:700;letter-spacing:.3px;font-size:11px;text-transform:uppercase;
  color:var(--muted);background:var(--bg-subtle);
  border-bottom:1px solid var(--border);padding:10px 12px}
#lp-gjs .gjs-category-open, #gjs .gjs-category-open,
#lp-gjs .gjs-block-category.gjs-open, #gjs .gjs-block-category.gjs-open,
#lp-gjs .gjs-sm-sector.gjs-sm-open, #gjs .gjs-sm-sector.gjs-sm-open,
#lp-gjs .gjs-trait-category.gjs-open, #gjs .gjs-trait-category.gjs-open{
  border-bottom:1px solid var(--border)}

/* Bloques que se arrastran al lienzo: tarjetas, como las del resto de la app */
#lp-gjs .gjs-blocks-c, #gjs .gjs-blocks-c{gap:8px;padding:10px}
#lp-gjs .gjs-block, #gjs .gjs-block{
  /* El margen de origen es un 2,5% a los lados y con él solo cabe un bloque
     por fila en un panel de 250px. La separación la da el gap del contenedor. */
  width:calc(50% - 4px);min-height:76px;padding:12px 8px;margin:0;
  background:var(--bg);border:1.5px solid var(--border);border-radius:var(--r);
  color:var(--text-2);box-shadow:none;
  transition:border-color var(--dur-fast),background var(--dur-fast),transform var(--dur-fast)}
#lp-gjs .gjs-block:hover, #gjs .gjs-block:hover{
  border-color:var(--blue);background:var(--blue-lt);color:var(--blue);
  box-shadow:var(--shadow-sm);transform:translateY(-1px)}
#lp-gjs .gjs-block-label, #gjs .gjs-block-label{
  font-family:var(--font);font-size:11.5px;font-weight:600}
#lp-gjs .gjs-block__media, #gjs .gjs-block__media{margin-bottom:7px;opacity:.75}

/* Campos. En origen son cajas oscuras sin borde; aquí, como nuestros inputs. */
#lp-gjs .gjs-field, #gjs .gjs-field{
  background:var(--bg);border:1.5px solid var(--border);border-radius:8px}
#lp-gjs .gjs-field:focus-within, #gjs .gjs-field:focus-within{border-color:var(--blue)}
#lp-gjs .gjs-field input, #gjs .gjs-field input,
#lp-gjs .gjs-field select, #gjs .gjs-field select,
#lp-gjs .gjs-field textarea, #gjs .gjs-field textarea{
  font-family:var(--font);color:var(--text)}
#lp-gjs .gjs-sm-label, #gjs .gjs-sm-label,
#lp-gjs .gjs-label, #gjs .gjs-label{font-weight:600;color:var(--muted)}

/* Etiquetas de clase: fondo azul, así que el texto va en blanco */
#lp-gjs .gjs-clm-tag, #gjs .gjs-clm-tag{color:#fff;font-weight:600;padding:5px 7px}
#lp-gjs #gjs-clm-add-tag, #gjs #gjs-clm-add-tag,
#lp-gjs .gjs-clm-tags-btn, #gjs .gjs-clm-tags-btn{
  background:var(--bg-muted);border:1px solid var(--border);color:var(--text-2);border-radius:6px}
/* Estos dos venían en blanco translúcido: sobre panel claro, invisibles */
#lp-gjs #gjs-clm-close, #gjs #gjs-clm-close,
#lp-gjs #gjs-clm-checkbox, #gjs #gjs-clm-checkbox{color:var(--text-2)}
#lp-gjs .gjs-field-checkbox input:checked + .gjs-chk-icon,
#gjs .gjs-field-checkbox input:checked + .gjs-chk-icon{border-color:var(--blue)}

/* Capas */
#lp-gjs .gjs-layer-item, #gjs .gjs-layer-item{border-bottom:1px solid var(--border2)}
#lp-gjs .gjs-layer, #gjs .gjs-layer{font-weight:500}

/* El lienzo. Fondo gris para que la página se lea como una hoja aparte. */
#lp-gjs .gjs-cv-canvas, #gjs .gjs-cv-canvas{background:var(--bg-muted)}
#lp-gjs .gjs-cv-canvas-bg, #gjs .gjs-cv-canvas-bg{background:transparent}
#lp-gjs .gjs-frame-wrapper, #gjs .gjs-frame-wrapper{padding:0}
#lp-gjs .gjs-frame, #gjs .gjs-frame{
  box-shadow:var(--shadow-md);background:#fff}

/* Barras de desplazamiento de los paneles */
#lp-gjs .gjs-editor-cont ::-webkit-scrollbar-track,
#gjs .gjs-editor-cont ::-webkit-scrollbar-track{background:transparent}
#lp-gjs .gjs-editor-cont ::-webkit-scrollbar-thumb,
#gjs .gjs-editor-cont ::-webkit-scrollbar-thumb{background:var(--border-h);border-radius:4px}

/* Ventanas del editor (código, ajustes) */
#lp-gjs .gjs-mdl-dialog, #gjs .gjs-mdl-dialog,
.gjs-mdl-dialog{border-radius:var(--rlg);box-shadow:var(--shadow-lg)}

/* En oscuro, las variables cambian solas con los tokens; lo único propio es
   que el lienzo no puede ser gris claro y la hoja sigue siendo blanca. */
[data-theme="dark"] #lp-gjs .gjs-cv-canvas,
[data-theme="dark"] #gjs .gjs-cv-canvas{background:#080A14}
[data-theme="dark"] #lp-gjs .gjs-block:hover,
[data-theme="dark"] #gjs .gjs-block:hover{color:var(--text)}
@media(max-width:760px){
  .lp-plantillas{grid-template-columns:1fr}
  .lp-item{flex-wrap:wrap}
  .lp-item-acc{width:100%;justify-content:flex-end}
}
.crm-filtros-badge{background:var(--blue);color:#fff;font-size:10px;font-weight:700;min-width:16px;height:16px;padding:0 4px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;margin-left:2px}
.crm-filtros-overlay{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:1200;display:none}
.crm-filtros-overlay.open{display:block}
.crm-filtros-panel{position:fixed;top:0;right:0;bottom:0;width:340px;max-width:92vw;background:var(--bg);border-left:1.5px solid var(--border);z-index:1201;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .28s ease;box-shadow:var(--shadow-lg);overflow:hidden}
.crm-filtros-panel.open{transform:translateX(0)}
.crm-filtros-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:18px 20px 14px;border-bottom:1px solid var(--border)}
.crm-filtros-titulo{font-size:var(--fs-md);font-weight:800}
.crm-filtros-sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.crm-filtros-body{flex:1;overflow-y:auto;padding:4px 20px 20px}
.crm-filtro-grupo{padding:16px 0;border-bottom:1px solid var(--border)}
.crm-filtro-grupo:last-child{border-bottom:0}
.crm-filtro-tit{font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.crm-filtro-atajos{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.crm-filtro-atajo{background:var(--bg-subtle);border:1px solid var(--border);color:var(--text);font-family:var(--font);font-size:12px;padding:5px 10px;border-radius:999px;cursor:pointer}
.crm-filtro-atajo:hover{border-color:var(--blue)}
.crm-filtro-atajo.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.crm-filtro-rango{display:flex;gap:8px}
.crm-filtro-rango label{flex:1;display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--muted)}
.crm-filtro-rango input{width:100%;padding:7px 9px;border:1.5px solid var(--border);border-radius:var(--r);font-family:var(--font);font-size:12.5px;background:var(--bg-subtle);color:var(--text);outline:none;box-sizing:border-box}
.crm-filtro-rango input:focus{border-color:var(--blue)}
.crm-filtros-panel .crm-quick-filters,.crm-filtros-panel .crm-tag-filter{display:flex;flex-wrap:wrap;gap:6px}
.crm-filtros-panel .dd-btn{width:100%;justify-content:space-between}
.crm-filtros-pie{display:flex;gap:8px;justify-content:space-between;align-items:center;padding:14px 20px;border-top:1px solid var(--border)}
@media(max-width:600px){.crm-filtros-panel{width:100%}}
.crm-title{font-size:18px;font-weight:700;letter-spacing:-.3px;flex:1}
.crm-btn-add{display:flex;align-items:center;gap:6px;padding:8px 14px;background:var(--blue);color:#fff;border:none;border-radius:var(--r);font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font);transition:background .15s;flex-shrink:0}
.crm-btn-add:hover{background:var(--blue-h)}
.crm-btn-add svg{flex-shrink:0}
.crm-view-toggle{display:flex;gap:2px;padding:3px;background:var(--sidebar2);border-radius:10px;border:1.5px solid var(--border);flex-shrink:0}
.crm-view-btn{padding:5px 12px;background:none;border:none;border-radius:7px;cursor:pointer;font-size:12px;font-weight:600;color:var(--muted);font-family:var(--font);transition:all .15s;display:flex;align-items:center;gap:5px;white-space:nowrap}
.crm-view-btn.active{background:var(--bg);color:var(--blue);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.crm-view-btn:not(.active):hover{color:var(--text)}
.pipe-selector{display:flex;align-items:center;gap:6px;flex-shrink:0}
.pipe-selector select{font-family:inherit;font-size:12px;font-weight:600;color:var(--text);background:var(--sidebar);border:1px solid var(--border);border-radius:20px;padding:5px 26px 5px 12px;cursor:pointer;max-width:190px;appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 24 24' fill='none' stroke='%238C90A8' stroke-width='3' stroke-linecap='round'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 9px center}
.pipe-selector select:hover{border-color:var(--blue)}
/* Mismo aspecto de píldora que tenía el select, pero abriendo el desplegable
   propio en vez de la lista del sistema operativo. */
.pipe-btn{display:inline-flex;align-items:center;gap:7px;font-family:inherit;font-size:12px;font-weight:600;color:var(--text);background:var(--sidebar);border:1px solid var(--border);border-radius:20px;padding:5px 12px;cursor:pointer;max-width:190px;transition:all .15s var(--ease)}
.pipe-btn:hover{border-color:var(--blue)}
.pipe-btn svg{flex-shrink:0;opacity:.5}
.pipe-admin{display:flex;align-items:center;justify-content:center;width:28px;height:28px;border:1px solid var(--border);background:var(--sidebar);color:var(--muted);border-radius:50%;cursor:pointer;flex-shrink:0;transition:.15s}
.pipe-admin:hover{border-color:var(--blue);color:var(--blue)}
.pipe-fila{display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid var(--border);border-radius:12px;margin-bottom:8px;background:var(--bg-subtle)}
.pipe-fila.act{border-color:var(--blue-md);background:var(--blue-lt)}
.pipe-fila input{flex:1;min-width:0;font-family:inherit;font-size:var(--fs-base);font-weight:600;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 11px}
.pipe-fila input:focus{outline:none;border-color:var(--blue-md)}
.pipe-fila .pipe-marca{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);background:var(--bg);border:1px solid var(--blue-md);border-radius:20px;padding:4px 9px;white-space:nowrap;flex-shrink:0}
.pipe-borrar{display:flex;align-items:center;justify-content:center;width:30px;height:30px;flex-shrink:0;border:1px solid var(--border);background:var(--bg);color:var(--muted);border-radius:9px;cursor:pointer;transition:.15s}

/* Motivos de cierre — el renombrado es en línea: un lápiz que abre otro modal
   para cambiar cuatro palabras sobra. */
.mot-fila{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.mot-input{flex:1;min-width:0;border:1px solid transparent;background:transparent;border-radius:7px;padding:6px 8px;font-size:12.5px;font-family:var(--font);color:var(--text);transition:all .14s}
.mot-input:hover{background:var(--bg-subtle)}
.mot-input:focus{outline:none;background:var(--bg);border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-lt)}
.mot-borrar{display:flex;align-items:center;justify-content:center;width:26px;height:26px;flex-shrink:0;border:none;background:transparent;color:var(--muted2);border-radius:7px;cursor:pointer;opacity:0;transition:.14s}
.mot-fila:hover .mot-borrar{opacity:1}
.mot-borrar:hover{background:#FEE2E2;color:#DC2626}
/* En la ficha del lead y en la lista de chatbots la papelera vive dentro de una
   fila que ya tiene su propio hover: se muestra al pasar por esa fila. */
.crm-activity-item .mot-borrar{align-self:flex-start;margin-left:auto}
.crm-activity-item:hover .mot-borrar{opacity:1}
.crm-agent-card .mot-borrar{flex-shrink:0}
.crm-agent-card:hover .mot-borrar{opacity:1}
.pipe-borrar:hover{border-color:#FCA5A5;color:#EF4444}
.pipe-nuevo{display:flex;align-items:center;gap:8px;margin-top:14px;padding-top:14px;border-top:1px dashed var(--border)}
.pipe-nuevo input{flex:1;min-width:0;font-family:inherit;font-size:var(--fs-base);color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 11px}
.pipe-nuevo input:focus{outline:none;border-color:var(--blue-md)}
.pipe-nuevo input:disabled{opacity:.55;cursor:not-allowed}

/* Gestor de procesos: lista a la izquierda, edición del elegido a la derecha */
.pipe-gestor{display:flex;min-height:0;flex:1}
.pipe-lat{width:210px;flex-shrink:0;border-right:1px solid var(--border);display:flex;flex-direction:column;background:var(--bg-subtle);border-bottom-left-radius:18px}
.pipe-lat-top{padding:14px 14px 10px}
.pipe-lat-lista{flex:1;overflow-y:auto;padding:0 8px 12px}
.pipe-lat-item{display:flex;align-items:center;gap:7px;width:100%;text-align:left;padding:9px 10px;border:1px solid transparent;border-radius:9px;background:none;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;color:var(--text);margin-bottom:2px;transition:.12s}
.pipe-lat-item:hover{background:var(--bg)}
.pipe-lat-item.act{background:var(--bg);border-color:var(--blue-md);color:var(--blue)}
.pipe-lat-item span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pipe-lat-item .pipe-punto{width:6px;height:6px;border-radius:50%;background:var(--blue);flex-shrink:0}
.pipe-lat-cta{font-size:11px;color:var(--muted);padding:0 14px 12px}
.pipe-panel{flex:1;min-width:0;overflow-y:auto;padding:18px 22px}
.pipe-panel-top{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.pipe-panel-top .btn-sec{flex-shrink:0}
.pipe-def{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--text);cursor:pointer;user-select:none}
.pipe-def input{width:15px;height:15px;accent-color:var(--blue);cursor:pointer}
.pipe-def.fija{opacity:.55;cursor:default}
.pipe-sec-tit{font-size:10.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:18px 0 9px;display:flex;align-items:center;justify-content:space-between;gap:10px}
/* En pantallas estrechas los dos paneles no caben lado a lado: la lista pasa
   arriba en horizontal y la edición se queda con todo el ancho. */
@media (max-width:700px){
  .pipe-gestor{flex-direction:column}
  .pipe-lat{width:auto;border-right:none;border-bottom:1px solid var(--border);border-radius:0;flex-shrink:0}
  .pipe-lat-top{padding:12px 12px 8px}
  .pipe-lat-lista{display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;padding:0 12px 10px}
  .pipe-lat-item{width:auto;flex-shrink:0;margin-bottom:0;border-color:var(--border)}
  .pipe-lat-item span{overflow:visible;max-width:150px;text-overflow:ellipsis}
  .pipe-lat-cta{padding:0 12px 10px}
  .pipe-panel{padding:16px 14px}
  /* La fila de etapa tiene 6 controles: en estrecho el nombre se quedaba sin
     ancho. Pasa a ocupar su propia línea, arriba, y el resto debajo. */
  .pipe-fila-etapa{flex-wrap:wrap}
  .pipe-fila-etapa > input.auto-input{flex:1 0 100% !important;order:-1}
}
.pipe-fila-etapa > input.auto-input{min-width:120px}
