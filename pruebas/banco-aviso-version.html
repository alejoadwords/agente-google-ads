.can-tab:hover{color:var(--text)}
.can-tab.act{color:var(--blue);border-bottom-color:var(--blue)}
.can-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.can-card{border:1px solid var(--border);border-radius:13px;padding:14px;background:var(--bg-subtle);display:flex;flex-direction:column;gap:9px}
.can-card-top{display:flex;align-items:center;gap:8px}
.can-card-nombre{font-size:14px;font-weight:800;flex:1;min-width:0}
.can-card-desc{font-size:12px;color:var(--muted);line-height:1.5;flex:1}
.can-punto{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.can-chip{font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--blue);background:var(--blue-lt);border-radius:20px;padding:3px 8px;white-space:nowrap}
.can-fila{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:12px;margin-bottom:8px;background:var(--bg-subtle)}
.can-fila-nombre{font-size:13.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.can-fila-sub{font-size:11.5px;color:var(--muted);margin-top:1px}
.can-select{font-family:inherit;font-size:12px;font-weight:600;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:6px 9px;cursor:pointer;max-width:180px;flex-shrink:0}
.can-select:hover{border-color:var(--blue)}
@media (max-width:700px){
  .can-grid{grid-template-columns:1fr}
  .can-fila{flex-wrap:wrap}
  .can-select{max-width:none;flex:1 0 100%;order:1}
}
.crm-card-ajeno{opacity:.72;cursor:pointer}
.crm-card-ajeno:hover{opacity:.9}
.crm-link-btn{background:none;border:none;padding:0;font-family:inherit;font-size:11px;font-weight:700;color:var(--blue);cursor:pointer;text-transform:none;letter-spacing:0}
.crm-link-btn:hover{text-decoration:underline}
.fuente-fila{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--border);border-radius:10px;margin-bottom:7px;background:var(--bg-subtle);font-size:13px}
.fuente-fila span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.fuente-fija{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted2);white-space:nowrap}
.pipe-ambito{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--bg-subtle);border:1px solid var(--border);border-radius:20px;padding:5px 11px;white-space:nowrap;margin-right:10px}
@media (max-width:700px){.pipe-ambito{display:none}}
.crm-client-tag{display:flex;align-items:center;gap:6px;padding:5px 10px;background:var(--sidebar);border:1px solid var(--border);border-radius:20px;font-size:11px;font-weight:600;color:var(--muted);flex-shrink:0}
.crm-client-tag span{color:var(--text)}

/* Kanban */
.crm-kanban{display:flex;gap:14px;padding:16px 20px;overflow-x:auto;flex:1;align-items:flex-start;background:var(--sidebar)}
.crm-kanban::-webkit-scrollbar{height:5px}
.crm-kanban::-webkit-scrollbar-track{background:transparent}
.crm-kanban::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.crm-col{flex:0 0 272px;display:flex;flex-direction:column;max-height:calc(100vh - 156px)}
.crm-col-head{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-bottom:none;border-radius:10px 10px 0 0;flex-shrink:0;border-left-width:4px}
.crm-col-label{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--text);flex:1;text-transform:uppercase}
.crm-col-count{font-size:10px;font-weight:700;background:var(--sidebar2);color:var(--muted);padding:2px 7px;border-radius:10px}
.crm-col-value{font-size:11px;color:#10B981;font-weight:700}
.crm-col-body{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:8px;min-height:80px;background:var(--bg);border:1px solid var(--border);border-top:none;border-radius:0 0 10px 10px}
.crm-col-body::-webkit-scrollbar{width:3px}
.crm-col-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
/* Con muchos leads la columna se recorta a 3 fichas: la barra tiene que verse
   o parece que ahi no hay nada mas. */
.crm-col-body.tiene-mas::-webkit-scrollbar{width:6px}
.crm-col-body.tiene-mas::-webkit-scrollbar-thumb{background:var(--muted2);border-radius:3px}
/* El pie con "Agregar" cierra la columna, asi que el cuerpo pierde su curva. */
.crm-col-body.con-pie{border-radius:0}
.crm-col-foot{flex-shrink:0;padding:8px;background:var(--bg);border:1px solid var(--border);border-top:none;border-radius:0 0 10px 10px}
.crm-col-body.drag-over{background:var(--blue-lt);border-color:var(--blue)}
/* flex-shrink:0 no es opcional: sin el, con 18 leads en una columna las fichas
   se aplastan hasta cortar los nombres en vez de dejar que la columna scrollee. */
.crm-card{background:var(--bg);border:1px solid var(--border);border-left-width:3px;border-radius:8px;cursor:pointer;transition:box-shadow .15s,transform .15s,border-color .15s;position:relative;overflow:hidden;flex-shrink:0}
.crm-card:hover{box-shadow:0 4px 18px rgba(0,0,0,.1);transform:translateY(-1px);border-color:rgba(0,0,0,.12)}
.crm-card.dragging{opacity:.5;transform:rotate(1.5deg)}
.crm-card-inner{padding:11px 12px 9px}
.crm-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:5px}
.crm-card-avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0;letter-spacing:-.2px}
.crm-card-name{font-size:13px;font-weight:700;color:var(--text);line-height:1.3;flex:1}
.crm-card-company{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px;margin-bottom:3px}
.crm-card-phone{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px;margin-bottom:7px}
.crm-card-footer{display:flex;align-items:center;justify-content:space-between;gap:6px}
.crm-card-source{font-size:10px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--sidebar2);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.crm-card-value{font-size:12px;font-weight:700;color:#10B981}
.crm-card-badges{display:flex;flex-direction:column;gap:3px;margin-top:6px}
/* Las acciones estaban con opacity:0 pero ocupando su espacio: cada tarjeta
   mostraba una franja vacía con una línea encima, que es justo lo que parece
   una tarjeta cortada. Y en pantalla táctil, donde no existe el hover, eran
   inalcanzables. Ahora se ven siempre, discretas, y se realzan al pasar. */
.crm-card-actions{display:flex;align-items:center;gap:5px;padding:7px 10px 8px;border-top:1px solid var(--border);opacity:.62;transition:opacity .15s}
.crm-card:hover .crm-card-actions{opacity:1}
.crm-card-act-btn{display:flex;align-items:center;gap:4px;padding:4px 8px;border-radius:6px;border:1px solid var(--border);background:none;font-size:10px;font-weight:600;color:var(--muted);cursor:pointer;font-family:var(--font);transition:all .12s;flex:1;justify-content:center}
.crm-card-act-btn:hover{background:var(--sidebar2);color:var(--text)}
.crm-card-act-btn.wa-btn:hover{background:#DCFCE7;color:#16A34A;border-color:#86EFAC}
.crm-card-act-btn.em-btn:hover{background:#EFF6FF;color:#2563EB;border-color:#BFDBFE}
/* Nota de dirección en la ficha. Se pinta oculta y la revela crmRevelarNotas()
   solo para el dueño y los administradores. */
.crm-card-actions.solo-nota{display:none}
.crm-card-actions.solo-nota .crm-nota-btn{margin-left:auto}
/* El compacto es SOLO el de la tarjeta del tablero: ahí va sin etiqueta. El de
   la ficha lleva texto y con estas medidas se aplastaría a 30px. */
.crm-card-act-btn.crm-nota-btn{position:relative;flex:0 0 30px;padding:4px 0}
.crm-nota-btn{position:relative}
.crm-nota-btn:hover{color:var(--blue);border-color:var(--blue);background:var(--blue-lt)}
/* Dentro del botón, no asomando: la ficha tiene overflow:hidden y un punto
   colgado del borde se recorta justo en la columna del extremo. */
.crm-nota-punto{position:absolute;top:2px;right:2px;width:6px;height:6px;border-radius:50%;background:var(--blue)}
.crm-add-card{display:flex;align-items:center;justify-content:center;gap:6px;padding:8px;border:1.5px dashed var(--border);border-radius:8px;cursor:pointer;font-size:12px;color:var(--muted);transition:all .15s;background:none;font-family:var(--font);width:100%}
.crm-add-card:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-lt)}

/* Vista lista */
.crm-list{flex:1;overflow-y:auto;padding:0 20px 20px}
.crm-list-table{width:100%;border-collapse:collapse}
.crm-list-table th{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:10px 12px;text-align:left;border-bottom:1.5px solid var(--border);position:sticky;top:0;background:var(--bg)}
/* Conmutador Tablero/Lista */
.crm-vista-sw{display:inline-flex;gap:2px;padding:2px;background:var(--bg-subtle);border:1px solid var(--border);border-radius:9px;flex-shrink:0}
.crm-vista-btn{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border:0;background:transparent;border-radius:7px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;font-family:inherit;transition:all .12s var(--ease)}
.crm-vista-btn:hover{color:var(--text)}
.crm-vista-btn.activa{background:var(--bg);color:var(--text);box-shadow:var(--shadow-sm)}
/* Cabecera de la lista: ordenar y elegir columnas */
.crm-list-tools{display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:4px 0 10px}
.crm-list-table th.ord{cursor:pointer;user-select:none}
.crm-list-table th.ord:hover{color:var(--text)}
.crm-list-table th .ord-flecha{opacity:.55;margin-left:4px}
.crm-cols-vacia{margin-left:auto;font-size:10.5px;color:var(--muted2);font-weight:500;text-transform:none;letter-spacing:0}
.crm-list-table td{padding:10px 12px;border-bottom:1px solid var(--border);font-size:13px;color:var(--text);cursor:pointer;transition:background .1s}
.crm-list-table tr:hover td{background:var(--sidebar)}
.crm-stage-pill{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600}

/* Empty state */
.crm-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:300px;gap:12px;color:var(--muted);text-align:center;padding:20px}
.crm-empty-icon{width:56px;height:56px;border-radius:16px;background:var(--sidebar);display:flex;align-items:center;justify-content:center}

/* Modal CRM */
.crm-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px}
.crm-modal-overlay.open{display:flex}
.crm-modal-box{background:var(--bg);border:1.5px solid var(--border);border-radius:16px;width:100%;max-width:460px;box-shadow:0 24px 64px rgba(0,0,0,.2);overflow:hidden}
.crm-modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border)}
.crm-modal-title{font-size:15px;font-weight:700;letter-spacing:-.2px}
.crm-modal-close{width:28px;height:28px;border-radius:8px;background:var(--sidebar);border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:var(--font)}
.crm-modal-close:hover{background:var(--sidebar2)}
.crm-modal-body{padding:20px;display:flex;flex-direction:column;gap:14px;max-height:70vh;overflow-y:auto}
.crm-field{display:flex;flex-direction:column;gap:5px}
.crm-field label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.crm-field input,.crm-field select,.crm-field textarea{padding:9px 12px;border:1.5px solid var(--border);border-radius:var(--r);font-size:13px;background:var(--bg);color:var(--text);font-family:var(--font);transition:border-color .15s;outline:none}
.crm-field input:focus,.crm-field select:focus,.crm-field textarea:focus{border-color:var(--blue)}
.crm-field textarea{resize:vertical;min-height:72px}
.crm-field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.crm-modal-foot{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--border)}
.crm-btn-cancel{flex:1;padding:9px;border:1.5px solid var(--border);border-radius:var(--r);background:none;color:var(--text);font-size:13px;font-weight:500;cursor:pointer;font-family:var(--font)}
.crm-btn-cancel:hover{background:var(--sidebar)}
.crm-btn-save{flex:2;padding:9px;background:var(--blue);color:#fff;border:none;border-radius:var(--r);font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font)}
.crm-btn-save:hover{background:var(--blue-h)}
.crm-btn-save:disabled{opacity:.5;cursor:not-allowed}

/* Panel de detalle lateral */
.crm-detail-overlay{position:fixed;inset:0;background:rgba(0,0,0,.15);z-index:500;display:none}
.crm-detail-overlay.open{display:block}
.crm-detail-panel{position:fixed;top:0;right:0;width:380px;max-width:95vw;height:100vh;background:var(--bg);border-left:1.5px solid var(--border);z-index:501;transform:translateX(100%);transition:transform .28s ease;display:flex;flex-direction:column;overflow:hidden}
.crm-detail-panel.open{transform:translateX(0)}
.crm-detail-head{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);flex-shrink:0}
.crm-detail-avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;flex-shrink:0}
.crm-detail-head-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.crm-detail-name{font-size:15px;font-weight:700;letter-spacing:-.2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crm-detail-quick-actions{display:flex;gap:5px;flex-wrap:wrap}
.crm-qa-btn{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:6px;border:1px solid var(--border);background:var(--bg);font-size:11px;font-weight:600;color:var(--muted);text-decoration:none;transition:all .12s;cursor:pointer;font-family:var(--font)}
.crm-qa-btn:hover{background:var(--sidebar2);color:var(--text)}
.crm-qa-btn.wa:hover{background:#DCFCE7;color:#16A34A;border-color:#86EFAC}
.crm-qa-btn.em:hover{background:#EFF6FF;color:#2563EB;border-color:#BFDBFE}
.crm-detail-close{width:28px;height:28px;border-radius:8px;background:var(--sidebar);border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;align-self:flex-start}
.crm-detail-close:hover{background:var(--sidebar2)}
.crm-detail-body{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:16px}
.crm-detail-body::-webkit-scrollbar{width:3px}
.crm-detail-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.crm-detail-section{display:flex;flex-direction:column;gap:8px}
.crm-detail-section-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted2)}
.crm-detail-row{display:flex;gap:8px;font-size:13px}
.crm-detail-row-label{font-weight:600;color:var(--muted);width:80px;flex-shrink:0}
.crm-detail-row-val{color:var(--text);flex:1;word-break:break-word}
.crm-d-proceso{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text)}
.crm-d-proceso .nom{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crm-d-proceso button{background:none;border:none;cursor:pointer;font-family:var(--font);font-size:12px;
  font-weight:700;color:var(--blue);padding:2px 4px;border-radius:6px;flex-shrink:0}
.crm-d-proceso button:hover{background:var(--blue-lt)}
.crm-detail-stage-select{width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:var(--r);font-size:13px;background:var(--bg);color:var(--text);font-family:var(--font);cursor:pointer;outline:none}
.crm-detail-stage-select:focus{border-color:var(--blue)}
/* Tareas pendientes dentro de la ficha del lead. La casilla es grande a
   propósito: se toca desde el celular, con una mano, después de colgar. */
.crm-d-tarea{display:flex;align-items:flex-start;gap:10px;padding:9px 11px;border:1px solid var(--border);
  border-radius:var(--r);margin-bottom:7px;background:var(--bg-subtle)}
.crm-d-tarea:last-child{margin-bottom:0}
.crm-d-tarea.vencida{border-color:var(--danger);background:var(--danger-bg)}
/* Hecha: se queda a la vista, apagada. Es lo que permite darse cuenta de que
   se marcó por error y destildarla. */
.crm-d-tarea.hecha{opacity:.55;background:var(--bg)}
.crm-d-tarea.hecha .crm-d-tarea-tit{text-decoration:line-through;color:var(--muted)}
.crm-d-tarea input[type=checkbox]{width:18px;height:18px;margin-top:1px;flex-shrink:0;cursor:pointer;accent-color:var(--blue)}
.crm-d-tarea-txt{flex:1;min-width:0}
/* Mismo caso que en la ficha: la tarea trae el enlace del inmueble pegado y
   sin `anywhere` se salía del panel. */
.crm-d-tarea-tit{font-size:12.5px;font-weight:600;color:var(--text);line-height:1.35;overflow-wrap:anywhere}
.crm-d-tarea-fecha{font-size:11px;color:var(--muted);margin-top:2px}
.crm-d-tarea.vencida .crm-d-tarea-fecha{color:var(--danger);font-weight:600}
.crm-d-tarea-btn{background:none;border:0;color:var(--muted);font-family:var(--font);font-size:11px;
  cursor:pointer;padding:2px 4px;flex-shrink:0;text-decoration:underline}
.crm-d-tarea-btn:hover{color:var(--blue)}
.crm-activity-input-wrap{display:flex;flex-direction:column;gap:7px}
.crm-activity-input{padding:8px 12px;border:1.5px solid var(--border);border-radius:var(--r);font-size:13px;background:var(--bg);color:var(--text);font-family:var(--font);resize:none;outline:none;min-height:64px}
.crm-activity-input:focus{border-color:var(--blue)}
.crm-activity-btn{align-self:flex-end;padding:7px 14px;background:var(--blue);color:#fff;border:none;border-radius:var(--r);font-size:12px;font-weight:600;cursor:pointer;font-family:var(--font)}
.crm-activity-btn:hover{background:var(--blue-h)}
.crm-activity-btn:disabled{opacity:.5;cursor:not-allowed}
.crm-activity-list{display:flex;flex-direction:column;gap:8px}
.crm-activity-item{display:flex;gap:9px;align-items:flex-start}
.crm-activity-dot{width:7px;height:7px;border-radius:50%;background:var(--blue);flex-shrink:0;margin-top:5px}
.crm-activity-dot.stage{background:var(--success)}
.crm-activity-dot.creacion{background:var(--muted2)}
.crm-activity-content{flex:1}
.crm-activity-text{font-size:12px;color:var(--text);line-height:1.4}
.crm-activity-time{font-size:10px;color:var(--muted2);margin-top:2px}
.crm-detail-actions{display:flex;gap:7px;padding:12px 18px;border-top:1px solid var(--border);flex-shrink:0}
.crm-detail-edit-btn{flex:1;padding:8px;border:1.5px solid var(--border);border-radius:var(--r);background:none;font-size:12px;font-weight:600;color:var(--text);cursor:pointer;font-family:var(--font)}
.crm-detail-edit-btn:hover{background:var(--sidebar)}
.crm-detail-del-btn{padding:8px 14px;border:1.5px solid #FCA5A5;border-radius:var(--r);background:none;font-size:12px;font-weight:600;color:#EF4444;cursor:pointer;font-family:var(--font)}
.crm-detail-del-btn:hover{background:#FEF2F2}
/* Copiloto IA en panel de detalle */
.crm-copilot-btn{display:flex;align-items:center;gap:5px;padding:7px 12px;background:linear-gradient(135deg,#7C3AED,#1E2BCC);color:#fff;border:none;border-radius:var(--r);font-size:12px;font-weight:600;cursor:pointer;font-family:var(--font);transition:opacity .15s}
.crm-copilot-btn:hover{opacity:.88}
.crm-copilot-btn:disabled{opacity:.5;cursor:not-allowed}
.crm-copilot-panel{background:linear-gradient(135deg,#F5F3FF,#EEF2FF);border:1.5px solid #C4B5FD;border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.crm-copilot-result{font-size:13px;color:var(--text);line-height:1.55;white-space:pre-wrap}
.crm-copilot-score{display:flex;align-items:center;gap:10px}
.crm-score-num{font-size:28px;font-weight:800;color:#7C3AED}
.crm-score-bar-wrap{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.crm-score-bar{height:100%;background:linear-gradient(90deg,#7C3AED,#1E2BCC);border-radius:3px;transition:width .5s ease}
.crm-copilot-tabs{display:flex;gap:5px;margin-bottom:4px}
.crm-copilot-tab{padding:4px 10px;border-radius:6px;border:1px solid #C4B5FD;background:none;font-size:11px;font-weight:600;color:#7C3AED;cursor:pointer;font-family:var(--font);transition:all .15s}
.crm-copilot-tab.active{background:#7C3AED;color:#fff;border-color:#7C3AED}
.crm-copy-msg-btn{align-self:flex-end;font-size:11px;font-weight:600;color:#7C3AED;background:none;border:none;cursor:pointer;font-family:var(--font);padding:2px 0}
.crm-copy-msg-btn:hover{text-decoration:underline}

/* Agentes de canal */
.crm-agents-wrap{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:14px}
.crm-agent-card{background:var(--bg);border:1.5px solid var(--border);border-radius:12px;padding:16px 18px;display:flex;align-items:center;gap:14px;transition:all .15s;cursor:pointer}
.crm-agent-card:hover{border-color:var(--blue);box-shadow:0 2px 12px rgba(30,43,204,.08)}
.crm-agent-avatar{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#7C3AED,#1E2BCC);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;color:#fff;font-weight:700}
.crm-agent-info{flex:1}
.crm-agent-name{font-size:14px;font-weight:700;color:var(--text);margin-bottom:2px}
.crm-agent-desc{font-size:12px;color:var(--muted);line-height:1.35}
.crm-agent-channels{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.crm-channel-badge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:600;letter-spacing:.02em}
.crm-channel-badge.messenger{background:#E7F0FD;color:#1877F2}
.crm-channel-badge.instagram{background:#FDE9F7;color:#C13584}
.crm-channel-badge.whatsapp{background:#E6F9EF;color:#128C7E}
.crm-channel-badge.tiktok{background:#EDEDED;color:#111}
.crm-channel-badge.inactive{background:var(--sidebar);color:var(--muted2)}
.crm-agent-status{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.crm-agent-status.active{background:var(--success)}
.crm-agent-status.inactive{background:var(--muted2)}
.crm-new-agent-btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border:2px dashed var(--border);border-radius:12px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);transition:all .15s;background:none;font-family:var(--font);width:100%}
.crm-new-agent-btn:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-lt)}

/* Modal agente */
/* Dos contenedores con scroll anidados —la caja y el cuerpo— hacían que el
   contenido se cortara y el pie se montara encima: no se podía llegar a la
   sección de Calificación. Ahora scroll SOLO en el cuerpo, con el pie fijo. */
/* Los <select> salían con el estilo nativo del sistema: fondo gris, flecha de
   macOS y tipografía ajena. Se les da la misma piel que a los <input>, con una
   flecha propia. Se aplica a los del diseño, no a los del navegador. */
select.auto-input,select.crm-select,.can-select,.pipe-fila select{
  appearance:none;-webkit-appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 24 24' fill='none' stroke='%238C90A8' stroke-width='3' stroke-linecap='round'><path d='M6 9l6 6 6-6'/></svg>");
  background-repeat:no-repeat;background-position:right 10px center;
  padding-right:30px;cursor:pointer}
select.auto-input:hover,.can-select:hover{border-color:var(--blue-md)}
select.auto-input:focus{outline:none;border-color:var(--blue-md)}
select.auto-input:disabled{opacity:.55;cursor:not-allowed}
.ag-pasos{display:flex;gap:6px;padding:12px 20px 0;flex-shrink:0}
.ag-pasos button{flex:1;background:none;border:none;padding:0 0 8px;font-family:inherit;font-size:10.5px;font-weight:700;
  color:var(--muted2);cursor:pointer;border-bottom:2.5px solid var(--border);text-align:left;transition:.15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-pasos button.act{color:var(--blue);border-bottom-color:var(--blue)}
.ag-pasos button.hecho{color:var(--text);border-bottom-color:var(--blue-md)}
.crm-agent-modal-box{max-width:580px;max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
.crm-agent-modal-box > .crm-modal-body{max-height:none;flex:1;min-height:0;overflow-y:auto}
.crm-agent-modal-box > .crm-modal-head,
.crm-agent-modal-box > .crm-modal-foot{flex-shrink:0}
.crm-faq-item{display:flex;gap:7px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--border)}
.crm-faq-item:last-child{border-bottom:none}
.crm-faq-input{flex:1;padding:7px 10px;border:1.5px solid var(--border);border-radius:var(--r);font-size:12px;background:var(--bg);color:var(--text);font-family:var(--font);outline:none}
.crm-faq-input:focus{border-color:var(--blue)}
.crm-faq-del{width:26px;height:26px;border:none;background:none;cursor:pointer;color:var(--muted2);display:flex;align-items:center;justify-content:center;border-radius:6px;flex-shrink:0;font-family:var(--font)}
.crm-faq-del:hover{background:var(--sidebar2);color:#EF4444}
.crm-add-faq-btn{font-size:12px;font-weight:600;color:var(--blue);background:none;border:none;cursor:pointer;font-family:var(--font);padding:4px 0}
.crm-add-faq-btn:hover{opacity:.7}
.crm-section-divider{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted2);padding:4px 0;border-top:1px solid var(--border);margin-top:4px}
.crm-channel-connect-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.crm-channel-connect-row:last-child{border-bottom:none}
.crm-channel-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px}
.crm-channel-connect-info{flex:1}
.crm-channel-connect-name{font-size:13px;font-weight:600;color:var(--text)}
.crm-channel-connect-status{font-size:11px;color:var(--muted)}
.crm-channel-btn{padding:5px 12px;border-radius:var(--r);font-size:11px;font-weight:600;cursor:pointer;border:none;font-family:var(--font);flex-shrink:0}
.crm-channel-btn.connect{background:var(--blue);color:#fff}
.crm-channel-btn.connect:hover{background:var(--blue-h)}
.crm-channel-btn.disconnect{background:var(--sidebar2);color:var(--muted);border:1px solid var(--border)}
.crm-channel-btn.disconnect:hover{background:#FEF2F2;color:#EF4444;border-color:#FCA5A5}

/* Inbox */
.crm-inbox-wrap{flex:1;display:flex;overflow:hidden}
.crm-inbox-list{width:280px;flex-shrink:0;border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.crm-inbox-filters{display:flex;gap:5px;padding:10px 12px;border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto}
.crm-inbox-filter-btn{padding:4px 10px;border-radius:6px;border:1.5px solid var(--border);background:none;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;font-family:var(--font);white-space:nowrap;flex-shrink:0}
.crm-inbox-filter-btn.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.crm-inbox-conversations{flex:1;overflow-y:auto}
.crm-inbox-conv-item{padding:12px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s;display:flex;gap:10px;align-items:flex-start}
.crm-inbox-conv-item:hover,.crm-inbox-conv-item.active{background:var(--sidebar)}
.crm-inbox-conv-avatar{width:36px;height:36px;border-radius:10px;background:var(--sidebar2);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;font-weight:700;color:var(--muted)}
.crm-inbox-conv-info{flex:1;min-width:0}
.crm-inbox-conv-name{font-size:13px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crm-inbox-conv-preview{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.crm-inbox-conv-meta{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0}
.crm-inbox-conv-time{font-size:10px;color:var(--muted2)}
.crm-inbox-unread{width:16px;height:16px;border-radius:50%;background:var(--blue);color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center}
.crm-inbox-channel-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:4px}
.crm-inbox-channel-dot.messenger{background:#1877F2}
.crm-inbox-channel-dot.instagram{background:#C13584}
.crm-inbox-channel-dot.whatsapp{background:#128C7E}
.crm-inbox-channel-dot.tiktok{background:#111}
.crm-inbox-chat{flex:1;display:flex;flex-direction:column;overflow:hidden}
.crm-inbox-chat-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);flex-shrink:0}
.crm-inbox-chat-name{font-size:14px;font-weight:700;flex:1}
.crm-inbox-status-btn{padding:5px 12px;border-radius:var(--r);font-size:11px;font-weight:600;cursor:pointer;border:none;font-family:var(--font)}
.crm-inbox-status-btn.bot{background:#E0E7FF;color:#1E2BCC}
.crm-inbox-status-btn.human{background:#D1FAE5;color:#059669}
.crm-inbox-status-btn.resolved{background:var(--sidebar2);color:var(--muted)}
.crm-inbox-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.crm-inbox-messages::-webkit-scrollbar{width:3px}
.crm-inbox-messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
/* pre-wrap: los saltos de línea del agente se ven. Sin esto, las opciones que
   escribe una por línea llegaban al inbox pegadas en un párrafo — WhatsApp sí
   las respeta, así que el operador veía algo distinto de lo que ve el cliente. */
.crm-inbox-bubble{max-width:75%;padding:9px 13px;border-radius:14px;font-size:13px;line-height:1.45;word-break:break-word;white-space:pre-wrap}
.crm-inbox-bubble.user{background:var(--sidebar);border-radius:14px 14px 14px 3px;align-self:flex-start}
.crm-inbox-bubble.assistant{background:var(--blue);color:#fff;border-radius:14px 14px 3px 14px;align-self:flex-end}
.crm-inbox-bubble-wrap{display:flex;flex-direction:column}
.crm-inbox-bubble-wrap.user{align-items:flex-start}
.crm-inbox-bubble-wrap.assistant{align-items:flex-end}
.crm-inbox-bubble-time{font-size:9px;color:var(--muted2);margin-top:2px;padding:0 3px}
.crm-inbox-reply{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--border);flex-shrink:0;position:relative}
.crm-inbox-reply-input{flex:1;padding:9px 12px;border:1.5px solid var(--border);border-radius:var(--r);font-size:13px;background:var(--bg);color:var(--text);font-family:var(--font);resize:none;outline:none;min-height:40px;max-height:100px}
.crm-inbox-reply-input:focus{border-color:var(--blue)}
.crm-inbox-reply-btn{padding:9px 16px;background:var(--blue);color:#fff;border:none;border-radius:var(--r);font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font);align-self:flex-end}
.crm-inbox-reply-btn:hover{background:var(--blue-h)}
.crm-inbox-reply-btn:disabled{opacity:.5;cursor:not-allowed}

/* Ventana de 24 h de WhatsApp y respuestas rápidas */
.inbox-ventana{font-size:10px;font-weight:700;color:var(--muted);background:var(--bg-subtle);border:1px solid var(--border);border-radius:99px;padding:1px 6px;line-height:1.5}
.inbox-ventana.apremia{color:#b45309;background:rgba(245,158,11,.12);border-color:rgba(245,158,11,.35)}
.inbox-ventana.vencida{color:#b91c1c;background:rgba(220,38,38,.10);border-color:rgba(220,38,38,.3)}
.inbox-ventana-aviso{margin:0 16px;padding:9px 12px;border-radius:var(--r);font-size:12px;line-height:1.45;color:#92400e;background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.35)}
.inbox-accion{display:flex;align-items:center;justify-content:center;width:36px;height:40px;flex-shrink:0;align-self:flex-end;background:transparent;border:1.5px solid var(--border);border-radius:var(--r);color:var(--muted);cursor:pointer}
.inbox-accion:hover{color:var(--blue);border-color:var(--blue)}
.qr-fila{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--r);margin-bottom:8px;background:var(--bg);transition:border-color var(--dur-fast) var(--ease)}
.qr-fila:hover{border-color:var(--blue-md)}
.qr-fila.borrando{border-color:var(--danger);background:var(--danger-bg)}
.qr-titulo{font-size:12.5px;font-weight:700;color:var(--text)}
.qr-texto{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.45;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.qr-icono{display:flex;align-items:center;justify-content:center;width:28px;height:28px;flex-shrink:0;background:transparent;border:1px solid transparent;border-radius:7px;color:var(--muted);cursor:pointer;transition:all var(--dur-fast) var(--ease)}
.qr-icono:hover{color:var(--blue);background:var(--bg-subtle);border-color:var(--border)}
.qr-icono.peligro:hover{color:var(--danger);background:var(--danger-bg);border-color:transparent}

/* Notas internas: deliberadamente NO parecen un mensaje, para que nadie crea
   que el cliente las leyó */
.inbox-nota{margin:10px 0;padding:10px 12px;border-radius:10px;background:rgba(245,158,11,.10);border:1px solid rgba(245,158,11,.32);border-left:3px solid #f59e0b}
.inbox-nota-head{display:flex;align-items:center;gap:8px;font-size:10.5px;color:var(--muted);margin-bottom:5px}
.inbox-nota-etq{font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#b45309}
.inbox-nota-x{margin-left:auto;background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:12px;line-height:1;padding:2px 4px;border-radius:5px;opacity:0}
.inbox-nota:hover .inbox-nota-x{opacity:1}
.inbox-nota-x:hover{color:var(--danger);background:var(--danger-bg)}
.inbox-nota-txt{font-size:12.5px;line-height:1.5;color:var(--text);white-space:pre-wrap}
.inbox-accion.activo{color:#b45309;border-color:rgba(245,158,11,.5);background:rgba(245,158,11,.12)}
.inbox-accion:disabled{cursor:default;opacity:.7}
.inbox-accion.pensando{color:var(--blue);border-color:var(--blue-md)}
.inbox-accion.pensando svg{animation:sugPulso 1s ease-in-out infinite}
@keyframes sugPulso{0%,100%{opacity:1}50%{opacity:.35}}

/* Adjuntos */
.inbox-adj-img{display:block;max-width:230px;max-height:230px;width:auto;border-radius:9px;margin-bottom:5px}
.inbox-adj-doc{display:flex;align-items:center;gap:7px;text-decoration:none;color:inherit;padding:7px 9px;border-radius:8px;background:rgba(255,255,255,.14);margin-bottom:5px;font-size:12.5px;font-weight:600}
.crm-inbox-bubble.user .inbox-adj-doc{background:rgba(0,0,0,.05)}
.inbox-adj-doc:hover{text-decoration:underline}
.inbox-adj-pend{display:flex;align-items:center;gap:9px;margin:0 16px 8px;padding:8px 11px;border:1px solid var(--border);border-radius:var(--r);background:var(--bg-subtle);font-size:12.5px;color:var(--text)}
.inbox-adj-mini{width:34px;height:34px;object-fit:cover;border-radius:6px;flex-shrink:0}
.inbox-adj-spin{width:13px;height:13px;flex-shrink:0;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:adjGiro .7s linear infinite}
@keyframes adjGiro{to{transform:rotate(360deg)}}

/* Emoji */
.emoji-panel{position:absolute;bottom:calc(100% + 8px);left:12px;width:300px;max-height:280px;overflow-y:auto;background:var(--bg-card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);padding:10px 12px;z-index:60}
.emoji-titulo{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:8px 0 5px}
.emoji-titulo:first-child{margin-top:0}
.emoji-rejilla{display:grid;grid-template-columns:repeat(8,1fr);gap:2px}
.emoji-btn{font-size:19px;line-height:1;background:transparent;border:none;border-radius:7px;padding:5px 0;cursor:pointer;font-family:var(--font)}
.emoji-btn:hover{background:var(--bg-subtle)}

/* Nota de voz */
.inbox-accion.grabando{color:#fff;background:var(--danger);border-color:var(--danger);animation:micLate 1.1s ease-in-out infinite}
@keyframes micLate{0%,100%{opacity:1}50%{opacity:.6}}

/* Mensajes programados */
.inbox-prog{display:flex;align-items:flex-start;gap:9px;margin:0 16px 8px;padding:8px 11px;border:1px solid var(--border);border-radius:var(--r);background:var(--bg-subtle);font-size:12.5px;color:var(--text)}
.inbox-prog svg{margin-top:2px;flex-shrink:0;color:var(--muted)}
.inbox-prog.fallido{border-color:rgba(220,38,38,.35);background:var(--danger-bg);color:var(--danger)}
.inbox-prog.fallido svg{color:var(--danger)}

/* Pestañas del catálogo */
.kb-tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--border)}
.kb-tab{background:transparent;border:none;border-bottom:2px solid transparent;padding:8px 12px;margin-bottom:-1px;font-family:var(--font);font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer}
.kb-tab:hover{color:var(--text)}
.kb-tab.activo{color:var(--blue);border-bottom-color:var(--blue)}

/* ── Tickets de soporte (equipo) ── */
#tk-full{position:fixed;inset:0;z-index:9700;background:var(--bg);display:none;flex-direction:column}
#tk-full.abierto{display:flex}
.tk-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 24px;border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap;background:var(--bg-card)}
.tk-titulo{font-size:var(--fs-lg);font-weight:800;letter-spacing:-.02em}
.tk-sub{font-size:12px;color:var(--muted);margin-top:1px}
.tk-body{flex:1;overflow-y:auto;padding:20px 24px}
.tk-card{border:1px solid var(--border);border-radius:14px;background:var(--bg-card);padding:16px 18px;margin:0 auto 12px;max-width:860px}
.tk-card.abierto{border-left:3px solid #B45309}
.tk-asunto{font-size:14px;font-weight:800;letter-spacing:-.01em}
.tk-pre{font-size:10.5px;background:var(--bg-subtle);border:1px solid var(--border);border-radius:8px;padding:10px;overflow-x:auto;margin-top:6px;white-space:pre-wrap}

/* ── Lista de leads del Pulso ── */
.pul-fila{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;background:var(--bg);transition:border-color var(--dur-fast) var(--ease)}
.pul-fila:hover{border-color:var(--blue-md)}
.pul-nombre{font-size:13.5px;font-weight:700;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pul-meta{font-size:11.5px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pul-dias{font-size:12px;font-weight:800;font-variant-numeric:tabular-nums;flex-shrink:0;min-width:34px;text-align:right}
.pul-accion{display:flex;align-items:center;justify-content:center;width:30px;height:30px;flex-shrink:0;background:transparent;border:1px solid var(--border);border-radius:8px;color:var(--muted);cursor:pointer;transition:all var(--dur-fast) var(--ease)}
.pul-accion:hover{color:var(--blue);border-color:var(--blue)}

/* ── Soporte flotante ── */
/* ── Hablarle al CRM: micrófono, hoja y respuesta ───────────────────────── */
/* La pista va AL LADO, no encima: la burbuja de soporte sube 76px para no
   tapar el micrófono, y con la pista arriba seguiría pisándola. */
#voz-zona{position:fixed;right:20px;bottom:20px;z-index:9403;display:none;flex-direction:row;align-items:center;gap:9px;transition:opacity .2s var(--ease)}
#voz-zona.viva{display:flex}
#voz-zona.oculto{opacity:0;pointer-events:none}
#voz-pista{font-size:11px;font-weight:600;color:var(--muted);background:var(--bg-card);border:1px solid var(--border);border-radius:99px;padding:4px 11px;white-space:nowrap;box-shadow:0 2px 8px rgba(13,15,28,.07)}
#voz-fab{width:60px;height:60px;border-radius:50%;border:none;background:var(--blue);color:#fff;box-shadow:0 8px 26px var(--blue-glow);display:grid;place-items:center;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:transform .16s var(--ease-mover),box-shadow .16s var(--ease-mover)}
#voz-fab svg{width:25px;height:25px;pointer-events:none}
#voz-fab.pulsado{transform:scale(1.2);box-shadow:0 0 0 14px var(--blue-dim),0 8px 26px var(--blue-glow)}
#voz-candado{position:fixed;right:33px;bottom:100px;z-index:9404;width:38px;height:38px;border-radius:50%;background:var(--bg-card);border:1px solid var(--border);display:none;place-items:center;color:var(--muted);box-shadow:0 4px 14px rgba(13,15,28,.12);z-index:9401}
#voz-candado.on{display:grid} #voz-candado.cerca{background:var(--blue);color:#fff;border-color:var(--blue)}
/* En escritorio el micrófono vive en la cabecera, no flotando. Flotando
   competía con el botón principal de cada pantalla —«Guardar y continuar» del
   constructor de campañas, «Agregar» del tablero—, que es exactamente el
   problema por el que soporte ya se había mudado aquí arriba. En el teléfono
   se queda flotando: es donde el pulgar lo alcanza y donde nació la función. */
#voz-zona.en-cabecera{position:static;right:auto;bottom:auto;z-index:auto;gap:0}
#voz-zona.en-cabecera #voz-pista{display:none}
#voz-zona.en-cabecera #voz-fab{width:auto;height:auto;border-radius:7px;background:none;color:var(--muted2);box-shadow:none;padding:4px 6px;display:block}
#voz-zona.en-cabecera #voz-fab svg{width:16px;height:16px;display:block}
#voz-zona.en-cabecera #voz-fab:hover{background:var(--border2)}
/* Pulsado tiene que verse: en la cabecera no hay sitio para que crezca, así
   que el aviso es el color de marca, no el tamaño. */
#voz-zona.en-cabecera #voz-fab.pulsado{transform:none;background:var(--blue);color:#fff;box-shadow:0 0 0 3px var(--blue-dim)}
#voz-candado svg{width:17px;height:17px}
#voz-hoja{position:fixed;left:0;right:0;bottom:0;z-index:9402;background:#0B0D18;color:#fff;border-radius:22px 22px 0 0;padding:18px 18px calc(92px + env(safe-area-inset-bottom));transform:translateY(102%);visibility:hidden;transition:transform .34s var(--ease-mover),visibility 0s linear .34s;display:flex;flex-direction:column;gap:13px;max-height:82vh;overflow-y:auto}
#voz-hoja.abierta{transform:translateY(0);visibility:visible;transition:transform .34s var(--ease-mover),visibility 0s}
@media (min-width:860px){#voz-hoja{left:auto;right:20px;width:380px;border-radius:22px;bottom:20px;max-height:70vh}
/* Cerrada tiene que bajar SU alto más la separación del borde: con solo el
   102% se quedaban 16 px de hoja asomando por la esquina, que parecían una
   ventana a medio cerrar. Va en :not(.abierta) para no pisar el abierto. */
#voz-hoja:not(.abierta){transform:translateY(calc(100% + 28px))}}
#voz-asa{width:38px;height:4px;border-radius:99px;background:rgba(255,255,255,.22);margin:0 auto;cursor:pointer;flex-shrink:0}
/* Los de arriba no se encogen. En una columna flex con overflow, los hijos
   se aplastan por defecto: con dos renglones de texto dictado, el segundo
   se montaba encima de la tarjeta de respuesta. */
#voz-estado{display:flex;align-items:center;gap:11px;flex-shrink:0}
.voz-onda{display:flex;align-items:center;gap:3px;height:26px}
.voz-onda i{display:block;width:3px;border-radius:99px;background:#7C8BFF;height:6px}
#voz-estado.escuchando .voz-onda i{animation:vozPulso 1s ease-in-out infinite}
.voz-onda i:nth-child(2){animation-delay:.12s}.voz-onda i:nth-child(3){animation-delay:.24s}
.voz-onda i:nth-child(4){animation-delay:.36s}.voz-onda i:nth-child(5){animation-delay:.48s}
@keyframes vozPulso{0%,100%{height:6px}50%{height:24px}}
/* Pensando: la onda sigue viva pero calmada. Ocho segundos de quietud se
   leen como que se colgó. */
#voz-estado.pensando .voz-onda i{animation:vozLatir 1.6s ease-in-out infinite;opacity:.65}
@keyframes vozLatir{0%,100%{height:6px}50%{height:13px}}
@media (prefers-reduced-motion:reduce){#voz-estado.escuchando .voz-onda i,#voz-estado.pensando .voz-onda i{animation:none;height:15px}#voz-hoja{transition:none}#voz-fab{transition:none}}
#voz-estado-txt{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:#98A2FF}
#voz-fijado{margin-left:auto;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#0B0D18;background:#98A2FF;border-radius:99px;padding:3px 9px;display:none}
#voz-fijado.on{display:block}
#voz-dicho{font-size:19px;font-weight:500;line-height:1.35;min-height:26px;color:#fff;flex-shrink:0}
#voz-dicho:empty::after{content:'\2026';color:rgba(255,255,255,.3)}
#voz-respuesta{flex-shrink:0;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:15px 16px;display:none;flex-direction:column;gap:11px}
#voz-respuesta.visible{display:flex}
.voz-txt{font-size:14.5px;color:rgba(255,255,255,.93);line-height:1.5}
.voz-flojo{font-size:12.5px;color:rgba(255,255,255,.55);line-height:1.5}
.voz-cifra{font-family:var(--font);font-weight:800;font-size:42px;line-height:1;letter-spacing:-.03em;color:#fff;font-variant-numeric:tabular-nums}
.voz-cifra-pie{font-size:12px;color:rgba(255,255,255,.55);margin-top:4px}
.voz-fila{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-top:1px solid rgba(255,255,255,.08)}
.voz-fila:first-child{border-top:0;padding-top:0}
.voz-fila-c{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.voz-fila b{font-size:13.5px;font-weight:600;color:#fff}
.voz-fila span{font-size:12px;color:rgba(255,255,255,.58)}
.voz-punto{width:7px;height:7px;border-radius:99px;margin-top:6px;flex-shrink:0;background:#7C8BFF}
.voz-punto.rojo{background:#F87171}
.voz-paso{display:flex;align-items:center;gap:10px;font-size:12.5px;color:rgba(255,255,255,.4);padding:3px 0}
.voz-paso i{width:8px;height:8px;border-radius:99px;background:rgba(255,255,255,.18);flex-shrink:0}
.voz-paso.hecho{color:rgba(255,255,255,.62)}.voz-paso.hecho i{background:rgba(255,255,255,.45)}
.voz-paso.aqui{color:#fff;font-weight:600}.voz-paso.aqui i{background:#7C8BFF;box-shadow:0 0 0 4px rgba(124,139,255,.22)}
.voz-acciones{display:flex;gap:8px;flex-wrap:wrap}
.voz-acc{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);color:#fff;border-radius:99px;padding:7px 14px;font-size:12.5px;font-weight:600;font-family:var(--font);cursor:pointer}
.voz-acc.primaria{background:#fff;color:#0B0D18;border-color:#fff}
.voz-acc:focus-visible{outline:2px solid #98A2FF;outline-offset:2px}
.voz-aviso{display:flex;gap:9px;background:rgba(180,83,9,.2);border:1px solid rgba(251,191,36,.3);border-radius:12px;padding:10px 12px}
.voz-aviso p{margin:0;font-size:12.5px;color:#FDE68A;line-height:1.45}
#sop-panel{position:fixed;right:20px;bottom:20px;z-index:9600;width:min(390px,calc(100vw - 32px));height:min(560px,calc(100vh - 40px));background:var(--bg-card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-lg);display:none;flex-direction:column;overflow:hidden}
#sop-panel.abierto{display:flex}
.sop-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;background:var(--blue);color:#fff;flex-shrink:0}
.sop-titulo{font-size:13.5px;font-weight:800;letter-spacing:-.01em}
.sop-sub{font-size:11px;opacity:.85;margin-top:1px}
.sop-x{background:transparent;border:none;color:#fff;font-size:14px;cursor:pointer;padding:2px 4px;border-radius:6px;line-height:1}
.sop-x:hover{background:rgba(255,255,255,.16)}
.sop-hilo{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.sop-msg{max-width:88%;padding:9px 12px;border-radius:12px;font-size:13px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.sop-msg.yo{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:4px}
.sop-msg.bot{align-self:flex-start;background:var(--bg-subtle);color:var(--text);border:1px solid var(--border);border-bottom-left-radius:4px}
.sop-msg.equipo{align-self:flex-start;background:rgba(16,185,129,.10);border:1px solid rgba(16,185,129,.32);color:var(--text);border-bottom-left-radius:4px}
.sop-equipo-tag{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#047857;margin-bottom:4px}
.sop-msg.error{align-self:stretch;background:var(--danger-bg);color:var(--danger);border:1px solid rgba(220,38,38,.3);text-align:center;font-size:12.5px}
.sop-ticket{align-self:stretch;background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.32);color:#047857;border-radius:10px;padding:9px 12px;font-size:12.5px;line-height:1.5}
.sop-sug{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.sop-sug button{background:var(--bg);border:1px solid var(--border);border-radius:99px;padding:6px 11px;font-family:var(--font);font-size:12px;color:var(--text);cursor:pointer}
.sop-sug button:hover{border-color:var(--blue);color:var(--blue)}
.sop-caja{display:flex;gap:7px;padding:12px 14px;border-top:1px solid var(--border);flex-shrink:0;align-items:flex-end}
.sop-caja textarea{flex:1;resize:none;max-height:96px;min-height:38px;padding:9px 11px;border:1.5px solid var(--border);border-radius:10px;font-family:var(--font);font-size:13px;background:var(--bg);color:var(--text);outline:none}
.sop-caja textarea:focus{border-color:var(--blue)}
.sop-enviar{width:38px;height:38px;flex-shrink:0;border:none;border-radius:10px;background:var(--blue);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
.sop-enviar:disabled{opacity:.5;cursor:default}
.sop-puntos{align-self:flex-start;display:flex;gap:4px;padding:10px 12px}
.sop-puntos span{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:sopLate 1.1s infinite}
.sop-puntos span:nth-child(2){animation-delay:.16s}
.sop-puntos span:nth-child(3){animation-delay:.32s}
@keyframes sopLate{0%,60%,100%{opacity:.28}30%{opacity:1}}
@media (max-width:520px){#sop-panel{right:8px;left:8px;bottom:8px;width:auto;height:min(70vh,540px)}}
.crm-inbox-reply.modo-nota{background:rgba(245,158,11,.07)}
.crm-inbox-reply.modo-nota .crm-inbox-reply-input{border-color:rgba(245,158,11,.5)}
.crm-inbox-reply.modo-nota .crm-inbox-reply-btn{background:#b45309}
.crm-inbox-reply.modo-nota .crm-inbox-reply-btn:hover{background:#92400e}
.crm-inbox-empty{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--muted);font-size:13px}
.crm-lead-link-btn{font-size:11px;font-weight:600;color:var(--blue);background:none;border:none;cursor:pointer;font-family:var(--font);padding:0;display:flex;align-items:center;gap:3px}
.crm-lead-link-btn:hover{text-decoration:underline}
/* ── FIN MÓDULO LEADS ─────────────────────────────────────────────────────── */
/* Layer 1 — Search bar */
.crm-search-bar{display:flex;align-items:center;gap:8px;padding:8px 20px;border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.crm-search-wrap{flex:1;min-width:160px;display:flex;align-items:center;gap:7px;background:var(--bg);border:1.5px solid var(--border);border-radius:var(--r);padding:6px 10px}
.crm-search-wrap:focus-within{border-color:var(--blue)}
.crm-search-input{flex:1;border:none;outline:none;font-size:13px;background:transparent;color:var(--text);font-family:var(--font)}
.crm-search-input::placeholder{color:var(--muted2)}
.crm-filter-select{padding:6px 10px;border:1.5px solid var(--border);border-radius:var(--r);font-size:12px;background:var(--bg);color:var(--text);font-family:var(--font);outline:none;cursor:pointer;max-width:160px}

/* Desplegable propio — el <select> nativo abre la lista del sistema operativo,
   con su tipografía y su azul, y rompe el aspecto de la app. */
.dd-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1.5px solid var(--border);border-radius:var(--r);font-size:12px;font-weight:500;background:var(--bg);color:var(--text);font-family:var(--font);cursor:pointer;transition:all .15s var(--ease);max-width:190px;white-space:nowrap}
.dd-btn:hover{border-color:var(--border-h);background:var(--bg-subtle)}
.dd-btn.activo{border-color:var(--blue);background:var(--blue-lt);color:var(--blue);font-weight:650}
.dd-btn-txt{overflow:hidden;text-overflow:ellipsis}
.dd-btn svg{flex-shrink:0;opacity:.5}
.dd-menu{position:fixed;z-index:4000;min-width:190px;max-height:300px;overflow-y:auto;background:var(--bg);border:1px solid var(--border);border-radius:11px;box-shadow:var(--shadow-lg);padding:5px;animation:ddIn .13s var(--ease)}
@keyframes ddIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.dd-opt{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:7px;font-size:12.5px;color:var(--text);cursor:pointer;line-height:1.3}
.dd-opt:hover{background:var(--bg-subtle)}
.dd-opt.sel{background:var(--blue-lt);color:var(--blue);font-weight:650}
.dd-opt-check{width:13px;flex-shrink:0;opacity:0}
.dd-opt.sel .dd-opt-check{opacity:1}
.dd-sep{height:1px;background:var(--border);margin:4px 6px}
.crm-filter-select:focus{border-color:var(--blue)}
.crm-leads-stats{font-size:11px;color:var(--muted);white-space:nowrap}
/* Activity types */
.crm-act-type-row{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
.crm-act-type-btn{display:flex;align-items:center;gap:4px;padding:4px 9px;border-radius:6px;border:1.5px solid var(--border);background:var(--bg);font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;font-family:var(--font);transition:all .15s}
.crm-act-type-btn:hover{border-color:var(--blue);color:var(--blue)}
.crm-act-type-btn.active{background:var(--blue);border-color:var(--blue);color:#fff}
.crm-act-barra{display:flex;align-items:center;justify-content:space-between;gap:8px}
.crm-act-link-btn{display:inline-flex;align-items:center;gap:5px;background:none;border:1px solid var(--border);border-radius:8px;padding:5px 10px;font-family:var(--font);font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer}
.crm-act-link-btn:hover{border-color:var(--blue);color:var(--blue)}
.crm-activity-text a{color:var(--blue);text-decoration:underline;text-underline-offset:2px;font-weight:600}
.crm-activity-text a:hover{opacity:.8}
.crm-act-due-input{width:100%;padding:7px 10px;border:1.5px solid var(--border);border-radius:var(--r);font-size:12px;background:var(--bg);color:var(--text);font-family:var(--font);outline:none;margin-bottom:4px}
.crm-act-due-input:focus{border-color:var(--blue)}
/* Card enhancements */
.crm-card-score{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;margin-top:4px}
.crm-card-inactive{display:flex;align-items:center;gap:3px;font-size:10px;color:#D97706;font-weight:600;margin-top:3px}
.crm-col-value{font-size:10px;color:var(--muted);margin-left:auto;font-weight:600}
.crm-pipeline-total{font-size:12px;font-weight:600;color:var(--blue);padding:4px 20px 0;display:flex;align-items:center;gap:6px}
/* Analytics view */
.crm-analytics-wrap{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:14px}
.crm-analytics-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.crm-analytics-card{background:var(--sidebar);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
.crm-analytics-card-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted2);margin-bottom:8px}
.crm-analytics-stat{font-size:26px;font-weight:800;letter-spacing:-.5px;color:var(--text);line-height:1}
.crm-analytics-sub{font-size:11px;color:var(--muted);margin-top:4px}
.crm-analytics-section{background:var(--sidebar);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
.crm-analytics-section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted2);margin-bottom:10px}
.crm-analytics-stage-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--border);font-size:12px}
.crm-analytics-stage-row:last-child{border-bottom:none}
.crm-analytics-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.crm-analytics-stage-name{flex:1;color:var(--text)}
.crm-analytics-stage-count{font-weight:700;color:var(--text);width:28px;text-align:right}
.crm-analytics-bar-wrap{width:80px;height:5px;background:var(--border);border-radius:3px;overflow:hidden}
.crm-analytics-bar{height:100%;border-radius:3px;transition:width .4s}
.crm-analytics-stage-val{font-size:10px;color:var(--muted);width:70px;text-align:right}
.crm-attention-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px;cursor:pointer;color:var(--text)}
.crm-attention-item:last-child{border-bottom:none}
.crm-attention-item:hover{color:var(--blue)}
.crm-attention-days{font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;background:#FEF3C7;color:#D97706;flex-shrink:0}
.crm-attention-stage{font-size:10px;padding:2px 6px;border-radius:4px;flex-shrink:0}
/* Source bar chart */
.crm-source-row{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12px}
.crm-source-label{width:90px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crm-source-bar-wrap{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.crm-source-bar{height:100%;border-radius:3px;background:var(--blue)}
.crm-source-count{font-weight:700;color:var(--text);width:24px;text-align:right;font-size:11px}
/* Value field */
.crm-f-value{padding:8px 10px;border:1.5px solid var(--border);border-radius:var(--r);font-size:13px;background:var(--bg);color:var(--text);font-family:var(--font);width:100%;box-sizing:border-box;outline:none}
.crm-f-value:focus{border-color:var(--blue)}
/* Tags field */
.crm-f-tags{padding:8px 10px;border:1.5px solid var(--border);border-radius:var(--r);font-size:13px;background:var(--bg);color:var(--text);font-family:var(--font);width:100%;box-sizing:border-box;outline:none}
.crm-f-tags:focus{border-color:var(--blue)}
/* Conversation link */
.crm-conv-link-btn{display:flex;align-items:center;gap:6px;padding:7px 10px;border:1.5px dashed var(--border);border-radius:var(--r);background:none;font-size:12px;color:var(--muted);cursor:pointer;font-family:var(--font);width:100%;justify-content:center;transition:all .15s}
.crm-conv-link-btn:hover{border-color:var(--blue);color:var(--blue)}
.crm-conv-linked{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1.5px solid var(--border);border-radius:var(--r);background:var(--sidebar);font-size:12px}
/* Linked conversation in detail panel */
.crm-linked-conv{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--sidebar);cursor:pointer;transition:all .12s;text-decoration:none}
.crm-linked-conv:hover{border-color:var(--blue);background:var(--blue-lt)}
.crm-linked-conv-icon{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px}
.crm-linked-conv-info{flex:1;min-width:0}
.crm-linked-conv-name{font-size:12px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crm-linked-conv-preview{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.crm-linked-conv-time{font-size:10px;color:var(--muted2);flex-shrink:0}
/* Suggest next action button */
.crm-suggest-btn{display:flex;align-items:center;gap:6px;width:100%;padding:9px 14px;background:linear-gradient(135deg,#F5F3FF,#EEF2FF);border:1.5px solid #C4B5FD;border-radius:10px;font-size:12px;font-weight:600;color:#7C3AED;cursor:pointer;font-family:var(--font);transition:all .15s;justify-content:center}
.crm-suggest-btn:hover{background:linear-gradient(135deg,#EDE9FE,#E0E7FF);border-color:#A78BFA}
.crm-suggest-btn:disabled{opacity:.5;cursor:not-allowed}
.crm-suggest-result{background:linear-gradient(135deg,#F5F3FF,#EEF2FF);border:1.5px solid #C4B5FD;border-radius:10px;padding:12px 14px;font-size:13px;color:var(--text);line-height:1.55;margin-bottom:8px}
.crm-suggest-result-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#7C3AED;margin-bottom:6px}
/* Quick filter pills */
.crm-quick-filters{display:flex;gap:6px;flex-wrap:wrap}
.crm-qf-pill{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;border:1.5px solid var(--border);background:var(--bg);font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;font-family:var(--font);transition:all .12s}
.crm-qf-pill:hover{border-color:var(--blue);color:var(--blue)}
.crm-qf-pill.active{background:var(--blue);border-color:var(--blue);color:#fff}
.crm-qf-pill.warn.active{background:#D97706;border-color:#D97706;color:#fff}
/* ── Etiquetas ── */
.tag-chip{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:700;line-height:1.5;white-space:nowrap}
.tag-chip .tag-chip-x{border:none;background:transparent;color:inherit;opacity:.55;cursor:pointer;font-size:9px;padding:0 0 0 2px;font-family:var(--font)}
.tag-chip .tag-chip-x:hover{opacity:1}
.tag-chip.tag-more{background:var(--bg-muted);color:var(--muted)}
.crm-card-tags{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 2px}
.crm-tag-filter{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.tag-filter-chip{border:none;cursor:pointer;font-family:var(--font);transition:transform var(--dur-fast) var(--ease)}
.tag-filter-chip:hover{transform:scale(1.06)}
.tag-filter-clear{border:none;background:transparent;color:var(--muted);font-size:10.5px;cursor:pointer;font-family:var(--font);text-decoration:underline}
.crm-d-tags-wrap{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.crm-d-tag-input{border:1.5px dashed var(--border);border-radius:20px;padding:2px 10px;font-size:10.5px;font-family:var(--font);color:var(--text);background:transparent;width:90px;outline:none}
.crm-d-tag-input:focus{border-color:var(--blue)}
/* Export button */
.crm-export-btn{display:flex;align-items:center;gap:5px;padding:6px 11px;border:1.5px solid var(--border);border-radius:var(--r);background:var(--bg);font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;font-family:var(--font);transition:all .12s;flex-shrink:0}
.crm-export-btn:hover{border-color:var(--blue);color:var(--blue)}

/* Aviso de versión nueva. Barra, no toast: un toast se va solo y quien estaba
   escribiendo no llega a leerlo. Abajo y no arriba, para no tapar la barra
   superior ni el buscador. */
.nueva-version{
  position:fixed; left:50%; transform:translateX(-50%); bottom:20px; z-index:9000;
  display:flex; align-items:center; gap:12px; flex-wrap:wrap; justify-content:center;
  max-width:calc(100vw - 32px); padding:12px 16px;
  background:var(--bg-card); border:1px solid var(--border); border-radius:var(--rlg);
  box-shadow:var(--shadow-md); font-size:var(--fs-sm); color:var(--text);
  animation:nvEntra var(--dur-base) var(--ease);
}
.nueva-version .nv-txt{display:flex; align-items:center; gap:8px;}
.nueva-version .nv-txt svg{color:var(--blue); flex:none;}
.nueva-version .nv-ok{display:inline-flex; align-items:center; gap:6px;}
.nueva-version .nv-no{white-space:nowrap;}
@keyframes nvEntra{from{opacity:0; transform:translate(-50%,12px);} to{opacity:1; transform:translate(-50%,0);}}
/* En el móvil ocupa el ancho y los botones se reparten: apretados en una fila
   quedaban por debajo del área que el dedo acierta. */
@media (max-width:520px){
  .nueva-version{left:16px; right:16px; transform:none; max-width:none;}
  @keyframes nvEntra{from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:none;}}
  .nueva-version .nv-txt{flex:1 1 100%;}
  .nueva-version .nv-ok,.nueva-version .nv-no{flex:1 1 0; justify-content:center;}
}

// Estado vacío con firma "agua" (gradiente azul→aqua de marca)
function emptyAgua(iconName, title, sub, ctaHtml) {
  return '<div class="empty-agua">' +
    '<div class="empty-agua-art">' + icn(iconName, 26) + '</div>' +
    '<div class="empty-agua-title">' + title + '</div>' +
    '<div class="empty-agua-sub">' + sub + '</div>' +
    (ctaHtml ? '<div class="empty-agua-cta">' + ctaHtml + '</div>' : '') +
  '</div>';
}

function icn(name, size, extra) {
  const p = ICN_PATHS[name] || ICN_PATHS.chart;
  return '<svg width="' + (size || 14) + '" height="' + (size || 14) + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"' + (extra ? ' ' + extra : '') + '>' + p + '</svg>';
}
let _barraVersionPuesta = false;
function mostrarBarraVersion() {
  if (_barraVersionPuesta || document.getElementById('nueva-version')) return;
  _barraVersionPuesta = true;
  const b = document.createElement('div');
  b.id = 'nueva-version';
  b.className = 'nueva-version';
  b.setAttribute('role', 'status');
  b.innerHTML =
    '<span class="nv-txt">' + icn('sparkles', 16) +
      'Hay una versión nueva de Acuarius.</span>' +
    '<button type="button" class="btn-pri nv-ok">' + icn('refresh', 15) + 'Actualizar</button>' +
    '<button type="button" class="btn-ghost nv-no" aria-label="Ahora no">Ahora no</button>';
  document.body.appendChild(b);
  b.querySelector('.nv-ok').addEventListener('click', () => location.reload());
  // Quien la cierra no quiere que le insistan cada cinco minutos. Vuelve a
  // aparecer en la siguiente sesión, que es cuando deja de molestar.
  b.querySelector('.nv-no').addEventListener('click', () => b.remove());
}
