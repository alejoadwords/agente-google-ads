<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Banco - aviso de version</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300..700&display=swap" rel="stylesheet"><style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  /* Brand blues */
  --blue:#1E2BCC;--blue-h:#1520B0;--blue-mid:#3D52E5;
  --blue-lt:#EEF0FD;--blue-md:#C5CAF8;--blue-dim:rgba(30,43,204,.07);
  --blue-glow:rgba(30,43,204,.15);--blue-ring:rgba(30,43,204,.2);
  /* Text */
  --text:#0D0F1C;--text-2:#5A607A;--text-3:#9DA3BE;
  /* Aliases for backward compat */
  --muted:#5A607A;--muted2:#9DA3BE;
  /* Borders */
  --border:#E4E6F0;--border2:#F0F1F8;--border-h:#C5CAF8;
  /* Backgrounds */
  --bg:#FFFFFF;--bg-subtle:#F7F8FC;--bg-muted:#F0F1F8;--bg-card:#FFFFFF;
  /* Aliases for backward compat */
  --sidebar:#F7F8FC;--sidebar2:#F0F1F8;
  --panel:var(--bg-card);
  /* Semantic */
  --success:#059669;--warning:#D97706;--danger:#DC2626;
  --success-bg:#E7F7F0;--warning-bg:#FEF3E2;--danger-bg:#FDECEC;
  /* Secundarios de marca */
  --violet:#7C3AED;--violet-lt:#F5F3FF;--aqua:#00B8CE;--aqua-lt:#E4FAFC;
  --agua-grad:linear-gradient(135deg,var(--blue),var(--aqua));
  /* Escala tipográfica (7 pasos) */
  --fs-xs:11px;--fs-sm:12px;--fs-base:13px;--fs-md:15px;--fs-lg:18px;--fs-xl:24px;--fs-2xl:32px;
  /* System */
  --font:'Outfit',sans-serif;--r:10px;--rlg:14px;--rxl:18px;
  --ease:cubic-bezier(0.16,1,0.3,1);--ease-mover:cubic-bezier(0.4,0,0.2,1);
  --dur-fast:.15s;--dur-base:.25s;--dur-slow:.4s;
  --shadow-sm:0 1px 3px rgba(13,15,28,.06),0 1px 2px rgba(13,15,28,.04);
  --shadow-md:0 4px 12px rgba(13,15,28,.08),0 1px 3px rgba(13,15,28,.05);
  --shadow-lg:0 12px 40px -8px rgba(13,15,28,.16),0 4px 12px rgba(13,15,28,.06);
  --shadow-blue:0 2px 8px rgba(30,43,204,.25);
  /* 244 px venían del árbol de agentes, con sus sub-items indentados y
     etiquetas como «Social Media Manager». Sin él, el contenido de la barra
     necesita 165 px medidos: quedaban casi 80 px muertos a la derecha. */
  --sb-w:200px;
}

/* ── Modo oscuro (beta) — overrides de tokens ── */
[data-theme="dark"]{
  color-scheme:dark;
  --blue:#5B6CFF;--blue-h:#7C89FF;--blue-mid:#6E7DFF;
  --blue-lt:#1B2040;--blue-md:#37407A;--blue-dim:rgba(91,108,255,.12);
  --blue-glow:rgba(91,108,255,.25);--blue-ring:rgba(91,108,255,.3);
  --text:#E8EAF6;--text-2:#A7ACC8;--text-3:#6E7494;
  --muted:#A7ACC8;--muted2:#6E7494;
  --border:#262B47;--border2:#1D2138;--border-h:#37407A;
  --bg:#0E1120;--bg-subtle:#151930;--bg-muted:#1D2138;--bg-card:#151930;
  --sidebar:#12152A;--sidebar2:#1D2138;
  --success:#34D399;--warning:#FBBF24;--danger:#F87171;
  --success-bg:rgba(16,185,129,.14);--warning-bg:rgba(251,191,36,.14);--danger-bg:rgba(239,68,68,.14);
  --violet:#A78BFA;--violet-lt:#241B45;--aqua:#22D3EE;--aqua-lt:#0B2E38;
  --shadow-sm:0 1px 3px rgba(0,0,0,.4),0 1px 2px rgba(0,0,0,.3);
  --shadow-md:0 4px 12px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4);
  --shadow-lg:0 12px 40px -8px rgba(0,0,0,.6),0 4px 12px rgba(0,0,0,.4);
  --shadow-blue:0 2px 8px rgba(91,108,255,.35);
}
[data-theme="dark"] .hdr{background:rgba(14,17,32,.92)}

body{font-family:var(--font);background:var(--bg);color:var(--text);height:100svh;display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}

/* ── HEADER ── */
/* La cabecera reserva la zona segura de arriba. Instalada en un iPhone, la
   app ocupa toda la pantalla: sin este colchón los 54px del encabezado quedan
   DEBAJO de la Isla Dinámica y el usuario no ve ni el menú ni el buscador.
   En un navegador normal env() vale 0 y esto no cambia nada. */
.hdr{display:flex;align-items:center;gap:10px;padding:0 max(16px,env(safe-area-inset-left)) 0 max(16px,env(safe-area-inset-right));padding-top:env(safe-area-inset-top);height:calc(54px + env(safe-area-inset-top));border-bottom:1px solid var(--border);background:rgba(255,255,255,.92);backdrop-filter:blur(12px);flex-shrink:0;z-index:20}
.hdr-logo{display:flex;align-items:center;gap:2px;text-decoration:none;flex-shrink:0}
.hdr-logo-icon{width:28px;height:28px;background:var(--blue);border-radius:8px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px var(--blue-glow);flex-shrink:0}
.hdr-logo-icon svg{width:18px;height:18px}
.hdr-logo-name{font-size:17px;font-weight:800;color:var(--text);letter-spacing:-.4px}
.hdr-logo-img{height:34px;width:auto;display:block}
.hdr-logo .hdr-logo-mark{display:none;width:30px;height:30px;min-width:30px;object-fit:contain;border-radius:8px;flex-shrink:0}
.hdr-logo-dark{display:none}
html[data-theme="dark"] .hdr-logo-light{display:none}
html[data-theme="dark"] .hdr-logo-dark{display:block}
.hdr-sep{width:1px;height:18px;background:var(--border);margin:0 2px}
.hdr-agent{font-size:12.5px;font-weight:500;color:var(--text-2);white-space:nowrap}
.hdr-badge{font-size:10px;font-weight:700;padding:2px 9px;border-radius:20px;background:var(--blue-lt);color:var(--blue);border:1px solid var(--blue-md);letter-spacing:.2px;white-space:nowrap}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.hdr-user{font-size:13px;color:var(--text-2);font-weight:500}
.hdr-icon-btn{width:32px;height:32px;border-radius:8px;background:transparent;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-2);transition:all .18s var(--ease)}
.hdr-icon-btn:hover{background:var(--bg-subtle);border-color:var(--border-h);color:var(--text)}

/* ── Paleta de comandos (⌘K) ── */
.cmdk-overlay{position:fixed;inset:0;background:rgba(10,12,40,.35);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:99998;display:none;align-items:flex-start;justify-content:center;padding:12vh 20px 20px}
.cmdk-overlay.open{display:flex;animation:cmdkFade .15s ease}
.cmdk-box{width:100%;max-width:560px;background:var(--bg);border-radius:16px;border:1px solid var(--border);box-shadow:0 32px 90px rgba(10,12,40,.35);overflow:hidden;animation:cmdkPop .18s cubic-bezier(.2,.9,.3,1.2)}
.cmdk-input-row{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border)}
.cmdk-input-row svg{flex-shrink:0;color:var(--muted2)}
.cmdk-input{flex:1;border:none;outline:none;background:transparent;font-size:15px;font-family:var(--font);color:var(--text)}
.cmdk-input::placeholder{color:var(--muted2)}
.cmdk-esc{font-size:10px;font-weight:600;color:var(--muted2);border:1px solid var(--border);border-radius:5px;padding:2px 6px;flex-shrink:0}
.cmdk-list{max-height:min(380px,50vh);overflow-y:auto;padding:8px}
.cmdk-group{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted2);padding:10px 12px 4px}
.cmdk-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:9px;cursor:pointer;font-size:13.5px;color:var(--text);transition:background .1s}
.cmdk-item .cmdk-ico{width:26px;height:26px;border-radius:7px;background:var(--bg-subtle);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.cmdk-item .cmdk-sub{font-size:11px;color:var(--muted2);margin-left:auto;flex-shrink:0}
.cmdk-item.sel{background:var(--blue-lt)}
.cmdk-item.sel .cmdk-ico{background:var(--bg);border-color:var(--blue-md)}
.cmdk-empty{padding:28px 16px;text-align:center;font-size:13px;color:var(--muted2)}
.cmdk-hint-btn{display:flex;align-items:center;gap:7px;background:var(--bg-subtle);border:1px solid var(--border);border-radius:8px;padding:5px 10px;cursor:pointer;color:var(--muted2);font-size:12px;font-family:var(--font);transition:all .18s var(--ease)}
.cmdk-hint-btn:hover{background:var(--blue-lt);border-color:var(--blue-md);color:var(--blue)}
.cmdk-hint-btn kbd{font-family:var(--font);font-size:10px;font-weight:700;border:1px solid var(--border);border-radius:4px;padding:1px 5px;background:var(--bg)}
@media(max-width:640px){.cmdk-hint-btn span{display:none}}
@keyframes cmdkFade{from{opacity:0}to{opacity:1}}
@keyframes cmdkPop{from{opacity:0;transform:scale(.97) translateY(-8px)}to{opacity:1;transform:none}}

/* ── Pulso — brief diario proactivo ── */
.pulso{width:100%;max-width:740px;margin:0 0 20px;text-align:left}
.pulso-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.pulso-title{font-size:12.5px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px;letter-spacing:-.1px}
.pulso-dot{width:7px;height:7px;border-radius:50%;background:linear-gradient(135deg,var(--blue),#00B8CE);animation:pulsoBeat 2.4s ease infinite;flex-shrink:0}
.pulso-refresh{width:26px;height:26px;border-radius:7px;background:transparent;border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted2);transition:all .15s var(--ease)}
.pulso-refresh:hover{background:var(--bg-subtle);color:var(--text)}
.pulso-grid{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x proximity;scrollbar-width:thin;scrollbar-color:var(--blue-md) var(--bg-muted)}
.pulso-grid::-webkit-scrollbar{height:6px}
.pulso-grid::-webkit-scrollbar-track{background:var(--bg-muted);border-radius:3px}
.pulso-grid::-webkit-scrollbar-thumb{background:var(--blue-md);border-radius:3px}
.pulso-grid::-webkit-scrollbar-thumb:hover{background:var(--blue-mid)}
.pulso-card{position:relative;background:linear-gradient(180deg,var(--bg),var(--bg-card));border:1px solid var(--border);border-radius:14px;padding:13px 15px;box-shadow:0 1px 2px rgba(16,20,48,.04),0 8px 24px -12px rgba(30,43,204,.12);display:flex;flex-direction:column;align-items:flex-start;flex:0 0 auto;width:258px;scroll-snap-align:start}
.pulso-skel{flex:0 0 auto;width:258px}
.pulso-card-top{display:flex;align-items:center;gap:8px;width:100%}
.pulso-ico{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pulso-card[data-tone="warn"] .pulso-ico{background:var(--warning-bg);color:var(--warning)}
.pulso-card[data-tone="good"] .pulso-ico{background:var(--success-bg);color:var(--success)}
.pulso-card[data-tone="info"] .pulso-ico{background:var(--aqua-lt);color:var(--aqua)}
.pulso-card-title{font-size:12.5px;font-weight:700;color:var(--text);letter-spacing:-.1px}
.pulso-card-body{font-size:var(--fs-sm);color:var(--muted);line-height:1.55;margin-top:7px;font-variant-numeric:tabular-nums}
.pulso-card-body b{color:var(--text);font-weight:700}
.pulso-act{margin-top:auto;padding:6px 12px;margin-top:11px;background:var(--blue);border:none;border-radius:9px;font-size:11px;font-weight:700;color:#fff;cursor:pointer;font-family:var(--font);box-shadow:var(--shadow-blue);transition:all var(--dur-fast) var(--ease);display:inline-flex;align-items:center;gap:5px}
.pulso-act:hover{background:var(--blue-h);transform:translateY(-1px)}
.pulso-skel{height:88px;border-radius:12px;background:linear-gradient(90deg,var(--bg-subtle) 25%,var(--bg-muted) 50%,var(--bg-subtle) 75%);background-size:200% 100%;animation:pulsoShimmer 1.2s linear infinite}
@keyframes pulsoBeat{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes pulsoShimmer{from{background-position:200% 0}to{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){.pulso-dot,.pulso-skel{animation:none}}

/* ── Automatizaciones del CRM ── */
.auto-card{background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:12px;box-shadow:var(--shadow-sm);display:flex;align-items:flex-start;gap:14px;transition:all var(--dur-fast) var(--ease)}
.auto-card:hover{border-color:var(--border-h)}
.auto-card.paused{opacity:.6}
.auto-ico{width:34px;height:34px;border-radius:10px;background:var(--agua-grad);display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.auto-name{font-size:var(--fs-md);font-weight:700;color:var(--text);letter-spacing:-.01em}
.auto-trigger{font-size:var(--fs-sm);color:var(--muted);margin-top:2px}
.auto-steps-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.auto-step-chip{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:14px;background:var(--bg-subtle);border:1px solid var(--border);color:var(--text-2)}
.auto-actions{display:flex;gap:6px;align-items:center;flex-shrink:0}
.auto-toggle{position:relative;width:36px;height:20px;border-radius:20px;background:var(--border);cursor:pointer;transition:background var(--dur-fast);border:none;flex-shrink:0}
.auto-toggle.on{background:var(--success)}
.auto-toggle::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform var(--dur-fast) var(--ease)}
.auto-toggle.on::after{transform:translateX(16px)}
.auto-modal-overlay{position:fixed;inset:0;background:rgba(10,12,40,.45);backdrop-filter:blur(5px);z-index:9998;display:flex;align-items:center;justify-content:center;padding:20px}
.auto-modal{background:var(--bg);border-radius:18px;width:100%;max-width:640px;max-height:90vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);animation:scaleInCard var(--dur-base) var(--ease)}
.auto-modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border);flex-shrink:0}
.auto-modal-body{flex:1;overflow-y:auto;padding:20px 22px}
.auto-field{margin-bottom:16px}
.auto-label{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px;display:block}
.auto-input{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:var(--fs-base);font-family:var(--font);background:var(--bg);color:var(--text);box-sizing:border-box}
.auto-input:focus{outline:none;border-color:var(--blue-md)}
textarea.auto-input{resize:vertical;min-height:64px}
.auto-step{border:1px solid var(--border);border-radius:12px;padding:13px 14px;margin-bottom:10px;background:var(--bg-subtle);position:relative}
.auto-step-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.auto-step-num{width:20px;height:20px;border-radius:6px;background:var(--blue-lt);color:var(--blue);font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.auto-step-type{font-size:var(--fs-sm);font-weight:700;color:var(--text);flex:1}
.auto-step-btns{display:flex;gap:2px}
.auto-step-mini{background:none;border:none;cursor:pointer;color:var(--muted2);padding:3px 5px;border-radius:5px;font-size:12px}
.auto-step-mini:hover{background:var(--bg-muted);color:var(--text)}
.auto-vars-hint{font-size:10.5px;color:var(--muted2);margin-top:5px;font-family:var(--mono,monospace)}
.auto-add-step{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.auto-log-row{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--border2);font-size:var(--fs-sm);align-items:baseline}
.auto-log-time{font-size:10.5px;color:var(--muted2);white-space:nowrap;flex-shrink:0;width:88px}
.auto-log-badge{font-size:9.5px;font-weight:700;padding:2px 8px;border-radius:10px;flex-shrink:0}
.auto-log-badge.ok{background:var(--success-bg);color:var(--success)}
.auto-log-badge.bad{background:var(--danger-bg);color:var(--danger)}
.auto-log-badge.mid{background:var(--warning-bg);color:var(--warning)}

/* ── Agenda del CRM (calendario) ── */
.agn-wrap{display:flex;gap:16px;flex:1;min-height:0;align-items:stretch}
.agn-cal{flex:1;min-width:0;display:flex;flex-direction:column}
.agn-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.agn-title{font-size:var(--fs-lg);font-weight:800;letter-spacing:-.02em;min-width:170px;text-transform:capitalize}
.agn-grid{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--border);border-radius:14px;overflow:hidden;background:var(--bg)}
.agn-dow{padding:8px 4px;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center;background:var(--bg-subtle);border-bottom:1px solid var(--border)}
.agn-cell{border-right:1px solid var(--border2);border-bottom:1px solid var(--border2);min-height:84px;padding:5px 6px;cursor:pointer;transition:background var(--dur-fast);overflow:hidden}
.agn-cell:nth-child(7n){border-right:none}
.agn-cell:hover{background:var(--bg-subtle)}
.agn-cell.other{opacity:.35}
.agn-cell.sel{background:var(--blue-lt)}
.agn-day{width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--text-2)}
.agn-cell.today .agn-day{background:var(--blue);color:#fff}
.agn-chip{font-size:9.5px;font-weight:600;padding:2px 6px;border-radius:6px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agn-chip.task{background:var(--blue-lt);color:var(--blue)}
.agn-chip.meeting{background:var(--aqua-lt);color:var(--aqua)}
.agn-chip.done{opacity:.5;text-decoration:line-through}
.agn-more{font-size:9px;color:var(--muted2);margin-top:2px;font-weight:600}
.agn-side{width:310px;flex-shrink:0;display:flex;flex-direction:column;gap:8px}
.agn-side-title{font-size:var(--fs-sm);font-weight:800;color:var(--text);margin:4px 0 2px}
.agn-item{display:flex;gap:10px;padding:11px 13px;border:1px solid var(--border);border-radius:12px;background:var(--bg);align-items:flex-start;box-shadow:var(--shadow-sm)}
.agn-item.done{opacity:.55}
.agn-item.done .agn-item-title{text-decoration:line-through}
.agn-item-ico{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.agn-item-ico.task{background:var(--blue-lt);color:var(--blue)}
.agn-item-ico.meeting{background:var(--aqua-lt);color:var(--aqua)}
.agn-item-title{font-size:var(--fs-sm);font-weight:700;color:var(--text)}
.agn-item-meta{font-size:10.5px;color:var(--muted2);margin-top:2px}
.agn-item-acts{display:flex;gap:2px;margin-left:auto;flex-shrink:0}
.agn-gcal{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:5px 11px;border-radius:20px}
.agn-gcal.on{background:var(--success-bg);color:var(--success)}
.agn-gcal.off{background:var(--warning-bg);color:var(--warning);cursor:pointer}
@media(max-width:920px){.agn-wrap{flex-direction:column}.agn-side{width:100%}}

/* ── Flow builder visual de automatizaciones ── */
.flow-wrap{display:flex;flex-direction:column;flex:1;min-height:0;margin:-18px -22px;height:calc(100% + 36px)}
.flow-head{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--border);background:var(--bg);flex-shrink:0;flex-wrap:wrap}
.flow-name{border:none;background:transparent;font-family:var(--font);font-size:var(--fs-md);font-weight:800;color:var(--text);min-width:200px;flex:1;outline:none;padding:6px 8px;border-radius:8px}
.flow-name:hover,.flow-name:focus{background:var(--bg-subtle)}
.flow-estado{display:flex;background:var(--bg-muted);border-radius:9px;padding:3px}
.flow-estado button{border:none;background:transparent;font-family:var(--font);font-size:var(--fs-xs);font-weight:700;padding:6px 14px;border-radius:7px;cursor:pointer;color:var(--muted)}
.flow-estado button.on{background:var(--bg);color:var(--text);box-shadow:var(--shadow-sm)}
.flow-estado button.on.pub{color:var(--success)}
.flow-body{display:flex;flex:1;min-height:0}
.flow-palette{width:250px;border-right:1px solid var(--border);background:var(--bg);padding:14px;overflow-y:auto;flex-shrink:0}
.flow-palette-title{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:12px 0 8px}
.flow-block{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border:1px solid var(--border);border-radius:11px;margin-bottom:8px;cursor:pointer;background:var(--bg);transition:all var(--dur-fast) var(--ease)}
.flow-block:hover{border-color:var(--blue-md);background:var(--blue-lt);transform:translateY(-1px)}
.flow-block-ico{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.flow-block-name{font-size:var(--fs-sm);font-weight:700;color:var(--text)}
.flow-block-desc{font-size:10.5px;color:var(--muted2);line-height:1.4;margin-top:1px}
.flow-canvas{flex:1;overflow:auto;position:relative;background-color:var(--bg-subtle);background-image:radial-gradient(circle,var(--border) 1px,transparent 1px);background-size:22px 22px}
.flow-chain{display:flex;align-items:center;padding:52px 60px;min-height:100%;width:max-content;transform-origin:0 0}
.flow-node{background:var(--bg);border:1.5px solid var(--border);border-radius:13px;padding:12px 15px;min-width:190px;max-width:230px;cursor:pointer;box-shadow:var(--shadow-sm);position:relative;transition:border-color var(--dur-fast),box-shadow var(--dur-fast);flex-shrink:0}
.flow-node:hover{border-color:var(--border-h);box-shadow:var(--shadow-md)}
.flow-node.sel{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-ring),var(--shadow-md)}
.flow-node-head{display:flex;align-items:center;gap:8px}
.flow-node-ico{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.flow-node-name{font-size:var(--fs-sm);font-weight:700;color:var(--text)}
.flow-node-sub{font-size:10.5px;color:var(--muted2);margin-top:5px;line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.flow-node-tools{position:absolute;top:-26px;right:2px;display:none;gap:2px;background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:2px;box-shadow:var(--shadow-sm)}
.flow-node:hover .flow-node-tools,.flow-node.sel .flow-node-tools{display:flex}
.flow-node-tool{border:none;background:transparent;cursor:pointer;font-size:11px;color:var(--muted);padding:2px 6px;border-radius:5px;font-family:var(--font)}
.flow-node-tool:hover{background:var(--bg-muted);color:var(--text)}
.flow-link{flex-shrink:0;color:var(--blue-md)}
.flow-add{width:38px;height:38px;border-radius:11px;border:1.5px dashed var(--blue-md);background:var(--blue-lt);color:var(--blue);font-size:18px;font-weight:700;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all var(--dur-fast) var(--ease)}
.flow-add:hover{background:var(--blue-md);transform:scale(1.08)}
.flow-add.sm{width:30px;height:30px;border-radius:9px;font-size:15px}
.flow-add.active{background:var(--agua-grad);border-style:solid;border-color:transparent;color:#fff;box-shadow:var(--shadow-sm)}
.flow-lanes{display:flex;flex-direction:column;gap:14px;padding:10px 0 10px 6px;border-left:2px dashed var(--blue-md);border-radius:2px;margin-left:-8px;flex-shrink:0}
.flow-lane{display:flex;align-items:center;flex-shrink:0}
.flow-lane-tag{flex-shrink:0;font-size:10px;font-weight:800;letter-spacing:.04em;padding:4px 9px;border-radius:20px;text-transform:uppercase}
.flow-lane-tag.yes{background:var(--success-bg);color:var(--success)}
.flow-lane-tag.no{background:var(--danger-bg);color:var(--danger)}
.flow-config{width:330px;border-left:1px solid var(--border);background:var(--bg);overflow-y:auto;flex-shrink:0;padding:18px}
.flow-config-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.flow-config-title{font-size:var(--fs-md);font-weight:800;color:var(--text)}
.flow-zoom{position:absolute;bottom:16px;right:16px;display:flex;flex-direction:column;gap:6px;z-index:5}
.flow-zoom button{width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:var(--bg);cursor:pointer;font-size:15px;color:var(--text-2);box-shadow:var(--shadow-sm)}
.flow-zoom button:hover{background:var(--bg-subtle)}
@media(max-width:900px){.flow-palette{width:200px}.flow-config{width:280px}}

/* ── Estados vacíos con firma "agua" ── */
.empty-agua{text-align:center;padding:30px 16px;display:flex;flex-direction:column;align-items:center;animation:msgIn var(--dur-base) var(--ease)}
.empty-agua-art{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,var(--blue-lt),var(--aqua-lt));display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;color:var(--blue);margin-bottom:12px}
.empty-agua-art::after{content:"";position:absolute;inset:auto -20% -45% -20%;height:60%;background:radial-gradient(ellipse at 50% 100%,rgba(0,184,206,.35),transparent 70%)}
.empty-agua-title{font-size:var(--fs-md);font-weight:700;color:var(--text);letter-spacing:-.01em}
.empty-agua-sub{font-size:var(--fs-sm);color:var(--muted);margin-top:4px;max-width:46ch;line-height:1.55}
.empty-agua-cta{margin-top:14px}

/* ── Sistema de botones unificado (4 variantes × 2 tamaños) ── */
.btn-pri,.btn-sec,.btn-ghost,.btn-dgr{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:var(--font);font-size:var(--fs-sm);font-weight:700;border-radius:9px;padding:9px 16px;cursor:pointer;border:1px solid transparent;transition:all var(--dur-fast) var(--ease);line-height:1.2;white-space:nowrap}
.btn-pri{background:var(--blue);color:#fff;box-shadow:var(--shadow-blue)}
.btn-pri:hover{background:var(--blue-h);transform:translateY(-1px)}
.btn-sec{background:var(--bg);color:var(--text);border-color:var(--border);box-shadow:var(--shadow-sm)}
.btn-sec:hover{background:var(--bg-subtle);border-color:var(--border-h)}
.btn-ghost{background:transparent;color:var(--text-2)}
.btn-ghost:hover{background:var(--bg-muted);color:var(--text)}
.btn-dgr{background:var(--danger-bg);color:var(--danger)}
.btn-dgr:hover{filter:brightness(.96)}
.btn-pri.sm,.btn-sec.sm,.btn-ghost.sm,.btn-dgr.sm{font-size:var(--fs-xs);padding:6px 11px;border-radius:7px}
.btn-pri.lg,.btn-sec.lg{font-size:var(--fs-base);padding:12px 20px;border-radius:11px;width:100%}
.btn-pri:disabled,.btn-sec:disabled{opacity:.55;cursor:default;transform:none}
@media(prefers-reduced-motion:reduce){.btn-pri:hover{transform:none}}

/* ── Tarjetas de acción de agentes (restauradas — se perdieron el 24 jun) ── */
.next-steps-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;max-width:520px}
@media(max-width:500px){.next-steps-grid{grid-template-columns:1fr}}
.next-step-card{border:1.5px solid var(--border);border-radius:12px;padding:14px 16px;cursor:pointer;background:var(--bg);transition:all .15s}
.next-step-card:hover{border-color:var(--blue-md);background:var(--blue-lt);transform:translateY(-1px)}
.next-step-icon{font-size:20px;margin-bottom:7px}
.next-step-title{font-size:12.5px;font-weight:600;color:var(--text);margin-bottom:4px}
.next-step-desc{font-size:11.5px;color:var(--muted2);line-height:1.45}

/* ── Proyecto SEO ── */
#view-seo-project{overflow-y:auto}
.seop-wrap{max-width:1100px;margin:0 auto;padding:26px 28px 40px;width:100%}
.seop-setup-card{max-width:540px;margin:36px auto;background:var(--bg);border:1px solid var(--border);border-radius:18px;padding:30px;box-shadow:var(--shadow-md)}
.seop-field{margin-bottom:14px}
.seop-label{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px;display:block}
.seop-input{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:13px;font-family:var(--font);background:var(--bg);color:var(--text);box-sizing:border-box}
.seop-input:focus{outline:none;border-color:var(--blue-md)}
textarea.seop-input{resize:vertical;min-height:70px}
.seop-topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.seop-title{font-size:20px;font-weight:800;letter-spacing:-.3px;display:flex;align-items:center;gap:10px}
.seop-sub{font-size:12px;color:var(--muted);margin-top:2px}
.seop-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:9px;font-size:var(--fs-sm);font-weight:700;cursor:pointer;font-family:var(--font);border:1px solid var(--border);background:var(--bg);color:var(--text);box-shadow:var(--shadow-sm);transition:all var(--dur-fast) var(--ease)}
.seop-btn:hover{background:var(--bg-subtle);border-color:var(--border-h)}
.seop-btn.primary{background:var(--blue);border-color:transparent;color:#fff;box-shadow:var(--shadow-blue)}
.seop-btn.primary:hover{background:var(--blue-h);transform:translateY(-1px)}
.seop-btn:disabled{opacity:.55;cursor:default;transform:none}
.seop-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.seop-stat{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:13px 16px}
.seop-stat-val{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums}
.seop-stat-lbl{font-size:11px;color:var(--muted);margin-top:2px}
.seop-tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto}
.seop-tab{padding:9px 15px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;border:none;border-bottom:2px solid transparent;font-family:var(--font);background:none;white-space:nowrap}
.seop-tab.active{color:var(--blue);border-bottom-color:var(--blue)}
.seop-scroll{overflow-x:auto;border:1px solid var(--border);border-radius:12px;background:var(--bg)}
.seop-table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:640px}
.seop-table th{text-align:left;padding:10px 14px;background:var(--bg-subtle);font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);border-bottom:1px solid var(--border)}
.seop-table td{padding:10px 14px;border-bottom:1px solid var(--border2);font-variant-numeric:tabular-nums;color:var(--text-2)}
.seop-table tr:last-child td{border-bottom:none}
.seop-table td:first-child{font-weight:600;color:var(--text)}
.seop-pos{font-weight:800;color:var(--text)}
.seop-delta{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:12px;white-space:nowrap}
.seop-delta.up{background:#E7F7F0;color:#047857}
.seop-delta.down{background:#FDECEC;color:#DC2626}
.seop-delta.same{background:var(--bg-muted);color:var(--muted)}
.seop-empty{padding:38px 20px;text-align:center;color:var(--muted);font-size:13px}
.seop-row-btn{background:none;border:none;cursor:pointer;font-size:13px;padding:3px 6px;border-radius:6px;color:var(--muted2)}
.seop-row-btn:hover{background:var(--bg-muted);color:var(--text)}
.seop-check{display:flex;align-items:flex-start;gap:10px;padding:10px 13px;border:1px solid var(--border);border-radius:10px;margin-bottom:7px;background:var(--bg);font-size:13px}
.seop-check input{margin-top:2px;cursor:pointer}
.seop-check.done .seop-check-text{text-decoration:line-through;color:var(--muted2)}
.seop-addbar{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
.seop-addbar .seop-input{flex:1;min-width:220px}
[data-theme="dark"] .seop-delta.up{background:rgba(16,185,129,.15)}
[data-theme="dark"] .seop-delta.down{background:rgba(239,68,68,.15)}

/* ── Lienzo — workspace dividido chat + resultado ── */
.lienzo-panel{position:fixed;top:0;right:0;width:620px;max-width:100vw;height:100vh;background:var(--bg);border-left:1px solid var(--border);z-index:180;transform:translateX(100%);transition:transform .3s var(--ease);display:flex;flex-direction:column}
.lienzo-panel.open{transform:translateX(0);box-shadow:-12px 0 40px rgba(13,15,28,.10)}
.lienzo-header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 18px;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--bg-subtle)}
.lienzo-title{font-size:13px;font-weight:700;display:flex;align-items:center;gap:9px;min-width:0;color:var(--text)}
.lienzo-title-ico{width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,var(--blue),#00B8CE);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.lienzo-title span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lienzo-actions{display:flex;gap:6px;flex-shrink:0}
.lienzo-btn{display:flex;align-items:center;gap:5px;padding:5px 11px;background:var(--bg);border:1px solid var(--border);border-radius:8px;font-size:11px;font-weight:600;color:var(--text-2);cursor:pointer;font-family:var(--font);transition:all .15s var(--ease)}
.lienzo-btn:hover{background:var(--bg-muted);color:var(--text)}
.lienzo-body{flex:1;overflow-y:auto;padding:20px 24px;font-size:13.5px;line-height:1.65;color:var(--text)}
.lienzo-body::-webkit-scrollbar{width:4px}
.lienzo-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.lienzo-body table{width:100%;border-collapse:collapse;margin:12px 0;font-size:12.5px}
.lienzo-body th{background:var(--bg-subtle);text-align:left;padding:8px 10px;border:1px solid var(--border);font-weight:700}
.lienzo-body td{padding:7px 10px;border:1px solid var(--border)}
.lienzo-open-chip{display:inline-flex;align-items:center;gap:7px;margin-top:10px;padding:7px 14px;background:var(--blue-lt);border:1.5px solid var(--blue-md);border-radius:10px;font-size:12px;font-weight:700;color:var(--blue);cursor:pointer;font-family:var(--font);transition:all .15s var(--ease)}
.lienzo-open-chip:hover{background:var(--blue-md);transform:translateY(-1px)}
@media(min-width:1100px){
  body.lienzo-open #view-chat{margin-right:620px;transition:margin-right .3s var(--ease)}
  #view-chat{transition:margin-right .3s var(--ease)}
}
@media(max-width:1099px){.lienzo-panel{width:100vw}}

/* ── Micro-animaciones globales ── */
.msg{animation:msgIn .28s ease both}
@keyframes msgIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.view.active{animation:viewIn .2s ease}
@keyframes viewIn{from{opacity:.4}to{opacity:1}}
.qb{transition:all .15s var(--ease)}
.qb:hover{transform:translateY(-1px)}
@media(prefers-reduced-motion:reduce){.msg,.view.active,.cmdk-overlay.open,.cmdk-box{animation:none}.qb:hover{transform:none}}
.hdr-avatar{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--blue),#5E6AD2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;cursor:pointer;box-shadow:var(--shadow-blue);flex-shrink:0}
.hdr-signout{font-size:12px;color:var(--text-2);cursor:pointer;padding:5px 10px;border-radius:var(--r);border:1px solid var(--border);background:transparent;font-family:var(--font);transition:all .15s}
.hdr-signout:hover{background:var(--bg-subtle);border-color:var(--border-h)}

/* ── TABS ── */
.nav{display:flex;align-items:center;gap:0;padding:0 20px;height:40px;border-bottom:1px solid var(--border);background:var(--bg2);flex-shrink:0}

/* ── LAYOUT ── */
.layout{display:flex;flex:1;overflow:hidden}

/* ── SIDEBAR ── */
.sidebar{width:var(--sb-w);background:var(--bg-subtle);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:10px 8px;gap:1px;overflow-y:auto;flex-shrink:0;scrollbar-width:none;transition:transform .3s var(--ease)}
.sidebar::-webkit-scrollbar{display:none}
.sb-sec{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted2);padding:12px 10px 5px}
.sb-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--r);cursor:pointer;font-size:13px;color:var(--muted);transition:all .15s;border:1px solid transparent}
.sb-item:hover{background:var(--sidebar2);color:var(--text)}
.sb-item.active{background:var(--blue-lt);color:var(--blue);border-color:var(--blue-md);font-weight:500}
.sb-icon{width:22px;height:22px;border-radius:6px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;border:1px solid var(--border)}
.sb-item.active .sb-icon{background:var(--blue-lt);border-color:var(--blue-md)}
.sb-divider{height:1px;background:var(--border);margin:6px 8px}
.sb-agent-header{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--r);cursor:pointer;transition:all .15s;margin-top:2px;user-select:none}
.sb-agent-header.open{background:var(--sidebar2)}
.sb-agent-header:hover{background:var(--sidebar2)}
.sb-agent-dot{width:16px;height:16px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.sb-agent-name{font-size:12px;font-weight:600;color:var(--text);letter-spacing:-.1px;flex:1}
.sb-chevron{color:var(--muted2);transition:transform .2s;flex-shrink:0}
.sb-chevron.open{transform:rotate(180deg)}
.sb-agent-items{display:flex;flex-direction:column;gap:1px;overflow:visible;padding-left:8px}
.sb-collapsed{display:none}
.sb-item{display:flex;align-items:center;gap:7px;padding:7px 10px;border-radius:8px;cursor:pointer;font-size:12px;color:var(--muted);transition:all .15s;border:1px solid transparent}
.sb-item:hover{background:var(--sidebar2);color:var(--text)}
.sb-item.active{background:var(--blue-lt);color:var(--blue);border-color:var(--blue-md);font-weight:500}
.sb-icon-sm{width:4px;height:4px;border-radius:50%;background:var(--border2);flex-shrink:0;margin-left:4px}
.sb-item.active .sb-icon-sm{background:var(--blue)}

.sb-new-conv{display:flex;align-items:center;gap:7px;padding:7px 10px;border-radius:8px;cursor:pointer;font-size:12px;color:var(--blue);font-weight:600;transition:all .15s;border:1px solid var(--blue-md);background:var(--blue-lt);margin:4px 0 2px}
.sb-new-conv:hover{background:#dde0fb}
.sb-section-label{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted2);padding:8px 10px 3px;display:flex;align-items:center;gap:6px}
.sb-section-label::after{content:'';flex:1;height:1px;background:var(--border)}
.sb-hist-section{padding:0;margin:0}
.sb-hist-item{display:flex;align-items:center;gap:7px;padding:6px 10px;border-radius:8px;cursor:pointer;font-size:12px;color:var(--muted);transition:all .15s;border:1px solid transparent;line-height:1.3}
.sb-hist-item:hover{background:var(--sidebar2);color:var(--text)}
.sb-hist-item.active{background:var(--blue-lt);color:var(--blue);border-color:var(--blue-md)}
.sb-hist-dot{width:5px;height:5px;border-radius:50%;background:var(--border2);flex-shrink:0;margin-left:2px}
.sb-hist-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-hist-del{opacity:0;padding:2px 5px;border-radius:4px;color:var(--muted2);font-size:11px;flex-shrink:0;transition:opacity .15s;line-height:1}
.sb-hist-item:hover .sb-hist-del{opacity:1}
.sb-hist-del:hover{color:#EF4444;background:#FEF2F2}
.sb-actions-section{margin-top:2px}
.sb-recents{margin-top:8px;border-top:1px solid var(--border);padding-top:8px}
.sb-recents-list{max-height:220px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border2) transparent}
.sb-recents-label{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted2);padding:4px 10px 6px;display:flex;align-items:center;gap:6px}
.sb-recents-label::after{content:'';flex:1;height:1px;background:var(--border)}
.sb-recent-item{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;cursor:pointer;font-size:12px;color:var(--muted);transition:all .15s;border:1px solid transparent;line-height:1.3}
.sb-recent-item:hover{background:var(--sidebar2);color:var(--text)}
.sb-recent-item.active{background:var(--blue-lt);color:var(--blue);border-color:var(--blue-md)}
.sb-recent-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.sb-recent-badge{font-size:9px;font-weight:600;padding:1px 6px;border-radius:8px;background:var(--sidebar2);color:var(--muted2);flex-shrink:0;white-space:nowrap}
.sb-recent-del{opacity:0;padding:2px 5px;border-radius:4px;color:var(--muted2);font-size:11px;flex-shrink:0;transition:opacity .15s;line-height:1}
.sb-recent-item:hover .sb-recent-del{opacity:1}
.sb-recent-del:hover{color:#EF4444;background:#FEF2F2}
.mem-card{margin-top:auto;background:var(--bg);border:1px solid var(--border);border-radius:var(--rlg);padding:12px 14px}
.mem-title{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted2);margin-bottom:10px}
.mem-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:3px 0;border-bottom:1px solid var(--border2)}
.mem-row:last-child{border-bottom:none}
.mem-label{color:var(--muted)}
.mem-val{font-weight:500;color:var(--text);max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right;font-size:12px}
.mem-stage{color:var(--blue)}

/* ── VIEWS ── */
.view{display:none;flex:1;overflow:hidden;flex-direction:column}
.view.active{display:flex}

/* ── APP LOADER ── */
#app-loader{position:fixed;inset:0;background:var(--bg,#fff);z-index:99999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;transition:opacity .25s}
#app-loader.hidden{opacity:0;pointer-events:none}
.app-loader-logo{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;position:relative}
.app-loader-logo::after{content:"";position:absolute;inset:-6px;border-radius:16px;border:2px solid rgba(0,184,206,.35);animation:agua-ripple 1.6s var(--ease,ease) infinite}
@keyframes agua-ripple{0%{transform:scale(.9);opacity:.8}100%{transform:scale(1.25);opacity:0}}
@media(prefers-reduced-motion:reduce){.app-loader-logo::after{animation:none;display:none}}
.app-loader-spinner{width:22px;height:22px;border:2.5px solid rgba(30,43,204,.15);border-top-color:#1E2BCC;border-right-color:#00B8CE;border-radius:50%;animation:app-spin .7s linear infinite}
@keyframes app-spin{to{transform:rotate(360deg)}}

/* ── HOME ── */
.home-wrap{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding:44px 28px 28px;background:var(--bg);scrollbar-width:none}
.home-wrap::-webkit-scrollbar{display:none}
.home-greeting{font-size:26px;font-weight:800;letter-spacing:-.6px;color:var(--text);margin-bottom:5px;text-align:center;line-height:1.25;animation:fadeUp .45s var(--ease) both}
.home-greeting .accent{color:var(--blue)}
.home-sub{font-size:13.5px;color:var(--text-2);text-align:center;margin-bottom:32px;animation:fadeUp .45s .07s var(--ease) both}
.home-agents{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:740px;margin-bottom:20px;animation:fadeUp .45s .12s var(--ease) both}
@media(max-width:640px){.home-agents{grid-template-columns:repeat(2,1fr);gap:8px}}
.home-agent-card{border:1.5px solid var(--border);border-radius:var(--rlg);padding:17px 16px;cursor:pointer;transition:all .22s var(--ease);background:var(--bg-card);box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
.home-agent-card:hover{border-color:var(--blue-md);box-shadow:0 4px 12px rgba(13,15,28,.08),0 0 0 3px var(--blue-dim);transform:translateY(-2px)}
.home-agent-card.coming{opacity:.55;cursor:default}
.home-agent-card.coming:hover{border-color:var(--border);box-shadow:var(--shadow-sm);transform:none}
.cs-badge{position:absolute;top:10px;right:10px;font-size:9px;font-weight:700;letter-spacing:.3px;background:var(--bg-muted);color:var(--text-3);padding:2px 8px;border-radius:10px;text-transform:uppercase;border:1px solid var(--border)}
.home-divider{display:flex;align-items:center;gap:10px;width:100%;max-width:740px;margin-bottom:12px;animation:fadeUp .45s .17s var(--ease) both}
.home-divider span{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);white-space:nowrap}
.home-divider::before,.home-divider::after{content:'';flex:1;height:1px;background:var(--border)}
.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:740px;margin-bottom:24px;animation:fadeUp .45s .2s var(--ease) both}
.quick-card{background:var(--bg-subtle);border:1.5px solid var(--border);border-radius:var(--r);padding:13px 14px;cursor:pointer;transition:all .18s var(--ease);display:flex;align-items:flex-start;gap:10px}
.quick-card:hover{border-color:var(--blue-md);background:var(--blue-lt);transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.quick-icon{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;background:var(--bg);border:1px solid var(--border);box-shadow:var(--shadow-sm)}
.quick-title{font-size:12px;font-weight:600;color:var(--text);margin-bottom:2px}
.quick-sub{font-size:10.5px;color:var(--text-2);line-height:1.4}
@media(max-width:640px){.quick-grid{grid-template-columns:repeat(2,1fr)}}
.home-agent-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:11px;border:1px solid rgba(0,0,0,.06)}
.home-agent-name{font-size:12.5px;font-weight:700;color:var(--text);margin-bottom:3px;letter-spacing:-.1px}
.home-agent-desc{font-size:11px;color:var(--text-2);line-height:1.45}
.home-or{font-size:10px;color:var(--muted2);text-align:center;margin-bottom:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;width:100%;max-width:740px}
.home-cin-wrap{width:100%;max-width:740px;animation:fadeUp .45s .24s var(--ease) both}
.home-cin-box{display:flex;align-items:flex-end;gap:8px;background:var(--bg);border:1.5px solid var(--border);border-radius:14px;padding:10px 12px;transition:border-color .15s,box-shadow .15s;box-shadow:var(--shadow-sm)}
.home-cin-box:focus-within{border-color:var(--blue-mid);box-shadow:var(--shadow-sm),0 0 0 3px var(--blue-ring)}
.home-cin-box textarea{flex:1;border:none;outline:none;font-family:var(--font);font-size:14px;color:var(--text);resize:none;background:transparent;line-height:1.5;max-height:120px}
.home-cin-box textarea::placeholder{color:var(--text-3)}
.home-send-btn{width:34px;height:34px;border-radius:9px;background:var(--blue);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s}
.home-send-btn:hover{background:var(--blue-h)}
.home-send-btn svg{width:15px;height:15px;fill:none;stroke:white;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ── CHAT ── */
.chat-area{flex:1;overflow-y:auto;padding:24px 28px;display:flex;flex-direction:column;gap:18px;scroll-behavior:smooth;background:var(--bg)}
.chat-area::-webkit-scrollbar{width:4px}
.chat-area::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

.msg{display:flex;gap:10px;max-width:820px;animation:msgIn .3s var(--ease) both}
.msg.user{flex-direction:row-reverse;align-self:flex-end;max-width:70%}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.av{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}.av.ag svg{width:30px;height:30px;border-radius:8px;display:block}
.av.ag{background:var(--blue-lt);color:var(--blue);border:1.5px solid var(--blue-md);overflow:visible}
.av.usr{background:var(--bg-muted);color:var(--text-2);border:1px solid var(--border)}

.bubble{border-radius:var(--rlg);padding:12px 16px;font-size:15px;line-height:1.65;color:var(--text)}
.bubble.ag-bubble{background:var(--bg);border:1px solid var(--border);border-radius:4px var(--rlg) var(--rlg) var(--rlg);box-shadow:var(--shadow-sm)}
.bubble.usr-bubble{background:var(--blue);color:#fff;border-radius:var(--rlg) 4px var(--rlg) var(--rlg);box-shadow:var(--shadow-blue)}
.bubble strong,.bubble b{font-weight:600;color:var(--blue)}
.usr-bubble strong,.usr-bubble b{color:rgba(255,255,255,.9)}
.bubble code{font-family:monospace;font-size:12px;background:var(--blue-lt);color:var(--blue);padding:1px 5px;border-radius:4px}
/* Social action cards */
.sac-card{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--border);background:var(--bg);cursor:pointer;text-align:left;font-family:var(--font);transition:all .15s;width:100%}
.sac-card:hover{border-color:var(--blue);background:var(--blue-lt);transform:translateY(-1px)}
[style*="cursor:zoom-in"]:hover .lb-zoom-icon{opacity:1!important}
.sac-icon{font-size:15px;line-height:1;margin-bottom:2px}
.sac-title{font-size:12px;font-weight:600;color:var(--text);line-height:1.3}
.sac-desc{font-size:11px;color:var(--muted);line-height:1.3}
.bubble ul{padding-left:16px;margin:4px 0}
.bubble li{margin:3px 0;color:var(--muted)}
.bubble li b{color:var(--text)}
.bubble h4{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:10px 0 4px}
.bubble p+p{margin-top:6px}

/* Thinking */
.thinking-bbl{background:var(--bg);border:1px solid var(--border);border-radius:4px var(--rlg) var(--rlg) var(--rlg);padding:12px 16px;display:flex;align-items:center;gap:10px;font-size:15px;color:var(--muted)}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--blue);border-right-color:var(--aqua);border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0}

/* ── VARIACIONES DE ANUNCIO ── */
.var-upload-zone{border:2px dashed var(--border);border-radius:12px;padding:28px 20px;text-align:center;cursor:pointer;transition:all .2s;background:var(--sidebar)}
.var-upload-zone:hover,.var-upload-zone.drag-over{border-color:var(--blue);background:var(--blue-lt)}
.var-upload-zone.has-image{border-style:solid;border-color:var(--blue);background:var(--blue-lt);padding:14px}
.var-preview-img{width:100%;max-height:160px;object-fit:contain;border-radius:8px;display:block}
.var-count-chip{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;border:1.5px solid var(--border);font-size:13px;font-weight:700;cursor:pointer;transition:all .15s;background:white;color:var(--muted)}
.var-count-chip.selected{background:var(--blue);color:white;border-color:var(--blue)}
.var-style-btn{flex:1;padding:10px 8px;border:1.5px solid var(--border);border-radius:8px;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;background:white;text-align:center;color:var(--muted)}
.var-style-btn.selected{border-color:var(--blue);background:var(--blue-lt);color:var(--blue)}

/* Onboarding card */
.ob-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--rlg);padding:22px 24px;max-width:520px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.ob-title{font-size:17px;font-weight:600;margin-bottom:3px}
.ob-sub{font-size:12px;color:var(--muted);margin-bottom:16px}
.prog-bar{height:3px;background:var(--border2);border-radius:3px;margin-bottom:20px;overflow:hidden}
.prog-fill{height:100%;background:var(--blue);border-radius:3px;transition:width .4s ease}
.step-lbl{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--blue);margin-bottom:5px}
.step-q{font-size:16px;font-weight:500;margin-bottom:14px;line-height:1.4}
.finput{width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:var(--r);padding:10px 13px;font-size:16px;color:var(--text);font-family:var(--font);outline:none;transition:border-color .15s}
.finput:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-dim)}
.finput::placeholder{color:var(--muted2)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.opt{background:var(--bg);border:1.5px solid var(--border);border-radius:var(--r);padding:9px 11px;font-size:14px;color:var(--muted);cursor:pointer;text-align:left;transition:all .15s;font-family:var(--font);line-height:1.4}
.opt:hover{border-color:var(--blue);color:var(--text)}
.opt.sel{border-color:var(--blue);background:var(--blue-lt);color:var(--blue);font-weight:500}
.step-nav{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.btn{padding:8px 16px;border-radius:var(--r);font-size:14px;font-weight:500;cursor:pointer;font-family:var(--font);transition:all .15s;border:1px solid transparent}
.btn-p{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn-p:hover{background:var(--blue-h)}
.btn-p:disabled{opacity:.4;cursor:not-allowed}
.btn-g{background:transparent;color:var(--muted);border-color:var(--border2)}
.btn-g:hover{background:var(--sidebar);color:var(--text)}

/* Chat input */
.cin-area{border-top:1px solid var(--border);padding:14px 20px;background:var(--bg);flex-shrink:0}
.qa{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.qb{padding:5px 12px;border-radius:20px;font-size:13px;border:1px solid var(--border2);background:var(--bg);color:var(--muted);cursor:pointer;font-family:var(--font);transition:all .15s}
.qb:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-lt)}
.attach-wrap{position:relative;flex-shrink:0}
.attach-btn{background:none;border:none;cursor:pointer;padding:6px 8px;border-radius:8px;color:var(--muted);display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0}
.attach-btn:hover{background:var(--blue-lt);color:var(--blue)}
.attach-btn.active{background:var(--blue-lt);color:var(--blue)}
.attach-btn.has-img{color:var(--blue);background:var(--blue-lt)}
.attach-menu{
  display:none;position:absolute;bottom:calc(100% + 8px);left:0;
  background:var(--bg);border:1px solid var(--border);border-radius:12px;
  box-shadow:0 4px 20px rgba(0,0,0,.12);min-width:180px;
  padding:6px;z-index:100;
}
.attach-menu.open{display:block}
.attach-opt{
  width:100%;display:flex;align-items:center;gap:10px;
  background:none;border:none;cursor:pointer;
  padding:9px 12px;border-radius:8px;
  font-size:14px;font-weight:500;color:var(--text);
  font-family:var(--font);text-align:left;transition:background .1s;
}
.attach-opt:hover{background:var(--bg2)}
.attach-opt svg{color:var(--muted);flex-shrink:0}
.cin-wrap{display:flex;gap:8px;align-items:flex-end;background:var(--bg);border:1.5px solid var(--border);border-radius:var(--rlg);padding:8px 12px;transition:border-color .15s}
.cin-wrap:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-dim)}
.cin{flex:1;background:transparent;border:none;outline:none;font-family:var(--font);font-size:16px;color:var(--text);resize:none;max-height:120px;min-height:22px;line-height:1.5}
.cin::placeholder{color:var(--muted2)}
.sbtn{width:32px;height:32px;border-radius:8px;background:var(--blue);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:opacity .15s}
.sbtn:hover{opacity:.85}
.sbtn:disabled{opacity:.3;cursor:not-allowed}
.sbtn svg{width:13px;height:13px;fill:white}

/* ── ROADMAP ── */
.rm-view{flex:1;overflow-y:auto;padding:24px 28px;background:var(--bg)}
.rm-view::-webkit-scrollbar{width:4px}
.rm-view::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

.stage-selector{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.stage-btn{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:1.5px solid var(--border2);background:var(--bg);color:var(--muted);font-family:var(--font);transition:all .15s}
.stage-btn:hover{border-color:var(--blue);color:var(--blue)}
.stage-btn.active{background:var(--blue);color:#fff;border-color:var(--blue)}

.stage-panel{display:none}
.stage-panel.active{display:block}

.stage-hero{background:var(--bg);border:1px solid var(--border);border-radius:var(--rlg);padding:18px 22px;margin-bottom:14px}
.stage-hero-header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.stage-period-pill{padding:4px 12px;border-radius:20px;font-size:11px;font-weight:600;flex-shrink:0}
.stage-hero-title{font-size:16px;font-weight:600}
.stage-hero-desc{font-size:13px;color:var(--muted);line-height:1.65}
.stage-alert{display:flex;gap:8px;align-items:flex-start;background:#FEF3C7;border:1px solid #FDE68A;border-radius:var(--r);padding:10px 12px;margin-top:10px;font-size:12px;color:#92400E;line-height:1.5}

.metrics-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.metric-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px}
.metric-label{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}
.metric-val{font-size:20px;font-weight:700;font-family:monospace}
.metric-sub{font-size:11px;color:var(--muted);margin-top:3px}
.mv-blue{color:var(--blue)}.mv-green{color:var(--success)}.mv-amber{color:var(--warning)}.mv-red{color:var(--danger)}

.checklist-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.checklist-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--rlg);padding:14px 16px}
.cl-header{display:flex;align-items:center;gap:7px;margin-bottom:10px}
.cl-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.cl-title{font-size:12px;font-weight:600}
.cl-item{display:flex;align-items:flex-start;gap:8px;padding:6px 0;border-bottom:1px solid var(--border2);font-size:12px;cursor:pointer;transition:all .15s}
.cl-item:last-child{border-bottom:none}
.cl-item:hover{color:var(--text)}
.cl-check{width:16px;height:16px;border:1.5px solid var(--border2);border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s;margin-top:1px;background:var(--bg)}
.cl-item.done .cl-check{background:var(--success);border-color:var(--success)}
.cl-item.done .cl-text{color:var(--muted);text-decoration:line-through}
.cl-check-mark{width:8px;height:8px;display:none}
.cl-item.done .cl-check-mark{display:block}
.cl-text{line-height:1.4;color:var(--muted)}
.cl-text b{color:var(--text);font-weight:500}
.cl-badge{font-size:10px;padding:1px 6px;border-radius:10px;flex-shrink:0;margin-top:2px}
.cb-red{background:#FEF2F2;color:var(--danger)}.cb-blue{background:var(--blue-lt);color:var(--blue)}.cb-green{background:#ECFDF5;color:var(--success)}.cb-amber{background:#FFFBEB;color:var(--warning)}

.ask-agent-btn{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--blue-lt);border:1px solid var(--blue-md);border-radius:var(--r);font-size:12px;color:var(--blue);cursor:pointer;font-family:var(--font);width:100%;text-align:left;transition:all .15s;margin-top:4px;font-weight:500}
.ask-agent-btn:hover{background:var(--blue-md)}

/* Progress tracker */
.progress-track{background:var(--bg);border:1px solid var(--border);border-radius:var(--rlg);padding:14px 18px;margin-bottom:14px}
.pt-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.pt-title{font-size:12px;font-weight:600}
.pt-count{font-size:12px;color:var(--muted);font-family:monospace}
.pt-bar{height:4px;background:var(--border2);border-radius:4px;overflow:hidden}
.pt-fill{height:100%;background:var(--blue);border-radius:4px;transition:width .4s ease}
.pt-stages{display:flex;gap:0;margin-top:14px}
.pt-stage{flex:1;text-align:center;position:relative}
.pt-stage::before{content:'';position:absolute;top:6px;left:50%;right:-50%;height:2px;background:var(--border2);z-index:0}
.pt-stage:last-child::before{display:none}
.pt-stage-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--border2);background:var(--bg);margin:0 auto 5px;position:relative;z-index:1;transition:all .3s}
.pt-stage.done .pt-stage-dot{background:var(--success);border-color:var(--success)}
.pt-stage.current .pt-stage-dot{background:var(--blue);border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-dim)}
.pt-stage-label{font-size:10px;color:var(--muted)}
.pt-stage.done .pt-stage-label,.pt-stage.current .pt-stage-label{color:var(--text);font-weight:500}

/* Limit banner */
.limit-banner{margin:8px 0;padding:14px 16px;background:#FFFBEB;border:1px solid #FDE68A;border-radius:var(--rlg);font-size:13px;color:#92400E}
.limit-banner a{display:inline-block;margin-top:8px;padding:6px 14px;background:var(--blue);color:#fff;border-radius:8px;font-size:12px;text-decoration:none;font-weight:500}

/* Pills */
.pill-dia{background:#FEF2F2;color:var(--danger)}
.pill-semana{background:var(--blue-lt);color:var(--blue)}
.pill-quincena{background:#FFFBEB;color:var(--warning)}
.pill-mes{background:#ECFDF5;color:var(--success)}
.pill-trimestre{background:#F5F3FF;color:#7C3AED}
.pill-semestre{background:var(--sidebar);color:var(--muted)}



/* Hoja de ruta — ítem destacado en sidebar */
.sb-roadmap {
  color: var(--blue) !important;

/* ═══════════════════════════════════════════
   RESPONSIVE — Mobile First
   Breakpoints: sm=480 md=768 lg=1024
═══════════════════════════════════════════ */

/* ── SIDEBAR MOBILE OVERLAY ── */
#sb-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.4);
  z-index: 99;
}
#sb-overlay.open { display: block; }

/* ── MOBILE NAV TOGGLE ── */
.mob-menu-btn {
  display: none;
  width: 36px; height: 36px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: var(--r);
  cursor: pointer;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background .15s;
}
.mob-menu-btn:hover { background: var(--sidebar); }

/* ── TABLET (≤1024px) ── */
@media (max-width: 1024px) {
  .sidebar { width: 260px; }
  .rm-panel { width: 440px; }
}

/* ── TABLET PORTRAIT / LARGE PHONE (≤768px) ── */
@media (max-width: 768px) {
  /* Header */
  /* La cabecera no cabía en un iPhone: el logotipo largo y el selector de
     cliente se comían el ancho, «salir» salía cortado y el botón de menú se
     encogía hasta desaparecer. En móvil manda otro reparto. */
  .hdr { padding: 0 10px; padding-top: env(safe-area-inset-top); height: calc(52px + env(safe-area-inset-top)); gap: 6px; }
  .hdr-logo-img { display: none; }                 /* el logotipo largo, fuera */
  .hdr-logo .hdr-logo-mark { display: block; }    /* la marca cuadrada, dentro */
  .mob-menu-btn { order: -1; }                     /* el menú, siempre lo primero */
  .hdr-badge { display: none; }                    /* el plan se ve en Configuración */
  #cmdk-hint-btn { display: none; }                /* ⌘K no existe sin teclado */
  .hdr-right { gap: 6px; min-width: 0; }
  #hdr-client-switch { margin-left: 2px !important; flex: 1 1 auto; max-width: none; min-width: 0; }
  #hdr-client-btn { width: 100%; padding: 5px 8px; }
  .hdr-logo .hdr-logo-img { height: 46px; }
  .hdr-user { display: none; }
  .hdr-sep { display: none; }
  .hdr-badge { font-size: 10px; padding: 2px 7px; }
  .mob-menu-btn { display: flex; }

  /* Nav pill */
  .nav { padding: 0 12px; height: 36px; }
  #nav-agent-title { font-size: 11px; padding: 3px 10px; }

  /* Layout: sidebar oculto en mobile */
  .layout { position: relative; overflow: hidden; }

  .sidebar {
    position: fixed;
    top: 0; left: 0;
    width: 260px;
    height: 100vh;
    z-index: 100;
    transform: translateX(-100%);
    transition: transform .3s ease;
    padding-top: 60px;
    border-right: 1px solid var(--border);
    box-shadow: 4px 0 24px rgba(0,0,0,.12);
  }
  .sidebar.mob-open { transform: translateX(0); }

  /* Views ocupan todo el ancho */
  .view { width: 100%; }

  /* Chat */
  .chat-area { padding: 16px; gap: 12px; }
  .msg { max-width: 100%; }
  .msg.user { max-width: 85%; }
  .bubble { font-size: 13px; padding: 10px 14px; }
  .ob-card { padding: 16px; }
  .opts { grid-template-columns: 1fr; }

  /* Input area */
  .cin-area { padding: 10px 12px; }
  .qa { gap: 4px; flex-wrap: wrap; }
  .qb { font-size: 11px; padding: 4px 10px; }

  /* Roadmap panel */
  .rm-panel { width: 100%; max-width: 100%; }

  /* Onboarding card */
  .ob-card { margin: 0 0 12px; }
  .step-nav { flex-direction: row; }

  /* Checklist grid */
  .checklist-grid { grid-template-columns: 1fr; }
  .metrics-row { grid-template-columns: 1fr 1fr; }

  /* Header avatar */
  .hdr-avatar { width: 28px; height: 28px; font-size: 10px; }
  .hdr-signout { font-size: 11px; padding: 4px 8px; }
  .academia-hdr-label { display: none; }
}


/* ── FIXES MÓVIL (auditoría jul 2026) ───────────────────────────── */
@media (max-width: 768px) {
  /* El fondo del sidebar era inalcanzable: 100vh incluye la zona bajo la
     barra del navegador móvil. dvh + colchón inferior con safe-area. */
  .sidebar { height: 100dvh; padding-top: calc(60px + env(safe-area-inset-top)); padding-bottom: calc(110px + env(safe-area-inset-bottom)); -webkit-overflow-scrolling: touch; }
  /* Selector de cliente compacto en el header */
  #hdr-client-switch { margin-left: 4px; min-width: 0; flex: 0 1 auto; max-width: 44vw; }
  #hdr-client-btn { max-width: 100%; padding: 5px 9px; gap: 5px; }
  #hdr-client-btn > span { display: none; }
  #hdr-client-menu { position: fixed; left: 10px; right: 10px; top: 56px; min-width: 0; }
  /* Tabs de módulo: fila deslizable, nunca cortada */
  .crm-toolbar { flex-wrap: wrap; row-gap: 8px; padding: 10px 12px 8px; }
  .crm-view-toggle { overflow-x: auto; max-width: 100%; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .crm-view-toggle::-webkit-scrollbar { display: none; }
  #crm-mod-crumb { font-size: 12px; }
  /* Chips de acciones del agente: fila deslizable */
  #agent-chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding: 0 10px 6px; -webkit-overflow-scrolling: touch; }
  #agent-chips::-webkit-scrollbar { display: none; }
  .agent-chip { flex-shrink: 0; }
  /* Academia ya vive en el sidebar — liberar espacio del header */
  .hdr-academia-btn { display: none !important; }
}

/* ── SMALL PHONE (≤480px) ── */

@media (max-width: 768px) {
  body { height: 100svh; }
  .view.active { height: calc(100svh - 52px - 36px); display: flex; flex-direction: column; }
  .chat-area { flex: 1; min-height: 0; }
  /* Evitar que el contenido quede debajo de la barra de navegación del browser */
  .cin-area { padding-bottom: max(10px, env(safe-area-inset-bottom)); }
}

@media (max-width: 480px) {
  .hdr { padding: 0 10px; height: 48px; }
  .hdr-logo .hdr-logo-img { height: 40px; max-width: 130px; }
  .hdr-badge { display: none; }

  .chat-area { padding: 12px; gap: 10px; }
  .bubble { font-size: 12.5px; padding: 9px 12px; }
  .av { width: 26px; height: 26px; }
  .av.ag svg { width: 26px; height: 26px; }

  .cin { font-size: 13px; }
  .cin-area { padding: 8px 10px; }
  .qb { font-size: 10px; padding: 3px 9px; }

  .ob-card { padding: 14px; }
  .ob-title { font-size: 14px; }
  .step-q { font-size: 13px; }
  .finput { padding: 9px 12px; font-size: 13px; }
  .btn { padding: 8px 14px; font-size: 12px; }

  .metrics-row { grid-template-columns: 1fr 1fr; gap: 6px; }
  .metric-val { font-size: 16px; }

  .rm-panel-body { padding: 12px 14px; }
}
