<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banco de pruebas · Plataformas de pauta</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!--
  Banco de pruebas de Marketing → Plataformas de pauta (pestaña Diagnóstico).

  Carga el CSS de public/index.html y las FUNCIONES de public/app.js tal cual,
  y solo cambia el servidor por uno de mentira. Los hallazgos de ejemplo son
  los que dio el diagnóstico contra las cuentas reales el 28-09-2026.

  Arrancar con:  PUERTO=4183 node pruebas/servidor-boceto.mjs
  y abrir http://localhost:4183/pruebas/banco-pauta.html
-->
<style id="estilos-reales"></style>
<style>
  body{margin:0;font-family:'Outfit',sans-serif;background:var(--bg-subtle,#F7F8FC);color:var(--text,#0D0F1C)}
  /* Igual que en index.html: con overflow, el contenedor no se ensancha con su contenido. */
  #crm-pauta-view{padding:18px 22px;max-width:1180px;margin:0 auto 60px;overflow-y:auto}
  .banco{position:fixed;bottom:0;left:0;right:0;background:var(--text,#111);color:#fff;padding:8px 14px;
    display:flex;gap:12px;align-items:center;justify-content:center;font-size:12px;z-index:9000;flex-wrap:wrap}
  .banco button{background:rgba(255,255,255,.14);color:#fff;border:none;border-radius:7px;padding:5px 10px;
    font-family:inherit;font-size:12px;cursor:pointer}
  .banco span{opacity:.55}
  #toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--text,#111);color:#fff;
    padding:10px 16px;border-radius:10px;font-size:13px;z-index:9999;display:none}
  #toast.err{background:var(--danger,#DC2626)}
</style>
</head>
<body>
<div id="crm-pauta-view"></div>
<div id="toast"></div>
<div class="banco">
  <span>BANCO · diagnóstico:</span>
  <button onclick="escenario('real')">con hallazgos</button>
  <button onclick="escenario('limpio')">todo en orden</button>
  <button onclick="escenario('caida')">una cuenta caída</button>
  <button onclick="escenario('comercial')">sin permiso de pausar</button>
  <button onclick="escenario('sin')">sin cuentas</button>
</div>

<script>
let ESC = 'real';
const HALLAZGOS = [
  { tipo: 'error', gravedad: 'alta', clave: 'anuncio_rechazado', red: 'google', campana: { id: '1', nombre: 'SRCH_Leads_SpaCanino_Bogota_2026', conexion_id: 'g' },
    titulo: '2 anuncios rechazados en «SRCH_Leads_SpaCanino_Bogota_2026»',
    detalle: 'Anuncio del grupo Peluquería y Baño Canino: la dirección que se muestra no coincide con la de destino; la página de destino no carga o da error · Anuncio del grupo Spa Canino: la dirección que se muestra no coincide con la de destino; la página de destino no carga o da error. Un anuncio rechazado no entrega; corrígelo o reemplázalo en Google.' },
  { tipo: 'error', gravedad: 'alta', clave: 'no_entrega', red: 'google', campana: { id: '2', nombre: 'Leads abril', conexion_id: 'g' },
    titulo: '«Leads abril» está activa pero no ha salido en 7 días',
    detalle: 'Cero impresiones en la última semana. Revisa en Google el método de pago, que tenga anuncios aprobados y que el público y el presupuesto no sean demasiado pequeños.' },
  { tipo: 'error', gravedad: 'alta', clave: 'gasto_sin_leads', red: 'meta', campana: { id: '3', nombre: 'Formulario Octubre', conexion_id: 'm' },
    titulo: '«Formulario Octubre» gastó $ 184.000 y no trajo ningún lead',
    detalle: 'Con lo que gastó, al costo medio de tu cuenta tendrían que haber entrado unos 9 leads. Revisa que el formulario o la página funcionen, y que la campaña apunte al objetivo correcto.',
    accion: { tipo: 'pausar', red: 'meta', conexion_id: 'm', campana_id: '3' } },
  { tipo: 'oportunidad', gravedad: 'media', clave: 'cpl_alto', red: 'meta', campana: { id: '4', nombre: 'Remarketing web', conexion_id: 'm' },
    titulo: 'Cada lead de «Remarketing web» cuesta 2,7 veces el promedio',
    detalle: '$ 54.000 por lead, contra $ 20.000 de media en tu cuenta. Mover parte de su presupuesto a las campañas que convierten más barato te daría más leads con el mismo dinero.' },
  { tipo: 'oportunidad', gravedad: 'media', clave: 'frecuencia_alta', red: 'meta', campana: { id: '5', nombre: 'Alcance Bogotá', conexion_id: 'm' },
    titulo: 'El público de «Alcance Bogotá» ya se cansó del anuncio',
    detalle: 'Cada persona lo vio 4,6 veces en 7 días. A partir de 3,5 suele subir el costo y bajar la respuesta: renueva los creativos o amplía el público.' },
  { tipo: 'oportunidad', gravedad: 'media', clave: 'leads_sin_atender', red: 'meta', campana: { id: '6', nombre: 'Formulario Septiembre', conexion_id: 'm' },
    titulo: '4 leads de «Formulario Septiembre» llevan más de 3 días sin atender',
    detalle: 'Ya pagaste por ellos. Un lead que nadie contacta en la primera semana casi nunca se recupera.' },
  { tipo: 'bien', gravedad: 'baja', clave: 'cpl_bueno', red: 'google', campana: { id: '7', nombre: 'SRCH_Marca', conexion_id: 'g' },
    titulo: '«SRCH_Marca» trae leads a mitad de precio',
    detalle: '$ 8.000 por lead (12 leads), contra $ 20.000 de media. Si su presupuesto se agota, es la primera candidata para crecer.' },
];
function respuestaDiag() {
  const cuentas = [{ id: 'g', red: 'google', nombre: 'Tierra de Mascotas', error: null }, { id: 'm', red: 'meta', nombre: 'Acuarius', error: null }];
  if (ESC === 'sin') return { cuentas: [], hallazgos: [], revisadas: 0 };
  if (ESC === 'limpio') return { cuentas, hallazgos: [], revisadas: 6, puede_pausar: true, desde: '2026-08-30', hasta: '2026-09-28' };
  if (ESC === 'caida') return { cuentas: [cuentas[0], { ...cuentas[1], error: 'El permiso de esta cuenta caducó. Hay que volver a conectarla.' }],
    hallazgos: HALLAZGOS.slice(0, 2), revisadas: 3, puede_pausar: true, desde: '2026-08-30', hasta: '2026-09-28' };
  return { cuentas, hallazgos: HALLAZGOS, revisadas: 11, puede_pausar: ESC !== 'comercial', desde: '2026-08-30', hasta: '2026-09-28' };
}
function escenario(e) { ESC = e; if (typeof pautaCargar === 'function') pautaCargar(); }
const resp = (ok, d) => Promise.resolve({ ok, status: ok ? 200 : 500, json: () => Promise.resolve(d) });

const STUBS = `
var crmSetView = function (v) {};
var NAV_TABS = { crm: [], marketing: [] }, NAV_TAB2MOD = {}, NAV_TAB_LABELS = {}, NAV_ALL_TABS = [];
function crmAmbitoCliente() { return ''; }
function showToast(m, t) {
  var e = document.getElementById('toast');
  e.textContent = m; e.className = t === 'error' ? 'err' : ''; e.style.display = 'block';
  clearTimeout(window._tt); window._tt = setTimeout(function () { e.style.display = 'none'; }, 2600);
}
async function fetchAuth(url, opts) {
  await new Promise(function (r) { setTimeout(r, 150); });
  if (opts && opts.method === 'POST') return resp(true, { ok: true, campana: 'Formulario Octubre' });
  if (url.indexOf('diagnostico=1') >= 0) return resp(true, respuestaDiag());
  return resp(true, { conexiones: [], campanas: [], totales: {} });
}
`;

(async function montar() {
  const html = await (await fetch('/public/index.html')).text();
  const js = await (await fetch('/public/app.js')).text();
  document.getElementById('estilos-reales').textContent = (html.match(/<style>([\s\S]*?)<\/style>/) || ['', ''])[1];
  const trozo = (desde, hasta) => {
    const a = js.indexOf(desde);
    const b = hasta ? js.indexOf(hasta, a) : js.length;
    if (a < 0) throw new Error('No encontré en app.js: ' + desde);
    return js.slice(a, b > a ? b : js.length);
  };
  const s = document.createElement('script');
  s.textContent = [
    (js.match(/function esc\(t\)\{.*\n/) || [''])[0],
    trozo('const ICN_PATHS = {', '\n}\n') + '\n}\n',
    trozo('function emptyAgua(', '// ── AUTOMATIZACIONES DEL CRM'),
    STUBS,
    // Acotado entre dos marcadores: si alguien mueve secciones, se ajusta aquí.
    trozo('// ══ PLATAFORMAS DE PAUTA ═', '// ══ RESERVAS ═'),
    "pautaVista = 'diagnostico'; pautaRender();",
  ].join('\n');
  document.body.appendChild(s);
})().catch(e => {
  document.getElementById('crm-pauta-view').innerHTML = '<pre style="color:#b91c1c">El banco no arrancó: ' + (e && e.message) + '</pre>';
});
</script>
</body>
</html>
