<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Propuesta comercial</title>

<style>
  :root{--blue:#1E2BCC;--aqua:#22D3EE;--text:#1a1a2e;--muted:#6b7280;--border:#e5e7eb;--bg:#f6f7fb}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:Georgia,'Times New Roman',serif;background:var(--bg);color:var(--text);line-height:1.7;-webkit-font-smoothing:antialiased}
  .wrap{max-width:720px;margin:0 auto;padding:40px 22px 80px}
  .doc{background:#fff;border-radius:18px;box-shadow:0 10px 40px rgba(30,43,204,.07);padding:56px 58px;position:relative;overflow:hidden}
  .doc::before{content:'';position:absolute;top:0;left:0;right:0;height:5px;background:linear-gradient(90deg,var(--blue),var(--aqua))}
  .brand{display:flex;align-items:center;gap:9px;font-family:Arial,Helvetica,sans-serif;font-size:13px;font-weight:700;letter-spacing:.02em;color:var(--muted);margin-bottom:34px}
  .brand-dot{width:11px;height:11px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--aqua))}
  h1{font-size:29px;line-height:1.25;letter-spacing:-.01em;margin:0 0 8px}
  .meta{font-family:Arial,Helvetica,sans-serif;font-size:12.5px;color:var(--muted);margin-bottom:26px}
  .rule{height:2.5px;background:linear-gradient(90deg,var(--blue),var(--aqua));border:none;border-radius:2px;margin:0 0 30px;width:64px}
  h2{font-family:Arial,Helvetica,sans-serif;font-size:15px;text-transform:uppercase;letter-spacing:.08em;color:var(--blue);margin:34px 0 12px}
  p{margin:0 0 15px;font-size:16.5px}
  ul,ol{margin:0 0 15px 22px;font-size:16.5px}
  li{margin-bottom:7px}
  strong{color:#000}
  .amount-box{background:linear-gradient(135deg,#eef0fd,#e6fbff);border-radius:14px;padding:20px 24px;margin:26px 0;font-family:Arial,Helvetica,sans-serif}
  .amount-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:4px}
  .amount-val{font-size:28px;font-weight:800;color:var(--blue)}
  .cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:38px;font-family:Arial,Helvetica,sans-serif}
  .btn{flex:1;min-width:200px;text-align:center;padding:15px 22px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;border:none;text-decoration:none;transition:transform .12s,box-shadow .12s;font-family:inherit}
  .btn:hover{transform:translateY(-1px)}
  .btn-accept{background:var(--blue);color:#fff;box-shadow:0 6px 18px rgba(30,43,204,.25)}
  .btn-pay{background:#10B981;color:#fff;box-shadow:0 6px 18px rgba(16,185,129,.25)}
  .status-banner{font-family:Arial,Helvetica,sans-serif;border-radius:12px;padding:14px 20px;margin-top:30px;font-size:14.5px;font-weight:600;text-align:center}
  .status-accepted{background:#ECFDF5;color:#059669}
  .foot{text-align:center;font-family:Arial,Helvetica,sans-serif;font-size:11.5px;color:#9ca3af;margin-top:26px}
  .foot a{color:#9ca3af}
  .loading,.error{text-align:center;padding:110px 20px;font-family:Arial,Helvetica,sans-serif;color:var(--muted)}
  @media(max-width:640px){.doc{padding:36px 24px}h1{font-size:24px}}
</style>
</head>
<body>
<div class="wrap">
  <div id="state" class="loading">Cargando propuesta…</div>
  <div id="doc" class="doc" style="display:none">
    <div class="brand"><span class="brand-dot"></span><span id="p-business">Propuesta comercial</span></div>
    <h1 id="p-title"></h1>
    <div class="meta" id="p-meta"></div>
    <hr class="rule">
    <div id="p-content"></div>
    <div class="amount-box" id="p-amount-box" style="display:none">
      <div class="amount-label">Inversión</div>
      <div class="amount-val" id="p-amount"></div>
    </div>
    <div class="cta" id="p-cta"></div>
    <div id="p-status"></div>
  </div>
  <div class="foot">Propuesta generada con <a href="https://acuarius.app" target="_blank">Acuarius</a></div>
</div>
<script>
(function () {
  var m = location.pathname.match(/^\/p\/([a-f0-9]{32})$/);
  var token = m ? m[1] : new URLSearchParams(location.search).get('t');
  var state = document.getElementById('state');
  if (!token) { state.className = 'error'; state.textContent = 'Enlace de propuesta inválido.'; return; }

  // Mini-renderer de markdown (títulos, negrita, listas, párrafos)
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function md(src) {
    var lines = esc(src).split('\n');
    var html = '', inUl = false, inOl = false;
    function closeLists() { if (inUl) { html += '</ul>'; inUl = false; } if (inOl) { html += '</ol>'; inOl = false; } }
    for (var i = 0; i < lines.length; i++) {
      var l = lines[i];
      var t = l.trim();
      if (!t) { closeLists(); continue; }
      var inline = t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      if (/^# /.test(t)) { closeLists(); continue; } // el H1 va aparte (título)
      else if (/^## /.test(t)) { closeLists(); html += '<h2>' + inline.slice(3) + '</h2>'; }
      else if (/^[-–•] /.test(t)) { if (!inUl) { closeLists(); html += '<ul>'; inUl = true; } html += '<li>' + inline.slice(2) + '</li>'; }
      else if (/^\d+[.)] /.test(t)) { if (!inOl) { closeLists(); html += '<ol>'; inOl = true; } html += '<li>' + inline.replace(/^\d+[.)] /, '') + '</li>'; }
      else { closeLists(); html += '<p>' + inline + '</p>'; }
    }
    closeLists();
    return html;
  }

  fetch('/api/proposals?public_token=' + token)
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (!d.proposal) { state.className = 'error'; state.textContent = 'Esta propuesta ya no está disponible.'; return; }
      var p = d.proposal;
      state.style.display = 'none';
      document.getElementById('doc').style.display = 'block';
      // Título: primera línea # del contenido, o el campo title
      var h1 = (p.content.match(/^#\s+(.+)$/m) || [])[1] || p.title;
      document.title = h1 + ' — Propuesta';
      document.getElementById('p-title').textContent = h1;
      if (p.business_name) document.getElementById('p-business').textContent = p.business_name;
      document.getElementById('p-meta').textContent = 'Propuesta comercial · ' + new Date().toLocaleDateString('es-CO', { day: 'numeric', month: 'long', year: 'numeric' });
      document.getElementById('p-content').innerHTML = md(p.content);
      if (p.amount) {
        document.getElementById('p-amount-box').style.display = 'block';
        document.getElementById('p-amount').textContent = '$' + Number(p.amount).toLocaleString('es-CO') + ' ' + (p.currency || '');
      }
      renderCta(p);
    })
    .catch(function () { state.className = 'error'; state.textContent = 'No se pudo cargar la propuesta.'; });

  function renderCta(p) {
    var cta = document.getElementById('p-cta');
    var statusEl = document.getElementById('p-status');
    cta.innerHTML = ''; statusEl.innerHTML = '';
    if (p.status === 'paid') {
      statusEl.innerHTML = '<div class="status-banner status-accepted">✓ Propuesta aceptada y pagada — ¡gracias!</div>';
      return;
    }
    if (p.status === 'accepted') {
      statusEl.innerHTML = '<div class="status-banner status-accepted">✓ Aceptaste esta propuesta' + (p.payment_link ? ' — puedes completar el pago cuando quieras' : '. Pronto te contactarán para coordinar el arranque.') + '</div>';
      if (p.payment_link) cta.innerHTML = '<a class="btn btn-pay" href="' + p.payment_link.replace(/"/g, '') + '" target="_blank" rel="noopener">💳 Completar el pago</a>';
      return;
    }
    var btn = document.createElement('button');
    btn.className = 'btn btn-accept';
    btn.textContent = '✓ Aceptar propuesta';
    btn.onclick = function () {
      btn.disabled = true; btn.textContent = 'Aceptando…';
      fetch('/api/proposals?public_token=' + token + '&action=accept', { method: 'POST' })
        .then(function (r) { return r.json(); })
        .then(function () { p.status = 'accepted'; renderCta(p); })
        .catch(function () { btn.disabled = false; btn.textContent = '✓ Aceptar propuesta'; });
    };
    cta.appendChild(btn);
    if (p.payment_link) {
      var pay = document.createElement('a');
      pay.className = 'btn btn-pay'; pay.target = '_blank'; pay.rel = 'noopener';
      pay.href = p.payment_link; pay.textContent = '💳 Aceptar y pagar';
      pay.onclick = function () { fetch('/api/proposals?public_token=' + token + '&action=accept', { method: 'POST' }).catch(function () {}); };
      cta.appendChild(pay);
    }
  }
})();
</script>
</body>
</html>
